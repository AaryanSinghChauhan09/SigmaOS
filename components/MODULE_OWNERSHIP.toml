# Source-tree ownership map for modular extraction from the SigmaOS integration
# repository. Paths remain in the main branch until their owning repository has
# an API, tests, CI, and a release contract.

schema_version = 1

[[module]]
path = "src/arch"
owner = "SigmaOS-core"
component = "kernel architecture"

[[module]]
path = "src/boot"
owner = "SigmaOS-core"
component = "bootloader integration"

