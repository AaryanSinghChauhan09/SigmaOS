<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σ SIGMAOS v28.0 - ZENITH SINGULARITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --glass: rgba(15, 15, 20, 0.85);
            --glass-bright: rgba(255, 255, 255, 0.05);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --font: 'Outfit', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
            height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 242, 255, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(128, 0, 255, 0.07) 0%, transparent 40%),
                url('https://www.transparenttextures.com/patterns/dark-matter.png');
            background-attachment: fixed;
        }

        /* --- Boot Sequence --- */
        #boot-screen {
            position: fixed;
            inset: 0;
            background: #000;
            color: var(--accent);
            font-family: var(--mono);
            padding: 3rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .boot-line { opacity: 0; transform: translateX(-10px); transition: all 0.2s ease-out; }
        .boot-line.visible { opacity: 1; transform: translateX(0); }

        /* --- Zenith Dashboard --- */
        #zenith-desktop {
            display: none;
            height: 100vh;
            width: 100vw;
            position: relative;
            padding: 2rem;
            animation: desktopFadeIn 1.5s ease-out;
        }

        @keyframes desktopFadeIn { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }

        /* --- Glassmorphism UI --- */
        .glass-panel {
            background: var(--glass);
            -webkit-backdrop-filter: blur(25px);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .flex-center { display: flex; align-items: center; gap: 1rem; }

        #top-bar {
            height: 50px;
            width: calc(100% - 4rem);
            position: absolute;
            top: 1rem;
            left: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 100;
        }

        .system-status { display: flex; gap: 2rem; align-items: center; }
        .status-dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; }

        #dashboard {
            width: 320px;
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stat-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        .progress-bar {
            height: 6px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #8000ff);
            width: 0%;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #spotlight {
            width: 600px;
            height: 70px;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            font-size: 1.3rem;
            transition: var(--transition);
        }

        #spotlight:focus-within {
            width: 650px;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        #spotlight input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            margin-left: 1.5rem;
            outline: none;
            font-family: var(--font);
            font-weight: 300;
        }

        #central-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.03;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }

        .shards-grid {
            position: absolute;
            top: 120px;
            left: 2rem;
            display: grid;
            grid-template-columns: repeat(2, 200px);
            gap: 1.5rem;
        }

        .shard-icon {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            cursor: pointer;
            transition: var(--transition);
            height: 120px;
        }

        .shard-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .shard-icon .icon { font-size: 2rem; }
        .shard-icon .label { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; }

        /* --- Window System --- */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 800px;
            height: 500px;
            display: none;
            flex-direction: column;
            z-index: 200;
            opacity: 0;
            transition: var(--transition);
        }

        .window.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .window-header {
            padding: 1.2rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-title { font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .close-btn { cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .close-btn:hover { opacity: 1; color: #ff4545; }

        .window-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        /* --- Tool Grid --- */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .tool-btn:hover {
            background: var(--accent);
            color: black;
            transform: scale(1.05);
        }

        .tool-btn i { font-size: 1.5rem; display: block; margin-bottom: 0.5rem; }

        /* --- Notifications --- */
        #notify {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translate(-50%, 150%);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
            transition: var(--transition);
        }

        #notify.visible { transform: translate(-50%, 0); }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }

    </style>
</head>
<body>

    <div id="boot-screen"></div>

    <div id="zenith-desktop">
        <div id="central-logo">Σ</div>

        <div id="top-bar" class="glass-panel">
            <div class="flex-center">
                <div class="status-dot"></div>
                <span>SIGMAOS 28.0 // ZENITH</span>
            </div>
            <div class="system-status">
                <span id="latency">2ms</span>
                <span id="clock">10:43 AM</span>
            </div>
        </div>

        <div id="spotlight" class="glass-panel">
            <span>🔍</span>
            <input type="text" placeholder="Accessing Sovereign Lattice..." id="spot-input">
        </div>

        <div class="shards-grid">
            <div class="shard-icon glass-panel" onclick="openWindow('win-tools')">
                <span class="icon">🛠️</span>
                <span class="label">S-TOOLS</span>
            </div>
            <div class="shard-icon glass-panel" onclick="showNotify('S-NET: Synchronized with Global Mesh.')">
                <span class="icon">🌍</span>
                <span class="label">NETWORK</span>
            </div>
            <div class="shard-icon glass-panel" onclick="showNotify('S-DASH: Real-time telemetry established.')">
                <span class="icon">📊</span>
                <span class="label">TELEMETRY</span>
            </div>
            <div class="shard-icon glass-panel" onclick="showNotify('S-ID: Post-Quantum Identity Verified.')">
                <span class="icon">🔐</span>
                <span class="label">IDENTITY</span>
            </div>
        </div>

        <!-- Tools Window -->
        <div id="win-tools" class="window glass-panel">
            <div class="window-header">
                <span class="window-title">S-TOOLS // Sovereign Utility Hub</span>
                <span class="close-btn" onclick="closeWindow('win-tools')">✕</span>
            </div>
            <div class="window-content">
                <div class="tool-grid">
                    <div class="tool-btn" onclick="toolAction('JSON Formatter')"><i>{ }</i>JSON Fixer</div>
                    <div class="tool-btn" onclick="toolAction('Base64 Encoder')"><i>B64</i>Base64</div>
                    <div class="tool-btn" onclick="toolAction('SHA-256 Gen')"><i>#</i>Hasher</div>
                    <div class="tool-btn" onclick="toolAction('Unit Converter')"><i>⇄</i>Converter</div>
                    <div class="tool-btn" onclick="toolAction('Markdown Render')"><i>M↓</i>Markdown</div>
                    <div class="tool-btn" onclick="toolAction('Regex Tester')"><i>.*</i>Regex</div>
                    <div class="tool-btn" onclick="toolAction('Color Picker')"><i>🎨</i>Palette</div>
                    <div class="tool-btn" onclick="toolAction('Code Minifier')"><i>&lt;&gt;</i>Minify</div>
                </div>
            </div>
        </div>

        <div id="dashboard" class="glass-panel">
            <div class="stat-card">
                <div class="stat-header"><span>Lattice Compute</span><span id="cpu-val">0%</span></div>
                <div class="progress-bar"><div class="progress-fill" id="cpu-bar"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-header"><span>Neural Memory</span><span id="ram-val">0 GB</span></div>
                <div class="progress-bar"><div class="progress-fill" id="ram-bar"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-header"><span>Shard Temperature</span><span>42.1°C</span></div>
            </div>
        </div>

        <div id="notify" class="glass-panel">
            <span id="notify-icon">ℹ️</span>
            <span id="notify-msg">System Readiness: 100%</span>
        </div>
    </div>

    <script>
        const bootScreen = document.getElementById('boot-screen');
        const desktop = document.getElementById('zenith-desktop');
        
        const bootLines = [
            ">> INITIALIZING SIGMAOS SOVEREIGN BOOTSTRAP",
            ">> VERSION: 28.0.ZENITH_STABLE",
            ">> HARDWARE: QUANTUM-LATICE-X1 (VIRTUALIZED)",
            "",
            "[   OK   ] S-HAL: Silicon Mapping Abstraction Layer Online",
            "[   OK   ] S-SMP: Multi-Core Shard Orchestration Ignited",
            "[   OK   ] S-MMU: Memory Management Shard Secured",
            "[   OK   ] S-IPC: Wait-Free Inter-Shard Nexus Active",
            "[   OK   ] S-KUBE: Shard Reconciliation Loop (LRL) Online",
            "[   OK   ] S-VFS: Sovereign Virtual File System Mounted",
            "[   OK   ] S-ID: Ring-LWE Post-Quantum Identity Vault Loaded",
            "[   OK   ] S-NEURAL: Predictive Tensor Orchestration (PTO) Ready",
            "[   OK   ] S-TIME: Incremental Snapshot Continuity Active",
            "[   OK   ] S-TOOLS: 1000+ Industrial Utilities Indexed",
            "[   OK   ] ZENITH UI: Glassmorphism Compositor Ready",
            "",
            ">> BOOT SEQUENCE COMPLETE. SOVEREIGNTY ESTABLISHED."
        ];

        let lineIdx = 0;
        function typeBoot() {
            if (lineIdx < bootLines.length) {
                const line = document.createElement('div');
                line.className = 'boot-line';
                line.textContent = bootLines[lineIdx];
                bootScreen.appendChild(line);
                
                // Force reflow for animation
                line.offsetHeight;
                line.classList.add('visible');
                
                lineIdx++;
                setTimeout(typeBoot, 60);
            } else {
                setTimeout(() => {
                    bootScreen.style.transition = 'opacity 1s cubic-bezier(0.16, 1, 0.3, 1)';
                    bootScreen.style.opacity = '0';
                    setTimeout(() => {
                        bootScreen.style.display = 'none';
                        desktop.style.display = 'block';
                        startTelemetry();
                    }, 800);
                }, 1000);
            }
        }

        function startTelemetry() {
            setInterval(() => {
                const cpu = Math.floor(Math.random() * 15) + 3;
                const ram = (Math.random() * 2 + 12.1).toFixed(1);
                const lat = Math.floor(Math.random() * 5) + 1;
                
                document.getElementById('cpu-val').textContent = cpu + '%';
                document.getElementById('cpu-bar').style.width = (cpu * 2) + '%';
                document.getElementById('ram-val').textContent = ram + ' GB';
                document.getElementById('ram-bar').style.width = (ram * 5) + '%';
                document.getElementById('latency').textContent = lat + 'ms';
                
                const now = new Date();
                document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }, 1000);
        }

        function showNotify(msg) {
            const notify = document.getElementById('notify');
            const msgEl = document.getElementById('notify-msg');
            msgEl.textContent = msg;
            notify.classList.add('visible');
            setTimeout(() => {
                notify.classList.remove('visible');
            }, 3500);
        }

        function openWindow(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeWindow(id) {
            document.getElementById(id).classList.remove('active');
        }

        function toolAction(name) {
            showNotify(`S-TOOLS: Launching ${name} shard...`);
        }

        // Start boot
        window.onload = () => setTimeout(typeBoot, 500);

        // Spotlight interaction
        document.getElementById('spot-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.toLowerCase();
                if (val.includes('tools') || val === 't') {
                    openWindow('win-tools');
                } else {
                    showNotify('LATTICE: Routing to ' + val);
                }
                e.target.value = '';
            }
        });
    </script>
</body>
</html>
