[package]
name = "sigma-ai-integration"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
license = "MIT"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS"

[lib]
path = "mod.rs"

[dependencies]
# Native replacements for external crates:
# - sigma_time: replaces chrono
# - sigma_uuid: replaces uuid
# - sigma_regex: replaces regex (simple pattern matching)
# serde and serde_json kept for serialization (can be replaced later if needed)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for model downloads (native implementation planned)
# For now, keep reqwest but mark for replacement
reqwest = { version = "0.11", features = ["json"] }

# Async runtime (keep for now, consider native async)
tokio = { version = "1.0", features = ["full"] }

# AI/ML dependencies (optional, for actual LLM integration)
llama_cpp = { version = "0.3", optional = true }
candle-core = { version = "0.3", optional = true }

# Logging
log = "0.4"
env_logger = "0.11"

[features]
default = []
local-llm = ["llama_cpp"]
ml-inference = ["candle-core"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
