[package]
name = "sigma-dev-studio"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
license = "MIT"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS"

[lib]
path = "mod.rs"

[dependencies]
# Native replacements for external crates:
# - sigma_time: replaces chrono
# - sigma_uuid: replaces uuid
# - native_http: replaces reqwest
# - native_log: replaces log and env_logger
# serde and serde_json kept for serialization (can be replaced later if needed)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Git integration (native implementation planned)
# For now, keep git2 but mark for replacement
git2 = "0.20.4"

# Async runtime (keep for now, consider native async)
tokio = { version = "1.0", features = ["full"] }

# Docker daemon integration (native implementation planned)
# For now, keep bollard but mark for replacement
bollard = "0.15"

# Kubernetes client (native implementation planned)
# For now, keep kube but mark for replacement
kube = { version = "0.92.0", features = ["runtime", "client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.22.0", optional = true }

# Database drivers (native implementations planned)
# For now, keep but mark for replacement
sqlx = { version = "0.8.1", features = ["runtime-tokio", "mysql", "postgres", "sqlite"], optional = true }
mongodb = { version = "3.2.5", optional = true }
redis = { version = "0.24", features = ["tokio-comp"], optional = true }

[features]
default = []
kubernetes = ["kube", "k8s-openapi"]
databases = ["sqlx", "mongodb", "redis"]
all-integrations = ["kubernetes", "databases"]

[dev-dependencies]
mockito = "1.2"
