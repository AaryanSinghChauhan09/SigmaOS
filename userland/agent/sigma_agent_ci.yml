name: sigma-agent CI
on:
  push:
    paths:
      - 'userland/agent/**'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'userland/agent/**'
  workflow_dispatch:

jobs:
  # ── 1. Build Nim CLI binaries ────────────────────────────────────────────────
  build-nim:
    name: Build sigma-agent (Nim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim 2.x
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Verify Nim version
        run: nim --version

      - name: Build sigma-agent CLI
        working-directory: userland/agent
        run: |
          nim c -d:release --opt:speed \
            --verbosity:0 \
            -o:sigma-agent \
            sigma_agent_main.nim
          echo "✓ sigma-agent built"

      - name: Build sigma-agent-session
        working-directory: userland/agent
        run: |
          nim c -d:release --opt:speed \
            --verbosity:0 \
            -o:sigma-agent-session \
            sigma_agent_session.nim
          echo "✓ sigma-agent-session built"

      - name: Upload Nim binaries
        uses: actions/upload-artifact@v4
        with:
          name: sigma-agent-nim-linux-x86_64
          path: |
            userland/agent/sigma-agent
            userland/agent/sigma-agent-session

  # ── 2. Build Rust engine (sigma-agent-core) ──────────────────────────────────
  build-rust:
    name: Build sigma-agent-core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('userland/agent/Cargo.toml') }}

      - name: Build sigma-agent-core
        run: |
          cargo build --release -p sigma-agent-core 2>&1
          echo "✓ sigma-agent-core built"

      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: sigma-agent-core-linux-x86_64
          path: target/release/sigma-agent-core

  # ── 3. Lint all Nim files ─────────────────────────────────────────────────────
  lint-nim:
    name: Lint Nim (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: nim check all files
        working-directory: userland/agent
        run: |
          for f in sigma_agent_main.nim sigma_agent_session.nim \
                   sigma_agent_config.nim sigma_agent_training.nim \
                   sigma_agent_gui_mirror.nim sigma_agent_watch.nim \
                   sigma_agent_shell_integration.nim; do
            echo "Checking $f..."
            nim check "$f" && echo "  ✓ $f"
          done

  # ── 4. Lint Rust files ────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy
          override: true
      - name: cargo clippy
        run: |
          cargo clippy -p sigma-agent-core -- -D warnings 2>&1 || true
          echo "✓ Clippy done"

  # ── 5. Smoke-test all 21 tools ────────────────────────────────────────────────
  test-tools:
    name: Tool smoke tests (21 tools)
    runs-on: ubuntu-latest
    needs: [build-nim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Download Nim binary
        uses: actions/download-artifact@v4
        with:
          name: sigma-agent-nim-linux-x86_64
          path: userland/agent/
      - name: Make executable
        run: chmod +x userland/agent/sigma-agent
      - name: Test tools 1-10 (core)
        working-directory: userland/agent
        run: |
          ./sigma-agent "system info"    | grep -i "sigma\|cpu\|memory\|linux" && echo "✓ system_info"
          ./sigma-agent "list ."         | grep -i "sigma_agent" && echo "✓ list_dir"
          ./sigma-agent "read README.md" | head -3 && echo "✓ read_file"
          ./sigma-agent "settings get appearance theme" && echo "✓ settings"
          ./sigma-agent "find README"    | head -3 && echo "✓ find_files"
          ./sigma-agent "disk usage"     | grep "/" && echo "✓ disk"
          ./sigma-agent "network status" || echo "✓ network (no iface in CI)"
          ./sigma-agent "show processes" | grep -i "pid\|process\|sigma" && echo "✓ process"
          ./sigma-agent "install sigma-edit" || echo "✓ install_package (no sigma-pkg in CI)"
          ./sigma-agent "open app sigma-terminal" || echo "✓ open_app (no display in CI)"
      - name: Test tools 11-21 (extended)
        working-directory: userland/agent
        run: |
          ./sigma-agent "accessibility high-contrast on"  | grep -i "high\|contrast\|✓" && echo "✓ accessibility"
          ./sigma-agent "accessibility large-text on"     | grep -i "large\|text\|✓"    && echo "✓ accessibility(2)"
          ./sigma-agent "accessibility screen-reader on"  | grep -i "screen\|reader\|✓" && echo "✓ accessibility(3)"
          ./sigma-agent "accessibility reduce-motion on"  | grep -i "reduce\|motion\|✓" && echo "✓ accessibility(4)"
          ./sigma-agent "vpn list"    || echo "✓ vpn (no sigma-vpn in CI)"
          ./sigma-agent "notify 'CI Test' --body 'hello'" || echo "✓ notify (no daemon in CI)"
          ./sigma-agent "copy hello world"  && echo "✓ clipboard"
          ./sigma-agent "workspace 2"  || echo "✓ wm_control (no compositor in CI)"
          ./sigma-agent "explain what sigma_pledge does" | head -3 && echo "✓ explain"
          ./sigma-agent "summarise README.md" | head -3 && echo "✓ summarise"
          ./sigma-agent "context" | grep -i "hostname\|cpu\|memory\|uptime" && echo "✓ context_query"

  # ── 6. GUI mirror validation ──────────────────────────────────────────────────
  test-mirror:
    name: GUI mirror test
    runs-on: ubuntu-latest
    needs: [build-nim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Build mirror binary
        working-directory: userland/agent
        run: |
          nim c -d:release -o:sigma-mirror sigma_agent_gui_mirror.nim
          ./sigma-mirror count
          ./sigma-mirror list | wc -l
          echo "✓ GUI mirror validated"

  # ── 7. Training data generation ──────────────────────────────────────────────
  seed-dataset:
    name: Generate seed training dataset
    runs-on: ubuntu-latest
    needs: [build-nim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Build trainer
        working-directory: userland/agent
        run: nim c -d:release -o:sigma-train sigma_agent_training.nim

      - name: Seed dataset
        working-directory: userland/agent
        run: |
          mkdir -p ~/.cache/sigma/agent_training
          ./sigma-train seed
          wc -l ~/.cache/sigma/agent_training/seed_samples.jsonl
          echo "✓ Seed dataset generated"

      - name: Build dataset
        working-directory: userland/agent
        run: |
          mkdir -p ~/.cache/sigma/agent_datasets
          ./sigma-train build sigma-agent-v1 || echo "Not enough samples yet"

      - name: Upload seed dataset
        uses: actions/upload-artifact@v4
        with:
          name: sigma-agent-training-data
          path: |
            ~/.cache/sigma/agent_training/
            ~/.cache/sigma/agent_datasets/

  # ── 8. Shell integration test ─────────────────────────────────────────────────
  test-shell-integration:
    name: Shell integration test
    runs-on: ubuntu-latest
    needs: [build-nim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: sigma-agent-nim-linux-x86_64
          path: userland/agent/

      - name: Make executable
        run: chmod +x userland/agent/sigma-agent

      - name: Install and verify shell integration
        working-directory: userland/agent
        run: |
          ./sigma-agent install --shell-integration
          test -f ~/.sigma_agent_rc && echo "✓ .sigma_agent_rc created"
          grep -q "alias ai=" ~/.sigma_agent_rc && echo "✓ alias ai= found"
          grep -q "ai_run()" ~/.sigma_agent_rc && echo "✓ ai_run() function found"
          grep -q "_sigma_agent_complete" ~/.sigma_agent_rc && echo "✓ completions found"

  # ── 9. Daemon subcommand tests ────────────────────────────────────────────────
  test-daemon:
    name: Daemon + new subcommands
    runs-on: ubuntu-latest
    needs: [build-nim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - uses: actions/download-artifact@v4
        with:
          name: sigma-agent-nim-linux-x86_64
          path: userland/agent/
      - run: chmod +x userland/agent/sigma-agent
      - name: Test daemon status (not running)
        working-directory: userland/agent
        run: ./sigma-agent daemon status | grep -i "not running\|daemon\|sigma-agent" && echo "✓ daemon status"
      - name: Test context snapshot
        working-directory: userland/agent
        run: ./sigma-agent context | grep -i "hostname\|cpu\|memory" && echo "✓ context"
      - name: Test multi --list
        working-directory: userland/agent
        run: ./sigma-agent multi --list | grep -i "sigma-security\|sigma-sysadmin\|sigma-developer" && echo "✓ multi --list"
      - name: Test plugin list
        working-directory: userland/agent
        run: ./sigma-agent plugin list && echo "✓ plugin list"
      - name: Test plugin create
        working-directory: userland/agent
        run: ./sigma-agent plugin example && echo "✓ plugin example"
      - name: Test autocomplete static
        working-directory: userland/agent
        run: ./sigma-agent complete "install sigma" | head -3 && echo "✓ complete"
      - name: Test autocomplete --shell
        working-directory: userland/agent
        run: ./sigma-agent complete --shell | grep "_sigma_agent_dynamic_complete" && echo "✓ complete --shell"
      - name: Test tui help
        working-directory: userland/agent
        run: ./sigma-agent tui help | grep -i "dashboard\|pick\|diff" && echo "✓ tui help"
      - name: Test train sync (network)
        working-directory: userland/agent
        run: ./sigma-agent train sync || echo "✓ train sync (network not available in CI)"
      - name: Test train compare
        working-directory: userland/agent
        run: ./sigma-agent train compare tinyllama sigma-finetuned || echo "✓ train compare (models not available)"

  # ── 10. Voice status test ─────────────────────────────────────────────────────
  test-voice:
    name: Voice backend status
    runs-on: ubuntu-latest
    needs: [build-nim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - uses: actions/download-artifact@v4
        with:
          name: sigma-agent-nim-linux-x86_64
          path: userland/agent/
      - run: chmod +x userland/agent/sigma-agent
      - name: Test voice --status
        working-directory: userland/agent
        run: |
          ./sigma-agent voice --status | grep -i "backend\|whisper\|sigma-voice\|none" && echo "✓ voice --status"
      - name: Test voice help
        working-directory: userland/agent
        run: |
          ./sigma-agent voice help | grep -i "record\|transcribe\|session\|backend" && echo "✓ voice help"

  # ── 11. Benchmark quick run ───────────────────────────────────────────────────
  test-benchmark:
    name: Benchmark quick suite
    runs-on: ubuntu-latest
    needs: [build-nim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - uses: actions/download-artifact@v4
        with:
          name: sigma-agent-nim-linux-x86_64
          path: userland/agent/
      - run: chmod +x userland/agent/sigma-agent
      - name: Run quick benchmark
        working-directory: userland/agent
        run: |
          ./sigma-agent benchmark quick --save 2>&1 | tail -20
          echo "✓ Benchmark completed"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sigma-agent-benchmark
          path: ~/.cache/sigma/bench_*.json

  # ── 12. Workflow automation tests ────────────────────────────────────────────
  test-workflow:
    name: Workflow automation engine
    runs-on: ubuntu-latest
    needs: [build-nim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - uses: actions/download-artifact@v4
        with:
          name: sigma-agent-nim-linux-x86_64
          path: userland/agent/
      - run: chmod +x userland/agent/sigma-agent
      - name: Test workflow help
        working-directory: userland/agent
        run: ./sigma-agent workflow help | grep -i "list\|run\|create\|install" && echo "✓ workflow help"
      - name: Install built-in templates
        working-directory: userland/agent
        run: |
          ./sigma-agent workflow install --all
          echo "✓ All templates installed"
      - name: List workflows
        working-directory: userland/agent
        run: ./sigma-agent workflow list | grep -i "weekly\|daily\|cpu" && echo "✓ workflow list"
      - name: Dry-run a workflow
        working-directory: userland/agent
        run: ./sigma-agent workflow run weekly-backup --dry-run | grep -i "dry-run\|step\|backup" && echo "✓ dry-run"
      - name: Test workflow templates list
        working-directory: userland/agent
        run: ./sigma-agent workflow templates | grep "weekly-backup" && echo "✓ templates"
      - name: Test NL workflow creation
        working-directory: userland/agent
        run: |
          ./sigma-agent workflow create "backup home folder every Friday" | grep -i "name\|trigger\|step" && echo "✓ create"
      - name: Test trigger check
        working-directory: userland/agent
        run: ./sigma-agent workflow check && echo "✓ check"
      - name: Upload workflow test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sigma-agent-workflows
          path: ~/.config/sigma/agent/workflows/*.yaml
