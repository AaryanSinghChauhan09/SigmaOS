name: sigma-agent CI
on:
  push:
    paths:
      - 'userland/agent/**'
  pull_request:
    paths:
      - 'userland/agent/**'
  workflow_dispatch:

jobs:
  build:
    name: Build sigma-agent binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build Nim binaries
        working-directory: userland/agent
        run: |
          nim c -d:release --opt:speed -o:sigma-agent        sigma_agent_main.nim
          nim c -d:release --opt:speed -o:sigma-agent-session sigma_agent_session.nim
          echo "✓ Nim binaries built"

      - name: Verify agent works
        working-directory: userland/agent
        run: |
          ./sigma-agent "list ." || true
          echo "✓ Basic smoke test passed"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sigma-agent-linux-x86_64
          path: |
            userland/agent/sigma-agent
            userland/agent/sigma-agent-session

  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Check compilation (no warnings)
        working-directory: userland/agent
        run: |
          nim check sigma_agent_main.nim
          nim check sigma_agent_session.nim
          nim check sigma_agent_config.nim
          nim check sigma_agent_training.nim
          nim check sigma_agent_gui_mirror.nim
          echo "✓ All Nim files pass type check"

  test-tools:
    name: Test all 20 tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Build agent
        working-directory: userland/agent
        run: nim c -d:release -o:sigma-agent sigma_agent_main.nim
      - name: Test tool: system_info
        working-directory: userland/agent
        run: ./sigma-agent "system info" | head -3
      - name: Test tool: list_dir
        working-directory: userland/agent
        run: ./sigma-agent "list ." | head -5
      - name: Test tool: read_file
        working-directory: userland/agent
        run: ./sigma-agent "read README.md" | head -5
      - name: Test tool: settings get
        working-directory: userland/agent
        run: ./sigma-agent "settings get appearance theme" || echo "(settings not configured)"
      - name: Test GUI mirror
        working-directory: userland/agent
        run: |
          nim c -d:release -o:sigma-agent-mirror sigma_agent_gui_mirror.nim
          ./sigma-agent-mirror count
      - name: Test training seed
        working-directory: userland/agent
        run: |
          nim c -d:release -o:sigma-agent-train sigma_agent_training.nim
          ./sigma-agent-train seed

  seed-dataset:
    name: Build training dataset
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -sSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Build trainer
        working-directory: userland/agent
        run: nim c -d:release -o:sigma-train sigma_agent_training.nim
      - name: Generate seed dataset
        working-directory: userland/agent
        run: |
          mkdir -p ~/.cache/sigma/agent_training
          ./sigma-train seed
      - name: Upload seed dataset
        uses: actions/upload-artifact@v4
        with:
          name: sigma-agent-seed-dataset
          path: ~/.cache/sigma/agent_training/
