<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS Bharat Procedural Matrix (LPMS v5.0)</title>
    <style>
        :root {
            --bg: #0b0c10;
            --surface: #1f2833;
            --surface-hover: #2a3644;
            --text-primary: #c5c6c7;
            --text-secondary: #8b929a;
            --accent: #66fcf1;
            --accent-glow: rgba(102, 252, 241, 0.4);
            --danger: #ff4757;
            --success: #45a29e;
            --warning: #f1c40f;
            --font-main: 'Inter', system-ui, sans-serif;
            --radius-lg: 16px;
            --radius-md: 8px;
            --radius-sm: 4px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Audit Trail */
        .sidebar {
            width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--surface-hover);
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            z-index: 10;
        }

        .brand {
            padding: 0 24px 24px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent);
            border-bottom: 1px solid var(--surface-hover);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-sections {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
            transition: 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-item:hover { background: var(--surface-hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(102, 252, 241, 0.1); color: var(--accent); border-left: 4px solid var(--accent); }

        .audit-log-container {
            margin-top: auto;
            border-top: 1px solid var(--surface-hover);
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .audit-entry {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .audit-time { font-family: monospace; color: var(--accent); margin-bottom: 4px; display: block; }
        .audit-action { color: var(--text-primary); }
        .audit-info { margin-top:4px; font-size:0.7rem; color: var(--success); opacity:0.8; }
        .audit-header { padding: 24px 24px 8px; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }

        /* Work Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            background: radial-gradient(circle at top right, rgba(102, 252, 241, 0.05), transparent 40%);
        }

        .header {
            padding: 32px 48px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header h1 { font-size: 2rem; color: #fff; font-weight: 800; }
        .header p { color: var(--text-secondary); margin-top: 8px; font-size: 0.95rem; }

        .progress-hud {
            text-align: right;
        }

        .progress-val { font-size: 2rem; font-weight: 800; color: var(--accent); }
        .progress-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }

        .workflow-matrix {
            padding: 24px 48px;
            max-width: 1200px;
            width: 100%;
            display: none;
        }

        .workflow-matrix.active { display: block; animation: fadeUp 0.4s ease forwards; }

        /* The LPMS Checklists */
        .stage-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--surface-hover);
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stage-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--surface-hover);
            transition: background 0.3s;
        }

        .stage-card.locked { opacity: 0.5; pointer-events: none; }
        .stage-card.completed { border-color: var(--success); }
        .stage-card.completed::before { background: var(--success); }
        .stage-card.active { border-color: var(--warning); box-shadow: 0 0 20px rgba(241, 196, 15, 0.1); }
        .stage-card.active::before { background: var(--warning); }

        .stage-number {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .stage-card.completed .stage-number { background: var(--success); color: #000; }
        .stage-card.active .stage-number { background: var(--warning); color: #000; }

        .stage-content { flex: 1; }
        .stage-content h3 { font-size: 1.2rem; color: #fff; margin-bottom: 8px; }
        .stage-content p { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }

        .statutory-rule {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(102, 252, 241, 0.1);
            color: var(--accent);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 700;
            font-family: monospace;
            margin-bottom: 12px;
            border: 1px solid rgba(102, 252, 241, 0.2);
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--surface-hover);
        }

        .action-row label { font-size: 0.85rem; cursor: pointer; -webkit--webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none; -webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none; flex: 1; }
        
        input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .btn-matrix {
            background: transparent;
            color: var(--text-primary);
            padding: 10px 20px;
            border: 1px solid var(--surface-hover);
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-matrix:hover:not(:disabled) { background: var(--surface-hover); }
        .btn-matrix.primary { background: var(--success); color: #000; border: none; }
        .btn-matrix.primary:hover:not(:disabled) { box-shadow: 0 0 16px rgba(69, 162, 158, 0.4); transform: translateY(-1px); }
        
        .btn-matrix:disabled { opacity: 0.5; cursor: not-allowed; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>

<script>
// Sovereign OS Inline Style Manager
document.addEventListener('DOMContentLoaded', () => {
    const applyTo = (el) => { if(el.getAttribute('data-style')) { el.setAttribute('style', el.getAttribute('data-style')); el.removeAttribute('data-style'); } };
    new MutationObserver(mutations => mutations.forEach(m => {
        if(m.type === 'childList') m.addedNodes.forEach(n => { if(n.nodeType === 1) { applyTo(n); n.querySelectorAll('[data-style]').forEach(applyTo); } });
    })).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('[data-style]').forEach(applyTo);
});
</script>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">
            Σ Procedural Matrix
        </div>

        <div class="nav-sections">
            <div class="nav-item active" onclick="LPMS.switchWorkflow('cpc')">
                Civil Suit (CPC 1908) <span id="cpc-badge">0%</span>
            </div>
            <div class="nav-item" onclick="LPMS.switchWorkflow('crpc')">
                Criminal Trial (BNSS) <span id="crpc-badge">0%</span>
            </div>
            <div class="nav-item" onclick="LPMS.switchWorkflow('comp')">
                Corporate Audit (SOP) <span id="comp-badge">0%</span>
            </div>
        </div>

        <div class="audit-header">Cryptographic Audit Log</div>
        <div class="audit-log-container" id="auditLog">
            <!-- Logs spawn here -->
        </div>
    </div>

    <!-- MAIN CONTEXT -->
    <div class="main-content">
        <div class="header">
            <div>
                <h1 id="workflowTitle">Code of Civil Procedure (CPC)</h1>
                <p id="workflowDesc">Mandatory sequence logic enforcing Orders & Rules for Civil Suits.</p>
            </div>
            <div class="progress-hud">
                <div class="progress-val" id="hudProgress">0%</div>
                <div class="progress-label">Lifecyle Completion</div>
            </div>
        </div>

        <!-- CPC WORKFLOW -->
        <div id="workflow-cpc" class="workflow-matrix active">
            <!-- Rendered via JS -->
        </div>

        <!-- BNSS WORKFLOW -->
        <div id="workflow-crpc" class="workflow-matrix">
            <!-- Rendered via JS -->
        </div>

        <!-- CORPORATE WORKFLOW -->
        <div id="workflow-comp" class="workflow-matrix">
            <!-- Rendered via JS -->
        </div>

    </div>

    <!-- NATIVE OOP LOGIC DEPLOYMENT -->
    <script>
        /**
         * Σ SIGMA OS: PROCEDURAL WORKFLOW MATRIX
         * Pure Silicon LPMS Logic. Zero Database Reliance. Zero Third-Party.
         */

        class AuditLogger {
            static log(action, user = "Advocate_0x44") {
                const container = document.getElementById('auditLog');
                const entry = document.createElement('div');
                entry.className = 'audit-entry';
                
                const timeStr = new Date().toISOString();
                
                entry.innerHTML = `
                    <span class="audit-time">[${timeStr}]</span>
                    <span class="audit-action">${action}</span>
                    <div class="audit-info">Verified by ${user}</div>
                `;
                
                container.prepend(entry);
            }
        }

        class StageNode {
            constructor(id, title, rule, desc, tasks, isFirst = false) {
                this.id = id;
                this.title = title;
                this.rule = rule;
                this.desc = desc;
                this.tasks = tasks; // Array of string descriptions
                this.status = isFirst ? 'active' : 'locked'; // 'locked', 'active', 'completed'
            }
        }

        class WorkflowEngine {
            constructor(type, title, desc, stages) {
                this.type = type;
                this.title = title;
                this.desc = desc;
                this.stages = stages;
                this.render();
            }

            render() {
                const container = document.getElementById(`workflow-${this.type}`);
                container.innerHTML = '';
                
                this.stages.forEach((stage, index) => {
                    const card = document.createElement('div');
                    card.className = `stage-card ${stage.status}`;
                    card.id = `card-${this.type}-${index}`;
                    
                    let taskHtml = '';
                    stage.tasks.forEach((task, tIndex) => {
                        const checked = stage.status === 'completed' ? 'checked' : '';
                        const disabled = stage.status === 'locked' ? 'disabled' : '';
                        taskHtml += `
                            <div class="action-row">
                                <input aria-label="input" type="checkbox" id="task-${this.type}-${index}-${tIndex}" ${checked} ${disabled} onclick="LPMS.checkStageCompletion('${this.type}', ${index})" title="input">
                                <label for="task-${this.type}-${index}-${tIndex}">${task}</label>
                            </div>
                        `;
                    });

                    let btnHtml = '';
                    if (stage.status === 'active') {
                        btnHtml = `<button class="btn-matrix primary" id="btn-cert-${this.type}-${index}" disabled onclick="LPMS.certifyStage('${this.type}', ${index})">Certify Stage Completion</button>`;
                    } else if (stage.status === 'completed') {
                        btnHtml = `<button class="btn-matrix" disabled>Stage Certified</button>`;
                    }

                    card.innerHTML = `
                        <div class="stage-number">${index + 1}</div>
                        <div class="stage-content">
                            <span class="statutory-rule">${stage.rule}</span>
                            <h3>${stage.title}</h3>
                            <p>${stage.desc}</p>
                            <div class="action-grid">${taskHtml}</div>
                            ${btnHtml}
                        </div>
                    `;
                    
                    container.appendChild(card);
                });

                this.updateProgress();
            }

            checkStageCompletion(index) {
                const stage = this.stages[index];
                if (stage.status !== 'active') return;

                let allChecked = true;
                stage.tasks.forEach((_, tIndex) => {
                    const cb = document.getElementById(`task-${this.type}-${index}-${tIndex}`);
                    if (!cb.checked) allChecked = false;
                });

                const btn = document.getElementById(`btn-cert-${this.type}-${index}`);
                if (btn) btn.disabled = !allChecked;
            }

            certifyStage(index) {
                const stage = this.stages[index];
                stage.status = 'completed';
                AuditLogger.log(`Certified Completion: ${stage.title} (${this.title})`);
                
                // Unlock next
                if (index + 1 < this.stages.length) {
                    this.stages[index + 1].status = 'active';
                    AuditLogger.log(`Unlocked Procedural Dependency: ${this.stages[index + 1].title}`);
                }

                this.render();
            }

            updateProgress() {
                const completed = this.stages.filter(s => s.status === 'completed').length;
                const percent = Math.round((completed / this.stages.length) * 100);
                
                document.getElementById(`${this.type}-badge`).innerText = `${percent}%`;
                
                // Only update HUD if currently active tab
                if (document.getElementById(`workflow-${this.type}`).classList.contains('active')) {
                    document.getElementById('hudProgress').innerText = `${percent}%`;
                }
            }
        }

        // Global LPMS Controller
        class SigmaLPMS {
            constructor() {
                this.workflows = {};
                this.initData();
                AuditLogger.log("SigmaOS LPMS Matrix Bootstrapped.");
            }

            initData() {
                this.workflows['cpc'] = new WorkflowEngine('cpc', 
                    'Code of Civil Procedure (CPC 1908)', 
                    'Mandatory sequence logic enforcing Orders & Rules for Civil Suits.',
                    [
                        new StageNode('cpc1', 'Institution of Suit & Plaint', 'Order IV, Rule 1 / Order VII', 'Every suit shall be instituted by presenting a plaint in duplicate to the Court. Must include facts, jurisdiction, and relief.', ['Draft Plaint generated', 'Court Fees affixed (Valuation Act)', 'Affidavit of Verity sworn'], true),
                        new StageNode('cpc2', 'Issuance & Service of Summons', 'Order V', 'When a suit has been duly instituted, a summons may be issued to the defendant to appear and answer the claim.', ['Summons generated (Form No. 1)', 'Service executed (Dasti/Post)', 'Service Affidavit filed']),
                        new StageNode('cpc3', 'Appearance & Written Statement (WS)', 'Order VIII, Rule 1', 'Defendant must file WS within 30 days from service of summons (extendable up to 90 days).', ['Vakalatnama filed by Defense', 'Written Statement drafting completed', 'WS Filed in Court Registry']),
                        new StageNode('cpc4', 'Framing of Issues', 'Order XIV', 'Court frames the issues of fact and law upon which the parties are at variance.', ['Admission/Denial affidavit filed', 'Draft Issues compiled', 'Court explicitly frames issues']),
                        new StageNode('cpc5', 'Evidence & Witness Examination', 'Order XVIII', 'Plaintiff has the right to begin. Examination-in-chief, Cross-examination, and Re-examination.', ['List of Witnesses filed', 'Affidavits of Evidence filed', 'Cross-examination concluded', 'Exhibits marked']),
                        new StageNode('cpc6', 'Final Arguments & Decree', 'Order XX', 'The Court, after the case has been heard, shall pronounce judgment, and on such judgment a decree shall follow.', ['Final Oral Arguments heard', 'Written Submissions filed', 'Judgment Pronounced & Decree Drawn'])
                    ]
                );

                this.workflows['crpc'] = new WorkflowEngine('crpc', 
                    'Bharatiya Nagarik Suraksha Sanhita (BNSS)', 
                    'Procedural timeline for Criminal Trials mapping from Investigation to Verdict.',
                    [
                        new StageNode('cr1', 'FIR & Investigation', 'Section 173 BNSS', 'Information in cognizable cases and police investigation timeline.', ['FIR registered (Zero/Regular)', 'Witness statements recorded (Sec 180)', 'Charge Sheet (Police Report) filed'], true),
                        new StageNode('cr2', 'Cognizance & Document Supply', 'Section 210/230 BNSS', 'Magistrate takes cognizance and ensures accused is supplied with copies of police report and documents.', ['Cognizance order passed', 'Section 230 compliance (Docs supplied)', 'Accused appearance secured']),
                        new StageNode('cr3', 'Framing of Charge', 'Section 250 BNSS', 'If ground for presuming accused has committed the offense exists, charge is framed in writing.', ['Arguments on Charge heard', 'Charge formally framed & read', 'Accused pleads not guilty']),
                        new StageNode('cr4', 'Prosecution Evidence (PE)', 'Section 254 BNSS', 'Prosecution examines witnesses to prove the charge beyond reasonable doubt.', ['Summons to Prosecution Witnesses', 'Examination-in-chief recorded', 'Cross-examination by Defense']),
                        new StageNode('cr5', 'Statement of Accused (SA)', 'Section 351 BNSS', 'Mandatory questioning of the accused to personally explain any circumstances appearing in the evidence.', ['Questionnaire drafted by Court', 'Accused statement recorded without oath']),
                        new StageNode('cr6', 'Defense Evidence & Judgment', 'Section 266 BNSS', 'Accused is called upon to enter defense. Followed by final arguments and verdict.', ['Defense witnesses examined (if any)', 'Final Arguments concluded', 'Judgment (Acquittal/Conviction) pronounced'])
                    ]
                );

                this.workflows['comp'] = new WorkflowEngine('comp', 
                    'Compliance Tracker & SOP (Companies Act 2013)', 
                    'Strict regulatory tracking for corporate secretaries and legal counsels.',
                    [
                        new StageNode('co1', 'Incorporation & First Board Meeting', 'Section 173', 'First Board Meeting must be held within 30 days of incorporation.', ['Certificate of Incorporation verified', 'Agenda circulated 7 days prior', 'First BM resolutions passed'], true),
                        new StageNode('co2', 'Statutory Auditor Appointment', 'Section 139', 'First auditor shall be appointed by the Board within 30 days of registration.', ['Consent from Auditor obtained', 'ADT-1 filed with ROC', 'Resolution recorded in Minutes']),
                        new StageNode('co3', 'Annual General Meeting (AGM)', 'Section 96', 'First AGM within 9 months of financial year close. Subsequent within 6 months.', ['Financial Statements audited', 'Board Report finalized', 'AGM Notice circulated (21 clear days)'])
                    ]
                );
            }

            switchWorkflow(type) {
                // UI Toggle
                document.querySelectorAll('.workflow-matrix').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                
                document.getElementById(`workflow-${type}`).classList.add('active');
                event.currentTarget.classList.add('active');

                // Update Header
                const wf = this.workflows[type];
                document.getElementById('workflowTitle').innerText = wf.title;
                document.getElementById('workflowDesc').innerText = wf.desc;
                
                wf.updateProgress();
                AuditLogger.log(`Switched Workflow Context to: ${wf.title}`);
            }

            // Route to specific workflow class
            checkStageCompletion(type, index) { this.workflows[type].checkStageCompletion(index); }
            certifyStage(type, index) { this.workflows[type].certifyStage(index); }
        }

        // Init
        const LPMS = new SigmaLPMS();

    </script>
</body>
</html>
