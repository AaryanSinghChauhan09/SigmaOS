<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Orchestrator — Sovereign Agentic Node</title>
    <script src="../libs/sovereign_api.js" defer></script>
    <style>
        :root {
            --bg: #060910; --surface: #0f172a; --accent: #00d2ff; --glow: rgba(0,210,255,0.3);
            --text: #e2e8f0; --dim: #64748b; --success: #22c55e;
        }
        body {
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }
        .status { font-size: 0.75rem; color: var(--dim); background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; }
        
        .main { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 20px; overflow: hidden; }
        
        .panel { 
            background: var(--surface); border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 16px; padding: 16px; display: flex; flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        .feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .feed::-webkit-scrollbar { width: 4px; }
        .feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        
        .log { font-size: 0.82rem; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.03); border-left: 3px solid var(--accent); }
        .log.success { border-left-color: var(--success); }
        .log-time { font-size: 0.7rem; color: var(--dim); margin-bottom: 4px; }
        
        .input-wrap { margin-top: 15px; position: relative; }
        input { 
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 16px; color: white; outline: none; transition: 0.2s;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 12px; text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: 700; color: white; }
        .stat-lbl { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; margin-top: 4px; }
        .obs-label { margin-bottom: 20px; font-weight: 700; font-size: 0.85rem; color: var(--dim); }
        .panel-flex { flex: 1; }
        .cap-btn { width: 100%; padding: 10px; background: var(--accent); border: none; border-radius: 10px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Σ OMNIMIND v6.1</div>
        <div class="status" id="node-id">NODE: SIGMA_MASTER</div>
    </div>
    
    <div class="main">
        <div class="panel">
            <div class="obs-label">KERNEL OBSERVABILITY</div>
            <div class="stat-grid">
                <div class="stat-card"><div class="stat-val" id="cpu-val">0.0%</div><div class="stat-lbl">CPU LOAD</div></div>
                <div class="stat-card"><div class="stat-val" id="mem-val">0MB</div><div class="stat-lbl">MEMORY</div></div>
                <div class="stat-card"><div class="stat-val" id="shard-val">0</div><div class="stat-lbl">SHARDS</div></div>
                <div class="stat-card"><div class="stat-val" id="net-val">MESH</div><div class="stat-lbl">NET STACK</div></div>
            </div>
            <div class="panel-flex"></div>
            <button class="cap-btn" onclick="requestCap()">Request Capability</button>
        </div>
        
        <div class="panel">
            <div class="feed" id="agent-feed">
                <div class="log">Initializing Aether Orchestrator Spectrum...</div>
                <div class="log success">Sovereign System API (SSA) v6.1.0 linked successfully.</div>
            </div>
            <div class="input-wrap">
                <input type="text" id="agent-cmd" placeholder="Command Orchestrator..." onkeydown="if(event.key==='Enter') execCmd()">
            </div>
        </div>
    </div>

    <script>
        function log(msg, type='') {
            const feed = document.getElementById('agent-feed');
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.innerHTML = `<div class="log-time">${new Date().toLocaleTimeString()}</div>${msg}`;
            feed.appendChild(div);
            feed.scrollTop = feed.scrollHeight;
        }

        async function updateStats() {
            if (!window.SSA) return;
            const stats = await SSA.get_system_stats();
            document.getElementById('cpu-val').textContent = stats.cpu_load;
            document.getElementById('mem-val').textContent = stats.mem_used;
            document.getElementById('shard-val').textContent = stats.shards_active;
            document.getElementById('node-id').textContent = 'NODE: ' + SSA.node_id;
        }

        async function requestCap() {
            const res = await SSA.request_capability('FS_WRITE_SYSTEM');
            if (res.granted) {
                log(`Policy Granted: <b>${res.token}</b>`, 'success');
            }
        }

        function execCmd() {
            const inp = document.getElementById('agent-cmd');
            const val = inp.value; if (!val) return;
            log(`Orchestrating: ${val}`);
            if (val.includes('spawn')) {
                SSA.spawn(val.split(' ')[1] || 'generic_task').then(r => {
                    log(`Kernel confirmation: PID ${r.pid} in RING-3`, 'success');
                });
            } else if (val.includes('mesh')) {
                SSA.mesh_broadcast({ cmd: val }).then(r => {
                    log(`Mesh Broadcast: ${r.nodes_reached} nodes synchronized.`, 'success');
                });
            }
            inp.value = '';
        }

        setInterval(updateStats, 2000);
        window.addEventListener('load', () => {
            log("Aether Spectrum Online. Multi-Agent routing active.");
            updateStats();
        });
    </script>
</body>
</html>
