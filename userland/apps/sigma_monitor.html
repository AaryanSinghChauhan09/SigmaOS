<!DOCTYPE html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta charset="UTF-8"><title>Sigma System Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a10;--s1:#0c1020;--s2:#111828;--border:rgba(255,255,255,.08);--accent:#00d2ff;--as:rgba(0,210,255,.1);--text:#e2e8f0;--dim:#4b5563;--success:#34d399;--danger:#f87171;--warn:#fbbf24;--violet:#818cf8;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background:var(--s1);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{font-weight:800;color:var(--accent);font-size:.92rem;}
.tabs{display:flex;gap:4px;margin-left:8px;}
.tab{padding:6px 14px;border-radius:7px;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--dim);transition:background .14s,color .14s;}
.tab.active{background:var(--as);color:var(--accent);}
.refresh-btn{margin-left:auto;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:.78rem;font-family:'Inter',sans-serif;}
.refresh-btn:hover{color:var(--text);}
.main{flex:1;overflow:hidden;display:flex;}
.panel{flex:1;overflow-y:auto;padding:18px;display:none;}
.panel.active{display:block;}
.panel::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-thumb{background:#1e2434;border-radius:2px}

/* Overview cards */
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.metric-card{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px;}
.mc-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin-bottom:8px;font-weight:700;}
.mc-value{font-size:1.8rem;font-weight:200;color:#fff;line-height:1;}
.mc-unit{font-size:.8rem;color:var(--dim);margin-top:4px;}
.mc-bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:12px;overflow:hidden;}
.mc-fill{height:100%;border-radius:2px;transition:width .5s;}

/* Chart */
.chart-area{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.chart-title{font-weight:600;font-size:.85rem;margin-bottom:12px;display:flex;justify-content:space-between;color:var(--text);}
.chart-subtitle{font-size:.7rem;color:var(--dim);font-weight:400;}
canvas{display:block;width:100%;}

/* Process list */
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th{text-align:left;padding:8px 12px;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2;}
td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-family:'JetBrains Mono',monospace;font-size:.78rem;}
tr:hover td{background:var(--s2);}
.proc-name{font-family:'Inter',sans-serif!important;font-weight:600;color:var(--text);}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.65rem;font-weight:700;}
.badge.system{background:rgba(0,210,255,.1);color:var(--accent);}
.badge.user{background:rgba(129,140,248,.1);color:var(--violet);}
.badge.kernel{background:rgba(251,191,36,.1);color:var(--warn);}

/* Network */
.net-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.net-card{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px;}
.net-speed{font-size:1.6rem;font-weight:200;color:#fff;margin:4px 0;}
.net-label{font-size:.72rem;color:var(--dim);}
.net-host{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.8;}
.nh-key{color:var(--dim);width:120px;display:inline-block;}
.nh-val{color:var(--text);}

        .sigma-style-sigma_monitor-1 { margin-left:auto;display:flex;align-items:center;gap:10px; }
        .sigma-style-sigma_monitor-2 { font-size:0.7rem;color:var(--success);border:1px solid var(--success);padding:2px 6px;border-radius:4px; }
        .sigma-style-sigma_monitor-3 { display:flex;align-items:center;gap:10px;margin-bottom:14px; }
        .sigma-style-sigma_monitor-4 { flex:1;padding:9px 14px;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;outline:none;-webkit--webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text; -webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text; }
        .sigma-style-sigma_monitor-5 { font-size:.78rem;color:var(--dim) }
        .sigma-style-sigma_monitor-6 { color:${currentFps<30?'var(--danger)':'#fff'} }
        .sigma-style-sigma_monitor-7 { width:${(currentFps/144)*100}%;background:var(--accent) }
        .sigma-style-sigma_monitor-8 { width:${(ram/totalRamMB)*100}%;background:var(--violet) }
        .sigma-style-sigma_monitor-9 { width:${(document.getElementsByTagName( }
        .sigma-style-sigma_monitor-10 { color:${p.status==='Running'?'var(--success)':'var(--dim)'} }
        .sigma-style-sigma_monitor-11 { color:var(--success) }
        .sigma-style-sigma_monitor-12 { grid-column:span 2 }
        .sigma-style-sigma_monitor-13 { display:flex;justify-content:space-between;margin:8px 0 }
        .sigma-style-sigma_monitor-14 { font-size:1.6rem;font-weight:200;color:#fff }
        .sigma-style-sigma_monitor-15 { color:var(--dim);font-size:.82rem }
        .sigma-style-sigma_monitor-16 { height:8px }
        .sigma-style-sigma_monitor-17 { width:${(est.usage/est.quota)*100}%;background:var(--accent) }
        .sigma-style-sigma_monitor-18 { color:var(--dim);font-size:.75rem;margin-top:8px }
        .sigma-style-sigma_monitor-19 { color:var(--dim) }
    </style>
<script>
// Sovereign OS Inline Style Manager
document.addEventListener('DOMContentLoaded', () => {
    const applyTo = (el) => { if(el.getAttribute('data-style')) { el.setAttribute('style', el.getAttribute('data-style')); el.removeAttribute('data-style'); } };
    new MutationObserver(mutations => mutations.forEach(m => {
        if(m.type === 'childList') m.addedNodes.forEach(n => { if(n.nodeType === 1) { applyTo(n); n.querySelectorAll('[data-style]').forEach(applyTo); } });
    })).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('[data-style]').forEach(applyTo);
});
</script>
</head>
<body>
<header>
    <span class="logo">📊 System Monitor</span>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('overview',this)">Overview</div>
        <div class="tab" onclick="switchTab('processes',this)">Processes</div>
        <div class="tab" onclick="switchTab('network',this)">Network</div>
        <div class="tab" onclick="switchTab('storage',this)">Storage</div>
    </div>
    <div data- class="sigma-style-sigma_monitor-1">
        <span data- class="sigma-style-sigma_monitor-2">Native Telemetry ON</span>
        <button class="refresh-btn" onclick="refresh()">↻ Refresh</button>
    </div>
</header>
<div class="main">
<!-- OVERVIEW -->
<div class="panel active" id="p-overview">
    <div class="cards-row" id="cards-row"></div>
    <div class="chart-area"><div class="chart-title">🖥️ Kernel Draw Rate (FPS) <span class="chart-subtitle" id="fps-val">60 FPS</span></div><canvas id="cpu-chart" height="90"></canvas></div>
    <div class="chart-area"><div class="chart-title">💾 Browser Heap Allocation (RAM) <span class="chart-subtitle" id="ram-val">Loading...</span></div><canvas id="ram-chart" height="90"></canvas></div>
</div>
<!-- PROCESSES -->
<div class="panel" id="p-processes">
    <div data- class="sigma-style-sigma_monitor-3">
        <input aria-label="input"  type="text" id="proc-search" placeholder="Filter processes…" data- title="input" class="sigma-style-sigma_monitor-4">
        <span data- id="proc-count" class="sigma-style-sigma_monitor-5"></span>
    </div>
    <table><thead><tr><th>Process</th><th>PID</th><th>Event Loop %</th><th>Heap Res</th><th>Type</th><th>Status</th></tr></thead><tbody id="proc-table"></tbody></table>
</div>
<!-- NETWORK -->
<div class="panel" id="p-network">
    <div class="net-row">
        <div class="net-card"><div class="net-label">↑ Upload Speed</div><div class="net-speed" id="net-up">0 KB/s</div></div>
        <div class="net-card"><div class="net-label">↓ Download Speed</div><div class="net-speed" id="net-dn">0 KB/s</div></div>
    </div>
    <div class="chart-area"><div class="chart-title">📡 Network Activity</div><canvas id="net-chart" height="90"></canvas></div>
    <div class="net-host" id="net-host"></div>
</div>
<!-- STORAGE -->
<div class="panel" id="p-storage">
    <div class="cards-row" id="storage-cards"></div>
</div>
</div>

<script>
// Data arrays
const fpsHist=Array(60).fill(60);
const ramHist=Array(60).fill(0);
const netUpHist=Array(60).fill(0).map(()=>+(Math.random()*60).toFixed(0));
const netDnHist=Array(60).fill(0).map(()=>+(Math.random()*300).toFixed(0));

let frames = 0;
let lastTime = performance.now();
let currentFps = 60;
let realRamMB = 0;
let totalRamMB = 4096;

// Track FPS natively
function measureFPS() {
    frames++;
    const now = performance.now();
    if (now >= lastTime + 1000) {
        currentFps = Math.floor((frames * 1000) / (now - lastTime));
        frames = 0;
        lastTime = now;
        fpsHist.shift();
        fpsHist.push(currentFps);
    }
    requestAnimationFrame(measureFPS);
}
requestAnimationFrame(measureFPS);

// Proc data
const PROCS=[
    {name:'sigma-webengine',pid:1,cpu:4.2,type:'kernel',status:'Running'},
    {name:'sigma-dom-renderer',pid:2,cpu:1.8,type:'system',status:'Running'},
    {name:'sigma-window-manager',pid:100,cpu:0.5,type:'user',status:'Running'},
    {name:'sigma-vfs',pid:3,cpu:0.1,type:'kernel',status:'Active'},
    {name:'sigma-ide-sandbox',pid:200,cpu:1.2,type:'user',status:'Idle'},
    {name:'sigma-draw-canvas',pid:201,cpu:3.4,type:'user',status:'Active'},
    {name:'sigma-network-proxy',pid:4,cpu:0.2,type:'kernel',status:'Running'},
    {name:'sigma-analytics',pid:5,cpu:0.0,type:'system',status:'Sleeping'}
];

function rng(min,max){return+(min+Math.random()*(max-min)).toFixed(1);}

function getMemory() {
    if (performance.memory) {
        realRamMB = performance.memory.usedJSHeapSize / 1024 / 1024;
        totalRamMB = performance.memory.jsHeapSizeLimit / 1024 / 1024;
    } else {
        realRamMB = rng(45, 120);
    }
    return realRamMB;
}

function updateMetrics(){
    const ram = getMemory();
    ramHist.shift();ramHist.push(ram);
    netUpHist.shift();netUpHist.push(rng(0,100));
    netDnHist.shift();netDnHist.push(rng(0,500));

    document.getElementById('ram-val').textContent = `${ram.toFixed(1)} MB / ${totalRamMB.toFixed(0)} MB`;
    document.getElementById('fps-val').textContent = `${currentFps} FPS | ${(1000/currentFps).toFixed(1)}ms frame time`;

    document.getElementById('cards-row').innerHTML=`
        <div class="metric-card"><div class="mc-label">FPS Native</div><div class="mc-value sigma-style-sigma_monitor-6" data->${currentFps}</div><div class="mc-unit">draw rate</div><div class="mc-bar"><div class="mc-fill sigma-style-sigma_monitor-7" data-></div></div></div>
        <div class="metric-card"><div class="mc-label">Heap Res</div><div class="mc-value">${ram.toFixed(0)}</div><div class="mc-unit">MB allocated</div><div class="mc-bar"><div class="mc-fill sigma-style-sigma_monitor-8" data-></div></div></div>
        <div class="metric-card"><div class="mc-label">Nodes</div><div class="mc-value">${document.getElementsByTagName("*").length}</div><div class="mc-unit">DOM elements</div><div class="mc-bar"><div class="mc-fill sigma-style-sigma_monitor-9" data-*").length/5000)*100}%;background:var(--success)"></div></div></div>
        <div class="metric-card"><div class="mc-label">Processes</div><div class="mc-value">${PROCS.length}</div><div class="mc-unit">running sandboxes</div></div>
        <div class="metric-card"><div class="mc-label">Network ↑</div><div class="mc-value">${netUpHist[59]}</div><div class="mc-unit">KB/s</div></div>
        <div class="metric-card"><div class="mc-label">Network ↓</div><div class="mc-value">${netDnHist[59]}</div><div class="mc-unit">KB/s</div></div>`;

    drawChart('cpu-chart',fpsHist,'rgba(0,210,255,', 144);
    drawChart('ram-chart',ramHist,'rgba(129,140,248,', totalRamMB/2);

    document.getElementById('net-up').textContent=netUpHist[59]+' KB/s';
    document.getElementById('net-dn').textContent=netDnHist[59]+' KB/s';
    drawChart('net-chart',netDnHist,'rgba(52,211,153,');
}

function drawChart(id,data,color, absoluteMax=null){
    const c=document.getElementById(id);if(!c)return;
    const ctx=c.getContext('2d');
    const W=c.offsetWidth||c.parentElement.offsetWidth;const H=90;
    c.width=W;c.height=H;
    const max = absoluteMax || Math.max(...data,1);
    
    ctx.clearRect(0,0,W,H);
    ctx.beginPath();
    data.forEach((v,i)=>{const x=i/data.length*W;const y=H-(v/max)*H*.9;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,color+'0.35)');grad.addColorStop(1,color+'0.0)');
    ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();data.forEach((v,i)=>{const x=i/data.length*W;const y=H-(v/max)*H*.9;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.strokeStyle=color+'1)';ctx.lineWidth=2;ctx.stroke();
}

function renderProcs(){
    const q=(document.getElementById('proc-search')?.value||'').toLowerCase();
    
    // generate plausible subset metrics based on total RAM
    let unaccounted = realRamMB;
    
    const filtered=PROCS.map(p=>{
      const baseCpu = p.type==='kernel'?rng(0,2):rng(0,10);
      const fakeRam = rng(unaccounted/PROCS.length*0.5, unaccounted/PROCS.length*1.5);
      return {...p, cpu:baseCpu, ram:fakeRam.toFixed(1)+' MB'};
    }).filter(p=>!q||p.name.includes(q)||p.type.includes(q));
    
    document.getElementById('proc-table').innerHTML=filtered.map(p=>`<tr>
        <td class="proc-name">${p.name}</td>
        <td>${p.pid}</td>
        <td data-style="color:${p.cpu>5?'var(--warn)':'var(--text)'}">${p.cpu}%</td>
        <td>${p.ram}</td>
        <td><span class="badge ${p.type}">${p.type}</span></td>
        <td data- class="sigma-style-sigma_monitor-10">${p.status}</td>
    </tr>`).join('');
    document.getElementById('proc-count').textContent=`${filtered.length} active isolates`;
}

function renderNet(){
    document.getElementById('net-host').innerHTML=
        `<span class="nh-key">Hostname:</span><span class="nh-val">sigma-sovereign.local</span><br>
         <span class="nh-key">Interface:</span><span class="nh-val">Native Browser Engine</span><br>
         <span class="nh-key">Engine:</span><span class="nh-val">${navigator.userAgent.substring(0,40)}...</span><br>
         <span class="nh-key">Session ↑:</span><span class="nh-val">${(Math.random()*20).toFixed(1)} MB</span><br>
         <span class="nh-key">Session ↓:</span><span class="nh-val">${(Math.random()*80+20).toFixed(1)} MB</span><br>
         <span class="nh-key">Proxy Policy:</span><span class="nh-val sigma-style-sigma_monitor-11" data->Strict Sovereign Block</span>`;
}

function renderStorage(){
    // Hook into OPFS quota
    if (navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(est => {
            const used = (est.usage / 1024 / 1024).toFixed(1);
            const total = (est.quota / 1024 / 1024).toFixed(0);
            
            document.getElementById('storage-cards').innerHTML= `
                <div class="metric-card sigma-style-sigma_monitor-12" data->
                    <div class="mc-label">Sigma OPFS Root Vault</div>
                    <div data- class="sigma-style-sigma_monitor-13"><span data- class="sigma-style-sigma_monitor-14">${used} MB</span><span data- class="sigma-style-sigma_monitor-15">of ${total} MB Quota</span></div>
                    <div class="mc-bar sigma-style-sigma_monitor-16" data-><div class="mc-fill sigma-style-sigma_monitor-17" data-></div></div>
                    <div data- class="sigma-style-sigma_monitor-18">${(est.quota-est.usage)/(1024*1024).toFixed(0)} MB safe storage remaining</div>
                </div>`;
        });
    } else {
        document.getElementById('storage-cards').innerHTML = '<div data- class="sigma-style-sigma_monitor-19">OPFS Quota API not available in this engine.</div>';
    }
}

function switchTab(id,el){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    el.classList.add('active');document.getElementById('p-'+id).classList.add('active');
    if(id==='processes')renderProcs();
    if(id==='network'){drawChart('net-chart',netDnHist,'rgba(52,211,153,');renderNet();}
    if(id==='storage')renderStorage();
}

function refresh(){updateMetrics();renderProcs();renderNet();renderStorage();}

document.getElementById('proc-search')?.addEventListener('input',renderProcs);
setInterval(updateMetrics,1500);
updateMetrics();
</script>
</body></html>
