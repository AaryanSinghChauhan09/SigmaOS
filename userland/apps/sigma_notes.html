<!DOCTYPE html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta charset="UTF-8"><title>Sigma Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06090f;--s1:#0c1020;--s2:#111825;--border:rgba(255,255,255,.08);--accent:#fbbf24;--as:rgba(251,191,36,.1);--text:#e2e8f0;--dim:#4b5563;--r:10px;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;display:flex;overflow:hidden;}
aside{width:240px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.aside-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.aside-logo{font-weight:800;font-size:.9rem;color:var(--accent);}
.new-btn{padding:6px 12px;border-radius:6px;background:var(--accent);color:#000;border:none;font-weight:700;font-size:.78rem;cursor:pointer;font-family:'Inter',sans-serif;}
.new-btn:hover{opacity:.85;}
#search-notes{width:100%;padding:10px 14px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:.82rem;outline:none;-webkit--webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text; -webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text;}
#search-notes::placeholder{color:var(--dim);}
#notes-list{flex:1;overflow-y:auto;padding:8px;}
#notes-list::-webkit-scrollbar{width:3px}
#notes-list::-webkit-scrollbar-thumb{background:#1e2030;border-radius:2px}
.note-item{padding:12px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:background .14s,border .14s;}
.note-item:hover{background:rgba(255,255,255,.04);}
.note-item.active{background:var(--as);border-color:rgba(251,191,36,.3);}
.note-title{font-weight:600;font-size:.85rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px;}
.note-preview{font-size:.75rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.note-date{font-size:.68rem;color:var(--dim);margin-top:4px;}
.note-color{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

.editor-area{flex:1;display:flex;flex-direction:column;}
.editor-toolbar{background:var(--s1);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s;}
.color-dot:hover,.color-dot.active{transform:scale(1.15);border-color:rgba(255,255,255,.3);}
.sep{width:1px;height:20px;background:var(--border);}
.tb{padding:5px 9px;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--dim);cursor:pointer;font-size:.8rem;font-family:'Inter',sans-serif;transition:background .14s;}
.tb:hover{background:rgba(255,255,255,.06);color:var(--text);}
.del-btn{margin-left:auto;padding:5px 10px;border-radius:6px;background:transparent;border:1px solid rgba(248,113,113,.3);color:#f87171;cursor:pointer;font-size:.78rem;font-family:'Inter',sans-serif;}
.del-btn:hover{background:rgba(248,113,113,.08);}
#note-title-inp{width:100%;padding:16px 20px 8px;background:transparent;border:none;border-bottom:1px solid var(--border);color:#fff;font-family:'Inter',sans-serif;font-size:1.2rem;font-weight:700;outline:none;-webkit--webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text; -webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text;}
#note-body{flex:1;padding:16px 20px;background:transparent;border:none;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;line-height:1.75;resize:none;outline:none;-webkit--webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text; -webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text;overflow-y:auto;}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim);}
.empty-state .big{font-size:3rem;}

        .sigma-style-sigma_notes-1 { background:${n.color} }
        .sigma-style-sigma_notes-2 { background:${c} }
    </style>
<script>
// Sovereign OS Inline Style Manager
document.addEventListener('DOMContentLoaded', () => {
    const applyTo = (el) => { if(el.getAttribute('data-style')) { el.setAttribute('style', el.getAttribute('data-style')); el.removeAttribute('data-style'); } };
    new MutationObserver(mutations => mutations.forEach(m => {
        if(m.type === 'childList') m.addedNodes.forEach(n => { if(n.nodeType === 1) { applyTo(n); n.querySelectorAll('[data-style]').forEach(applyTo); } });
    })).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('[data-style]').forEach(applyTo);
});
</script>
</head>
<body>
<aside>
    <div class="aside-hdr"><span class="aside-logo">📝 Notes</span><button class="new-btn" onclick="newNote()">+</button></div>
    <input aria-label="input"  type="text" id="search-notes" placeholder="Search notes…" oninput="renderList()" title="input">
    <div id="notes-list"></div>
</aside>
<div class="editor-area" id="editor-area">
    <div class="empty-state"><div class="big">📝</div><div>Select or create a note</div></div>
</div>

<script>
const COLORS=['#fbbf24','#34d399','#f87171','#818cf8','#f472b6','#60a5fa'];
let notes=JSON.parse(localStorage.getItem('sigma-notes')||'[]');
let activeId=null;

if(!notes.length){
    notes=[
        {id:'n1',title:'Welcome to Sigma Notes',body:'Your sovereign note-taking app.\n\n• Rich markdown support\n• Color tags\n• Auto-save\n• Search',color:'#fbbf24',date:Date.now()},
        {id:'n2',title:'Indian Legal Quick Ref',body:'Section 138 NI Act — Cheque Bounce\nSection 420 IPC — Cheating\nArticle 21 — Right to Life\nSection 144 CrPC — Prohibitory Orders',color:'#818cf8',date:Date.now()-86400000},
        {id:'n3',title:'Study Plan 2026',body:'Jan: Companies Act Deep Dive\nFeb: Constitutional Law\nMar: Evidence Act & BNS\nApr: Mock Court Proceedings',color:'#34d399',date:Date.now()-172800000},
    ];
    save();
}

function save(){localStorage.setItem('sigma-notes',JSON.stringify(notes));}

function renderList(){
    const q=document.getElementById('search-notes').value.toLowerCase();
    const c=document.getElementById('notes-list');c.innerHTML='';
    notes.filter(n=>!q||n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q))
         .sort((a,b)=>b.date-a.date)
         .forEach(n=>{
        const d=document.createElement('div');
        d.className='note-item'+(n.id===activeId?' active':'');
        d.innerHTML=`<div class="note-title"><span class="note-color sigma-style-sigma_notes-1" data-></span>${n.title||'Untitled'}</div>
        <div class="note-preview">${n.body.slice(0,60)}</div>
        <div class="note-date">${new Date(n.date).toLocaleDateString('en-IN')}</div>`;
        d.onclick=()=>openNote(n.id);
        c.appendChild(d);
    });
}

function openNote(id){
    activeId=id;
    const n=notes.find(x=>x.id===id);
    const ea=document.getElementById('editor-area');
    ea.innerHTML=`
        <div class="editor-toolbar">
            ${COLORS.map(c=>`<div class="color-dot${n.color===c?' active':''} sigma-style-sigma_notes-2" data- onclick="setColor('${id}','${c}',this)"></div>`).join('')}
            <div class="sep"></div>
            <button class="tb" onclick="wrapText('**','**')"><b>B</b></button>
            <button class="tb" onclick="wrapText('_','_')"><i>I</i></button>
            <button class="tb" onclick="wrapText('\`','\`')">Code</button>
            <button class="tb" onclick="insertTemplate()">📋 Template</button>
            <button class="tb" onclick="exportNote('${id}')">💾 Export</button>
            <button class="del-btn" onclick="deleteNote('${id}')">🗑 Delete</button>
        </div>
        <input aria-label="input" type="text" id="note-title-inp" value="${htmlE(n.title)}" placeholder="Title" oninput="updateNote('${id}')" title="input">
        <textarea id="note-body" oninput="updateNote('${id}')" title="Input">${htmlE(n.body)}</textarea>`;
    renderList();
}

function updateNote(id){
    const n=notes.find(x=>x.id===id);
    if(!n)return;
    n.title=document.getElementById('note-title-inp').value;
    n.body=document.getElementById('note-body').value;
    n.date=Date.now();
    save();
}

function setColor(id,color,el){
    const n=notes.find(x=>x.id===id);if(!n)return;
    n.color=color;save();
    document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
    el.classList.add('active');
    renderList();
}

function deleteNote(id){
    if(!confirm('Delete this note?'))return;
    notes=notes.filter(n=>n.id!==id);save();activeId=null;
    document.getElementById('editor-area').innerHTML='<div class="empty-state"><div class="big">📝</div><div>Select or create a note</div></div>';
    renderList();
}

function newNote(){
    const id='n'+Date.now();
    notes.unshift({id,title:'',body:'',color:'#fbbf24',date:Date.now()});
    save();renderList();openNote(id);
    setTimeout(()=>document.getElementById('note-title-inp')?.focus(),50);
}

function wrapText(pre,suf){
    const ta=document.getElementById('note-body');if(!ta)return;
    const s=ta.selectionStart,e=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+pre+ta.value.slice(s,e)+suf+ta.value.slice(e);
    ta.focus();ta.setSelectionRange(s+pre.length,e+pre.length);
    const id=activeId;updateNote(id);
}

function insertTemplate(){
    const ta=document.getElementById('note-body');if(!ta)return;
    ta.value+= '\n\n## Section\n\n- Point 1\n- Point 2\n\n**Note:** \n\n---\n';
    ta.focus();updateNote(activeId);
}

function exportNote(id){
    const n=notes.find(x=>x.id===id);if(!n)return;
    const b=new Blob([`# ${n.title}\n\n${n.body}`],{type:'text/markdown'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n.title.replace(/\s+/g,'_')+'.md';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function htmlE(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

renderList();
</script>
</body></html>
