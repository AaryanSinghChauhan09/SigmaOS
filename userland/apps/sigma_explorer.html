<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Explorer — SigmaOS File Manager</title>
    <script src="../libs/sovereign_api.js" defer></script>
    <style>
        :root { --bg:#0f172a; --panel:#1e293b; --surface:rgba(255,255,255,0.02); --accent:#00d2ff; --text:#f1f5f9; --dim:#94a3b8; --border:rgba(255,255,255,0.08); }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family: 'Inter', sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        
        .toolbar { background:var(--panel); border-bottom:1px solid var(--border); padding:10px 20px; display:flex; gap:12px; align-items:center; }
        .path { flex:1; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; padding:6px 14px; font-size:0.8rem; color:var(--accent); }
        .nav-btn { background:rgba(255,255,255,0.05); border:none; color:white; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.85rem; }
        .nav-btn:hover { background:rgba(255,255,255,0.1); }
        
        .main { flex:1; display:grid; grid-template-columns: 240px 1fr 1fr; gap:1px; background:var(--border); }
        .sidebar { background:var(--bg); padding:15px; display:flex; flex-direction:column; gap:8px; }
        .side-item { padding:8px 12px; border-radius:8px; display:flex; align-items:center; gap:10px; cursor:pointer; font-size:0.85rem; color:var(--dim); }
        .side-item:hover, .side-item.active { background:rgba(0,210,255,0.1); color:var(--accent); }
        
        .view { background:var(--bg); display:flex; flex-direction:column; }
        .view-header { border-bottom:1px solid var(--border); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; }
        .file-list { flex:1; overflow-y:auto; padding:5px; }
        .file-item { display:flex; align-items:center; gap:12px; padding:10px 15px; border-radius:8px; cursor:pointer; font-size:0.85rem; transition:0.1s; }
        .file-item:hover { background:rgba(255,255,255,0.03); }
        .file-icon { font-size:1.4rem; }
        .file-info { flex:1; }
        .file-sz { font-size:0.75rem; color:var(--dim); }
        .f-dir { color:#febc2e; } .f-js { color:#f0db4f; } .f-cpp { color:#00599c; }
        
        .status-bar { height:30px; background:var(--panel); border-top:1px solid var(--border); display:flex; align-items:center; padding:0 15px; font-size:0.7rem; color:var(--dim); gap:20px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="nav-btn">←</button>
        <button class="nav-btn">→</button>
        <div class="path" id="path-bar">/home/sigma/Documents</div>
        <button class="nav-btn">⟳ Sync</button>
    </div>
    
    <div class="main">
        <div class="sidebar">
            <div class="side-item active">🏠 Home</div>
            <div class="side-item">📂 Documents</div>
            <div class="side-item">📦 Shards</div>
            <div class="side-item">🌌 MESH Nodes</div>
            <div class="side-item">🔒 Vault</div>
        </div>
        
        <div class="view" id="panel-left">
            <div class="view-header"><span>Left Shard</span> <span class="file-sz">12 Items</span></div>
            <div class="file-list" id="list-left"></div>
        </div>
        
        <div class="view" id="panel-right">
            <div class="view-header"><span>Right Shard (P2P Sync)</span> <span class="file-sz">Offline</span></div>
            <div class="file-list" id="list-right"></div>
        </div>
    </div>
    
    <div class="status-bar">
        <span>Sovereign Explorer v6.2 (Industrial)</span>
        <span id="sb-stats">CPU: 2.1% | MEM: 420MB used</span>
        <span id="sb-node">NODE: SIGMA_DELTA</span>
    </div>

    <script>
        const files = [
            { name:'libc_core.so', type:'shard', sz:'124 KB' },
            { name:'kernel_vpx.sys', type:'kmod', sz:'892 KB' },
            { name:'zenith_ui.app', type:'app', sz:'1.2 MB' },
            { name:'omnimind_ai', type:'dir', sz:'-' },
            { name:'budget_2026.pdf', type:'pdf', sz:'78 KB' },
            { name:'cases_legal.db', type:'db', sz:'2.4 GB' },
        ];

        function renderList(target, list) {
            const el = document.getElementById(target);
            el.innerHTML = list.map(f => `
                <div class="file-item">
                    <span class="file-icon">${f.type==='dir'?'📁':'📄'}</span>
                    <div class="file-info">
                        <div>${f.name}</div>
                        <div class="file-sz">${f.sz}</div>
                    </div>
                </div>
            `).join('');
        }

        async function updateStats() {
            if (window.SSA) {
                const s = await SSA.get_system_stats();
                document.getElementById('sb-stats').textContent = `CPU: ${s.cpu_load} | MEM: ${s.mem_used} used`;
                document.getElementById('sb-node').textContent = 'NODE: ' + SSA.node_id;
            }
        }

        window.onload = () => {
            renderList('list-left', files);
            renderList('list-right', files.slice(0,3)); // sync demo
            setInterval(updateStats, 3000);
            updateStats();
        };
    </script>
</body>
</html>
