<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigma Terminal — Sovereign Shell</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--surface:#111418;--accent:#00d2ff;--success:#34d399;--danger:#f87171;--warn:#fbbf24;--purple:#c084fc;--text:#e2e8f0;--dim:#64748b;--font:'JetBrains Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#term-header{background:var(--surface);border-bottom:1px solid rgba(255,255,255,.07);padding:8px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.dot{width:12px;height:12px;border-radius:50%;}
.d-r{background:#ff5f57;}.d-y{background:#febc2e;}.d-g{background:#28c840;}
.th-title{font-size:.8rem;color:var(--dim);margin-left:auto;}
#term-tabs{background:rgba(0,0,0,.3);border-bottom:1px solid rgba(255,255,255,.05);padding:0 12px;display:flex;gap:2px;flex-shrink:0;}
.term-tab{padding:5px 14px;font-size:.72rem;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;}
.term-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
#output{flex:1;overflow-y:auto;padding:16px 20px;font-size:.85rem;line-height:1.7;word-break:break-all;}
#output::-webkit-scrollbar{width:4px;}#output::-webkit-scrollbar-thumb{background:#1e2434;border-radius:2px;}
.line{display:block;margin-bottom:1px;}
.prompt{color:var(--accent);}.cmd-txt{color:var(--text);}.out-line{color:#94a3b8;}.err-line{color:var(--danger);}.ok-line{color:var(--success);}.info-line{color:var(--warn);}.purple-line{color:var(--purple);}
#input-row{display:flex;align-items:center;padding:8px 20px 14px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
#prompt-prefix{color:var(--accent);font-size:.85rem;white-space:nowrap;font-family:var(--font);}
#term-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:.85rem;caret-color:var(--accent);-webkit--webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text;-webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text;}
.suggest-box{position:absolute;bottom:48px;left:20px;background:#1e2434;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px;z-index:10;display:none;}
.suggest-item{padding:3px 10px;font-size:.78rem;color:var(--dim);cursor:pointer;border-radius:3px;}
.suggest-item:hover,.suggest-item.sel{background:rgba(0,210,255,.15);color:var(--text);}

        .sigma-style-sigma_terminal-1 { position:relative; }
        .sigma-style-sigma_terminal-2 { color:var(--purple) }
        .sigma-style-sigma_terminal-3 { background:rgba(251,191,36,.2) }
        .sigma-style-sigma_terminal-4 { color:var(--accent) }
    </style>

<script>
// Sovereign OS Inline Style Manager
document.addEventListener('DOMContentLoaded', () => {
    const applyTo = (el) => { if(el.getAttribute('data-style')) { el.setAttribute('style', el.getAttribute('data-style')); el.removeAttribute('data-style'); } };
    new MutationObserver(mutations => mutations.forEach(m => {
        if(m.type === 'childList') m.addedNodes.forEach(n => { if(n.nodeType === 1) { applyTo(n); n.querySelectorAll('[data-style]').forEach(applyTo); } });
    })).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('[data-style]').forEach(applyTo);
});
</script>
</head>
<body>
<div id="term-header">
  <div class="dot d-r"></div><div class="dot d-y"></div><div class="dot d-g"></div>
  <span class="th-title" id="th-title">sigma@sovereign: ~</span>
</div>

</div>
<div id="output"></div>
<div id="input-row" data- class="sigma-style-sigma_terminal-1">
  <span id="prompt-prefix">sigma@sovereign:~$ </span>
  <input aria-label="input" type="text" id="term-input" autocomplete="off" autocorrect="off" spellcheck="false" title="input">
  <div class="suggest-box" id="suggest-box"></div>
</div>

<script>
'use strict';
/**
 * SIGMA TERMINAL — Sovereign Shell v6.1
 * OOP: SigmaVFS + SigmaProcess + SigmaShell
 * 40+ real commands, piping, variables, history.
 */

/* ── VIRTUAL FILE SYSTEM ─────────────────────────────── */
class SigmaVFS {
  constructor() {
    this.tree = {
      '/': { type:'dir', children:['home','etc','bin','var','proc','dev','tmp','sys'] },
      '/home': { type:'dir', children:['sigma'] },
      '/home/sigma': { type:'dir', children:['Documents','Downloads','Desktop','.bashrc','.sigma_profile'] },
      '/home/sigma/Documents': { type:'dir', children:['legal_cases.md','constitution.md','budget_2026.txt','contract_nda.md'] },
      '/home/sigma/Downloads': { type:'dir', children:['SigmaOS_v6.1.iso','india_legal_corpus.tar.gz'] },
      '/home/sigma/Desktop': { type:'dir', children:['README.md','shortcuts.lnk'] },
      '/etc': { type:'dir', children:['passwd','hostname','fstab','sigma.conf','resolv.conf'] },
      '/bin': { type:'dir', children:['ls','cat','grep','echo','mkdir','rm','cp','mv','chmod','bash','sigma-pkg'] },
      '/var': { type:'dir', children:['log'] },
      '/var/log': { type:'dir', children:['sigma.log','auth.log','boot.log'] },
      '/proc': { type:'dir', children:['cpuinfo','meminfo','uptime','version','1','2','3'] },
      '/dev': { type:'dir', children:['null','zero','random','urandom','tty0','sda'] },
      '/tmp': { type:'dir', children:[] },
      '/sys': { type:'dir', children:['kernel','block','class'] },
    };
    this.files = {
      '/home/sigma/.bashrc': '# SigmaOS Bash Config\nexport PATH=/bin:/usr/bin\nexport USER=sigma\nalias ll="ls -la"\nalias cls="clear"',
      '/home/sigma/.sigma_profile': 'SIGMA_VERSION=6.1\nSIGMA_MODE=SOVEREIGN\nLOCALE=en-IN',
      '/home/sigma/Documents/legal_cases.md': '# Indian Case Law\n\n## Kesavananda Bharati v State of Kerala (1973)\n- Established Basic Structure Doctrine\n- 13-judge bench\n\n## Maneka Gandhi v Union of India (1978)\n- Expanded Article 21 (Right to Life)\n\n## AK Gopalan v State of Madras (1950)\n- First major constitutional case',
      '/home/sigma/Documents/constitution.md': '# Constitution of India\n\nPart III — Fundamental Rights\n- Article 14: Equality\n- Article 19: Freedom of Speech\n- Article 21: Life and Liberty\n- Article 32: Right to Constitutional Remedies',
      '/home/sigma/Documents/budget_2026.txt': 'Union Budget 2026-27\nTotal Outlay: Rs 50.65 Lakh Crore\nCapex: Rs 11.21 Lakh Crore\nRevenue Deficit: 1.8% of GDP\nFiscal Deficit Target: 4.4% of GDP',
      '/etc/hostname': 'sigma-sovereign',
      '/etc/sigma.conf': '[kernel]\nversion=6.1\nmode=sovereign\nscheduler=round-robin\n\n[security]\nzero_trust=true\ncsp=enforced\n\n[network]\nstack=sigma-net\nfirewall=active',
      '/etc/resolv.conf': 'nameserver 8.8.8.8\nnameserver 1.1.1.1\nsearch localdomain',
      '/proc/cpuinfo': 'processor: 0\nmodel name: Browser JIT Engine\ncache size: 8192 KB\ncpu MHz: 3200.000\nbogomips: 6400.00',
      '/proc/meminfo': 'MemTotal: 8192000 kB\nMemFree: 4096000 kB\nMemAvailable: 5120000 kB\nBuffers: 512000 kB\nCached: 1024000 kB',
      '/proc/version': 'SigmaOS version 6.1 (sigma@sovereign) (Sigma C++ 14.0, GNU ld 2.41) #1 SMP SOVEREIGN',
      '/var/log/sigma.log': '[2026-03-25 08:00:01] SigmaOS kernel starting\n[2026-03-25 08:00:02] VFS mounted\n[2026-03-25 08:00:03] Scheduler active\n[2026-03-25 08:00:05] All services up',
    };
    this.cwd = '/home/sigma';
  }

  resolve(path) {
    if (!path || path === '~') return '/home/sigma';
    if (path.startsWith('~/')) return '/home/sigma/' + path.slice(2);
    if (path.startsWith('/')) return path;
    // relative
    const parts = (this.cwd + '/' + path).split('/').filter(Boolean);
    const stack = [];
    for (const p of parts) { if (p === '..') stack.pop(); else if (p !== '.') stack.push(p); }
    return '/' + stack.join('/');
  }

  ls(path) {
    const abs = this.resolve(path || this.cwd);
    const node = this.tree[abs];
    if (!node) return null;
    return node.children || [];
  }

  isDir(path) { const n = this.tree[this.resolve(path)]; return n && n.type === 'dir'; }

  cat(path) {
    const abs = this.resolve(path);
    if (this.files[abs]) return this.files[abs];
    const node = this.tree[abs];
    if (node && node.type === 'dir') return `cat: ${path}: Is a directory`;
    return null;
  }

  mkdir(path) {
    const abs = this.resolve(path);
    if (this.tree[abs]) return false;
    this.tree[abs] = { type: 'dir', children: [] };
    const parent = abs.substring(0, abs.lastIndexOf('/')) || '/';
    if (this.tree[parent]) this.tree[parent].children.push(abs.split('/').pop());
    return true;
  }

  touch(path, content='') {
    const abs = this.resolve(path);
    this.files[abs] = content;
    const parent = abs.substring(0, abs.lastIndexOf('/')) || '/';
    const name = abs.split('/').pop();
    if (this.tree[parent] && !this.tree[parent].children.includes(name)) this.tree[parent].children.push(name);
    return true;
  }

  rm(path) {
    const abs = this.resolve(path);
    const parent = abs.substring(0, abs.lastIndexOf('/')) || '/';
    const name = abs.split('/').pop();
    if (this.files[abs]) { delete this.files[abs]; }
    else if (this.tree[abs]) { delete this.tree[abs]; }
    else return false;
    if (this.tree[parent]) this.tree[parent].children = this.tree[parent].children.filter(c => c !== name);
    return true;
  }
}

/* ── PROCESS TABLE ───────────────────────────────────── */
class SigmaProcessTable {
  constructor() {
    this.table = [
      { pid:1, name:'sigma_kernel', state:'S', cpu:'0.0', mem:'4096', user:'root', time:'0:00:42' },
      { pid:2, name:'sigma_scheduler', state:'S', cpu:'0.1', mem:'2048', user:'root', time:'0:00:42' },
      { pid:3, name:'sigma_vfs', state:'S', cpu:'0.0', mem:'8192', user:'root', time:'0:00:41' },
      { pid:4, name:'sigma_net', state:'S', cpu:'0.2', mem:'4096', user:'root', time:'0:00:41' },
      { pid:100, name:'sigma_desktop', state:'S', cpu:'1.2', mem:'32768', user:'sigma', time:'0:01:15' },
      { pid:101, name:'sigma_terminal', state:'R', cpu:'0.8', mem:'8192', user:'sigma', time:'0:00:05' },
    ];
    this.nextPid = 200;
  }
  spawn(name) {
    const p = { pid: this.nextPid++, name, state:'R', cpu:'0.0', mem:(Math.random()*8192+512|0).toString(), user:'sigma', time:'0:00:00' };
    this.table.push(p); return p;
  }
  kill(pid) { const i = this.table.findIndex(p=>p.pid===pid); if(i>=0){this.table.splice(i,1);return true;} return false; }
  list() { return this.table; }
}

/* ── SHELL ENGINE ────────────────────────────────────── */
class SigmaShell {
  constructor() {
    this.vfs = new SigmaVFS();
    this.procs = new SigmaProcessTable();
    this.history = [];
    this.histIdx = -1;
    this.vars = { USER:'sigma', HOME:'/home/sigma', SHELL:'/bin/sigma-bash', TERM:'xterm-256color', SIGMA_VERSION:'6.1' };
    this.aliases = { ll:'ls -la', la:'ls -a', cls:'clear', '..':'cd ..', grep:'grep' };
    this.out = document.getElementById('output');
    this.inp = document.getElementById('term-input');
    this.prefix = document.getElementById('prompt-prefix');
    this.sugBox = document.getElementById('suggest-box');
    this.startTime = Date.now();
    this._allCmds = ['ls','cd','cat','pwd','echo','mkdir','rmdir','rm','touch','cp','mv',
      'clear','date','whoami','uname','uptime','hostname','env','export','alias','unalias',
      'ps','kill','top','df','du','free','uname','which','find','grep','head','tail',
      'wc','sort','uniq','diff','chmod','chown','history','jobs','bg','fg','nohup',
      'ping','ifconfig','netstat','curl','wget','ssh','scp','tar','gzip','gunzip',
      'man','help','exit','sigma-pkg','neofetch','sigma-info','benchmark','theme'];
    this._bind();
  }

  _prompt() {
    const cwd = this.vfs.cwd.replace('/home/sigma','~');
    return `<span class="prompt">sigma@sovereign:<span data- class="sigma-style-sigma_terminal-2">${cwd}</span>$</span> `;
  }

  _updatePrompt() {
    const cwd = this.vfs.cwd.replace('/home/sigma','~');
    this.prefix.innerHTML = `sigma@sovereign:${cwd}$ `;
    document.getElementById('th-title').textContent = `sigma@sovereign: ${cwd}`;
  }

  print(html, cls='out-line') {
    const s = document.createElement('span');
    s.className = 'line ' + cls;
    s.innerHTML = html;
    this.out.appendChild(s);
    this.out.scrollTop = this.out.scrollHeight;
  }

  _esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  _bind() {
    this.inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const line = this.inp.value;
        this.inp.value = ''; this.sugBox.style.display='none';
        this.run(line);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        this.histIdx = Math.min(this.histIdx+1, this.history.length-1);
        this.inp.value = this.history[this.histIdx] || '';
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        this.histIdx = Math.max(this.histIdx-1, -1);
        this.inp.value = this.histIdx < 0 ? '' : this.history[this.histIdx];
      } else if (e.ctrlKey && e.key === 'l') {
        e.preventDefault(); this.out.innerHTML = '';
      } else if (e.ctrlKey && e.key === 'c') {
        e.preventDefault(); this.print('^C','err-line'); this.inp.value='';
      } else if (e.key === 'Tab') {
        e.preventDefault(); this._autocomplete();
      }
    });
    this.inp.addEventListener('input', () => this._showSuggestions());
    document.body.addEventListener('click', () => this.inp.focus());
    this.inp.focus();
  }

  _autocomplete() {
    const val = this.inp.value.trim();
    const parts = val.split(/\s+/);
    if (parts.length === 1) {
      const matches = this._allCmds.filter(c => c.startsWith(parts[0]));
      if (matches.length === 1) { this.inp.value = matches[0] + ' '; }
      else if (matches.length > 1) { this.print(matches.join('  ')); }
    } else {
      // complete path
      const partial = parts[parts.length-1];
      const dir = partial.includes('/') ? partial.substring(0, partial.lastIndexOf('/')+1) : '';
      const frag = partial.includes('/') ? partial.substring(partial.lastIndexOf('/')+1) : partial;
      const children = this.vfs.ls(dir || this.vfs.cwd) || [];
      const matches = children.filter(c => c.startsWith(frag));
      if (matches.length === 1) { parts[parts.length-1] = dir + matches[0]; this.inp.value = parts.join(' '); }
      else if (matches.length > 1) this.print(matches.join('  '));
    }
  }

  _showSuggestions() {
    const val = this.inp.value.trim();
    if (!val) { this.sugBox.style.display='none'; return; }
    const parts = val.split(/\s+/);
    if (parts.length === 1) {
      const m = this._allCmds.filter(c => c.startsWith(parts[0]) && c !== parts[0]);
      if (m.length > 0 && m.length < 8) {
        this.sugBox.innerHTML = m.map(s => `<div class="suggest-item">${s}</div>`).join('');
        this.sugBox.style.display='block';
        this.sugBox.querySelectorAll('.suggest-item').forEach(el => {
          el.onclick = () => { this.inp.value = el.textContent + ' '; this.sugBox.style.display='none'; this.inp.focus(); };
        });
        return;
      }
    }
    this.sugBox.style.display='none';
  }

  run(rawLine) {
    if (!rawLine.trim()) { this.out.scrollTop=this.out.scrollHeight; return; }
    // variable expansion
    const line = rawLine.replace(/\$(\w+)/g, (_, v) => this.vars[v] || '');
    this.print(this._prompt() + `<span class="cmd-txt">${this._esc(rawLine)}</span>`);
    this.history.unshift(rawLine); this.histIdx = -1;

    // alias expansion
    let parts = line.trim().split(/\s+/);
    if (this.aliases[parts[0]]) { parts = (this.aliases[parts[0]] + ' ' + parts.slice(1).join(' ')).trim().split(/\s+/); }

    // Pipe support
    const pipeSegments = line.trim().split('|').map(s=>s.trim());
    if (pipeSegments.length > 1) {
      this.print(this._runPipe(pipeSegments)); return;
    }

    const [cmd, ...args] = parts;
    this._exec(cmd, args);
  }

  _runPipe(segments) {
    let input = '';
    segments.forEach(seg => {
      const [cmd, ...args] = seg.split(/\s+/);
      if (cmd === 'grep') { const pat=args[0]||''; input=input.split('\n').filter(l=>l.includes(pat)).join('\n'); }
      else if (cmd === 'wc') {
        if (args[0]==='-l') { input=String(input.split('\n').filter(Boolean).length)+' lines'; }
        else { const ws=input.trim().split(/\s+/); input=`${input.split('\n').length} ${ws.length} ${input.length}`; }
      }
      else if (cmd === 'sort') { input=input.split('\n').sort().join('\n'); }
      else if (cmd === 'uniq') { const lines=input.split('\n'); input=lines.filter((l,i)=>l!==lines[i-1]).join('\n'); }
      else if (cmd === 'head') { const n=parseInt(args[0])||10; input=input.split('\n').slice(0,n).join('\n'); }
      else if (cmd === 'tail') { const n=parseInt(args[0])||10; const ls=input.split('\n'); input=ls.slice(Math.max(0,ls.length-n)).join('\n'); }
      else { const r=this._getOutput(cmd,args.join(' ').split(/\s+/)); input=r||input; }
    });
    return input ? this._esc(input).replace(/\n/g,'<br>') : '';
  }

  _getOutput(cmd, args) {
    if (cmd === 'ls') { return (this.vfs.ls(args[0]) || []).join('\n'); }
    if (cmd === 'cat') { return this.vfs.cat(args[0]) || ''; }
    if (cmd === 'echo') { return args.join(' '); }
    if (cmd === 'ps') { return this.procs.list().map(p=>`${p.pid}\t${p.state}\t${p.user}\t${p.name}`).join('\n'); }
    return '';
  }

  _exec(cmd, args) {
    switch(cmd) {
      case 'help': return this._help();
      case 'ls': return this._ls(args);
      case 'pwd': return this.print(this._esc(this.vfs.cwd), 'out-line');
      case 'cd': return this._cd(args[0]);
      case 'cat': return this._cat(args);
      case 'echo': return this.print(this._esc(args.join(' ')));
      case 'clear': this.out.innerHTML=''; return;
      case 'date': return this.print(new Date().toString());
      case 'whoami': return this.print('sigma (uid=1000, groups=sigma,sudo,sigma-dev)');
      case 'uname': return this._uname(args);
      case 'uptime': { const u=Math.floor((Date.now()-this.startTime)/1000); return this.print(`up ${Math.floor(u/60)}m ${u%60}s, 1 user, load average: 0.42, 0.37, 0.29`); }
      case 'hostname': return this.print('sigma-sovereign');
      case 'env': return Object.entries(this.vars).forEach(([k,v])=>this.print(`${this._esc(k)}=${this._esc(v)}`));
      case 'export': { if(args[0]&&args[0].includes('=')){const[k,v]=args[0].split('=');this.vars[k]=v;this.print(`export ${this._esc(k)}=${this._esc(v)}`,'ok-line');} return; }
      case 'alias': return this._alias(args);
      case 'ps': return this._ps(args);
      case 'kill': return this._kill(args);
      case 'top': return this._top();
      case 'free': return this._free();
      case 'df': return this._df();
      case 'du': return this._du(args);
      case 'mkdir': return args.length ? (this.vfs.mkdir(args[0]) ? this.print(`Created: ${args[0]}`,'ok-line') : this.print(`mkdir: cannot create directory '${args[0]}': File exists`,'err-line')) : this.print('Usage: mkdir <dir>','err-line');
      case 'touch': return args.length ? (this.vfs.touch(args[0]), this.print(`Touched: ${args[0]}`,'ok-line')) : this.print('Usage: touch <file>','err-line');
      case 'rm': return this._rm(args);
      case 'find': return this._find(args);
      case 'grep': return this._grep(args);
      case 'head': return this._headtail(args, 'head');
      case 'tail': return this._headtail(args, 'tail');
      case 'wc': return this._wc(args);
      case 'history': return this.history.slice(0,20).forEach((h,i)=>this.print(`${String(i+1).padStart(3,' ')}  ${this._esc(h)}`));
      case 'man': return this._man(args[0]);
      case 'which': return this.print(args[0] ? `/bin/${args[0]}` : 'Usage: which <command>');
      case 'ping': return this._ping(args[0]);
      case 'ifconfig': return this._ifconfig();
      case 'netstat': return this._netstat();
      case 'neofetch': return this._neofetch();
      case 'sigma-info': return this._sigmaInfo();
      case 'sigma-pkg': return this._sigmaPkg(args);
      case 'benchmark': return this._benchmark();
      case 'chmod': return this.print(`chmod: ${this._esc(args.join(' '))} — permissions applied`,'ok-line');
      case 'theme': return this._theme(args[0]);
      case 'exit': return this.print('Closing terminal session…','info-line');
      case 'jobs': return this.print('[1] Running  sigma_terminal', 'out-line');
      case 'tar': return this.print(`tar: simulated — ${this._esc(args.join(' '))}`,'info-line');
      case 'diff': return this._diff(args);
      default: return this.print(`σ: command not found: <span class="err-line">${this._esc(cmd)}</span> — type 'help' for commands`);
    }
  }

  _ls(args) {
    const flags = args.filter(a=>a.startsWith('-')).join('');
    const path = args.filter(a=>!a.startsWith('-'))[0];
    const children = this.vfs.ls(path);
    if (!children) { this.print(`ls: cannot access '${this._esc(path)}': No such file or directory`,'err-line'); return; }
    if (flags.includes('l')) {
      this.print('total ' + children.length*4);
      children.forEach(c => {
        const abs = this.vfs.resolve((path || this.vfs.cwd) + '/' + c);
        const isDir = this.vfs.isDir(abs);
        const perm = isDir ? 'drwxr-xr-x' : '-rw-r--r--';
        const sz = this.vfs.files[abs] ? this.vfs.files[abs].length : 4096;
        this.print(`${perm}  1 sigma sigma ${String(sz).padStart(6,' ')} Mar 25 08:00 <span class="${isDir?'ok-line':'out-line'}">${this._esc(c)}${isDir?'/':''}</span>`);
      });
    } else {
      const items = children.map(c => {
        const abs = this.vfs.resolve((path||this.vfs.cwd)+'/'+c);
        return this.vfs.isDir(abs) ? `<span class="ok-line">${this._esc(c)}/</span>` : `<span class="out-line">${this._esc(c)}</span>`;
      });
      this.print(items.join('  ') || '(empty)');
    }
  }

  _cd(dir) {
    if (!dir || dir === '~') { this.vfs.cwd = '/home/sigma'; this._updatePrompt(); return; }
    const abs = this.vfs.resolve(dir);
    if (this.vfs.isDir(abs)) { this.vfs.cwd = abs; this._updatePrompt(); }
    else this.print(`cd: ${this._esc(dir)}: No such file or directory`,'err-line');
  }

  _cat(args) {
    args.filter(a=>!a.startsWith('-')).forEach(f => {
      const content = this.vfs.cat(f);
      if (content) this.print(this._esc(content).replace(/\n/g,'<br>'));
      else this.print(`cat: ${this._esc(f)}: No such file or directory`,'err-line');
    });
  }

  _ps(args) {
    this.print('  PID S USER     COMMAND','info-line');
    this.procs.list().forEach(p => this.print(`${String(p.pid).padStart(5,' ')} ${p.state} ${p.user.padEnd(8,' ')} ${p.name}`));
  }

  _kill(args) {
    const pid = parseInt(args[args.length-1]);
    if (isNaN(pid)) { this.print('Usage: kill [-9] <pid>','err-line'); return; }
    if (pid < 5) { this.print(`kill: (${pid}): Operation not permitted`,'err-line'); return; }
    this.procs.kill(pid) ? this.print(`[${pid}] Terminated`,'ok-line') : this.print(`kill: (${pid}): No such process`,'err-line');
  }

  _top() {
    this.print('=== SIGMA TOP — Process Monitor ===','info-line');
    this.print('  PID  CPU%  MEM(KB) STATE USER     COMMAND','info-line');
    this.procs.list().forEach(p => this.print(`${String(p.pid).padStart(5)} ${p.cpu.padStart(5)}% ${String(p.mem).padStart(8)} ${p.state}     ${p.user.padEnd(8)} ${p.name}`));
    this.print(`Tasks: ${this.procs.list().length} total | Memory: 8192 MB | Uptime: ${Math.floor((Date.now()-this.startTime)/60000)}m`);
  }

  _free() {
    this.print('               total    used    free    shared  buffers  available','info-line');
    this.print('Mem:         8388608 3276800 4194304  262144   524288   4980736');
    this.print('Swap:        2097152       0 2097152');
  }

  _df() {
    this.print('Filesystem     Size  Used Avail Use% Mounted on','info-line');
    this.print('/dev/sda1       50G  8.2G   42G  17% /');
    this.print('tmpfs          4.0G     0  4.0G   0% /tmp');
    this.print('sigma-vfs       10G  1.1G  8.9G  12% /home');
  }

  _du(args) {
    const path = args.filter(a=>!a.startsWith('-'))[0] || '.';
    this.print(`4.2M\t${this._esc(path)}`,'out-line');
  }

  _rm(args) {
    const flags = args.filter(a=>a.startsWith('-')).join('');
    const files = args.filter(a=>!a.startsWith('-'));
    files.forEach(f => {
      if (this.vfs.rm(f)) this.print(`removed '${this._esc(f)}'`,'ok-line');
      else this.print(`rm: cannot remove '${this._esc(f)}': No such file or directory`,'err-line');
    });
  }

  _find(args) {
    const dir = args[0] || '.';
    const name = args.indexOf('-name') >= 0 ? args[args.indexOf('-name')+1] : null;
    const results = [];
    const search = (d) => {
      const children = this.vfs.ls(d) || [];
      children.forEach(c => {
        const abs = this.vfs.resolve(d + '/' + c);
        if (!name || c.includes(name.replace('*',''))) results.push(abs);
        if (this.vfs.isDir(abs)) search(abs);
      });
    };
    search(this.vfs.resolve(dir));
    if (results.length) results.forEach(r => this.print(this._esc(r)));
    else this.print('(no results)','dim');
  }

  _grep(args) {
    const pat = args.find(a=>!a.startsWith('-'));
    const file = args[args.length-1];
    if (pat === file) { this.print('Usage: grep <pattern> <file>','err-line'); return; }
    const content = this.vfs.cat(file);
    if (!content) { this.print(`grep: ${this._esc(file)}: No such file`,'err-line'); return; }
    const matches = content.split('\n').filter(l=>l.includes(pat));
    if (matches.length) matches.forEach(l => this.print(this._esc(l).replace(this._esc(pat), `<span class="warn-line sigma-style-sigma_terminal-3" data->${this._esc(pat)}</span>`)));
    else this.print('(no matches)','dim');
  }

  _headtail(args, mode) {
    const n = args[0] === '-n' ? parseInt(args[1]) : 10;
    const file = args[args.indexOf('-n')>=0 ? args.indexOf('-n')+2 : 0] || args[0];
    const content = this.vfs.cat(file);
    if (!content) { this.print(`${mode}: ${this._esc(file)}: No such file`,'err-line'); return; }
    const lines = content.split('\n');
    const out = mode === 'head' ? lines.slice(0,n) : lines.slice(-n);
    out.forEach(l => this.print(this._esc(l)));
  }

  _wc(args) {
    const file = args.filter(a=>!a.startsWith('-'))[0];
    if (!file) { this.print('Usage: wc <file>','err-line'); return; }
    const content = this.vfs.cat(file) || '';
    const lines = content.split('\n').length;
    const words = content.trim().split(/\s+/).length;
    const bytes = content.length;
    this.print(`${lines}\t${words}\t${bytes}\t${this._esc(file)}`);
  }

  _diff(args) {
    const [f1,f2] = args;
    const c1 = (this.vfs.cat(f1)||'').split('\n');
    const c2 = (this.vfs.cat(f2)||'').split('\n');
    const maxLen = Math.max(c1.length, c2.length);
    let diffFound = false;
    for (let i=0; i<maxLen; i++) {
      if (c1[i] !== c2[i]) {
        if(c1[i]) this.print(`< ${this._esc(c1[i])}`,'err-line');
        if(c2[i]) this.print(`> ${this._esc(c2[i])}`,'ok-line');
        diffFound = true;
      }
    }
    if (!diffFound) this.print('Files are identical.','ok-line');
  }

  _ping(host) {
    if (!host) { this.print('Usage: ping <host>','err-line'); return; }
    this.print(`PING ${this._esc(host)} (via Sigma Net Stack):`,'info-line');
    [1,2,3,4].forEach((i,idx) => {
      setTimeout(() => {
        const ms = (Math.random()*40+5).toFixed(2);
        this.print(`64 bytes from ${this._esc(host)}: icmp_seq=${i} ttl=64 time=${ms} ms`,'out-line');
        this.out.scrollTop=this.out.scrollHeight;
        if (i===4) { this.print(`--- ${this._esc(host)} ping statistics ---`,'info-line'); this.print('4 packets transmitted, 4 received, 0% packet loss','ok-line'); }
      }, idx*400);
    });
  }

  _ifconfig() {
    this.print('<span class="ok-line">eth0</span>: flags=4163&lt;UP,BROADCAST,RUNNING,MULTICAST&gt;  mtu 1500');
    this.print('        inet <span class="purple-line">192.168.1.10</span>  netmask 255.255.255.0  broadcast 192.168.1.255');
    this.print('        ether <span class="purple-line">5c:5b:35:f1:aa:bb</span>  txqueuelen 1000');
    this.print('<span class="ok-line">lo</span>: flags=73&lt;UP,LOOPBACK,RUNNING&gt;  mtu 65536');
    this.print('        inet 127.0.0.1  netmask 255.0.0.0');
  }

  _netstat() {
    this.print('Active Internet connections','info-line');
    this.print('Proto  Local Address        Foreign Address      State');
    this.print('tcp    192.168.1.10:80      0.0.0.0:*            LISTEN');
    this.print('tcp    192.168.1.10:443     0.0.0.0:*            LISTEN');
    this.print('tcp    192.168.1.10:51432   8.8.8.8:53           ESTABLISHED');
  }

  _man(cmd) {
    const manuals = {
      ls: 'ls — list directory contents\nUsage: ls [-la] [path]\n  -l  long format\n  -a  show hidden files',
      cat: 'cat — concatenate and print files\nUsage: cat <file>',
      grep: 'grep — search for pattern in file\nUsage: grep <pattern> <file>',
      cd: 'cd — change directory\nUsage: cd [dir|~|..]',
      mkdir: 'mkdir — make directories\nUsage: mkdir <dir>',
      rm: 'rm — remove files\nUsage: rm [-r] <file>',
      ps: 'ps — report process status\nUsage: ps',
      kill: 'kill — send signal to process\nUsage: kill [-9] <pid>',
    };
    if (!cmd) { this.print('Usage: man <command>','err-line'); return; }
    const m = manuals[cmd];
    if (m) this.print(this._esc(m).replace(/\n/g,'<br>'),'info-line');
    else this.print(`No manual entry for ${this._esc(cmd)}`,'err-line');
  }

  _alias(args) {
    if (!args.length) { Object.entries(this.aliases).forEach(([k,v])=>this.print(`alias ${this._esc(k)}='${this._esc(v)}'`)); return; }
    const eq = args.join(' ');
    if (eq.includes('=')) { const [k,...v]=eq.split('='); this.aliases[k.trim()]=v.join('=').replace(/'/g,''); this.print(`alias ${this._esc(k.trim())} set`,'ok-line'); }
  }

  _uname(args) {
    const full = args.includes('-a') || args.includes('--all');
    const kernel = 'SigmaOS'; const ver = '6.1-zenith-sovereign'; const arch = 'x86_64';
    if (full) this.print(`${kernel} sigma-sovereign ${ver} #1 SMP SOVEREIGN ${arch} GNU/SigmaOS`);
    else this.print(kernel);
  }

  _neofetch() {
    this.print(`<span data- class="sigma-style-sigma_terminal-4">   ███████╗██╗ ██████╗ ███╗   ███╗ █████╗ 
   ██╔════╝██║██╔════╝ ████╗ ████║██╔══██╗
   ███████╗██║██║  ███╗██╔████╔██║███████║
   ╚════██║██║██║   ██║██║╚██╔╝██║██╔══██║
   ███████║██║╚██████╔╝██║ ╚═╝ ██║██║  ██║
   ╚══════╝╚═╝ ╚═════╝ ╚═╝     ╚═╝╚═╝  ╚═╝</span>
   <span class="ok-line">OS:</span>       SigmaOS v6.1 Zenith Sovereign
   <span class="ok-line">Kernel:</span>   WebKernel v6.1 + SigmaLibC
   <span class="ok-line">Shell:</span>    SigmaShell 6.1 (bash compat)
   <span class="ok-line">Uptime:</span>   ${Math.floor((Date.now()-this.startTime)/60000)}m ${Math.floor((Date.now()-this.startTime)/1000)%60}s
   <span class="ok-line">CPU:</span>      Browser JIT Engine @ 3.2 GHz
   <span class="ok-line">Memory:</span>   ${performance.memory ? Math.round(performance.memory.usedJSHeapSize/1048576) : '~'}MB / 8192MB
   <span class="ok-line">Arch:</span>     WebAssembly x86_64
   <span class="ok-line">Origin:</span>   🇮🇳 India — Sovereign OS`);
  }

  _sigmaInfo() {
    this.print('=== SIGMAOS SOVEREIGN SYSTEM INFO ===','info-line');
    this.print(`Version: 6.1 Zenith | Kernel: WebKernel 6.1 | Arch: x86_64 Browser`);
    this.print(`Processes: ${this.procs.list().length} | VFS nodes: ${Object.keys(this.vfs.tree).length}`);
    this.print(`JS Heap: ${performance.memory ? Math.round(performance.memory.usedJSHeapSize/1024) : '?'} KB used`);
    this.print('Security: Zero-Trust CSP | Deps: ZERO | License: Sovereign Proprietary','ok-line');
  }

  _sigmaPkg(args) {
    const sub = args[0]; const pkg = args[1];
    const db = ['sigma-tools','sigma-legal','sigma-finance','sigma-ide','sigma-net','sigma-crypto'];
    if (sub === 'list') { db.forEach((p,i)=>this.print(`  [${i}] ${p}  v6.1  installed`,'ok-line')); return; }
    if (sub === 'install' && pkg) { this.print(`Fetching ${this._esc(pkg)} from SigmaStore…`,'info-line'); setTimeout(()=>{ this.print(`Installing ${this._esc(pkg)}… done`,'ok-line'); this.out.scrollTop=this.out.scrollHeight; },800); return; }
    if (sub === 'remove' && pkg) { this.print(`Removed ${this._esc(pkg)}`,'ok-line'); return; }
    if (sub === 'search' && pkg) { const m=db.filter(p=>p.includes(pkg)); m.forEach(p=>this.print(`  ${p}`)); return; }
    this.print('Usage: sigma-pkg [list|install|remove|search] [package]','info-line');
  }

  _benchmark() {
    this.print('Running SigmaOS Benchmark Suite…','info-line');
    const t = performance.now();
    let x = 0; for (let i=0;i<1e7;i++) x+=Math.sqrt(i);
    const dur = (performance.now()-t).toFixed(2);
    this.print(`CPU Score:     ${(1e7/dur*1000).toFixed(0)} ops/sec (${dur}ms)`,'ok-line');
    const m = []; const t2=performance.now();
    for(let i=0;i<1e5;i++) m.push(i*2); m.length=0;
    this.print(`Memory Score:  ${(1e5/(performance.now()-t2)*1000).toFixed(0)} allocs/sec`,'ok-line');
    this.print(`JS JIT Engine: ACTIVE | WASM support: ${typeof WebAssembly!=='undefined'?'YES':'NO'}`,'ok-line');
  }

  _theme(name) {
    const themes = { dark:'#0a0c10', light:'#f0f4f8', green:'#091809', purple:'#0d0713' };
    if (themes[name]) { document.body.style.background=themes[name]; this.print(`Theme set: ${this._esc(name)}`,'ok-line'); }
    else this.print(`Available themes: ${Object.keys(themes).join(', ')}`,'info-line');
  }

  _help() {
    this.print('=== Σ SIGMA SHELL v6.1 — COMMANDS ===','info-line');
    const cmds = [
      ['NAVIGATION','ls [-la] [dir]','List files','cd [dir|~|..]','Change dir','pwd','Working dir','find [-name]','Search files'],
      ['FILES','cat <file>','View file','touch <file>','Create file','mkdir <dir>','Make dir','rm <file>','Remove','diff <f1> <f2>','Compare'],
      ['TEXT','echo <text>','Print text','grep <pat> <file>','Search','head/tail [-n]','First/last lines','wc <file>','Word count','sort/uniq','Sort/unique'],
      ['SYSTEM','ps','Processes','kill <pid>','Kill process','top','Process monitor','free','Memory','df','Disk space','du','Dir size','uptime','Uptime'],
      ['INFO','uname [-a]','System info','hostname','Hostname','whoami','Current user','env','Variables','history','Command history','neofetch','System art'],
      ['NETWORK','ping <host>','Ping host','ifconfig','Network interfaces','netstat','Connections'],
      ['SIGMA','sigma-pkg','Package manager','sigma-info','System detail','benchmark','Performance test','theme [name]','Set theme'],
    ];
    cmds.forEach(group => {
      this.print(`<span class="info-line">── ${group[0]} ──</span>`);
      for (let i=1; i<group.length; i+=2) this.print(`  <span class="ok-line">${this._esc(group[i])}</span>  ${this._esc(group[i+1]||'')}`);
    });
    this.print('Pipe: cmd1 | grep pat | wc -l | sort','dim');
    this.print('Tab to autocomplete | ↑↓ history | Ctrl+L clear | Ctrl+C cancel','dim');
  }
}

// Boot
const shell = new SigmaShell();
shell.print('<span class="info-line">Σ SigmaOS Sovereign Shell v6.1 — Zero-Dependency</span>');
shell.print(`<span class="dim">Kernel: WebKernel 6.1 | ${new Date().toLocaleString('en-IN')} | Type 'help' for commands</span>`);
shell.print('');
</script>
