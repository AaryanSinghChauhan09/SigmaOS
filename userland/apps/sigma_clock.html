<!DOCTYPE html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta charset="UTF-8"><title>Sigma Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--s1:#0c0c16;--s2:#12121e;--border:rgba(255,255,255,.07);--accent:#00d2ff;--as:rgba(0,210,255,.1);--text:#e2e8f0;--dim:#4b5563;--success:#34d399;--danger:#f87171;--warn:#fbbf24;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit--webkit--webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none; -webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none; -webkit--webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none; -webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none;}
.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:12px;text-align:center;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--dim);transition:color .15s,background .15s;}
.tab.active{color:var(--accent);border-bottom:2px solid var(--accent);background:var(--as);}
.panel{flex:1;overflow:hidden;display:none;flex-direction:column;align-items:center;}
.panel.active{display:flex;}

/* Clock */
#p-clock { padding: 30px; }
.clock-face{text-align:center;}
.clock-time{font-size:5rem;font-weight:200;letter-spacing:-2px;color:#fff;line-height:1;}
.clock-date{font-size:1.1rem;color:var(--dim);margin-top:10px;}
.clock-day{font-size:.85rem;color:var(--accent);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}

.world-clocks{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:14px;margin-top:40px;width:100%;max-width:800px;}
.wc{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;position:relative;}
.wc-city{font-size:.8rem;color:var(--text);font-weight:700;letter-spacing:.5px;margin-bottom:6px;}
.wc-time{font-size:1.5rem;font-weight:300;color:var(--accent);}
.wc-tz{font-size:.65rem;color:var(--dim);margin-top:2px;position:relative;top:4px;}
.wc-sun{font-size:.7rem;color:var(--warn);margin-top:12px;display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--border);}
.wc-sun div{display:flex;flex-direction:column;}
.wc-sun span{color:var(--dim);font-size:.6rem;text-transform:uppercase;}

/* SunCalc Orbit (aesthetic) */
.orbit-wrap{width:200px;height:100px;margin:20px auto 0;position:relative;overflow:hidden;border-bottom:1px solid var(--dim);}
.orbit-path{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:180px;height:180px;border-radius:50%;border:1px dashed var(--dim);clip-path:polygon(0 0, 100% 0, 100% 50%, 0 50%);}
.sun-dot{position:absolute;width:14px;height:14px;background:var(--warn);border-radius:50%;box-shadow:0 0 10px var(--warn);transform:translate(-50%,50%);transition:left 1s, bottom 1s;}

/* Controls shared */
.btn{padding:10px 22px;border-radius:8px;border:1px solid var(--border);background:var(--accent);color:#000;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;font-size:.85rem;}
.btn-outline{background:transparent;color:var(--accent);border-color:var(--accent);}
.btn:hover{opacity:.85;}

/* Alarm */
#p-alarm{padding:20px;justify-content:center;}
.alarm-list{width:min(460px,100%);display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;}
.alarm-card{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px;}
.alarm-time{font-size:1.5rem;font-weight:200;color:#fff;}
.alarm-label{font-size:.82rem;color:var(--dim);}
.alarm-toggle{margin-left:auto;cursor:pointer;font-size:1.4rem;}

/* Stopwatch */
#p-stopwatch{justify-content:center;}
.sw-display{font-size:4.5rem;font-weight:200;color:#fff;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin-bottom:20px;}
.sw-controls{display:flex;gap:14px;}
.laps{width:min(400px,90%);margin-top:30px;max-height:30vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.lap{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;display:flex;justify-content:space-between;font-size:.85rem;}
.lap-n{color:var(--dim);}
.lap-t{color:#fff;font-weight:600;}

/* Timer */
#p-timer{justify-content:center;}
.timer-inputs{display:flex;gap:8px;margin-bottom:30px;align-items:center;}
.ti{width:80px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:1.2rem;text-align:center;outline:none;-webkit--webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text; -webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text;}
.ti:focus{border-color:var(--accent);}
.ti-label{font-size:.72rem;color:var(--dim);margin-top:6px;}
.timer-display{font-size:4rem;font-weight:200;color:#fff;font-variant-numeric:tabular-nums;line-height:1;}
.timer-ring{width:200px;height:200px;margin:0 auto 30px;position:relative;}
.timer-ring svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--s2);stroke-width:8;}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s;}


        .sigma-style-sigma_clock-1 { left:50%;bottom:50%; }
        .sigma-style-sigma_clock-2 { display:flex;gap:10px;margin-top:20px;width:min(460px,100%); }
        .sigma-style-sigma_clock-3 { padding:10px;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif }
        .sigma-style-sigma_clock-4 { flex:1;padding:10px;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;outline:none; }
        .sigma-style-sigma_clock-5 { text-align:center }
        .sigma-style-sigma_clock-6 { font-size:1.5rem;color:var(--dim);align-self:flex-start;margin-top:10px; }
        .sigma-style-sigma_clock-7 { text-align:center }
        .sigma-style-sigma_clock-8 { font-size:1.5rem;color:var(--dim);align-self:flex-start;margin-top:10px; }
        .sigma-style-sigma_clock-9 { text-align:center }
        .sigma-style-sigma_clock-10 { position:absolute;inset:0;display:flex;align-items:center;justify-content:center; }
        .sigma-style-sigma_clock-11 { display:flex;gap:14px; }
        .sigma-style-sigma_clock-12 { cursor:pointer;opacity:.5;font-size:1.2rem;margin-left:10px }
    </style>
<script>
// Sovereign OS Inline Style Manager
document.addEventListener('DOMContentLoaded', () => {
    const applyTo = (el) => { if(el.getAttribute('data-style')) { el.setAttribute('style', el.getAttribute('data-style')); el.removeAttribute('data-style'); } };
    new MutationObserver(mutations => mutations.forEach(m => {
        if(m.type === 'childList') m.addedNodes.forEach(n => { if(n.nodeType === 1) { applyTo(n); n.querySelectorAll('[data-style]').forEach(applyTo); } });
    })).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('[data-style]').forEach(applyTo);
});
</script>
</head>
<body>
<div class="tabs">
    <div class="tab active" onclick="switchTab('clock',this)">🕐 World Clock</div>
    <div class="tab" onclick="switchTab('alarm',this)">⏰ Alarm</div>
    <div class="tab" onclick="switchTab('stopwatch',this)">⏱️ Stopwatch</div>
    <div class="tab" onclick="switchTab('timer',this)">⏳ Timer</div>
</div>

<!-- CLOCK -->
<div class="panel active" id="p-clock">
    <div class="clock-face">
        <div class="clock-time" id="clock-main">00:00:00</div>
        <div class="clock-date" id="clock-date">Loading…</div>
        <div class="clock-day" id="clock-day">Wednesday</div>
    </div>
    
    <div class="orbit-wrap" title="Local Solar Position Estimate">
      <div class="orbit-path"></div>
      <div class="sun-dot sigma-style-sigma_clock-1" id="sun-dot" data-></div>
    </div>
    
    <div class="world-clocks" id="world-clocks">
        <!-- populated by JS -->
    </div>
</div>

<!-- ALARM -->
<div class="panel" id="p-alarm">
    <div class="alarm-list" id="alarm-list"></div>
    <div data- class="sigma-style-sigma_clock-2">
        <input aria-label="input" type="time" id="alarm-time-inp" data- title="input" class="sigma-style-sigma_clock-3">
        <input aria-label="input" type="text" id="alarm-label-inp" placeholder="Label (optional)" data- title="input" class="sigma-style-sigma_clock-4">
        <button class="btn" onclick="addAlarm()">+ Add</button>
    </div>
</div>

<!-- STOPWATCH -->
<div class="panel" id="p-stopwatch">
    <div class="sw-display" id="sw-display">00:00.00</div>
    <div class="sw-controls">
        <button class="btn btn-outline" onclick="swReset()">Reset</button>
        <button class="btn" id="sw-btn" onclick="swToggle()">Start</button>
        <button class="btn btn-outline" onclick="swLap()">Lap</button>
    </div>
    <div class="laps" id="laps"></div>
</div>

<!-- TIMER -->
<div class="panel" id="p-timer">
    <div class="timer-inputs">
        <div data- class="sigma-style-sigma_clock-5"><input aria-label="input" class="ti" id="t-h" type="number" min="0" max="99" value="0" placeholder="00" title="input"><div class="ti-label">HRS</div></div>
        <span data- class="sigma-style-sigma_clock-6">:</span>
        <div data- class="sigma-style-sigma_clock-7"><input aria-label="input" class="ti" id="t-m" type="number" min="0" max="59" value="25" placeholder="00" title="input"><div class="ti-label">MIN</div></div>
        <span data- class="sigma-style-sigma_clock-8">:</span>
        <div data- class="sigma-style-sigma_clock-9"><input aria-label="input" class="ti" id="t-s" type="number" min="0" max="59" value="0" placeholder="00" title="input"><div class="ti-label">SEC</div></div>
    </div>
    <div class="timer-ring">
        <svg width="200" height="200" viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="90"/>
            <circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="90" stroke-dasharray="565" stroke-dashoffset="0"/>
        </svg>
        <div data- class="sigma-style-sigma_clock-10">
            <div class="timer-display" id="timer-display">25:00</div>
        </div>
    </div>
    <div data- class="sigma-style-sigma_clock-11">
        <button class="btn btn-outline" onclick="timerReset()">Reset</button>
        <button class="btn" id="timer-btn" onclick="timerToggle()">Start</button>
    </div>
</div>

<script>
// ── CLOCK & SUNRISE ──────────────────────────────────────────────────────
const CITIES = [
  {id:'ist', name:'Mumbai', tz:'Asia/Kolkata', lat:19.07, lng:72.87},
  {id:'lon', name:'London', tz:'Europe/London', lat:51.5, lng:-0.12},
  {id:'ny', name:'New York', tz:'America/New_York', lat:40.71, lng:-74.00},
  {id:'tok', name:'Tokyo', tz:'Asia/Tokyo', lat:35.67, lng:139.65},
];

function calcSun(lat, lng) {
  // Ultra-simplified offline suncalc formula for visual estimate
  const now = new Date();
  const d = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
  const offset = lng / 15; // Rough timezone hr offset
  const eqTime = 9.87 * Math.sin(2*((2*Math.PI*(d-81))/365)) - 7.53*Math.cos((2*Math.PI*(d-81))/365) - 1.5*Math.sin((2*Math.PI*(d-81))/365);
  const sunrise = 12 - (12/Math.PI)*Math.acos(-Math.tan(lat*Math.PI/180)*Math.tan(23.44*Math.PI/180*Math.cos((360/365)*(d+10)*Math.PI/180))) - offset - eqTime/60;
  const sunset = 12 + (12/Math.PI)*Math.acos(-Math.tan(lat*Math.PI/180)*Math.tan(23.44*Math.PI/180*Math.cos((360/365)*(d+10)*Math.PI/180))) - offset - eqTime/60;
  
  const fmt = h => { const hh=(Math.floor(h)%24+24)%24; const m=Math.floor((h-Math.floor(h))*60); return `${hh.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`; };
  return { rise: fmt(sunrise), set: fmt(sunset) };
}

function initWorldClocks() {
  const c = document.getElementById('world-clocks');
  CITIES.forEach(city => {
    const sun = calcSun(city.lat, city.lng);
    c.innerHTML += `
      <div class="wc">
        <div class="wc-city">${city.name}</div>
        <div class="wc-time" id="wc-t-${city.id}">—</div>
        <div class="wc-tz">${city.tz.split('/')[1].replace('_',' ')}</div>
        <div class="wc-sun">
           <div><span>Sunrise</span>${sun.rise}</div>
           <div><span>Sunset</span>${sun.set}</div>
        </div>
      </div>
    `;
  });
}

function updateClocks(){
    const now=new Date();
    document.getElementById('clock-main').textContent=now.toLocaleTimeString('en-IN',{hour12:false});
    document.getElementById('clock-date').textContent=now.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
    document.getElementById('clock-day').textContent=now.toLocaleDateString('en-IN',{weekday:'long'});
    
    // Update local sun dot
    const hrs = now.getHours() + (now.getMinutes()/60);
    // Arbitrary map 6am to 0%, 6pm to 100%, clip at bottom.
    let pct = (hrs - 6) / 12; // 6am to 6pm
    if(pct < 0) pct = 0; if(pct > 1) pct = 1;
    // Semi circle path: x = cos(pi - pct*pi), y = sin(pi - pct*pi)
    const angle = Math.PI - (pct * Math.PI);
    const rad = 90; // 180w
    const x = 100 + Math.cos(angle)*rad;
    const y = 90 - Math.sin(angle)*rad; // inverted Y
    
    const dot = document.getElementById('sun-dot');
    if(hrs < 6 || hrs >= 18) { dot.style.bottom = '-10px'; dot.style.left = pct < 0.5 ? '10px' : '190px'; dot.style.background = '#4b5563'; dot.style.boxShadow = 'none'; }
    else { dot.style.left = x + 'px'; dot.style.bottom = (100-y) + 'px'; dot.style.background = 'var(--warn)'; dot.style.boxShadow = '0 0 10px var(--warn)'; }

    CITIES.forEach(city => {
      const el = document.getElementById(`wc-t-${city.id}`);
      if(el) el.textContent = new Date().toLocaleTimeString('en-US',{timeZone:city.tz,hour:'2-digit',minute:'2-digit',hour12:false});
    });
}
initWorldClocks();
setInterval(updateClocks,1000); updateClocks();

// ── TABS ────────────────────────────────────────────────────────
function switchTab(id,el){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('p-'+id).classList.add('active');
}

// ── ALARM ───────────────────────────────────────────────────────
let alarms=[{t:'07:00',l:'Morning Wake-Up',on:true},{t:'09:30',l:'Daily Standup',on:false},{t:'21:00',l:'Study Session',on:true}];
function renderAlarms(){
    const c=document.getElementById('alarm-list');
    c.innerHTML='';
    alarms.forEach((a,i)=>{
        const div=document.createElement('div');div.className='alarm-card';
        div.innerHTML=`<div><div class="alarm-time">${a.t}</div><div class="alarm-label">${a.l||'Alarm'}</div></div>
        <span class="alarm-toggle" onclick="toggleAlarm(${i})" title="Toggle">${a.on?'✅':'⬜'}</span>
        <span data- onclick="deleteAlarm(${i})" class="sigma-style-sigma_clock-12">🗑</span>`;
        c.appendChild(div);
    });
}
function addAlarm(){const t=document.getElementById('alarm-time-inp').value;const l=document.getElementById('alarm-label-inp').value;if(!t)return;alarms.unshift({t,l,on:true});renderAlarms();}
function toggleAlarm(i){alarms[i].on=!alarms[i].on;renderAlarms();}
function deleteAlarm(i){alarms.splice(i,1);renderAlarms();}
setInterval(()=>{
    const now=new Date().toLocaleTimeString('en-IN',{hour12:false,hour:'2-digit',minute:'2-digit'});
    alarms.forEach(a=>{if(a.on&&a.t===now&&new Date().getSeconds()===0){alert('⏰ Sovereign Alarm: '+(a.l||a.t));}});
},1000);
renderAlarms();

// ── STOPWATCH ───────────────────────────────────────────────────
let swRunning=false,swMs=0,swTimer=null,swStart=0,lapList=[];
function swFmt(ms){const m=Math.floor(ms/60000);const s=Math.floor(ms/1000)%60;const cs=Math.floor(ms/10)%100;return(m<10?'0'+m:m)+':'+(s<10?'0'+s:s)+'.'+(cs<10?'0'+cs:cs);}
function swToggle(){
    if(swRunning){clearInterval(swTimer);swMs+=Date.now()-swStart;swRunning=false;document.getElementById('sw-btn').textContent='Resume';}
    else{swStart=Date.now();swTimer=setInterval(()=>{document.getElementById('sw-display').textContent=swFmt(swMs+Date.now()-swStart);},30);swRunning=true;document.getElementById('sw-btn').textContent='Stop';document.getElementById('sw-btn').classList.remove('primary');}
}
function swReset(){clearInterval(swTimer);swRunning=false;swMs=0;lapList=[];document.getElementById('sw-display').textContent='00:00.00';document.getElementById('laps').innerHTML='';document.getElementById('sw-btn').textContent='Start';}
function swLap(){
    if(!swRunning)return;const cur=swMs+Date.now()-swStart;lapList.push(cur);
    const div=document.createElement('div');div.className='lap';
    div.innerHTML=`<span class="lap-n">Lap ${lapList.length}</span><span class="lap-t">${swFmt(cur)}</span>`;
    document.getElementById('laps').prepend(div);
}

// ── TIMER ───────────────────────────────────────────────────────
let timerRunning=false,timerRemaining=0,timerTotal=0,timerTmr=null;
const ring=document.getElementById('ring-fg');
function timerSecs(){return parseInt(document.getElementById('t-h').value||0)*3600+parseInt(document.getElementById('t-m').value||0)*60+parseInt(document.getElementById('t-s').value||0);}
function timerFmt(s){const h=Math.floor(s/3600);const m=Math.floor(s/60)%60;const ss=s%60;return h>0?(h+':'+(m<10?'0'+m:m)+':'+(ss<10?'0'+ss:ss)):(m<10?'0'+m:m)+':'+(ss<10?'0'+ss:ss);}
function timerToggle(){
    if(timerRunning){clearInterval(timerTmr);timerRunning=false;document.getElementById('timer-btn').textContent='Resume';}
    else{
        if(!timerRemaining){timerRemaining=timerSecs();timerTotal=timerRemaining;}
        if(!timerRemaining)return;
        timerRunning=true;document.getElementById('timer-btn').textContent='Pause';
        timerTmr=setInterval(()=>{
            timerRemaining--;
            document.getElementById('timer-display').textContent=timerFmt(timerRemaining);
            const pct=1-(timerRemaining/timerTotal);
            ring.style.strokeDashoffset=565*pct;
            if(timerRemaining<=0){clearInterval(timerTmr);timerRunning=false;timerRemaining=0;document.getElementById('timer-btn').textContent='Start';alert('⏳ Sovereign Timer Complete!');}
        },1000);
        document.getElementById('timer-display').textContent=timerFmt(timerRemaining);
    }
}
function timerReset(){clearInterval(timerTmr);timerRunning=false;timerRemaining=0;timerTotal=0;ring.style.strokeDashoffset=0;document.getElementById('timer-display').textContent='00:00';document.getElementById('timer-btn').textContent='Start';}
</script>
</body></html>
