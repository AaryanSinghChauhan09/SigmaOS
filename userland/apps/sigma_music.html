<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigma Music — Sovereign Audio Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--surface:#151520;--panel:#1c1c2c;--border:rgba(255,255,255,.06);--accent:#a855f7;--text:#e2e8f0;--dim:#64748b;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Topbar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;}
.logo{font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,var(--accent),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.spacer{flex:1;}
.tb-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 12px;cursor:pointer;font-size:.8rem;font-weight:600;}
.tb-btn:hover{background:rgba(255,255,255,.1);}

/* Layout */
.main{display:flex;flex:1;overflow:hidden;}

/* Sidebar */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:4px;}
.nav-item{padding:10px 12px;border-radius:8px;font-size:.85rem;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:500;}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text);}
.nav-item.active{background:rgba(168,85,247,.1);color:var(--accent);}
.nav-title{font-size:.7rem;text-transform:uppercase;color:var(--dim);font-weight:800;letter-spacing:1px;margin:12px 0 6px 6px;}

/* Content */
.content{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;}

/* Equalizer Canvas */
.eq-area{height:160px;background:#000;border-bottom:1px solid var(--border);position:relative;}
.eq-title{position:absolute;top:10px;left:14px;font-size:.7rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:1px;z-index:2;}
canvas#visualizer{width:100%;height:100%;display:block;}

.track-area{flex:1;overflow-y:auto;padding:24px;}
.track-area::-webkit-scrollbar{width:6px;background:transparent;}
.track-area::-webkit-scrollbar-thumb{background:#2d2d3d;border-radius:3px;}

.track-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:16px;}
.track-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.2s;}
.track-card:hover{border-color:var(--accent);background:rgba(168,85,247,.05);transform:translateY(-3px);}
.track-card.playing{border-color:var(--accent);box-shadow:0 0 15px rgba(168,85,247,.2);}
.art{font-size:3rem;text-align:center;margin-bottom:12px;}
.t-title{font-size:.9rem;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.t-artist{font-size:.75rem;color:var(--dim);}

/* Player Bar */
.player-bar{background:rgba(21,21,32,.95);-webkit--webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);border-top:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:24px;flex-shrink:0;}
.np-info{display:flex;align-items:center;gap:12px;width:240px;flex-shrink:0;}
.np-art{width:48px;height:48px;background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;border:1px solid var(--border);}
.np-text{min-width:0;flex:1;}
.np-title{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.np-artist{font-size:.75rem;color:var(--dim);white-space:nowrap;overflow:hidden;}

.controls{display:flex;flex-direction:column;align-items:center;flex:1;}
.c-btns{display:flex;align-items:center;gap:16px;}
.c-btn{background:none;border:none;color:var(--dim);font-size:1.2rem;cursor:pointer;transition:.15s;}
.c-btn:hover{color:var(--text);}
.c-btn.play{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 12px rgba(168,85,247,.3);}
.c-btn.play:hover{transform:scale(1.05);}

.progress{display:flex;align-items:center;gap:10px;width:100%;max-width:500px;margin-top:8px;}
.time{font-size:.7rem;color:var(--dim);font-family:monospace;width:36px;text-align:center;}
.prog-bar{flex:1;height:4px;background:var(--panel);border-radius:2px;cursor:pointer;position:relative;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear;}

.extra{width:200px;display:flex;align-items:center;gap:12px;justify-content:flex-end;}
.vol-sl{width:80px;accent-color:var(--accent);cursor:pointer;}

        .sigma-style-sigma_music-1 { display:none }
        .sigma-style-sigma_music-2 { color:var(--dim) }
    </style>

<script>
// Sovereign OS Inline Style Manager
document.addEventListener('DOMContentLoaded', () => {
    const applyTo = (el) => { if(el.getAttribute('data-style')) { el.setAttribute('style', el.getAttribute('data-style')); el.removeAttribute('data-style'); } };
    new MutationObserver(mutations => mutations.forEach(m => {
        if(m.type === 'childList') m.addedNodes.forEach(n => { if(n.nodeType === 1) { applyTo(n); n.querySelectorAll('[data-style]').forEach(applyTo); } });
    })).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('[data-style]').forEach(applyTo);
});
</script>
</head>
<body>

<div class="topbar">
  <div class="logo">🎵 Sigma Music</div>
  <div class="spacer"></div>
  <button class="tb-btn" onclick="document.getElementById('fileInp').click()">+ Load Local File</button>
  <input aria-label="input" type="file" id="fileInp" accept="audio/*" data- onchange="loadLocalFile(event)" title="input" class="sigma-style-sigma_music-1">
</div>

<div class="main">
  <div class="sidebar">
    <div class="nav-title">Library</div>
    <div class="nav-item active">🎵 All Tracks</div>
    <div class="nav-item">📋 Playlists</div>
    <div class="nav-item">💿 Albums</div>
    <div class="nav-title">Playlists</div>
    <div class="nav-item">❤️ Favourites</div>
    <div class="nav-item">📖 Legal Study</div>
    <div class="nav-item">🧘 Focus Mode</div>
  </div>
  
  <div class="content">
    <div class="eq-area">
      <div class="eq-title">Web Audio API Visualizer (Live FFT)</div>
      <canvas id="visualizer"></canvas>
    </div>
    
    <div class="track-area">
      <div class="track-grid" id="grid"></div>
    </div>
  </div>
</div>

<div class="player-bar">
  <div class="np-info">
    <div class="np-art" id="np-art">🎵</div>
    <div class="np-text">
      <div class="np-title" id="np-title">No Track Selected</div>
      <div class="np-artist" id="np-artist">Upload a file or select a stub</div>
    </div>
  </div>
  
  <div class="controls">
    <div class="c-btns">
      <button class="c-btn">🔀</button>
      <button class="c-btn" onclick="prev()">⏮</button>
      <button class="c-btn play" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="c-btn" onclick="next()">⏭</button>
      <button class="c-btn">🔁</button>
    </div>
    <div class="progress">
      <span class="time" id="t-cur">0:00</span>
      <div class="prog-bar" id="p-bar" onclick="seek(event)"><div class="prog-fill" id="p-fill"></div></div>
      <span class="time" id="t-dur">0:00</span>
    </div>
  </div>
  
  <div class="extra">
    <span data- class="sigma-style-sigma_music-2">🔊</span>
    <input aria-label="input" type="range" class="vol-sl" id="vol" min="0" max="1" step="0.01" value="0.7" title="input">
  </div>
</div>

<!-- Hidden audio element -->
<audio id="audio" crossorigin="anonymous"></audio>

<script>
/**
 * SIGMA MUSIC - Sovereign Audio Engine v6.1
 * Integrates Web Audio API, AnalyserNode, Local File FileReader
 */

const TRACKS = [
  {title:'Raag Bhairav (Stub)',artist:'Ravi Shankar',art:'🪕',dur:213,fake:true},
  {title:'Lo-Fi Study Beat (Stub)',artist:'Sigma Beats',art:'📚',dur:3600,fake:true},
  {title:'Focus Flow (Stub)',artist:'Sigma Beats',art:'🧘',dur:2700,fake:true},
  {title:'Deep Work Drone (Stub)',artist:'Sigma Waves',art:'🌊',dur:3000,fake:true}
];

let curIdx = 0;
let playing = false;
let audioCtx, analyser, source, dataArray, bufferLength;
let canvas, ctx;
let fakeTimer = null, fakeElapsed = 0;

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = TRACKS.map((t, i) => `
    <div class="track-card ${i===curIdx && playing ? 'playing':''}" onclick="playTrack(${i})">
      <div class="art">${t.art||'🎵'}</div>
      <div class="t-title">${t.title}</div>
      <div class="t-artist">${t.artist||'Unknown Artist'}</div>
    </div>
  `).join('');
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  
  canvas = document.getElementById('visualizer');
  ctx = canvas.getContext('2d');
  
  const resize = () => { canvas.width = document.querySelector('.eq-area').clientWidth; canvas.height = 160; };
  window.addEventListener('resize', resize);
  resize();
  
  drawVisualizer();
}

function drawVisualizer() {
  requestAnimationFrame(drawVisualizer);
  if (!audioCtx) return;
  
  analyser.getByteFrequencyData(dataArray);
  
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  if (!playing && (!TRACKS[curIdx] || !TRACKS[curIdx].fake)) return;
  
  const barWidth = (canvas.width / bufferLength) * 2.5;
  let barHeight, x = 0;
  
  for(let i = 0; i < bufferLength; i++) {
    // If fake, inject some random sin wave logic so it looks cool
    if (TRACKS[curIdx] && TRACKS[curIdx].fake && playing) {
      if (Math.random() > 0.3) {
        barHeight = Math.abs(Math.sin((Date.now()/100) + i) * 100) + Math.random()*50;
      } else { barHeight = 0; }
    } else {
      barHeight = dataArray[i];
    }
    
    const r = barHeight + (25 * (i/bufferLength));
    const g = 85; 
    const b = 247;
    
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(x, canvas.height - barHeight/2, barWidth, barHeight/2);
    x += barWidth + 1;
  }
}

function loadLocalFile(e) {
  const file = e.target.files[0];
  if(!file) return;
  
  const url = URL.createObjectURL(file);
  TRACKS.unshift({
    title: file.name.replace(/\.[^/.]+$/, ""),
    artist: 'Local Sovereign File',
    art: '🎧',
    fake: false,
    url: url
  });
  
  playTrack(0);
}

function playTrack(idx) {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  curIdx = idx;
  const t = TRACKS[idx];
  
  document.getElementById('np-title').textContent = t.title;
  document.getElementById('np-artist').textContent = t.artist;
  document.getElementById('np-art').textContent = t.art || '🎵';
  
  clearInterval(fakeTimer);
  audio.pause();
  
  if (t.fake) {
    fakeElapsed = 0;
    document.getElementById('t-dur').textContent = fmtTime(t.dur);
  } else {
    audio.src = t.url;
    audio.load();
    audio.play();
  }
  
  setPlaying(true);
  renderGrid();
}

function togglePlay() {
  if (!TRACKS[curIdx]) return playTrack(0);
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  if (playing) {
    if(!TRACKS[curIdx].fake) audio.pause();
    setPlaying(false);
  } else {
    if(!TRACKS[curIdx].fake) audio.play();
    setPlaying(true);
  }
}

function setPlaying(p) {
  playing = p;
  playBtn.textContent = p ? '⏸' : '▶';
  document.querySelectorAll('.track-card').forEach((c, i) => c.classList.toggle('playing', i===curIdx && p));
  
  if (TRACKS[curIdx] && TRACKS[curIdx].fake) {
    if (p) {
      fakeTimer = setInterval(() => {
        fakeElapsed++;
        updateProg(fakeElapsed, TRACKS[curIdx].dur);
        if(fakeElapsed >= TRACKS[curIdx].dur) next();
      }, 1000);
    } else {
      clearInterval(fakeTimer);
    }
  }
}

function next() { playTrack((curIdx + 1) % TRACKS.length); }
function prev() { playTrack((curIdx - 1 + TRACKS.length) % TRACKS.length); }

function updateProg(cur, dur) {
  document.getElementById('t-cur').textContent = fmtTime(cur);
  const pct = dur ? (cur / dur) * 100 : 0;
  document.getElementById('p-fill').style.width = pct + '%';
}

function fmtTime(s) {
  if (isNaN(s)) return '0:00';
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + (s%60).toString().padStart(2,'0');
}

function seek(e) {
  const t = TRACKS[curIdx];
  if (!t) return;
  const r = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - r.left) / r.width;
  
  if (t.fake) {
    fakeElapsed = Math.floor(pct * t.dur);
    updateProg(fakeElapsed, t.dur);
  } else {
    audio.currentTime = pct * audio.duration;
  }
}

// Audio events
audio.addEventListener('timeupdate', () => {
  if (!TRACKS[curIdx] || TRACKS[curIdx].fake) return;
  document.getElementById('t-dur').textContent = fmtTime(audio.duration);
  updateProg(audio.currentTime, audio.duration);
});
audio.addEventListener('ended', next);

document.getElementById('vol').addEventListener('input', e => { audio.volume = e.target.value; });

renderGrid();
</script>
</body>
</html>
