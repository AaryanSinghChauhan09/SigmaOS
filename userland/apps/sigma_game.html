<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch the Cup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg:#0E0E12; --panel:#16181F; --card:#1E2028; --accent:#FFD60A; 
    --primary:#7B2FFF; --cup:#8B5E3C; --cup-hi:#C4854F; 
    --success:#32D74B; --danger:#FF453A; --text:#F2F2F7; --dim:#636366;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit--webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none; -webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none; }
body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }

/* Header */
header { width: 100%; max-width: 800px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
.diff-sel { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; color: var(--dim); }
.diff-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--card); background: var(--bg); color: var(--dim); cursor: pointer; }
.diff-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,214,10,0.1); }

/* Canvas Area */
.game-container { position: relative; width: 100%; max-width: 800px; height: 360px; background: var(--panel); border-radius: 12px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.table { position: absolute; bottom: 0; width: 100%; height: 60px; background: #1A1209; border-top: 6px solid #2E1F0A; }

.cup-wrapper {
    position: absolute;
    bottom: 54px;
    width: 100px;
    height: 120px;
    transform-origin: bottom center;
    transition: transform 0.5s ease-in-out;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
}
.cup {
    width: 80px;
    height: 110px;
    background: linear-gradient(to bottom, #A16A42, #734A2D);
    border-radius: 10px 10px 0 0;
    position: relative;
    box-shadow: inset -10px 0 15px rgba(0,0,0,0.3), 0 10px 15px rgba(0,0,0,0.4);
}
.cup::before { /* Rim */
    content: ''; position: absolute; bottom: -8px; left: -10px; right: -10px; height: 16px; background: #5A3A1A; border-radius: 4px; border: 1px solid #3A2010;
}
.cup::after { /* Knob */
    content: ''; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 24px; height: 20px; background: #3A2010; border-radius: 50%;
}
.cup-num { position: absolute; bottom: 20px; font-size: 1.5rem; font-weight: 800; color: #FFD69E; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); z-index: 2; }
.shadow { position: absolute; bottom: -12px; width: 110px; height: 18px; background: rgba(0,0,0,0.6); border-radius: 50%; z-index: -1; }

.coin {
    position: absolute;
    bottom: 50px;
    width: 44px;
    height: 44px;
    background: radial-gradient(circle, #FFE140, #D4AF37);
    border-radius: 50%;
    border: 3px solid #FFD700;
    z-index: 5;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: bold; color: #8B6914;
    opacity: 0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
}

/* Animations added via JS class */
.lifted { transform: translateY(-70px); }

/* Stats & Controls */
.instr { font-size: 1.2rem; font-weight: 600; text-align: center; margin-bottom: 20px; min-height: 28px; }
.stats { display: flex; width: 100%; max-width: 800px; gap: 10px; margin-bottom: 20px; }
.stat-box { flex: 1; background: var(--card); padding: 14px; border-radius: 10px; text-align: center; }
.stat-lbl { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.stat-val { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

.controls { display: flex; gap: 14px; margin-bottom: 20px; }
button { border: none; padding: 14px 30px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.15s; }
button:active { transform: scale(0.95); }
.btn-play { background: var(--primary); color: #fff; box-shadow: 0 4px 15px rgba(123,47,255,0.4); }
.btn-play:hover:not(:disabled) { opacity: 0.9; }
.btn-play:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-reset { background: var(--card); color: var(--dim); }
.btn-reset:hover { color: var(--text); }

        .sigma-style-sigma_game-1 { color:var(--text) }
    </style>

<script>
// Sovereign OS Inline Style Manager
document.addEventListener('DOMContentLoaded', () => {
    const applyTo = (el) => { if(el.getAttribute('data-style')) { el.setAttribute('style', el.getAttribute('data-style')); el.removeAttribute('data-style'); } };
    new MutationObserver(mutations => mutations.forEach(m => {
        if(m.type === 'childList') m.addedNodes.forEach(n => { if(n.nodeType === 1) { applyTo(n); n.querySelectorAll('[data-style]').forEach(applyTo); } });
    })).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('[data-style]').forEach(applyTo);
});
</script>
</head>
<body>

<header>
    <h1>🎩 WATCH THE CUP!</h1>
    <div class="diff-sel" id="diffs">
        <span>Difficulty:</span>
        <div class="diff-btn" onclick="setDiff('Beginner')">Beginner</div>
        <div class="diff-btn active" onclick="setDiff('Normal')">Normal</div>
        <div class="diff-btn" onclick="setDiff('Hard')">Hard</div>
        <div class="diff-btn" onclick="setDiff('Impossible')">Impossible</div>
    </div>
</header>

<div class="instr sigma-style-sigma_game-1" id="instr" data->Press ▶ PLAY to start a round.</div>

<div class="game-container" id="gc">
    <div class="table"></div>
    <div class="coin" id="coin">₿</div>
    <!-- Cups injected via JS -->
</div>

<div class="stats">
    <div class="stat-box"><div class="stat-lbl">Score</div><div class="stat-val" id="st-score">0</div></div>
    <div class="stat-box"><div class="stat-lbl">Streak 🔥</div><div class="stat-val" id="st-streak">0</div></div>
    <div class="stat-box"><div class="stat-lbl">Best Streak</div><div class="stat-val" id="st-best">0</div></div>
    <div class="stat-box"><div class="stat-lbl">Round</div><div class="stat-val" id="st-round">0</div></div>
</div>

<div class="controls">
    <button class="btn-play" id="btn-play" onclick="startRound()">▶ PLAY</button>
    <button class="btn-reset" onclick="resetGame()">↺ Reset Score</button>
</div>

<script>
const SPEEDS = {
    Beginner: { swaps: 3, dur: 700, p: 1 },
    Normal: { swaps: 5, dur: 450, p: 2 },
    Hard: { swaps: 8, dur: 250, p: 4 },
    Impossible: { swaps: 14, dur: 140, p: 8 }
};

let diff = 'Normal';
let state = 'idle'; // idle, reveal, shuffle, guess, result
let coinPos = 1;
let score = 0, streak = 0, best = 0, round = 0;
let cups = [], positions = [20, 50, 80]; // percentages across the 100% width

const gc = document.getElementById('gc');
const coinEl = document.getElementById('coin');
const instrEl = document.getElementById('instr');
const playBtn = document.getElementById('btn-play');

// Init Cups
function initCups() {
    gc.querySelectorAll('.cup-wrapper').forEach(e => e.remove());
    cups = [];
    for(let i=0; i<3; i++) {
        let cw = document.createElement('div');
        cw.className = 'cup-wrapper';
        cw.innerHTML = `<div class="cup"></div><div class="shadow"></div><div class="cup-num">${i+1}</div>`;
        cw.dataset.idx = i;
        cw.onclick = () => guess(i);
        gc.appendChild(cw);
        cups.push(cw);
        moveCup(i, i, 0);
    }
}
function moveCup(cupIdx, posIdx, dur) {
    cups[cupIdx].style.transition = `transform ${dur}ms ease-in-out`;
    cups[cupIdx].style.transform = `translateX(calc(${positions[posIdx]}vw * 8 - 50px))`; // approximation wrapper
    cups[cupIdx].style.left = `calc(${positions[posIdx]}% - 50px)`;
    cups[cupIdx].dataset.pos = posIdx;
}

function setDiff(d) {
    if(state !== 'idle') return;
    diff = d;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.textContent===d));
}

function updateStats() {
    document.getElementById('st-score').textContent = score;
    document.getElementById('st-streak').textContent = streak;
    document.getElementById('st-best').textContent = best;
    document.getElementById('st-round').textContent = round;
}

function startRound() {
    if(state !== 'idle') return;
    state = 'reveal';
    round++;
    playBtn.disabled = true;
    instrEl.textContent = '👀 Watch carefully — remember the coin!';
    instrEl.style.color = 'var(--accent)';
    updateStats();

    // Reset positions logically
    initCups();
    coinPos = Math.floor(Math.random() * 3);
    
    // Position coin
    coinEl.style.left = `calc(${positions[coinPos]}% - 22px)`;
    coinEl.style.opacity = '1';

    // Lift cup containing coin
    let coinCup = cups.find(c => parseInt(c.dataset.pos) === coinPos);
    coinCup.classList.add('lifted');

    setTimeout(() => {
        coinCup.classList.remove('lifted');
        setTimeout(() => {
            coinEl.style.opacity = '0';
            doShuffle();
        }, 500);
    }, 1200);
}

function doShuffle() {
    state = 'shuffle';
    instrEl.textContent = '🔀 Shuffling…';
    instrEl.style.color = 'var(--dim)';
    
    let cfg = SPEEDS[diff];
    let swapsLeft = cfg.swaps;

    function swap() {
        if(swapsLeft <= 0) {
            state = 'guess';
            instrEl.textContent = '🖱 Click a cup — where is the coin?';
            instrEl.style.color = 'var(--accent)';
            return;
        }
        
        // pick 2 random positions to swap
        let p1 = Math.floor(Math.random()*3);
        let p2 = (p1 + 1 + Math.floor(Math.random()*2)) % 3;

        let cup1 = cups.find(c => parseInt(c.dataset.pos) === p1);
        let cup2 = cups.find(c => parseInt(c.dataset.pos) === p2);

        // Swap their dataset positions
        cup1.dataset.pos = p2;
        cup2.dataset.pos = p1;

        // Apply physical movement
        cup1.style.transition = `left ${cfg.dur}ms ease-in-out`;
        cup2.style.transition = `left ${cfg.dur}ms ease-in-out`;
        cup1.style.left = `calc(${positions[p2]}% - 50px)`;
        cup2.style.left = `calc(${positions[p1]}% - 50px)`;

        // Track coin logical movement
        if(coinPos === p1) coinPos = p2;
        else if(coinPos === p2) coinPos = p1;

        swapsLeft--;
        setTimeout(swap, cfg.dur + 50);
    }
    swap();
}

function guess(idx) {
    if(state !== 'guess') return;
    state = 'result';
    
    let clickedCup = cups[idx];
    let guessedPos = parseInt(clickedCup.dataset.pos);
    let win = (guessedPos === coinPos);

    // Position coin and reveal
    coinEl.style.left = `calc(${positions[coinPos]}% - 22px)`;
    coinEl.style.opacity = '1';
    
    let winningCup = cups.find(c => parseInt(c.dataset.pos) === coinPos);
    winningCup.classList.add('lifted');

    if(win) {
        streak++;
        if(streak > best) best = streak;
        let pts = 10 * SPEEDS[diff].p * (1 + Math.floor(streak/3));
        score += pts;
        instrEl.textContent = `✅ Correct! +${pts} points 🔥×${streak}`;
        instrEl.style.color = 'var(--success)';
        clickedCup.querySelector('.cup').style.filter = 'drop-shadow(0 0 10px #32D74B)';
    } else {
        streak = 0;
        instrEl.textContent = `❌ Wrong! The coin was under another cup.`;
        instrEl.style.color = 'var(--danger)';
        clickedCup.classList.add('lifted');
        clickedCup.querySelector('.cup').style.filter = 'drop-shadow(0 0 10px #FF453A)';
    }
    
    updateStats();

    setTimeout(() => {
        winningCup.classList.remove('lifted');
        clickedCup.classList.remove('lifted');
        clickedCup.querySelector('.cup').style.filter = '';
        state = 'idle';
        playBtn.disabled = false;
        instrEl.textContent = 'Press ▶ PLAY for the next round.';
        instrEl.style.color = 'var(--text)';
        coinEl.style.opacity = '0';
    }, 2500);
}

function resetGame() {
    if(state === 'shuffle' || state === 'reveal') return;
    score = streak = best = round = 0;
    updateStats();
    state = 'idle';
    instrEl.textContent = 'Score reset. Press ▶ PLAY.';
    instrEl.style.color = 'var(--text)';
    coinEl.style.opacity = '0';
    initCups();
}

initCups();
</script>
</body>
</html>
