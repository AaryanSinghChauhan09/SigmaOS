<!DOCTYPE html>
<html lang="en">
<head>

<title>Sigma IDE — Sovereign Code Engine</title>
<style>
:root{
  --bg:#1e1e2e;--panel:#181825;--surface:#313244;--border:rgba(255,255,255,.07);
  --accent:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--yellow:#f9e2af;
  --purple:#cba6f7;--orange:#fab387;--text:#cdd6f4;--dim:#6c7086;
  --bar:#11111b;--linenum:#45475a;--sel:rgba(137,180,250,.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Consolas','JetBrains Mono','Courier New',monospace;display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:13px;}

/* TOOLBAR */
.toolbar{background:var(--bar);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.brand{color:var(--accent);font-weight:700;font-size:.88rem;margin-right:8px;font-family:sans-serif;}
.tb-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 12px;cursor:pointer;font-size:.76rem;font-weight:700;font-family:sans-serif;transition:background .15s;}
.tb-btn:hover{background:rgba(255,255,255,.12);}
.tb-btn.run{background:rgba(166,227,161,.15);border-color:rgba(166,227,161,.3);color:var(--green);}
.tb-btn.run:hover{background:rgba(166,227,161,.25);}
.tb-btn.danger{background:rgba(243,139,168,.1);border-color:rgba(243,139,168,.3);color:var(--red);}
.lang-sel{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 8px;font-size:.76rem;font-family:sans-serif;cursor:pointer;}
.spacer{flex:1;}
.stats-bar{font-size:.7rem;color:var(--dim);}

/* LAYOUT */
.layout{flex:1;display:flex;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:200px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-title{padding:8px 12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);border-bottom:1px solid var(--border);font-family:sans-serif;}
.file-item{padding:6px 12px;cursor:pointer;font-size:.78rem;color:var(--dim);display:flex;align-items:center;gap:6px;border-radius:0;transition:background .1s;}
.file-item:hover{background:rgba(255,255,255,.04);color:var(--text);}
.file-item.active{background:rgba(137,180,250,.1);color:var(--accent);}
.file-icon{flex-shrink:0;}

/* EDITOR PANE */
.editor-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.tab-bar{background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;overflow-x:auto;}
.tab{padding:7px 16px;font-size:.76rem;color:var(--dim);cursor:pointer;border-right:1px solid var(--border);white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:sans-serif;}
.tab.active{background:var(--bg);color:var(--text);border-bottom:2px solid var(--accent);}
.tab .close-t{opacity:.3;font-size:.8rem;}
.tab:hover .close-t{opacity:.8;}

.editor-wrap{flex:1;display:flex;overflow:hidden;position:relative;}
.line-nums{background:var(--panel);padding:12px 8px 12px 12px;text-align:right;color:var(--linenum);font-size:13px;line-height:1.6;-webkit--webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none; -webkit--webkit-user-select: none; user-select: none; -webkit-user-select: none; user-select: none;overflow:hidden;flex-shrink:0;min-width:42px;}
.code-area{flex:1;padding:12px 12px 12px 8px;outline:none;border:none;background:transparent;color:var(--text);font-size:13px;line-height:1.6;resize:none;-webkit--webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text;-webkit--webkit-user-select: text; user-select: text; -webkit-user-select: text; user-select: text;tab-size:4;caret-color:var(--accent);font-family:'Consolas','JetBrains Mono','Courier New',monospace;}
.code-area::-webkit-scrollbar{width:8px;height:8px;}
.code-area::-webkit-scrollbar-thumb{background:#313244;border-radius:4px;}

/* OUTPUT */
.output-pane{height:220px;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.out-header{padding:6px 12px;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-family:sans-serif;flex-shrink:0;}
.out-tab{cursor:pointer;padding:2px 8px;border-radius:3px;transition:background .1s;}
.out-tab.active{background:rgba(137,180,250,.15);color:var(--accent);}
.out-body{flex:1;overflow-y:auto;padding:10px 14px;font-size:.82rem;line-height:1.6;}
.out-body::-webkit-scrollbar{width:4px;}
.out-body::-webkit-scrollbar-thumb{background:#313244;border-radius:2px;}
.out-line{display:block;margin-bottom:2px;}
.out-err{color:var(--red);}
.out-ok{color:var(--green);}
.out-info{color:var(--yellow);}
.out-dim{color:var(--dim);}

/* STATUS */
.status-bar{background:var(--bar);border-top:1px solid var(--border);padding:3px 14px;font-size:.68rem;color:var(--dim);display:flex;gap:16px;align-items:center;flex-shrink:0;font-family:sans-serif;}

        .sigma-style-sigma_ide-1 { display:none }
        .sigma-style-sigma_ide-2 { flex:1; }
        .sigma-style-sigma_ide-3 { font-size:.68rem; }
    </style>

<script>
// Sovereign OS Inline Style Manager
document.addEventListener('DOMContentLoaded', () => {
    const applyTo = (el) => { if(el.getAttribute('data-style')) { el.setAttribute('style', el.getAttribute('data-style')); el.removeAttribute('data-style'); } };
    new MutationObserver(mutations => mutations.forEach(m => {
        if(m.type === 'childList') m.addedNodes.forEach(n => { if(n.nodeType === 1) { applyTo(n); n.querySelectorAll('[data-style]').forEach(applyTo); } });
    })).observe(document.body, {childList: true, subtree: true});
    document.querySelectorAll('[data-style]').forEach(applyTo);
});
</script>

<script>
'use strict';
/**
 * SIGMA IDE — Sovereign Code Engine v6.1
 * OOP architecture. Zero external dependencies.
 * Custom JS interpreter + C/Rust/ASM simulators.
 */

class SigmaFile {
  constructor(id, name, content, lang) {
    this.id = id;
    this.name = name;
    this.content = content;
    this.lang = lang;
    this.modified = false;
    this.cursorPos = 0;
  }
}

class SigmaOutputEngine {
  constructor(el) { this.el = el; this.lines = []; }
  clear() { this.el.innerHTML = ''; this.lines = []; }
  print(msg, cls='') {
    const span = document.createElement('span');
    span.className = 'out-line ' + cls;
    span.innerHTML = msg;
    this.el.appendChild(span);
    this.el.scrollTop = this.el.scrollHeight;
    this.lines.push(msg);
  }
  info(m) { this.print('ℹ ' + m, 'out-info'); }
  ok(m) { this.print('✓ ' + m, 'out-ok'); }
  err(m) { this.print('✗ ' + m, 'out-err'); }
  dim(m) { this.print(m, 'out-dim'); }
}

class SigmaLanguageEngine {
  static simulateCpp(src) {
    const out = [];
    // Detect common patterns
    const printfPat = /printf\s*\(\s*"([^"]*)"\s*\)/g;
    const coutPat = /cout\s*<<\s*"([^"]*)"/g;
    const intMain = src.includes('int main');
    if (!intMain) return { ok: false, err: 'No main() function found.' };
    let m;
    while ((m = printfPat.exec(src)) !== null) out.push(m[1].replace(/\\n/g,'\n').replace(/\\t/g,'\t'));
    while ((m = coutPat.exec(src)) !== null) out.push(m[1].replace(/\\n/g,'\n'));
    if (!out.length) out.push('[Program executed with no console output]');
    return { ok: true, out };
  }

  static simulateC(src) { return SigmaLanguageEngine.simulateCpp(src); }

  static simulateRust(src) {
    const out = [];
    const printPat = /println!\s*\(\s*"([^"]*)"/g;
    let m;
    const hasFn = src.includes('fn main');
    if (!hasFn) return { ok: false, err: 'No fn main() found.' };
    while ((m = printPat.exec(src)) !== null) out.push(m[1]);
    if (!out.length) out.push('[Rust program executed successfully]');
    return { ok: true, out };
  }

  static simulateAsm(src) {
    const out = ['[x86 Assembly Simulator]'];
    const lines = src.split('\n').filter(l => l.trim() && !l.trim().startsWith(';'));
    let regs = { eax: 0, ebx: 0, ecx: 0, edx: 0 };
    lines.forEach(line => {
      const t = line.trim().toLowerCase();
      if (t.startsWith('mov')) {
        const parts = t.replace('mov','').trim().split(',');
        if (parts.length === 2) {
          const dst = parts[0].trim(), src2 = parts[1].trim();
          if (regs.hasOwnProperty(dst)) regs[dst] = isNaN(src2) ? (regs[src2] || 0) : parseInt(src2);
          out.push(`  mov ${dst}, ${regs[dst]}`);
        }
      } else if (t.startsWith('add')) {
        const parts = t.replace('add','').trim().split(',');
        if (parts.length === 2) {
          const dst = parts[0].trim(), v = parseInt(parts[1].trim()) || 0;
          if (regs.hasOwnProperty(dst)) { regs[dst] += v; out.push(`  add ${dst} => ${regs[dst]}`); }
        }
      } else if (t.startsWith('int 0x21') || t.includes('syscall')) {
        out.push('  [syscall: EAX=' + regs.eax + ']');
      }
    });
    out.push('Registers: ' + Object.entries(regs).map(([k,v]) => `${k}=${v}`).join(', '));
    return { ok: true, out };
  }

  static simulatePython(src) {
    const out = [];
    // Simple sigma python: print(), for loops, if/else, arithmetic
    const lines = src.split('\n');
    const vars = {};
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line || line.startsWith('#')) continue;
      if (line.startsWith('print(')) {
        const inner = line.slice(6, -1);
        const val = evalSigmaExpr(inner, vars);
        out.push(String(val));
      } else if (line.includes('=') && !line.includes('==')) {
        const [lhs, rhs] = line.split('=').map(s => s.trim());
        if (/^[a-zA-Z_]\w*$/.test(lhs)) vars[lhs] = evalSigmaExpr(rhs, vars);
      }
    }
    function evalSigmaExpr(expr, scope) {
      expr = expr.trim().replace(/f"([^"]*)"/g, (_, t) => t.replace(/\{([^}]+)\}/g, (__, v) => scope[v.trim()] ?? v));
      expr = expr.replace(/"([^"]*)"/g, '"$1"').replace(/'([^']*)'/g, '"$1"');
      Object.entries(scope).forEach(([k, v]) => { expr = expr.replace(new RegExp('\\b'+k+'\\b','g'), JSON.stringify(v)); });
      try { return Function('"use strict"; return (' + expr + ')')(); } catch { return expr.replace(/"/g,''); }
    }
    if (!out.length) out.push('[No print() output]');
    return { ok: true, out };
  }
}

class SigmaIDE {
  constructor() {
    this.files = [];
    this.activeId = null;
    this.tabSeq = 0;
    this.output = new SigmaOutputEngine(document.getElementById('out-body'));
    this._initDefaultFiles();
    this._bindEvents();
    this.openTab(this.files[0].id);
  }

  _initDefaultFiles() {
    this._addFile('main.js', `// Sigma IDE — JavaScript Engine
// Pure zero-dependency sovereign code runner

class SigmaProcess {
  constructor(pid, name) {
    this.pid = pid;
    this.name = name;
    this.memory = Math.floor(Math.random() * 1024) + 256;
  }
  toString() { return \`PID:\${this.pid} [\${this.name}] mem:\${this.memory}KB\`; }
}

const processes = [
  new SigmaProcess(1, 'sigma_kernel'),
  new SigmaProcess(2, 'sigma_scheduler'),
  new SigmaProcess(3, 'sigma_vfs'),
  new SigmaProcess(4, 'user_session'),
];

console.log("=== SIGMA PROCESS TABLE ===");
processes.forEach(p => console.log(p.toString()));

// Memory allocation simulation
let totalMem = processes.reduce((s, p) => s + p.memory, 0);
console.log(\`\\nTotal Memory: \${totalMem} KB / 65536 KB\`);
console.log("Kernel: operational");`, 'js');

    this._addFile('hello.cpp', `#include <iostream>
using namespace std;

// Custom SigmaOS C++ kernel module demo
class SigmaMemBlock {
    size_t size;
    void* ptr;
public:
    SigmaMemBlock(size_t sz) : size(sz), ptr(nullptr) {
        ptr = static_cast<void*>(new char[sz]);
        cout << "Allocated " << sz << " bytes" << endl;
    }
    ~SigmaMemBlock() {
        delete[] static_cast<char*>(ptr);
        cout << "Freed " << size << " bytes" << endl;
    }
    size_t getSize() const { return size; }
};

int main() {
    cout << "=== SigmaOS Memory Manager ===" << endl;
    SigmaMemBlock blk1(1024);
    SigmaMemBlock blk2(4096);
    cout << "Block 1: " << blk1.getSize() << " bytes" << endl;
    cout << "Block 2: " << blk2.getSize() << " bytes" << endl;
    cout << "Kernel init: OK" << endl;
    return 0;
}`, 'cpp');

    this._addFile('sigma_core.rs', `// SigmaOS Rust Core Module — no_std sovereign
use std::collections::HashMap;

struct SigmaScheduler {
    pid_counter: u32,
    run_queue: Vec<(u32, String)>,
}

impl SigmaScheduler {
    fn new() -> Self { SigmaScheduler { pid_counter: 0, run_queue: Vec::new() } }
    fn spawn(&mut self, name: &str) -> u32 {
        self.pid_counter += 1;
        self.run_queue.push((self.pid_counter, name.to_string()));
        println!("Spawned process '{}' PID={}", name, self.pid_counter);
        self.pid_counter
    }
    fn tick(&self) {
        println!("=== Run Queue ===");
        for (pid, name) in &self.run_queue {
            println!("  PID {} | {}", pid, name);
        }
    }
}

fn main() {
    let mut sched = SigmaScheduler::new();
    sched.spawn("sigma_kernel");
    sched.spawn("sigma_vfs");
    sched.spawn("user_shell");
    sched.tick();
    println!("Scheduler: {} processes", sched.run_queue.len());
}`, 'rust');

    this._addFile('kernel.asm', `; SigmaOS x86 Bootloader Stub
; NASM Syntax

section .data
    msg db 'SigmaOS Booting...', 0Ah, 0
    msg_len equ $ - msg

section .text
    global _start

_start:
    mov eax, 4       ; sys_write
    mov ebx, 1       ; stdout
    mov ecx, msg     ; message
    mov edx, msg_len ; length
    int 0x80         ; syscall

    mov eax, 1       ; sys_exit
    mov ebx, 0       ; code 0
    int 0x80`, 'asm');

    this._addFile('sigma_algo.py', `# SigmaOS Python Engine — Custom algorithms
# No external libraries used

def sigma_sort(arr):
    """Custom merge sort — O(n log n)"""
    if len(arr) <= 1:
        return arr
    mid = len(arr) // 2
    left = sigma_sort(arr[:mid])
    right = sigma_sort(arr[mid:])
    merged = []
    i = j = 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]:
            merged.append(left[i]); i += 1
        else:
            merged.append(right[j]); j += 1
    return merged + left[i:] + right[j:]

data = [64, 34, 25, 12, 22, 11, 90]
result = sigma_sort(data)
print(f"Input:  {data}")
print(f"Sorted: {result}")
print(f"Length: {len(result)} items")`, 'py');
  }

  _addFile(name, content, lang) {
    const id = ++this.tabSeq;
    const file = new SigmaFile(id, name, content, lang);
    this.files.push(file);
    this._rebuildFileList();
    return file;
  }

  _rebuildFileList() {
    const el = document.getElementById('file-list');
    const icons = { js: '📄', cpp: '⚙️', c: '🔧', rs: '🦀', py: '🐍', asm: '💾', rust: '🦀' };
    el.innerHTML = this.files.map(f =>
      `<div class="file-item${f.id === this.activeId ? ' active' : ''}" onclick="ide.openTab(${f.id})">
        <span class="file-icon">${icons[f.lang] || '📄'}</span>${f.name}${f.modified ? ' •' : ''}
      </div>`
    ).join('');
  }

  _rebuildTabBar() {
    const el = document.getElementById('tab-bar');
    el.innerHTML = this.files.map(f =>
      `<div class="tab${f.id === this.activeId ? ' active' : ''}" onclick="ide.openTab(${f.id})">
        ${f.name}${f.modified ? ' •' : ''}
        <span class="close-t" onclick="event.stopPropagation();ide.closeTab(${f.id})">✕</span>
      </div>`
    ).join('');
  }

  openTab(id) {
    // Save current content
    if (this.activeId) {
      const cur = this.files.find(f => f.id === this.activeId);
      if (cur) cur.content = document.getElementById('code').value;
    }
    this.activeId = id;
    const file = this.files.find(f => f.id === id);
    if (!file) return;
    document.getElementById('code').value = file.content;
    document.getElementById('lang-sel').value = file.lang === 'rust' ? 'rust' : file.lang;
    this._updateLineNums();
    this._rebuildTabBar();
    this._rebuildFileList();
    document.getElementById('sb-lang').textContent = this._langName(file.lang);
    document.getElementById('code').focus();
  }

  closeTab(id) {
    if (this.files.length <= 1) return;
    this.files = this.files.filter(f => f.id !== id);
    if (this.activeId === id) this.openTab(this.files[this.files.length - 1].id);
    else { this._rebuildTabBar(); this._rebuildFileList(); }
  }

  newTab() {
    const f = this._addFile('untitled.js', '// New file\n', 'js');
    this.openTab(f.id);
    this._rebuildTabBar();
  }

  _langName(l) {
    return {js:'JavaScript',cpp:'C++',c:'C',rust:'Rust',py:'Python',asm:'x86 Assembly'}[l] || l;
  }

  _bindEvents() {
    const ta = document.getElementById('code');
    ta.addEventListener('input', () => {
      this._updateLineNums();
      this._updateStats();
      if (this.activeId) { const f = this.files.find(f => f.id === this.activeId); if (f) { f.modified = true; this._rebuildTabBar(); } }
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.substring(0,s)+'    '+ta.value.substring(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s+4; }
      if (e.key === 'F11') { e.preventDefault(); this.runCode(); }
      if (e.altKey && e.key === 'f') { e.preventDefault(); this.formatCode(); }
    });
    ta.addEventListener('click', () => this._updateStats());
    ta.addEventListener('keyup', () => this._updateStats());
  }

  _updateLineNums() {
    const ta = document.getElementById('code');
    const lines = ta.value.split('\n').length;
    document.getElementById('line-nums').textContent = Array.from({length: lines}, (_, i) => i + 1).join('\n');
  }

  _updateStats() {
    const ta = document.getElementById('code');
    const val = ta.value;
    const before = val.substring(0, ta.selectionStart);
    const lines = before.split('\n');
    const ln = lines.length, col = lines[lines.length - 1].length + 1;
    document.getElementById('stats').textContent = `Ln ${ln}, Col ${col} | ${val.length} chars`;
    document.getElementById('sb-ln').textContent = 'Ln ' + ln;
    document.getElementById('sb-col').textContent = 'Col ' + col;
  }

  runCode() {
    // Save current tab content
    if (this.activeId) { const f = this.files.find(f => f.id === this.activeId); if (f) f.content = document.getElementById('code').value; }
    const file = this.files.find(f => f.id === this.activeId);
    if (!file) return;

    this.output.clear();
    this.output.info(`Running ${file.name} [${this._langName(file.lang)}]...`);
    this.output.dim('─'.repeat(50));

    const t0 = performance.now();
    const src = file.content;

    try {
      if (file.lang === 'js') {
        // Real JS execution
        const logs = [];
        const fakeCons = { log: (...a) => logs.push(a.join(' ')), error: (...a) => logs.push('ERROR: '+a.join(' ')), warn: (...a) => logs.push('WARN: '+a.join(' ')) };
        new Function('console', src)(fakeCons);
        logs.forEach(l => this.output.print(l.replace(/</g,'&lt;').replace(/>/g,'&gt;')));
      } else if (file.lang === 'cpp') {
        const r = SigmaLanguageEngine.simulateCpp(src);
        if (!r.ok) throw new Error(r.err);
        r.out.forEach(l => this.output.print(l.replace(/</g,'&lt;')));
      } else if (file.lang === 'c') {
        const r = SigmaLanguageEngine.simulateC(src);
        if (!r.ok) throw new Error(r.err);
        r.out.forEach(l => this.output.print(l.replace(/</g,'&lt;')));
      } else if (file.lang === 'rust') {
        const r = SigmaLanguageEngine.simulateRust(src);
        if (!r.ok) throw new Error(r.err);
        r.out.forEach(l => this.output.print(l.replace(/</g,'&lt;')));
      } else if (file.lang === 'asm') {
        const r = SigmaLanguageEngine.simulateAsm(src);
        r.out.forEach(l => this.output.print(l));
      } else if (file.lang === 'py') {
        const r = SigmaLanguageEngine.simulatePython(src);
        if (!r.ok) throw new Error(r.err);
        r.out.forEach(l => this.output.print(l.replace(/</g,'&lt;')));
      }
      const dt = (performance.now() - t0).toFixed(2);
      this.output.dim('─'.repeat(50));
      this.output.ok(`Execution finished in ${dt}ms`);
      document.getElementById('exec-time').textContent = dt + 'ms';
    } catch(e) {
      this.output.err(`Error: ${(e.message||e).replace(/</g,'&lt;')}`);
    }
  }

  formatCode() {
    const ta = document.getElementById('code');
    let code = ta.value;
    // Basic indent formatter
    code = code.split('\n').map(l => l.trimEnd()).join('\n');
    code = code.replace(/\n{3,}/g, '\n\n');
    ta.value = code;
    this._updateLineNums();
    this.output.ok('Code formatted.');
  }

  saveFile() {
    const file = this.files.find(f => f.id === this.activeId);
    if (!file) return;
    file.content = document.getElementById('code').value;
    file.modified = false;
    const blob = new Blob([file.content], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    a.click();
    this._rebuildTabBar();
    this.output.ok(`Saved: ${file.name}`);
  }

  loadFile() { document.getElementById('file-input').click(); }

  openFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const ext = file.name.split('.').pop().toLowerCase();
      const langMap = { js:'js', ts:'js', cpp:'cpp', cc:'cpp', cxx:'cpp', c:'c', rs:'rust', py:'py', asm:'asm', s:'asm' };
      const lang = langMap[ext] || 'js';
      const f = this._addFile(file.name, e.target.result, lang);
      this.openTab(f.id);
      this._rebuildTabBar();
      this.output.ok(`Opened: ${file.name}`);
    };
    reader.readAsText(file);
  }

  clearOutput() { this.output.clear(); }
}

// Init
function changeLang() {
  const f = ide.files.find(f => f.id === ide.activeId);
  if (f) { f.lang = document.getElementById('lang-sel').value; document.getElementById('sb-lang').textContent = ide._langName(f.lang); }
}
function runCode() { ide.runCode(); }
function formatCode() { ide.formatCode(); }
function newTab() { ide.newTab(); }
function saveFile() { ide.saveFile(); }
function loadFile() { ide.loadFile(); }
function openFile(e) { ide.openFile(e); }
function clearOutput() { ide.clearOutput(); }
function switchOut(tab) {
  document.querySelectorAll('.out-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('ot-'+tab).classList.add('active');
}

const ide = new SigmaIDE();
</script>
</body>
