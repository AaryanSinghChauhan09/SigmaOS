# SigmaOS light theme (sigma-light)
# Comfortable for bright-room use; passes WCAG 2.2 AA (≥4.5:1 contrast)

name    = "sigma-light"
author  = "SigmaOS Team"
version = "1.0.0"
dark_mode     = false
high_contrast = false

[colors]
accent          = "#0969da"   # GitHub-blue — high contrast on white
background      = "#ffffff"   # pure white
surface         = "#f6f8fa"   # GitHub sidebar grey
surface_raised  = "#eaeef2"   # slightly darker raised surfaces
border          = "#d0d7de"   # subtle border
text_primary    = "#1f2328"   # near-black — 16.75:1 contrast on white
text_muted      = "#57606a"   # secondary — 5.74:1 (passes AA)
text_inverse    = "#ffffff"
success         = "#1a7f37"
warning         = "#9a6700"
error           = "#d1242f"
info            = "#0550ae"

[fonts]
ui       = "SigmaSans"
code     = "SigmaMono"
display  = "SigmaSans"
size_base   = 14
line_height = 1.6

[shape]
radius_window = 12
radius_button  = 8
radius_card    = 10
radius_input   = 6

[spacing]
xs = 4
sm = 8
md = 16
lg = 24
xl = 32

[animation]
duration_ms = 200
easing      = "ease-in-out"

[wallpaper]
path         = "/sigma/share/wallpapers/sigma-light-default.jpg"
blur         = false
blur_radius  = 0.0
