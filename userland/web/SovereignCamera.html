<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS Sovereign Camera</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #video-container { position: relative; width: 80%; max-width: 800px; aspect-ratio: 16/9; background: #111; border: 2px solid cyan; border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px cyan; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        canvas { pointer-events: none; }
        .controls { margin-top: 20px; display: flex; gap: 15px; }
        button { background: transparent; border: 1px solid cyan; color: cyan; padding: 10px 20px; font-family: inherit; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: 0.3s; border-radius: 5px; }
        button:hover { background: cyan; color: #000; box-shadow: 0 0 10px cyan; }
        .filter-options { margin-top: 15px; display: flex; gap: 10px; }
        .filter-btn { font-size: 14px; padding: 5px 10px; }
        #snapshot-gallery { margin-top: 20px; display: flex; gap: 10px; overflow-x: auto; width: 80%; padding-bottom: 10px; }
        .snapshot { width: 120px; border: 1px solid #fff; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .snapshot:hover { transform: scale(1.1); border-color: cyan; }
    </style>
</head>
<body>
    <h2 style="text-shadow: 0 0 10px cyan;">SOVEREIGN OPTICS (Sovereign Camera)</h2>
    <div id="video-container">
        <video id="camera" autoplay playsinline></video>
        <canvas id="ar-overlay"></canvas>
    </div>
    
    <div class="controls">
        <button id="capture-btn">Capture Reality</button>
        <button id="download-btn" style="display:none;">Download Shard</button>
    </div>

    <div class="filter-options">
        <button class="filter-btn" data-filter="none">Raw</button>
        <button class="filter-btn" data-filter="grayscale(100%)">Noir</button>
        <button class="filter-btn" data-filter="sepia(100%)">Relic</button>
        <button class="filter-btn" data-filter="invert(100%)">Inverted</button>
        <button class="filter-btn" data-filter="hue-rotate(90deg)">Neon</button>
        <button class="filter-btn" data-filter="ar-snap">AR Mask (Snapchat USP)</button>
    </div>

    <div id="snapshot-gallery"></div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('ar-overlay');
        const ctx = canvas.getContext('2d');
        const captureBtn = document.getElementById('capture-btn');
        const gallery = document.getElementById('snapshot-gallery');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        let currentFilter = 'none';
        let arMode = false;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                console.error("Camera access denied or unavailable: ", err);
                document.getElementById('video-container').innerHTML = `<p style="padding: 20px; text-align: center; color: red;">Failed to access camera hardware directly. Ensure camera permissions are granted to the Sovereign Engine.</p>`;
            }
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (arMode) {
                // Mit-scratch/Snapchat USP: Basic AR drawing on faces (placeholder logic for demonstration)
                // In a production C/C++ build, this connects to the facial recognition subsystem
                const time = Date.now() / 500;
                const x = canvas.width / 2 + Math.sin(time) * 50;
                const y = canvas.height / 2 + Math.cos(time) * 50;
                
                ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(x, y, 60, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '24px Courier';
                ctx.fillText('Tracking Entity...', x - 80, y - 80);
            }
            requestAnimationFrame(renderLoop);
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const f = e.target.getAttribute('data-filter');
                if (f === 'ar-snap') {
                    arMode = true;
                    video.style.filter = 'none';
                    currentFilter = 'none';
                } else {
                    arMode = false;
                    video.style.filter = f;
                    currentFilter = f;
                }
            });
        });

        captureBtn.addEventListener('click', () => {
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = canvas.width;
            snapCanvas.height = canvas.height;
            const snapCtx = snapCanvas.getContext('2d');
            
            snapCtx.filter = currentFilter;
            snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
            
            if (arMode) {
                snapCtx.drawImage(canvas, 0, 0); // Overlay AR
            }

            const imgUrl = snapCanvas.toDataURL('image/png');
            const img = document.createElement('img');
            img.src = imgUrl;
            img.className = 'snapshot';
            img.onclick = () => {
                const a = document.createElement('a');
                a.href = imgUrl;
                a.download = 'SigmaOS_Capture_' + Date.now() + '.png';
                a.click();
            };
            
            gallery.prepend(img);
        });

        initCamera();
    </script>
</body>
</html>
