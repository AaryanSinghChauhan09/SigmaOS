<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS Sovereign Camera</title>
    <link rel="stylesheet" href="SovereignCamera.css">
</head>
<body>
    <h2 class="sovereign-title">SOVEREIGN OPTICS (Sovereign Camera)</h2>
    <div id="video-container">
        <!-- Removed 'playsinline' for Firefox compatibility -->
        <video id="camera" autoplay></video>
        <canvas id="ar-overlay"></canvas>
    </div>
    
    <div class="controls">
        <button id="capture-btn">Capture Reality</button>
        <button id="download-btn" class="btn-hidden">Download Shard</button>
    </div>

    <!-- Added more modes for Sovereign operations -->
    <div class="filter-options">
        <button class="filter-btn" data-filter="none">Raw</button>
        <button class="filter-btn" data-filter="grayscale(100%)">Noir</button>
        <button class="filter-btn" data-filter="sepia(100%)">Relic</button>
        <button class="filter-btn" data-filter="invert(100%)">Inverted</button>
        <button class="filter-btn" data-filter="hue-rotate(90deg)">Neon</button>
        
        <!-- New Sovereign Modes -->
        <button class="filter-btn" data-filter="brightness(150%) contrast(150%) hue-rotate(180deg)">Thermal</button>
        <button class="filter-btn" data-filter="brightness(80%) contrast(200%) sepia(100%) hue-rotate(80deg) saturate(200%)">Night Vision</button>
        <button class="filter-btn" data-filter="grayscale(100%) invert(100%) contrast(150%)">X-Ray</button>
        <button class="filter-btn" data-filter="contrast(200%) saturate(200%) hue-rotate(45deg)">Cyberpunk</button>
        <button class="filter-btn" data-filter="blur(3px) contrast(150%)">Cinematic Focus</button>

        <button class="filter-btn" data-filter="ar-snap">AR Mask (Snapchat USP)</button>
    </div>

    <div id="snapshot-gallery"></div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('ar-overlay');
        const ctx = canvas.getContext('2d');
        const captureBtn = document.getElementById('capture-btn');
        const gallery = document.getElementById('snapshot-gallery');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        let currentFilter = 'none';
        let arMode = false;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                console.error("Camera access denied or unavailable: ", err);
                document.getElementById('video-container').innerHTML = `<p class="error-msg">Failed to access camera hardware directly. Ensure camera permissions are granted to the Sovereign Engine.</p>`;
            }
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (arMode) {
                // MIT-Scratch & Snapchat USP: Algorithmic block-based AR drawing and facial mesh filtering.
                // In a production C/C++ build, this connects to the bare-metal facial recognition subsystem.
                const time = Date.now() / 500;
                const x = canvas.width / 2 + Math.sin(time) * 50;
                const y = canvas.height / 2 + Math.cos(time) * 50;
                
                ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(x, y, 60, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '24px Courier';
                ctx.fillText('Tracking Entity via MIT Scratch & Snapchat Algorithms...', x - 80, y - 80);
            }
            requestAnimationFrame(renderLoop);
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const f = e.target.getAttribute('data-filter');
                if (f === 'ar-snap') {
                    arMode = true;
                    video.style.filter = 'none';
                    currentFilter = 'none';
                } else {
                    arMode = false;
                    video.style.filter = f;
                    currentFilter = f;
                }
            });
        });

        captureBtn.addEventListener('click', () => {
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = canvas.width;
            snapCanvas.height = canvas.height;
            const snapCtx = snapCanvas.getContext('2d');
            
            snapCtx.filter = currentFilter;
            snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
            
            if (arMode) {
                snapCtx.drawImage(canvas, 0, 0); // Overlay AR
            }

            const imgUrl = snapCanvas.toDataURL('image/png');
            const img = document.createElement('img');
            img.src = imgUrl;
            img.className = 'snapshot';
            img.onclick = () => {
                const a = document.createElement('a');
                a.href = imgUrl;
                a.download = 'SigmaOS_Capture_' + Date.now() + '.png';
                a.click();
            };
            
            gallery.prepend(img);
        });

        initCamera();
    </script>
</body>
</html>
