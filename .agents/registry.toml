# SigmaOS Agent Registry and Operating Model

[version]
schema = "1.0.0"
updated = "2026-03-31"

[agents.repository-steward]
name = "Repository Steward"
description = "Maintains repository hygiene, issue/PR triage, conventional commit enforcement, and weekly staleness audits."
scope = ["./"]
owner_path = ".github/"
allowed_tools = ["read_file", "list_files", "grep", "run_in_bash_session"]
permissions = { fs_read = true, fs_write_reports = true, code_write = false, network = false }
recurring_cadence = "daily"
definition_of_done = "All open PRs checked for commit rules, linked issues, changed-file scope, and test evidence."

[agents.build-test-sentinel]
name = "Build and Test Sentinel"
description = "Runs cargo check, cargo test, ./run_sigma_tests.sh, make test, detects flaky tests, and produces test manifests."
scope = ["src/", "tests/", "Makefile", "run_sigma_tests.sh"]
owner_path = "reports/test/"
allowed_tools = ["run_in_bash_session", "read_file", "write_file"]
permissions = { fs_read = true, fs_write_reports = true, code_write_mechanical = true, network = false }
recurring_cadence = "daily"
definition_of_done = "Build/test suite passes cleanly, failure classification is produced, and machine-readable report is saved."

[agents.boot-runtime-validator]
name = "Boot and Runtime Validator"
description = "Builds boot/ISO artifacts, launches QEMU x86_64/ARM64, captures serial console logs, and verifies boot-to-shell contract."
scope = ["kernel/", "src/kernel/", "installer/", "iso_root/", "scripts/", "tests/"]
owner_path = "reports/boot/"
allowed_tools = ["run_in_bash_session", "read_file", "write_file"]
permissions = { fs_read = true, fs_write_reports = true, code_write = false, network = false }
recurring_cadence = "daily"
definition_of_done = "QEMU boot completes within timeout, shell prompt is verified, serial log is saved, and status matrix updated."

[agents.capability-auditor]
name = "Capability Auditor"
description = "Audits CAPABILITY_MATRIX.toml, FEATURE_STATUS.toml, README claims, and source code to maintain evidence-driven truth table."
scope = ["CAPABILITY_MATRIX.toml", "FEATURE_STATUS.toml", "README.md", "docs/", "src/"]
owner_path = "reports/capability/"
allowed_tools = ["read_file", "grep", "write_file", "run_in_bash_session"]
permissions = { fs_read = true, fs_write_reports = true, code_write = false, network = false }
recurring_cadence = "weekly"
definition_of_done = "All status claims checked against unit tests and QEMU boot traces; truth table published in reports/capability/."

[agents.kernel-subsystem]
name = "Kernel Subsystem Agent"
description = "Maintains kernel entry, memory management, VFS, IPC, interrupts, and syscall ABI consistency."
scope = ["src/kernel/", "src/memory/", "src/vfs/", "src/ipc/", "kernel/"]
owner_path = "src/kernel/"
allowed_tools = ["read_file", "write_file", "replace_with_git_merge_diff", "run_in_bash_session"]
permissions = { fs_read = true, fs_write_reports = true, code_write = true, network = false }
recurring_cadence = "biweekly"
definition_of_done = "Subsystem rules enforced, unit/integration tests pass, and zero unsafe regressions introduced."

[agents.package-compat]
name = "Package and Distro Compatibility Agent"
description = "Maintains package-format schemas, metadata parsing, dependency graphs, and sandboxed package dry-run installation."
scope = ["src/package/", "src/compatibility/", "src/distro/", "tools/"]
owner_path = "src/package/"
allowed_tools = ["read_file", "write_file", "replace_with_git_merge_diff", "run_in_bash_session"]
permissions = { fs_read = true, fs_write_reports = true, code_write = true, network = false }
recurring_cadence = "weekly"
definition_of_done = "Package metadata parsed, dependency graphs resolved without execution, dry-run reported in reports/package/."

[agents.docs-onboarding]
name = "Documentation and Onboarding Agent"
description = "Ensures README commands match scripts/Makefile, maintains contributor quickstart, and updates Verified Today dashboard."
scope = ["README.md", "docs/", "WIKI/", "reports/"]
owner_path = "docs/"
allowed_tools = ["read_file", "write_file", "replace_with_git_merge_diff", "list_files"]
permissions = { fs_read = true, fs_write_docs = true, code_write = false, network = false }
recurring_cadence = "weekly"
definition_of_done = "Documentation strictly reflects current QEMU-verified evidence without unverified claims."
