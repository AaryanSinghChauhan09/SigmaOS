# SigmaOS Agent Registry
# Defines agent roles, ownership boundaries, scopes, permissions, and report locations.

version = "1.0.0"

[agents.repository-steward]
name = "Repository Steward"
description = "Keeps repository clean, coherent, and reviewable."
scope = ["./", ".github/", "docs/", "reports/steward/"]
permissions = [
  "read:all",
  "write:reports/steward/*",
  "open:issue",
  "open:pr:docs"
]
reports = [
  "reports/steward/daily-status.md",
  "reports/steward/stale-work.md"
]
requires_human_approval = [
  "force_push",
  "branch_deletion",
  "architecture_refactor"
]

[agents.build-test-sentinel]
name = "Build and Test Sentinel"
description = "Automates clean builds, test execution, and regression reporting."
scope = ["Cargo.toml", "Cargo.lock", "Makefile", "scripts/", "tests/", "reports/build/", "reports/test/"]
permissions = [
  "read:all",
  "exec:cargo",
  "exec:make",
  "exec:test_scripts",
  "write:reports/build/*",
  "write:reports/test/*",
  "open:pr:fix"
]
reports = [
  "reports/build/latest.json",
  "reports/test/latest.json"
]
requires_human_approval = [
  "dependency_upgrade",
  "toolchain_bump"
]

[agents.boot-runtime-validator]
name = "Boot and Runtime Validator"
description = "Validates boot-to-shell, installer, and QEMU runtime execution paths."
scope = ["installer/", "src/kernel/", "scripts/", "tests/", "reports/boot/", "reports/installer/"]
permissions = [
  "read:all",
  "exec:qemu",
  "exec:build_iso",
  "write:reports/boot/*",
  "write:reports/installer/*",
  "open:issue:blocker"
]
reports = [
  "reports/boot/qemu-x86_64.json",
  "reports/boot/boot_matrix.json",
  "reports/installer/summary.json"
]
requires_human_approval = [
  "bootloader_change",
  "kernel_entry_change",
  "installer_disk_wipe"
]

[agents.capability-auditor]
name = "Capability Auditor"
description = "Cross-checks capability status claims against actual test and boot evidence."
scope = ["README.md", "CAPABILITY_MATRIX.toml", "FEATURE_STATUS.toml", "docs/", "reports/capability/"]
permissions = [
  "read:all",
  "write:reports/capability/*",
  "update:status_downgrade",
  "open:issue:unverified_claim"
]
reports = [
  "reports/capability/verified_today.md",
  "reports/capability/truth_table.json"
]
requires_human_approval = [
  "status_upgrade_to_supported"
]

[agents.scheduler-agent]
name = "Scheduler Subsystem Agent"
description = "Owns thread scheduling, process priority, starvation preventer, and CPU dispatching."
scope = ["src/kernel/scheduler/", "src/kernel/sched*", "tests/kernel/scheduler*"]
permissions = [
  "read:all",
  "write:src/kernel/scheduler/*",
  "exec:cargo_test_scoped"
]
reports = ["reports/test/scheduler.json"]
requires_human_approval = ["kernel_interface_change"]

[agents.memory-agent]
name = "Memory Subsystem Agent"
description = "Owns frame allocation, heap allocators, paging, and kernel virtual memory."
scope = ["src/kernel/memory/", "src/kernel/mem*", "tests/kernel/memory*"]
permissions = [
  "read:all",
  "write:src/kernel/memory/*",
  "exec:cargo_test_scoped"
]
reports = ["reports/test/memory.json"]
requires_human_approval = ["kernel_security_boundary_change"]

[agents.vfs-agent]
name = "VFS and Filesystem Agent"
description = "Owns path resolution, VFS trait abstractions, mount table, and filesystem drivers."
scope = ["src/vfs/", "src/fs/", "tests/vfs/*", "tests/fs/*"]
permissions = [
  "read:all",
  "write:src/vfs/*",
  "write:src/fs/*",
  "exec:cargo_test_scoped"
]
reports = ["reports/test/vfs.json"]
requires_human_approval = ["storage_format_change"]

[agents.syscall-agent]
name = "Syscall Subsystem Agent"
description = "Owns ABI consistency, argument validation, and kernel syscall dispatching."
scope = ["src/kernel/syscall*", "tests/kernel/syscall*"]
permissions = [
  "read:all",
  "write:src/kernel/syscall*",
  "exec:cargo_test_scoped"
]
reports = ["reports/test/syscall.json"]
requires_human_approval = ["abi_breaking_change"]

[agents.ipc-agent]
name = "IPC Subsystem Agent"
description = "Owns pipes, signals, Unix sockets, shared memory, and IPC message queues."
scope = ["src/kernel/ipc*", "src/ipc/", "tests/ipc/*"]
permissions = [
  "read:all",
  "write:src/kernel/ipc*",
  "write:src/ipc/*",
  "exec:cargo_test_scoped"
]
reports = ["reports/test/ipc.json"]
requires_human_approval = ["ipc_capability_change"]

[agents.driver-agent]
name = "Driver Subsystem Agent"
description = "Owns hardware probe, device initialization, virtio drivers, and PCI/USB shims."
scope = ["src/driver/", "src/graphics/", "src/audio/", "tests/driver/*"]
permissions = [
  "read:all",
  "write:src/driver/*",
  "write:src/graphics/*",
  "write:src/audio/*",
  "exec:cargo_test_scoped"
]
reports = ["reports/test/drivers.json"]
requires_human_approval = ["physical_hardware_claim"]

[agents.security-agent]
name = "Security Subsystem Agent"
description = "Owns MAC policies, capability checks, sandboxing, pledge/unveil, and threat models."
scope = ["src/security/", "tests/security/*", "reports/security/"]
permissions = [
  "read:all",
  "write:src/security/*",
  "write:reports/security/*",
  "exec:fuzz"
]
reports = ["reports/security/audit.json"]
requires_human_approval = ["all_security_changes"]

[agents.package-compat-agent]
name = "Package and Distro Compatibility Agent"
description = "Owns package metadata parsing, dependency graphs, and sandboxed package execution."
scope = ["src/compatibility/", "src/distro/", "tools/sigma_pacman_compat.rs", "reports/package/"]
permissions = [
  "read:all",
  "write:src/compatibility/*",
  "write:reports/package/*",
  "exec:sandbox_dryrun"
]
reports = ["reports/package/compatibility_matrix.json"]
requires_human_approval = ["exec_host_package_scripts"]

[agents.docs-onboarding-agent]
name = "Documentation and Onboarding Agent"
description = "Synchronizes README claims, contributor guides, and troubleshooting steps with verified reality."
scope = ["README.md", "docs/", "WIKI/", "wiki/", ".github/PULL_REQUEST_TEMPLATE.md"]
permissions = [
  "read:all",
  "write:docs/*",
  "write:WIKI/*",
  "open:pr:docs"
]
reports = ["reports/capability/verified_today.md"]
requires_human_approval = ["readme_architecture_redefinition"]
