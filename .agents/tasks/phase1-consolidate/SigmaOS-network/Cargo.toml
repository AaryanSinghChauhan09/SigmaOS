[package]
name = "SigmaOS_network"
version = "0.1.0"
edition = "2021"
authors = ["Aaryan Singh Chauhan <aaryan@sigmaos.dev>"]
license = "MIT"
description = "Networking stack: TCP/IP, UDP, DNS, TLS, and mDNS discovery. Packet filtering and QoS support."
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-network"
keywords = ["sigmaos", "system"]
categories = ["os"]

[dependencies]
thiserror = "1.0"
log = "0.4"
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"

[[test]]
name = "integration"
path = "tests/integration.rs"
