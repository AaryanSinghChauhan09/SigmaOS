[package]
name = "SigmaOS_filesystem"
version = "0.1.0"
edition = "2021"
authors = ["Aaryan Singh Chauhan <aaryan@sigmaos.dev>"]
license = "MIT"
description = "Virtual filesystem layer with ext4, tmpfs, and devfs drivers. Provides efficient, zero-copy paths and journaling support."
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-filesystem"
keywords = ["sigmaos", "system"]
categories = ["os"]

[dependencies]
thiserror = "1.0"
log = "0.4"
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"

[[test]]
name = "integration"
path = "tests/integration.rs"
