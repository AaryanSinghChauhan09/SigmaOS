[rule.memory_completeness]
requirement = "Memory management defines allocation, paging, protection, and swap semantics."
enforcement = "Memory tests + rehearsals"

[rule.no_leak]
requirement = "Memory leaks are zero under stress tests."
enforcement = "Memory stress tests"

[rule.oom_metric]
requirement = "Memory defines and measures OOM behavior."
enforcement = "Limit rehearsal"

[rule.page_table_integrity]
requirement = "Page-table invariants preserve mapping and scheduler integrity."
enforcement = "Page-table tests"

[rule.protection_semantics]
requirement = "Mapping protection defines legal access and error codes."
enforcement = "Protection tests"

[rule.no_model_only_status]
requirement = "Memory features cannot be marked complete from model tests alone."
enforcement = "Status audit"

[rule.runtime_evidence]
requirement = "Boot-affecting memory changes require boot-to-shell or integration evidence."
enforcement = "CI boot gate"
