# Shell and Command-Line Interface Standards

# Rules governing shell behavior, command syntax, and CLI standards

[shell_compatibility]
# POSIX shell compatibility level
posix_level = "1"

# Bash compatibility required
bash_compatible = true

# Minimum shell version
min_shell_version = "5.0"

[command_syntax]
# Command syntax: GNU-style or POSIX-style
command_syntax = "gnu"

# Long option support required (--option)
long_options_required = true

# Short option support required (-o)
short_options_required = true

# Option parsing: getopt or custom
option_parsing = "getopt"

[exit_codes]
# Exit code 0: success, non-zero: failure
exit_code_convention = "posix"

# Exit code range: 0-255
exit_code_max = 255

# Documented exit codes required
documented_exit_codes = true

[io_redirection]
# Standard I/O redirection supported
stdio_redirection = true

# Pipe operator support required
pipe_support = true

# Stderr redirection supported
stderr_redirection = true

# Append redirection supported
append_redirection = true

[scripting]
# Shell script support required
script_support = true

# Script shebang processing required
shebang_processing = true

# Built-in command set required
builtin_commands_required = true

[builtins]
# Essential built-ins: cd, exit, export, etc.
essential_builtins = ["cd", "exit", "export", "unset", "echo", "pwd", "test"]

# Variable expansion supported
variable_expansion = true

# Command substitution supported
command_substitution = true

[environment]
# Environment variable inheritance
env_inheritance = true

# PATH variable mandatory
path_required = true

# HOME variable mandatory
home_required = true

[completion]
# Tab completion support
tab_completion = true

# History support
history_support = true

# Maximum history size (lines)
max_history_lines = 1000
