name: Validate Documentation Links

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install markdown-link-check
        run: |
          npm install -g markdown-link-check

      - name: Find all markdown files
        id: find-files
        run: |
          files=$(find docs -name "*.md" -type f)
          echo "FILES<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate internal links
        run: |
          failed=0
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            
            echo "Checking $file..."
            
            # Extract links from markdown
            grep -o '\[.*\](.*\.md.*\|#.*\)' "$file" | grep -o '(.*\.md.*\|#.*)' | tr -d '()' | while read -r link; do
              # Handle fragment links
              if [[ "$link" == \#* ]]; then
                # Fragment link - not validated here
                continue
              fi
              
              # Handle relative links
              if [[ "$link" == /* ]]; then
                # Absolute path from repo root
                target="$link"
              else
                # Relative path
                target="$(dirname "$file")/$link"
              fi
              
              # Resolve path
              target=$(echo "$target" | sed 's|/./|/|g')
              target=$(echo "$target" | sed 's|[^/]*/\.\./||g')
              
              # Check if file exists
              if [ -f "$target" ]; then
                echo "  ✓ $link"
              else
                echo "  ✗ $link -> $target (not found)"
                failed=$((failed + 1))
              fi
            done
            
            if [ $failed -gt 0 ]; then
              exit 1
            fi
          done <<< "${{ steps.find-files.outputs.FILES }}"

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Documentation link validation failed. Please fix broken links.'
            })
