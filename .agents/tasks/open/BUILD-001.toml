id = "BUILD-001"
title = "Execute clean build and test sentinel check"
agent = "build-test-sentinel"
priority = "P0"
repeat = "daily"
scope = ["Cargo.toml", "Cargo.lock", "Makefile", "scripts/", "tests/"]

steps = [
  "cargo check --lib",
  "cargo test --lib",
  "./run_sigma_tests.sh",
  "rerun failing tests up to 3 times to detect flakiness",
  "write build and test reports",
  "sign report artifacts with SHA256 digest"
]

evidence = [
  "reports/build/latest.json",
  "reports/test/latest.json",
  "reports/evidence_signatures.json"
]

success = [
  "all build and test commands exit 0",
  "reports signed and written to disk"
]

on_failure = "create blocked task with failing command stderr"
