id = "AUDIT-001"
title = "Audit capability claims against verified runtime and test evidence"
agent = "capability-auditor"
priority = "P0"
repeat = "daily"
scope = ["README.md", "CAPABILITY_MATRIX.toml", "FEATURE_STATUS.toml"]

steps = [
  "parse CAPABILITY_MATRIX.toml and FEATURE_STATUS.toml",
  "cross-reference claims against reports/ evidence directory",
  "flag claims lacking test or boot logs",
  "downgrade unevidenced claims to model-only or needs-revalidation",
  "generate truth_table.json and verified_today.md"
]

evidence = [
  "reports/capability/truth_table.json",
  "reports/capability/verified_today.md"
]

success = [
  "all claims mapped to explicit evidence status",
  "verified_today.md generated without syntax error"
]

on_failure = "create blocked task with unverified claims"
