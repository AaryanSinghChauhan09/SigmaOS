id = "BUILD-TEST-001"
title = "Execute Clean Build and Core Test Verification"
agent = "build-test-sentinel"
priority = "P0"
scope = ["src/", "tests/", "run_sigma_tests.sh", "Makefile"]
repeat = "daily"

steps = [
  "cargo check --lib",
  "cargo test --lib",
  "./run_sigma_tests.sh",
  "write test execution manifest"
]

evidence = [
  "reports/test/test_manifest.json"
]

success = [
  "all commands exit 0",
  "no fatal compiler errors",
  "test manifest created with valid timestamp"
]

on_failure = "create blocked task with first failing stage and error excerpt"
