id = "AUDIT-CAPABILITY-001"
title = "Audit capability claims against test evidence and source code"
agent = "capability-auditor"
priority = "P1"
scope = ["CAPABILITY_MATRIX.toml", "FEATURE_STATUS.toml", "README.md", "src/"]
repeat = "weekly"

steps = [
  "parse capability matrix and feature status files",
  "search source tree for declared component types",
  "verify associated unit and runtime tests",
  "generate truth table JSON and verified today dashboard"
]

evidence = [
  "reports/capability/truth_table.json",
  "reports/capability/verified_today.md"
]

success = [
  "truth table successfully generated",
  "all claims classified into standard status vocabulary",
  "verified_today dashboard updated"
]

on_failure = "flag unverified claims as model-only or integration-pending"
