id = "NIGHTLY-001"
title = "Assemble and verify nightly release channel artifact"
agent = "repository-steward"
priority = "P1"
repeat = "daily"
scope = ["build/", "iso_root/", "reports/"]

steps = [
  "verify clean build passes",
  "verify QEMU x86_64 boot smoke test passes",
  "assemble nightly ISO image",
  "compute SHA256 checksum",
  "write release rollback instructions and known-issue list"
]

evidence = [
  "reports/boot/qemu-x86_64.json",
  "reports/evidence_signatures.json"
]

success = [
  "nightly ISO assembled and checksummed",
  "known-issue list and rollback instructions updated"
]

on_failure = "create blocked task with assembly failure details"
