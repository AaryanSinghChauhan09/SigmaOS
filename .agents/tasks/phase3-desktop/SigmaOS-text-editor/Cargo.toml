[package]
name = "sigmaos-text-editor"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Contributors"]
description = "Text editor for SigmaOS"
license = "MIT"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-text-editor"

[lib]
name = "sigmaos_text_editor"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
