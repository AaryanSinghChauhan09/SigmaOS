[package]
name = "sigma-file-manager"
version = "0.1.0"
edition = "2021"
description = "File browser for SigmaOS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SigmaOS/SigmaOS-file-manager"

[lib]
name = "sigma_file_manager"
path = "src/lib.rs"

[dependencies]
gtk4 = "0.7"
gio = "0.18"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
