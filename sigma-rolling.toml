# SigmaOS Rolling Release Profile (sigma-rolling)
# Rolling release with latest features and updates
# Inspired by openSUSE Tumbleweed and Arch Linux

[profile]
name = "sigma-rolling"
description = "Rolling release with latest features and updates"
version = "rolling"
release_type = "rolling"
update_frequency = "daily"

[features]
# Latest feature set
desktop = true
ai_tools = true
networking = true
graphics = true
audio = true

[shards]
# Latest core shards
core_shards = ["s-mm", "s-sched", "s-net", "s-fs", "s-ipc", "s-sec", "s-sys"]

# Latest essential shards
essential_shards = ["gpu", "network", "storage", "input", "audio"]

# Latest optional shards
optional_shards = ["zenith", "desktop", "llm", "pkg"]

[boot]
# Latest kernel parameters
kernel_params = [
  "kernel.smm.enable=true",
  "kernel.sched.eevdf=true",
  "kernel.net.firewall=deny"
]

[init]
# Full init system
systemd_compatible = true
services = ["network", "ssh", "desktop", "audio"]

[package]
# Rolling package configuration
repository = "https://packages.sigmaos.org/rolling"
cache_dir = "/sigma/store"
auto_update = true
update_frequency = "daily"

# Latest packages
core_packages = \[
  "sigma-coreutils",
  "sigma-shell",
  "sigma-network",
  "sigma-storage",
  "sigma-security",
  "sigma-desktop",
  "sigma-ai"
\]

[security]
# Latest security configuration
secure_boot = true
tpm_enabled = true
disk_encryption = true
selinux = true
auditd = true

[network]
# Full network configuration
dhcp = true
firewall = "deny"
dns_servers = ["8.8.8.8", "8.8.4.4"]

[ui]
# Desktop UI settings
compositor = "zenith"
theme = "latest"
scaling = "auto"

[ai]
# AI configuration
llm_enabled = true
llm_model = "latest"
privacy_mode = "balanced"

[logging]
# Full logging
log_level = "info"
log_file = "/var/log/sigmaos.log"
