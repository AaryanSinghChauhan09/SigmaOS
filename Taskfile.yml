version: '3'

tasks:
  default:
    cmds:
      - task: build
      - task: test

  build:
    desc: Build the Sovereign Lattice (Pure Silicon)
    cmds:
      - make all
    sources:
      - suites/**/*.c
      - suites/**/*.asm
      - core/**/*.c
    generates:
      - build/sigmaos_zenith

  test:
    desc: Run atomic lattice shard tests
    cmds:
      - ./run_sigma_tests.sh
    deps: [build]

  deploy:
    desc: Synchronize lattice state with remote mirrors
    cmds:
      - git push origin main
      - cd WIKI && git push origin master

  observability:
    desc: Launch Zenith Vitals HUD with DTrace probes
    cmds:
      - node gui/backend/server.js
