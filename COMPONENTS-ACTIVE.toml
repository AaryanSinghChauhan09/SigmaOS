engine = "rust"
category = "Desktop"
language = "rust"
visibility = "public"
depends_on = ["SigmaOS-kernel", "SigmaOS-system"]
provides = ["wayland-compositor", "desktop-shell"]

[[component]]
name = "SigmaOS-installer"
