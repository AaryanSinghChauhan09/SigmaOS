# SigmaOS Active Component Registry
# Single source of truth for the 12 core component repositories.
# Modelled on Omarchy Linux sub-repository architecture.
# Following: MODULARITY, SINGLE RESPONSIBILITY, DRY, KISS, SEPARATION OF CONCERNS
# Last updated: 2026-11-19
# 84 redundant repositories archived, 12 core components retained

# Core Infrastructure
[[component]]
name = "SigmaOS"
description = "Main repository with shell hub, component registry, and coordination interface"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS"
engine = "shell_hub"
category = "Core Infrastructure"
language = "shell"
visibility = "public"
depends_on = []
provides = ["hub", "registry", "coordination"]

[[component]]
name = "SigmaOS-dev"
description = "Unified development tools: toolchain, shell configs, agent CLI, workspace management"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS-dev"
engine = "dev_tools"
category = "Core Infrastructure"
language = "rust"
visibility = "public"
depends_on = []
provides = ["development-tools", "shell-configs", "workspace-management"]

[[component]]
name = "SigmaOS-utils"
description = "Unified utilities: file tools, network tools, automation, audio, hardware control"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS-utils"
engine = "utilities"
category = "Core Infrastructure"
language = "rust"
visibility = "public"
depends_on = []
provides = ["file-tools", "network-tools", "automation", "audio", "hardware-control"]

[[component]]
name = "SigmaOS-themes"
description = "Unified theming system: icons, GTK3, desktop themes, and design tokens"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS-themes"
engine = "theming"
category = "Core Infrastructure"
language = "rust"
visibility = "public"
depends_on = []
provides = ["icons", "gtk3-themes", "desktop-themes", "design-tokens"]

