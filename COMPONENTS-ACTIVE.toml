# SigmaOS Active Component Registry
# Single source of truth for the core component repositories — the repos that
# actually carry implementation content after the 2026-11-20 modularization.
# Modelled on Omarchy Linux sub-repository architecture.
# Following: MODULARITY, SINGLE RESPONSIBILITY, DRY, KISS, SEPARATION OF CONCERNS
# Last updated: 2026-11-20
# 12 core components: 1 connector + 11 implementation repos

# ── Connector / control plane ────────────────────────────────────────────────
[[component]]
name = "SigmaOS"
description = "Connector/control-plane repo: fleet registry, component scaffold, and shell hub that orchestrates the SigmaOS-* component repositories"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS"
engine = "shell_hub"
category = "Core Infrastructure"
language = "shell"
visibility = "public"
depends_on = []
provides = ["hub", "registry", "coordination", "component-scaffold"]

# ── Tier 0: platform ─────────────────────────────────────────────────────────
[[component]]
name = "SigmaOS-ISO"
description = "Archiso live-ISO pipeline: archiso profile, installer payload, QEMU boot verification, release publishing"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS-ISO"
engine = "archiso"
category = "Platform"
language = "shell"
visibility = "public"
depends_on = []
provides = ["live-iso", "installer-payload", "boot-verification"]

[[component]]
name = "SigmaOS-kernel"
description = "SigmaOS kernel core: scheduler, VFS, syscall gate, memory, plus the migrated Rust module tree (desktop, filesystem, network, security research modules)"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS-kernel"
engine = "rust"
category = "Platform"
language = "rust"
visibility = "public"
depends_on = []
provides = ["kernel", "scheduler", "vfs", "syscall-gate", "memory"]

# ── Tier 1: system services ──────────────────────────────────────────────────
[[component]]
name = "SigmaOS-system"
description = "System services layer: init, service management, and OS-level primitives"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS-system"
engine = "rust"
category = "System Services"
language = "rust"
visibility = "public"
depends_on = ["SigmaOS-kernel"]
provides = ["init", "service-management"]

[[component]]
name = "SigmaOS-network"
description = "Networking stack: TCP/IP, TLS, mDNS discovery"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS-network"
engine = "rust"
category = "System Services"
language = "rust"
visibility = "public"
depends_on = ["SigmaOS-kernel"]
provides = ["tcp-ip", "tls", "mdns"]

[[component]]
name = "SigmaOS-security"
description = "Privilege separation, mandatory access control (MAC) policy engine, and CVE vulnerability auditor"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS-security"
engine = "rust"
category = "System Services"
language = "rust"
visibility = "public"
depends_on = ["SigmaOS-kernel"]
provides = ["privilege-separation", "mac-policy", "cve-audit"]

# ── Tier 2: user-facing components ───────────────────────────────────────────
[[component]]
name = "SigmaOS-desktop"
description = "Wayland compositor shell & desktop primitives (Hyprland-based live desktop configs)"
