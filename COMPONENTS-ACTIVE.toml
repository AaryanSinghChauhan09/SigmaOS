# Archived Components (Reference Only)
# The following 84 repositories have been archived following OPTIMISE FOR DELETION
# and CONSOLIDATE GITHUB REPOS OF SIMILAR COMPONENTS principles.
# See docs/wiki/Consolidation-Plan.md for detailed archive reasons.

# Theme duplicates (4) → SigmaOS-themes
# apt/dpkg violations (4) → violates Arch-based architecture
# Consolidated components (15) → merged into canonical repos
# Arch infrastructure placeholders (65) → use official Arch
# Application-level repos (4) → not core OS components
# CLI scaffold (1) → SigmaOS-dev
