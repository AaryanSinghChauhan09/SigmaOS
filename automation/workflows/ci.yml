name: "Σ SigmaOS CI/CD — Rust Workspace + C Shards + Smart Triggers"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Detect Changes ──────────────────────────────────────────────────────────
  detect:
    name: "Change Detection"
    runs-on: ubuntu-latest
    outputs:
      rust:   ${{ steps.f.outputs.rust }}
      kernel: ${{ steps.f.outputs.kernel }}
      web_ui: ${{ steps.f.outputs.web_ui }}
      tools:  ${{ steps.f.outputs.tools }}
      docs:   ${{ steps.f.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            rust:
              - 'shards/**'
              - 'core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            kernel:
              - 'kernel/**'
              - 'include/**'
              - 'Makefile'
            web_ui:
              - 'web_ui/**'
              - 'gui/**'
            tools:
              - 'tools/**'
              - 'cli/**'
              - 'sigmactl.py'
            docs:
              - 'docs/**'
              - 'WIKI/**'
              - '*.md'

  # ── Rust Workspace Build & Native Tests ──────────────────────────────────────
  rust_build:
    name: "Rust Workspace (Build & Native Tests)"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --release
      - name: Run native integration tests
        run: cargo test -p sigma-cli --test integration
      - name: Clippy lint
        run: cargo clippy --workspace -- -D warnings
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sigma-rust-bins
          path: target/release/sigma-*
          retention-days: 3

  # ── C Kernel Build ──────────────────────────────────────────────────────────
  kernel_build:
    name: "C11 Kernel Shards"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.kernel == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-x86-64-linux-gnu nasm cppcheck
      - name: Build shards
        run: bash automation/scripts/build.sh kernel/suites
      - name: cppcheck static analysis
        run: cppcheck --enable=all --std=c11 -I./include --error-exitcode=0 kernel/suites/ 2>&1 | tail -30


  # ── GUI / Web Lint ──────────────────────────────────────────────────────────
  web_lint:
    name: "Zenith UI Audit"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.web_ui == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          COUNT=$(ls web_ui/scripts/modules/*.js | wc -l)
          echo "UI Modules: $COUNT"
          [ "$COUNT" -ge 30 ] || echo "::warning::Module count below expected"

  # ── Security Gate ────────────────────────────────────────────────────────────
  security:
    name: "Security Gate"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.kernel == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Zero foreign-file policy
        run: |
          COUNT=$(find kernel/suites -name "*.py" -o -name "*.js" 2>/dev/null | wc -l)
          [ "$COUNT" -eq 0 ] && echo "[PASS] No foreign files" || (echo "[FAIL] Foreign files in kernel" && exit 1)

  # ── Semantic Release ────────────────────────────────────────────────────────
  release:
    name: "Semantic Release & Changelog"
    runs-on: ubuntu-latest
    needs: [rust_build, kernel_build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure git
        run: |
          git config user.name "sigma-bot"
          git config user.email "bot@sigmaos.dev"
      - name: Run semantic release script
        run: bash automation/scripts/release.sh || echo "No new commits to release"
