name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Check formatting
      run: |
        if [ -f Cargo.toml ]; then
          cargo fmt -- --check
        fi
    
    - name: Run Clippy
      run: |
        if [ -f Cargo.toml ]; then
          cargo clippy -- -D warnings
        fi
