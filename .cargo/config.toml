# SigmaOS Cargo Configuration
# ────────────────────────────────────────────────────────────────────────────
# This file controls project-level cargo behaviour.
# It is NOT committed to git (see .gitignore) and is generated by setup.sh.
#
# RATIONALE: SigmaOS is a ~1M-LOC single-crate workspace. Parallel rustc
# codegen-unit compilation is extremely RAM-hungry. On 16 GiB machines the
# default "all cores, 16 CGUs" configuration causes SIGKILL (OOM) during
# `cargo test --lib`.
#
# SOLUTION: Limit parallel rustc *jobs* to half the CPU count so each rustc
# invocation gets more headroom. The [profile.test] in Cargo.toml further
# forces codegen-units=1 for the test harness build.
# ────────────────────────────────────────────────────────────────────────────

[build]
# Use half the available CPUs for parallel compilation jobs.
# Prevents OOM on 16 GiB machines when building the ~1M-LOC codebase.
jobs = 8

[net]
retry = 3

[term]
quiet = false
verbose = false

[profile.dev]
# Inherit Cargo.toml settings; nothing extra needed here.

[profile.test]
# Codegen-units already forced to 1 in Cargo.toml to prevent OOM.
# Adding RUSTFLAGS to reduce debug info size on test builds.
