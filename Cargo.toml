[package]
name = "sigmaos"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Team"]
description = "SigmaOS - Sovereign, AI-Native Operating System"
license = "MIT OR GPL-2.0"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS"

[dependencies]
# Zero external C dependencies for kernel space

[dev-dependencies]
# Test dependencies

[features]
# 3-Tier Architecture Feature Gates
default = ["kernel-tier", "services-tier"]

# Tier 1: Core Kernel (no_std)
kernel-tier = []

# Tier 2: Core OS Services
services-tier = [
    "kernel-tier",
    "filesystem",
    "ipc",
    "networking",
    "security",
]

# Tier 3: Userland, Desktop, AI & Virtualization
full = [
    "services-tier",
    "userland",
    "desktop",
    "ai",
    "virtualization",
]

# Individual Subsystems
filesystem = []
ipc = []
networking = []
security = []
userland = []
desktop = []
ai = []
virtualization = []

# Legacy feature compatibility flags
core-build = ["kernel-tier"]
full-build = ["full"]
microkernel = ["core-shards"]
core-shards = []
rtos = ["realtime"]
realtime = []
cloud = ["cloud-init"]
cloud-init = []
wasm = []
browser = ["wasm"]

# Storage & Performance Matrix features
cache-lfu = []
cache-arc = []
jemalloc = []
mimalloc = []
scheduler-eevdf = []
scheduler-bore = []
lock-free = []
mutex = []
rwlock = []
io-sequential = []
io-random = []
io-mmap = []

# Security Hardening Matrix features
landlock-v4 = []
pledge = []
capsicum = []
seccomp-strict = []
smack = []

# Desktop Environment features
gnome = []
kde = []
xfce = []
mate = []
lxqt = []
enlightenment = []
wayland = []
mir = []
x11 = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(custom_alloc_error_handler)',
    'cfg(standalone_test)',
    'cfg(feature, values("cache-lru", "cache-lfu", "cache-arc", "jemalloc", "mimalloc", "scheduler-eevdf", "scheduler-bore", "lock-free", "mutex", "rwlock", "io-sequential", "io-random", "io-mmap"))'
] }

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "sigma_kernel"
path = "src/kernel/main.rs"
test = false
required-features = ["microkernel"]

[[bin]]
name = "sovereign_edition_builder"
path = "tools/build/SovereignEditionBuilder.rs"

[[bin]]
name = "sigma_make"
path = "tools/build/sigma_make.rs"

[[bin]]
name = "sigmaos_setup_wizard"
path = "tools/build/SigmaOSSetupWizard.rs"
test = false
required-features = ["microkernel"]
