[package]
name = "sigmaos"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Team"]
description = "SigmaOS - Sovereign, AI-Native Operating System"
license = "MIT OR GPL-2.0"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS"

[dependencies]
# Core dependencies (minimal as per SigmaOS philosophy)

[dev-dependencies]
# Test dependencies

[features]
default = []
desktop = []
drivers = []
ai = []
microkernel = ["core-shards"]
core-shards = []
rtos = ["realtime"]
realtime = []
cloud = ["cloud-init"]
cloud-init = []
wasm = []
browser = ["wasm"]
# Build features
core-build = []  # Core kernel components (VFS, Process, Network)
full-build = ["core-build"]  # Full build with all modules
# Opt-in feature consumed by src/klib/custom_allocator.rs via cfg(feature = "...").
custom_alloc_error_handler = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(custom_alloc_error_handler)'] }

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "sigma_kernel"
path = "src/kernel/main.rs"
test = false
required-features = ["microkernel"]

[[bin]]
name = "sovereign_edition_builder"
path = "tools/build/SovereignEditionBuilder.rs"

[[bin]]
name = "sigma_make"
path = "tools/build/sigma_make.rs"

[[bin]]
name = "sigmaos_setup_wizard"
path = "tools/build/SigmaOSSetupWizard.rs"
test = false
required-features = ["microkernel"]
