[workspace]
resolver = "2"
members = [
    "kabi",
    "kernel",
    "meta/config",
    "sdk/driver",
    "sigma-sh",
    "suites/S03_Orchestrator",
    "tools",
    "tools/sigma-cli-bin",
    "userland/agent",
    "userland/coreutils",
    "userland/sigpkg",
    "sigma_pkg_registry",
    "userland/system_api/control_center",
    "userland/system_api/ai_integration",
    "userland/system_api/dev_studio",
    "userland/ui/design_system",
    "userland/system_api/common",
]

[workspace.package]
version     = "15.0.0"
authors     = ["SigmaOS Project"]
edition     = "2021"
license     = "MIT"
repository  = "https://github.com/AaryanSinghChauhan09/SigmaOS"

[workspace.dependencies]
# No third-party crates in kernel — all dependencies are sigma-* internal

[profile.dev]
opt-level    = 1
debug        = true
overflow-checks = true

[profile.release]
opt-level  = "z"     # size-optimised
lto        = true
codegen-units = 1
strip      = "symbols"
panic      = "abort"

[profile.kernel]
inherits   = "release"
opt-level  = "s"
debug      = false
