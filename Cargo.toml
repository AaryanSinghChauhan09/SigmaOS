[package]
name = "sigmaos"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Team"]
description = "SigmaOS - Sovereign, AI-Native Operating System"
license = "MIT OR GPL-2.0"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS"

[dependencies]
# Core dependencies (minimal as per SigmaOS philosophy)

[dev-dependencies]
# Test dependencies

[features]
default = []
desktop = []
drivers = []
ai = []
microkernel = ["core-shards"]
core-shards = []
rtos = ["realtime"]
realtime = []
cloud = ["cloud-init"]
cloud-init = []
wasm = []
browser = ["wasm"]
test_disabled = []
# Build features
core-build = []  # Core kernel components (VFS, Process, Network)
full-build = ["core-build"]  # Full build with all modules
# Opt-in feature consumed by src/klib/custom_allocator.rs via cfg(feature = "...").
custom_alloc_error_handler = []
standalone_test = []
# Storage & Performance Matrix features
cache-lfu = []
cache-arc = []
jemalloc = []
mimalloc = []
scheduler-eevdf = []
scheduler-bore = []
lock-free = []
mutex = []
rwlock = []
io-sequential = []
io-random = []
io-mmap = []

# Security Hardening Matrix features
landlock-v4 = []
pledge = []
capsicum = []
seccomp-strict = []
smack = []

# Desktop environment features
gnome = []
kde = []
xfce = []
mate = []
lxqt = []
enlightenment = []
wayland = []
mir = []
x11 = []

# Storage & Performance matrix features
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(custom_alloc_error_handler)',
    'cfg(standalone_test)',
    'cfg(feature, values("cache-lru", "cache-lfu", "cache-arc", "jemalloc", "mimalloc", "scheduler-eevdf", "scheduler-bore", "lock-free", "mutex", "rwlock", "io-sequential", "io-random", "io-mmap"))'
] }

# ---------------------------------------------------------------------------
# Build performance profiles
#
# SigmaOS is a ~1M-LOC zero-dependency crate, so build time is dominated by the
# workspace itself. These profiles are tuned for that reality:
#   * dev          : opt-level 1 + line-tables-only debug info -> dramatically
#                    faster linking & test runs with negligible compile cost.
#   * release      : maximum performance (fat LTO, 1 CGU) for final artifacts.
#   * release-fast : thin LTO + 16 CGUs -> ~90% of release perf at a fraction
#                    of the compile time, for daily benchmarking workflows.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true
panic = "abort"

# Tests inherit dev; keep assertions but shed full DWARF for faster linking.
[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Fast iteration profile: `cargo build --profile release-fast`
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
strip = "debuginfo"

# Benchmarks run with thin LTO so numbers stay representative without the
# full release-build cost.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"

[[bin]]
name = "sigma_kernel"
path = "src/kernel/main.rs"
test = false
required-features = ["microkernel"]

[[bin]]
name = "sovereign_edition_builder"
path = "tools/build/SovereignEditionBuilder.rs"

[[bin]]
name = "sigma_make"
path = "tools/build/sigma_make.rs"

[[bin]]
name = "sigmaos_setup_wizard"
path = "tools/build/SigmaOSSetupWizard.rs"
test = false
required-features = ["microkernel"]
