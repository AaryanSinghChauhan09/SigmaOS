[workspace]
resolver = "2"
members = [
    "kabi",
    "kernel",
    "sdk/driver",
    "sigma-sh",
    "suites/S03_Orchestrator",
    "userland/agent",
    "userland/coreutils",
    "userland/sigpkg",
    "sigma_pkg_registry",
    "userland/system_api/control_center",
    "userland/system_api/ai_integration",
    "userland/system_api/dev_studio",
    "userland/ui/design_system",
    "userland/system_api/common",
]
default-members = ["kernel"]

[profile.dev]
opt-level    = 1
debug        = true
overflow-checks = true
panic        = "abort"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
