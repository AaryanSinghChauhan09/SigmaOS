[workspace]
resolver = "2"
members = [
    "kabi",
    "kernel",
    "sdk/driver",
    "sigma-sh",
    "suites/S03_Orchestrator",
    "userland/agent",
    "userland/coreutils",
    "userland/sigpkg",
    "sigma_pkg_registry",
    "userland/system_api/control_center",
    "userland/system_api/ai_integration",
    "userland/system_api/dev_studio",
    "userland/ui/design_system",
    "userland/system_api/common",
]
default-members = ["kernel"]

[dependencies]
# Core dependencies (minimal as per SigmaOS philosophy)
uuid = { version = "1.4", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
# Test dependencies

[features]
default = []
desktop = []
drivers = []
ai = []
microkernel = ["core-shards"]
core-shards = []
rtos = ["realtime"]
realtime = []
cloud = ["cloud-init"]
cloud-init = []
wasm = []
browser = ["wasm"]

[profile.dev]
opt-level    = 1
debug        = true
overflow-checks = true
panic        = "abort"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "sigma_kernel"
path = "src/kernel/main.rs"
test = false
required-features = ["microkernel"]

[[bin]]
name = "sigma_drivers"
path = "src/drivers/main.rs"
test = false
required-features = ["microkernel"]

[[bin]]
name = "sigma_userspace"
path = "src/userspace/main.rs"
test = false
required-features = ["microkernel"]
