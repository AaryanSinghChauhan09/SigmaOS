# SigmaOS GRUB Configuration
# Boot configuration for SigmaOS

set timeout=5
set default=0

menuentry "SigmaOS" {
    linux /boot/vmlinuz quiet splash
    initrd /boot/initramfs.img
}

menuentry "SigmaOS (Recovery Mode)" {
    linux /boot/vmlinuz single
    initrd /boot/initramfs.img
}

menuentry "SigmaOS (Verbose)" {
    linux /boot/vmlinuz
    initrd /boot/initramfs.img
}
