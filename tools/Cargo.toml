# Cargo workspace for SigmaOS tooling
# This allows 'cargo build/test/fmt/clippy' to work from the tools/ directory

[workspace]
members = ["sigma-cli-bin", "sigma-format", "sigma-lint"]

[workspace.package]
version    = "15.0.0"
edition    = "2021"
license    = "GPL-2.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS"
