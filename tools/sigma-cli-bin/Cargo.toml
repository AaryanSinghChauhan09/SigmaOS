[package]
name        = "sigma-cli"
version     = "15.0.0"
edition     = "2021"
description = "SigmaOS Sovereign Unified Command-Line Orchestrator"
license     = "GPL-2.0-or-later"
repository  = "https://github.com/AaryanSinghChauhan09/SigmaOS"

[[bin]]
name = "sigma"
path = "../sigma-cli.rs"

[profile.release]
opt-level    = 3
lto          = true
strip        = true
codegen-units = 1
