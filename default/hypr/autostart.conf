# SigmaOS Hyprland autostart
# Inspired by Omarchy 4.0.5 default/hypr/autostart.lua

# Start the bar.
exec-once = waybar

# Start the notification daemon.
exec-once = mako

# Start the policy kit agent.
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Restore wallpaper.
exec-once = swww restore

# Start the clipboard daemon.
exec-once = sigmaos-clipboard-daemon

# Start the reminder daemon.
exec-once = sigmaos-reminderd

# Start the audio daemon.
exec-once = wireplumber

# Start the power manager.
exec-once = sigmaos-power-manager
