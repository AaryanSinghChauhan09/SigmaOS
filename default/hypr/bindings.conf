# SigmaOS Hyprland keybindings
# Inspired by Omarchy 4.0.5 default/hypr/bindings.lua

# Launcher.
bind = $MOD SHIFT, D, exec, wofi --show drun

# Screenshot tools.
bind = $MOD, Print, exec, sigmaos-capture-screenshot
bind = $MOD SHIFT, Print, exec, sigmaos-capture-region
bind = $MOD, F9, exec, sigmaos-capture-screenrecording

# Brightness controls.
bind = $MOD, F11, exec, brightnessctl s 10%-
bind = $MOD, F12, exec, brightnessctl s 10%+

# Volume controls.
bind = $MOD, F10, exec, pamixer -t
bind = $MOD SHIFT, F11, exec, pamixer -d 5
bind = $MOD SHIFT, F12, exec, pamixer -i 5

# Toggle bar.
bind = $MOD SHIFT, B, exec, pkill -USR1 waybar

# ============================================================================
# Device toggles
# ============================================================================
bind = $MOD, XF86TouchpadToggle, exec, hyprctl keyword input:touchpad:no_touchpad_toggle true
bind = $MOD, XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
