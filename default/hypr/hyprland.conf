# SigmaOS Hyprland configuration
# Inspired by Omarchy 4.0.5 default/hypr/
# This is the window manager configuration for the SigmaOS desktop session.

# ============================================================================
# Environment variables
# ============================================================================
env = XCURSOR_SIZE,24
env = TERMINAL,foot
env = BROWSER,chromium
env = EDITOR,micro
env = FILE_MANAGER,nautilus
env = MOD,SUPER

# ============================================================================
# Appearance
# ============================================================================
general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(c792eaee) rgba(00000000) 0 deg
	col.inactive_border = rgba(595959aa) rgba(00000000) 0 deg
	col.active_border_gradient = rgba(c792eaee)
	col.inactive_border_gradient = rgba(595959aa)
	layout = dwindle
	# Floating window border size override.
	floating_border_size = 2
}

decoration {
	rounding = 10
	blur = yes
	blur_size = 8
	blur_passes = 7
	blur_new_optimizations = yes
	active_opacity = 1.0
	inactive_opacity = 0.95
	active_opacity_override = no
	inactive_opacity_override = no
	# Drop shadow for depth (DISCOVERABILITY: visual depth cues).
	drop_shadow = yes
	shadow_range = 4
	shadow_render_power = 3
	col.shadow = rgba(1a1a1aee)
}

# ============================================================================
# Input
# ============================================================================
input {
	follow_mouse = yes
	mouse_move = $MOD
	mouse_resize = $MOD shift
	mouse_resize_corner = false
	touchpad {
		natural_scroll = no
		tap-button = lr
		clickfinger behavior = none
		scroll_factor = 1
		tap_and_drag = yes
		tap_and_drag_lock = false
	}
	keyboard {
		repeat_rate = 25
		repeat_delay = 250
		nb_xkb = 1
		xkb_model = pc105
		xkb_layout = us
		xkb_options = caps:escape
	}
	# Swallow popups that don't want decorations.
	xcursor_theme = Bibata-Modern-Ice
	xcursor_size = 24
}

# ============================================================================
# Autostart
# ============================================================================
# Start the bar and notification daemon.
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = bluetooth-applet

# ============================================================================
# Keybindings (LEAST ASTONISHMENT: standard Hyprland-style bindings)
# ============================================================================
# Kill active window.
bind = $MOD SHIFT, Q, exec, hyprctl kill

# Launch terminal.
bind = $MOD, Return, exec, $TERMINAL

# Launch launcher (wofi/rofi).
bind = $MOD, D, exec, wofi --show drun

# Launch file manager.
bind = $MOD, E, exec, $FILE_MANAGER

# Launch browser.
bind = $MOD, B, exec, $BROWSER

# Screenshot / capture (SigmaOS capture subsystem).
bind = $MOD, S, exec, sigmaos-capture-screenshot
bind = $MOD SHIFT, S, exec, sigmaos-capture-region

# Layout toggles.
bind = $MOD, R, exec, hyprctl dispatch togglesplit
bind = $MOD SHIFT, R, exec, hyprctl dispatch togglefloating

# Focus movement (vim-style).
bind = $MOD, left, movefocus, l
bind = $MOD, down, movefocus, d
bind = $MOD, up, movefocus, u
bind = $MOD, right, movefocus, r

# Move windows.
bind = $MOD SHIFT, left, movewindow, l
bind = $MOD SHIFT, down, movewindow, d
bind = $MOD SHIFT, up, movewindow, u
bind = $MOD SHIFT, right, movewindow, r

# Workspace navigation.
bind = $MOD, 1, workspace, 1
bind = $MOD, 2, workspace, 2
bind = $MOD, 3, workspace, 3
bind = $MOD, 4, workspace, 4
bind = $MOD, 5, workspace, 5
bind = $MOD, 6, workspace, 6
bind = $MOD, 7, workspace, 7
bind = $MOD, 8, workspace, 8
bind = $MOD, 9, workspace, 9
bind = $MOD, 0, workspace, 10

# Move window to workspace.
bind = $MOD SHIFT, 1, movetoworkspace, 1
bind = $MOD SHIFT, 2, movetoworkspace, 2
bind = $MOD SHIFT, 3, movetoworkspace, 3
bind = $MOD SHIFT, 4, movetoworkspace, 4
bind = $MOD SHIFT, 5, movetoworkspace, 5
bind = $MOD SHIFT, 6, movetoworkspace, 6
bind = $MOD SHIFT, 7, movetoworkspace, 7
bind = $MOD SHIFT, 8, movetoworkspace, 8
bind = $MOD SHIFT, 9, movetoworkspace, 9
bind = $MOD SHIFT, 0, movetoworkspace, 10

# Special workspace.
bind = $MOD, C, togglespecialworkspace, magic

# Scratchpad.
bind = $MOD SHIFT, C, movetoworkspace, special:magic

# Fullscreen / floating toggles.
bind = $MOD, F, fullscreen, 1
bind = $MOD SHIFT, F, togglefloating, 1

# Exit Hyprland.
bind = $MOD SHIFT, E, exec, hyprctl dispatch exit

# ============================================================================
# Window rules
# ============================================================================
# Center floating dialogs.
windowrule = float, ^(pavucontrol|nm-applet|blueman-manager)$
windowrule = noplan, ^(pavucontrol|nm-applet|blueman-manager)$

