# SigmaOS WirePlumber audio configuration
# Inspired by Omarchy 4.0.5 default/wireplumber/

# Context properties for the default audio node.
context.properties = {
    # Default sink and source are selected by the user via the settings panel.
    # WirePlumber respects the session's default-sink/source.
}

# Enable Lua scripting for advanced routing.
lua.enabled = true

# Default node configuration.
# These set secure defaults: no mute on startup, volume at 60%.
node.default-rules = [
    {
        matches = [
            {
                node.name = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            }
        ],
        actions = {
            update-props = {
                node.description = "Built-in Audio"
                media.class = "Audio/Sink"
                audio.position = "FL,FR"
            }
        }
    }
]

# Enable Bluetooth audio support.
bluez5.enabled = true
