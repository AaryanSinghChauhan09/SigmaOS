# SigmaOS foot terminal configuration
# Inspired by Omarchy 4.0.5 default/foot/

[font]
# Default font family. Change to your preferred font.
family = JetBrainsMono Nerd Font
# Fallback fonts for glyph coverage.
fallback = Symbola,Noto Color Emoji
size = 12

[colors]
# Default foreground / background.
foreground = cdd6f4
background = 1e1e2e

# Regular colors.
color0 = 1e1e2e   # black
color1 = f38ba8   # red
color2 = a6e3a1   # green
color3 = fab387   # yellow
color4 = 89b4fa   # blue
color5 = cba6f7   # purple
color6 = 94e2d5   # cyan
color7 = bac2de   # white

# Bright colors.
color8 = 585b70   # bright black
color9 = f38ba8   # bright red
color10 = a6e3a1  # bright green
color11 = fab387  # bright yellow
color12 = 89b4fa  # bright blue
color13 = cba6f7  # bright purple
color14 = 94e2d5  # bright cyan
color15 = bac2de  # bright white

# Cursor colors.
cursor = cdd6f4
cursor-text = 1e1e2e

# Selection colors.
selection-background = 585b70
selection-foreground = cdd6f4

# URLs are underlined and clickable (DISCOVERABILITY).
urls = true
url-color = 89b4fa
url-style = underlined

# Bell style (visual bell, no audio beep).
bell = visual

[mouse]
# Hide cursor while typing.
hide-when-typing = true
# Double-click interval in milliseconds.
double-click-interval = 500
# Triple-click interval in milliseconds.
triple-click-interval = 750
# Triple-click selects whole line.
triple-click-select-line = true

[selection]
# Selection clipboard.
clipboard = primary
clipboard = system

[keys]
# Copy / paste (LEAST ASTONISHMENT: standard bindings).
binding = ctrl+shift+c, copy_clipboard
binding = ctrl+shift+v, paste_clipboard
binding = ctrl+shift+v, paste_selection
# Font size.
binding = ctrl+plus, increase_font_size
binding = ctrl+minus, decrease_font_size
binding = ctrl+zero, reset_font_size
# New window / tab.
binding = ctrl+shift+n, new_window
binding = ctrl+shift+t, new_tab
binding = ctrl+shift+q, close

[search]
# Wrap around when searching.
wrap = true
# Case-sensitive by default.
case-sensitive = false

[spellcheck]
# Enable spell checking.
enable = false

[selection]
# Double-click selects word, triple-click selects line.
# (already configured in [mouse])
