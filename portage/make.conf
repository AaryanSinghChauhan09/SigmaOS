# /etc/portage/make.conf - SigmaOS Optimized Gentoo Compilation Flags
COMMON_FLAGS="-O3 -pipe -march=x86-64-v3 -flto=auto"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C opt-level=3 -C target-cpu=x86-64-v3"
MAKEOPTS="-j$(nproc)"
USE="wayland pipewire zstd lto pgo vulkan btrfs hardened -X -gnome -kde"
ACCEPT_LICENSE="*"
GRUB_PLATFORMS="efi-64 pc"
