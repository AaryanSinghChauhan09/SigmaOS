<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SigmaOS Personalisation Hub</title>
  <meta name="description" content="Sovereign configuration and visual settings layer for SigmaOS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Theme provider wraps the entire application -->
  <div id="app-root" class="app-root">
    <!-- Main Shell Layout -->
    <div id="sidebar-container"></div>
    
    <main class="main-content" id="main-content">
      <div class="content-body" id="content-body">
        <!-- Render page tabs here -->
      </div>
      
      <aside class="preview-sidebar" id="preview-sidebar">
        <!-- Render Live Preview panel here -->
      </aside>
    </main>
  </div>

  <!-- Toast notification system -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Script Modules -->
  <script type="module" src="app.js"></script>
</body>
</html>
