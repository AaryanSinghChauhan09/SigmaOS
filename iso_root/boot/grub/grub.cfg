# SigmaOS GRUB Configuration
# Inspired by Arch Linux ISO structure

set timeout=10
set default=0

# Set default resolution
set gfxpayload=keep
set gfxmode=auto

# SigmaOS Boot Entries
menuentry "SigmaOS v29.0 Zenith Foundation (Boot)" {
    multiboot2 /boot/sigmaos.bin
    boot
}

menuentry "SigmaOS v29.0 Zenith Foundation (Safe Mode)" {
    multiboot2 /boot/sigmaos.bin single
    boot
}

menuentry "SigmaOS v29.0 Zenith Foundation (Verbose)" {
    multiboot2 /boot/sigmaos.bin loglevel=7
    boot
}

menuentry "SigmaOS v29.0 Zenith Foundation (Debug)" {
    multiboot2 /boot/sigmaos.bin debug=1
    boot
}

# System Tools
menuentry "System Information" {
    echo "SigmaOS v29.0 Zenith Foundation"
    echo "Architecture: x86_64"
    echo "Kernel: Sovereign Microkernel"
    echo "Boot Mode: Multiboot2"
    echo ""
    echo "Press any key to return to menu..."
    read
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off System" {
    halt
}
