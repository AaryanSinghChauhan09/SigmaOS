# SigmaOS GRUB Configuration
# SPDX-License-Identifier: MIT

set timeout=5
set default=0

menuentry "SigmaOS v16.0 Apex (UEFI)" {
    multiboot2 /boot/sigma-kernel.elf
    boot
}

menuentry "SigmaOS v16.0 Apex (UEFI - Safe Mode)" {
    multiboot2 /boot/sigma-kernel.elf safe_mode=1
    boot
}

menuentry "SigmaOS v16.0 Apex (UEFI - Debug)" {
    multiboot2 /boot/sigma-kernel.elf debug=1 serial=1
    boot
}
