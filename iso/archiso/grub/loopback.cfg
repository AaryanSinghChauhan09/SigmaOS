# Loopback configuration for booting SigmaOS ISO directly from disk image
menuentry "SigmaOS Arch Linux (Loopback)" {
    set gfxpayload=keep
    linux /sigmaos/boot/x86_64/vmlinuz-linux img_dev=$img_dev img_loop=$iso_path archisobasedir=sigmaos archisolabel=SIGMAOS_LIVE
    initrd /sigmaos/boot/intel-ucode.img /sigmaos/boot/amd-ucode.img /sigmaos/boot/x86_64/initramfs-linux.img
}
