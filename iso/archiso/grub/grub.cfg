# GRUB configuration for SigmaOS Arch Linux Live ISO
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod font

set default="0"
set timeout=15

search --no-floppy --set=root --label "%ARCHISO_LABEL%"

menuentry "SigmaOS Arch Linux live medium (x86_64, UEFI/GRUB, Hyprland)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /sigmaos/boot/x86_64/vmlinuz-linux archisobasedir=sigmaos archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G quiet splash
    initrd /sigmaos/boot/intel-ucode.img /sigmaos/boot/amd-ucode.img /sigmaos/boot/x86_64/initramfs-linux.img
}

menuentry "SigmaOS Arch Linux (copy to RAM, all in memory)" --class arch --class gnu-linux {
    set gfxpayload=keep
    linux /sigmaos/boot/x86_64/vmlinuz-linux archisobasedir=sigmaos archisolabel=%ARCHISO_LABEL% copytoram=y cow_spacesize=4G quiet
    initrd /sigmaos/boot/intel-ucode.img /sigmaos/boot/amd-ucode.img /sigmaos/boot/x86_64/initramfs-linux.img
}

menuentry "SigmaOS Arch Linux with Speech (accessibility)" --class arch {
    set gfxpayload=keep
    linux /sigmaos/boot/x86_64/vmlinuz-linux archisobasedir=sigmaos archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G accessibility=on
    initrd /sigmaos/boot/intel-ucode.img /sigmaos/boot/amd-ucode.img /sigmaos/boot/x86_64/initramfs-linux.img
}

menuentry "UEFI Firmware Settings" --id 'uefi-firmware' {
    fwsetup
}

menuentry "System Shutdown" --class shutdown {
    halt
}

menuentry "System Reboot" --class reboot {
    reboot
}
