# /etc/pacman.conf - SigmaOS Arch Linux Distribution Configuration
[options]
HoldPkg     = pacman glibc linux sigmaos-base
Architecture = x86_64
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
