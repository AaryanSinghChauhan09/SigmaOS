UI boot/syslinux/vesamenu.c32
PROMPT 0
TIMEOUT 150

MENU TITLE SigmaOS Arch Linux Live Environment
MENU BACKGROUND boot/syslinux/splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033b5e5 #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL arch64
MENU LABEL SigmaOS Arch Linux install medium (x86_64, BIOS)
LINUX /sigmaos/boot/x86_64/vmlinuz-linux
INITRD /sigmaos/boot/intel-ucode.img,/sigmaos/boot/amd-ucode.img,/sigmaos/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=sigmaos archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G quiet splash

LABEL arch64ram
MENU LABEL SigmaOS Arch Linux (Copy to RAM)
LINUX /sigmaos/boot/x86_64/vmlinuz-linux
INITRD /sigmaos/boot/intel-ucode.img,/sigmaos/boot/amd-ucode.img,/sigmaos/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=sigmaos archisolabel=%ARCHISO_LABEL% copytoram=y cow_spacesize=4G quiet

LABEL reboot
MENU LABEL Reboot System
COM32 boot/syslinux/reboot.c32

LABEL poweroff
MENU LABEL Power Off System
COM32 boot/syslinux/poweroff.c32
