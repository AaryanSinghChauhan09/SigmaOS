# SigmaOS Hyprland Configuration
# Sovereign Wayland Tiling Compositor Setup

# Monitor setup
monitor=eDP-1,1920x1080,0x0,1
monitor=,preferred,auto,1

# Input settings
input {
    kb_layout=us
    kb_variant=
    kb_model=
    kb_options=
    kb_rules=

    follow_mouse=1

    touchpad {
        natural_scroll=no
        disable_while_typing=1
        tap-to-click=1
    }

    sensitivity=0
    force_no_accel=1
}

# General settings
general {
    gaps_in=5
    gaps_out=20
    border_size=2
    col.active_border=rgba(7aa2f7ee)
    col.inactive_border=rgba(414868ee)

    layout=dwindle
    allow_tearing=0
}

# Decoration
decoration {
    rounding=10
    blur {
        enabled=yes
        size=3
        passes=2
    }

    drop_shadow=yes
    shadow_range=4
    shadow_render_power=3
    col.shadow=rgba(1a1b26ee)
}

# Animations
animations {
    enabled=yes
    bezier=easeOutQuint,0.23,1,0.32,1
    bezier=linear,0,0,1,1

    animation=windows,1,7,easeOutQuint
    animation=windowsOut,1,7,easeOutQuint,slide
    animation=border,1,10,linear
    animation=borderangle,1,10,linear
    animation=fade,1,10,default
    animation=workspaces,1,6,easeOutQuint,slide
}

# Dwindle layout
dwindle {
    pseudotile=0
    preserve_split=0
    smart_split=0
    smart_resizing=1
}

# Master layout
master {
    new_status=master
    new_on_top=0
    orientation=right
    no_gaps_when_only=0
}

# Gestures
gestures {
    workspace_swipe=yes
    workspace_swipe_fingers=3
}

# Per-device config
device:epson-m5379:epson-5379 {
    sensitivity=-0.5
}

# Keybinds
$mainMod=SUPER

bindm=$mainMod,mouse:272,movewindow
bindm=$mainMod,mouse:273,resizewindow

bind=$mainMod,RETURN,exec,foot
bind=$mainMod,Q,killactive
bind=$mainShift,Q,killactive,
bind=$mainMod,M,exit
bind=$mainMod,E,exec,thunar
bind=$mainMod,V,togglefloating
bind=$mainMod,SPACE,togglesplit
bind=$mainMod,P,pseudo
bind=$mainMod,J,togglesplit
bind=$mainMod,F,fullscreen

# Move focus
bind=$mainMod,left,movefocus,l
bind=$mainMod,right,movefocus,r
bind=$mainMod,up,movefocus,u
bind=$mainMod,down,movefocus,d

# Move window
bind=$mainShift,left,movewindow,l
bind=$mainShift,right,movewindow,r
bind=$mainShift,up,movewindow,u
bind=$mainShift,down,movewindow,d

# Resize window
bind=$mainCtrl,UP,resizewindow,0,-10
bind=$mainCtrl,DOWN,resizewindow,0,10
bind=$mainCtrl,LEFT,resizewindow,-10,0
bind=$mainCtrl,RIGHT,resizewindow,10,0

# Media keys
bind=,XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=,XF86AudioMute,exec,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=,XF86AudioPlay,exec,playerctl play-pause
bind=,XF86AudioNext,exec,playerctl next
bind=,XF86AudioPrev,exec,playerctl previous

# Workspace bindings
bind=$mainMod,1,workspace,1
bind=$mainMod,2,workspace,2
bind=$mainMod,3,workspace,3
bind=$mainMod,4,workspace,4
bind=$mainMod,5,workspace,5
bind=$mainMod,6,workspace,6
bind=$mainMod,7,workspace,7
bind=$mainMod,8,workspace,8
bind=$mainMod,9,workspace,9
bind=$mainMod,0,workspace,10

bind=$mainShift,1,movetoworkspace,1
bind=$mainShift,2,movetoworkspace,2
bind=$mainShift,3,movetoworkspace,3
bind=$mainShift,4,movetoworkspace,4
bind=$mainShift,5,movetoworkspace,5
bind=$mainShift,6,movetoworkspace,6
bind=$mainShift,7,movetoworkspace,7
bind=$mainShift,8,movetoworkspace,8
bind=$mainShift,9,movetoworkspace,9
bind=$mainShift,0,movetoworkspace,10

bind=$mainMod,mouse_down,workspace,e+1
bind=$mainMod,mouse_up,workspace,e-1

# Screenshot
bind=$mainMod,S,exec,hyprshot -m window
bind=$mainShift,S,exec,hyprshot -m output

# Launcher
bind=$mainMod,D,exec,rofi -show drun

# Window rules
windowrule=float,^(pavucontrol)$
windowrule=float,^(blueman-manager)$
windowrule=float,^(nm-connection-editor)$
windowrule=size 50% 50%,^(pavucontrol)$
windowrule=center,^(pavucontrol)$

# Startup
exec-once=waybar
exec-once=hyprpaper
exec-once=hypridle
exec-once=dunst
exec-once=wl-paste --type text --watch cliphist store
exec-once=~/.config/hypr/autostart.sh
