# SigmaOS Hypridle configuration — idle lock & DPMS.
# Secure default: lock the session after 5 min idle, turn the display
# off after 10 min, wake on input.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
}

# Lock the session after 5 minutes without input.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the display off after 10 minutes idle.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
}

# Restore the display as soon as there is input again.
listener {
    on-resume = hyprctl dispatch dpms on
}
