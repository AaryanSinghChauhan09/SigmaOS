# /etc/mkinitcpio.conf - SigmaOS Arch Linux Initramfs Generator Configuration
#
# MODULES are loaded before any boot hooks run. autodetect cannot work inside
# the archiso airootfs chroot (there is no real root block device), so every
# driver needed to locate and mount the live media must be listed explicitly.
#
# Only .ko modules belong here — ahci, sd_mod, virtio_blk, virtio_scsi,
# btrfs, zstd, etc. are built into the Arch kernel (=y) and need no entry.
MODULES=(
    # ATA/SATA host controllers not built into the kernel
    ata_piix ata_generic pata_acpi pata_oldpiix

    # CD-ROM / ISO9660 media access (required by archiso_loop_mnt)
    sr_mod cdrom isofs

    # USB mass storage (USB keys/drives)
    usb-storage uas

    # NVMe over fabrics & volume management
    nvme vmd

    # SD/eMMC cards
    mmc_core mmc_block

    # Device-mapper & loopback (archiso also adds these via its hook)
    loop dm-snapshot overlay
)
BINARIES=(/usr/bin/btrfs)
FILES=()
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard consolefont fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
