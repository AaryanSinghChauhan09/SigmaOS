<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS Customization Hub</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .panel {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #005f9e;
        }
    </style>
</head>
<body>

    <div class="header">Customization Hub - Zenith Desktop</div>

    <div class="panel">
        <h3>Theme Store</h3>
        <p>Browse and apply community themes.</p>
        <button class="btn" id="openThemeStoreBtn">Open Theme Store</button>
    </div>

    <div class="panel">
        <h3>Accessibility Options</h3>
        <p>Configure screen reader and high contrast modes.</p>
        <button class="btn" id="toggleScreenReaderBtn">Toggle Screen Reader</button>
    </div>

    <script src="sigma_theme_store.js"></script>
    <script src="accessibility/sigma_screen_reader.js"></script>
    <script>
        document.getElementById('openThemeStoreBtn').addEventListener('click', () => {
            ThemeStore.open();
        });

        document.getElementById('toggleScreenReaderBtn').addEventListener('click', () => {
            ScreenReader.toggle();
        });
    </script>
</body>
</html>
