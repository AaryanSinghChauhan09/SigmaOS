# SigmaOS Consolidated Component Suites Specification
# Authoritative architectural framework for multi-repository consolidation.
# Adheres to: Avoid Fragmentation, Maximise Cohesion, Minimise Coupling,
# Separation of Concerns, Single Responsibility, Uniform Access, Gall's Law, KISS, DRY.

[metadata]
version = "1.0.0"
updated = "2026-11-05"
description = "Target federation plan for SigmaOS; live registry coverage is checked by scripts/audit_consolidation.py"
status = "planned; constituent mappings require reconciliation against COMPONENTS.toml"
governance = "SigmaOS Architecture Authority"

# ==============================================================================
# SUITE 1: OFFICE & PRODUCTIVITY
# ==============================================================================
[suites.office]
canonical = "SigmaOS-office"
category = "Productivity & Documents"
tier = 3
description = "Consolidated productivity suite integrating word processing, spreadsheets, presentations, vector drawing, database frontends, and MathML rendering."
upstream = ["https://github.com/linuxmint/libreoffice-style-mint", "https://github.com/omacom/omawrite"]
consolidates = [
    "SigmaOS-genoffice",
    "SigmaOS-genoffice-docs",
    "SigmaOS-genoffice-html",
    "SigmaOS-genoffice-markdown",
    "SigmaOS-genoffice-pdf",
    "SigmaOS-genoffice-sheet",
    "SigmaOS-genoffice-slides",
    "SigmaOS-genoffice-tests",
    "SigmaOS-betteroffice-diagrams",
    "SigmaOS-betteroffice-documents",
    "SigmaOS-betteroffice-slides",
    "SigmaOS-betteroffice-spreadsheets",
    "SigmaOS-openoffice-base",
    "SigmaOS-openoffice-calc",
    "SigmaOS-openoffice-draw",
    "SigmaOS-openoffice-impress",
    "SigmaOS-openoffice-math",
    "SigmaOS-openoffice-writer",
    "SigmaOS-office-core",
    "SigmaOS-office-diagrams",
    "SigmaOS-office-documents",
    "SigmaOS-office-html",
    "SigmaOS-office-integration",
    "SigmaOS-office-interop",
    "SigmaOS-office-markdown",
    "SigmaOS-office-packaging",
    "SigmaOS-office-pdf",
    "SigmaOS-office-slides",
    "SigmaOS-office-spreadsheets",
    "SigmaOS-office-tests",
    "SigmaOS-office-web",
    "SigmaOS-onlyoffice",
