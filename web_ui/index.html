<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Zenith Dashboard | SigmaOS</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sentient-background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="mesh-grid"></div>
    </div>
    
    <header class="glass-panel main-header">
        <div class="logo-container">
            <div class="sigma-glyph">Σ</div>
            <div class="title-wrapper">
                <h1>SigmaOS Zenith</h1>
                <div class="badge-row">
                    <span class="status-badge pulse-ring">LATTICE ACTIVE</span>
                    <span class="version-badge">v33.1</span>
                </div>
            </div>
        </div>
        <div class="telemetry-bar">
            <div class="telemetry-node">
                <span class="t-label">COVERAGE</span>
                <span class="t-value highlight-cyan" id="coverage-val">0%</span>
            </div>
            <div class="telemetry-node">
                <span class="t-label">INTEGRITY</span>
                <span class="t-value highlight-magenta">100% PURE</span>
            </div>
            <div class="telemetry-node">
                <span class="t-label">IQ YIELD</span>
                <span class="t-value glow-text">ABSOLUTE</span>
            </div>
        </div>
    </header>

    <main class="dashboard-layout">
        <section class="left-wing glass-panel">
            <div class="panel-tabs">
                <button class="tab-btn active" data-tab="lattice-view">33-SUITE LATTICE</button>
                <button class="tab-btn" data-tab="explorer-view">SOVEREIGN EXPLORER</button>
            </div>
            
            <div class="tab-content active" id="lattice-view">
                <div class="suite-grid" id="lattice-grid">
                    <!-- Javascript will inject 33 suites -->
                </div>
            </div>

            <div class="tab-content" id="explorer-view">
                <div class="explorer-header">
                    <span id="current-path">/</span>
                    <button id="btn-up-dir">↑ UP</button>
                </div>
                <div class="file-list" id="explorer-list">
                    <!-- Files injected here -->
                </div>
            </div>
        </section>

        <section class="right-wing">
            <div class="glass-panel visualizer-card">
                <h2 class="panel-title">CHROMATIC RESONANCE</h2>
                <div class="holographic-display" id="holo-canvas">
                    <div class="holo-ring outer-ring"></div>
                    <div class="holo-ring middle-ring"></div>
                    <div class="holo-core"></div>
                </div>
            </div>

            <div class="glass-panel terminal-card">
                <div class="terminal-header">
                    <span class="t-title">AUDIT TERMINAL // LIVE</span>
                    <div class="t-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
                <div class="terminal-body" id="audit-log">
                    <div class="log-entry system"><span class="timestamp">[SYSTEM]</span> Initiating Singular Assimilation Protocol...</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal glass-panel" id="file-modal">
        <div class="modal-header">
            <span id="modal-filename" class="t-title">FILE: </span>
            <button id="btn-close-modal">✕ Close</button>
        </div>
        <div class="modal-body">
            <pre><code id="file-content"></code></pre>
        </div>
    </div>

    <script src="scripts/app.js"></script>
</body>
</html>
