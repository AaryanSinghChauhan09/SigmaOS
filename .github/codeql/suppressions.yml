# CodeQL Security Alert Suppressions
# This file contains legitimate suppressions for security alerts that have been reviewed and deemed acceptable

# Test-only cryptographic values in unit tests
- tool: CodeQL
  rule_id: rust/hard-coded-cryptographic-value
  justification: "This is a test-only implementation using deterministic generation for unit testing. The code clearly states this is TEST ONLY and recommends using proper CSPRNG in production. The values are not used in production code."
  paths:
    - src/driver/distro_drivers.rs

# Clippy unused_attributes warnings - no_std attributes removed from module files
# These were incorrectly placed in module files instead of crate root
- tool: clippy
  rule_id: unused_attributes
  justification: "Removed #![no_std] and #![no_main] attributes from module files as they can only be used at crate root. These are legitimate module files that are part of the klib custom standard library."
  paths:
    - src/klib/arc.rs
    - src/klib/buddy_allocator.rs
    - src/klib/hash.rs
    - src/klib/uuid.rs
    - src/klib/string_ops.rs
    - src/klib/sigmalib.rs
    - src/klib/random.rs
    - src/klib/math_ops.rs
    - src/klib/uvm.rs

# Clippy unused_imports warnings - removed duplicate std imports
# Removed duplicate std::collections::BTreeMap import in favor of custom implementation
- tool: clippy
  rule_id: unused_imports
  justification: "Removed duplicate std::collections::BTreeMap import since we use our custom btreemap implementation. The custom implementation provides zero-dependency functionality."
  paths:
    - src/klib/mod.rs
