name: OpenMandriva Clang PGO & BOLT Optimization CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  openmandriva-bolt-pgo:
    name: OpenMandriva LLVM Clang PGO + BOLT Optimization Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify LLVM Binary Optimization Pipeline
        run: |
          cargo check --lib --features "realtime"
          cargo test --lib -- boot::optimization
