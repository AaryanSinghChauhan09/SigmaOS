name: Nightly Security and Fuzzing Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-fuzz:
    name: Nightly Fuzzing & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 / stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz || true

      - name: Run IPC parser fuzzing target
        run: cargo fuzz run ipc_parser -- -runs=10000 || true

      - name: Run VFS path parser fuzzing target
        run: cargo fuzz run vfs_path_parser -- -runs=10000 || true

      - name: Run Competitor Open Source OS Scanner
        run: python3 scripts/competitor_scan.py
