name: "Arch Linux: devtools makepkg-chroot CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  arch-makepkg-chroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Arch Linux devtools makepkg-chroot verification
        run: |
          mkdir -p build
          echo "Simulating Arch devtools makepkg-chroot build..."
          ./run_sigma_tests.sh
