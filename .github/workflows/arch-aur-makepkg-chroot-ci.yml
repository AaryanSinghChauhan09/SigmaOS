name: Arch Linux AUR makepkg & Clean-Chroot Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  arch-makepkg-chroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Arch AUR PKGBUILD & Clean-Chroot Build Architecture
        run: |
          echo "::group::Arch Linux makepkg & Clean-Chroot Verification"
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh
          echo "::endgroup::"
