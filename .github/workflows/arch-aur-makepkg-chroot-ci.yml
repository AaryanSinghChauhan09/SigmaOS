name: Arch Linux AUR & makepkg Chroot CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  arch-aur-verification:
    name: Arch Linux AUR PKGBUILD & Sandboxed makepkg Chroot Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Arch AUR Test Suite
        run: |
          ./run_sigma_tests.sh
