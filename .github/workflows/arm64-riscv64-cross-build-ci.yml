name: Multi-Arch (ARM64 / RISC-V64) Cross-Compilation Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  cross-compile-arm-riscv:
    name: Toolchain Cross-Build & Sysroot Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cross-Compile Toolchain Generator
        run: |
          cargo test --lib cross_compile || true
