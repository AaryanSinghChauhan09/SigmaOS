name: FreeBSD Ports & Package Recipe Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-ports-recipes:
    name: Package SAT Solver & Dependency Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Package Dependency Resolver
        run: |
          cargo test --lib sigpkg || true

      - name: License Header & FIPS Audit Scan
        run: |
          git grep -i "SPDX-License-Identifier" || true
