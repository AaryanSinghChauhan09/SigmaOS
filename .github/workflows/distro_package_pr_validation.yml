name: Distro Package PR Validation & Transpilation Pipeline

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'pkgs/**'
      - 'src/package/**'
      - '.github/workflows/distro_package_pr_validation.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-package-pr:
    name: Validate Distro Package PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build Package PM Gateway Tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test src/package/sovereign_universal_multi_distro_pm_gateway.rs -o build/test_universal_pm_gateway
          rustc --edition=2021 --test src/package/omarchy_pr_proposal_engine.rs -o build/test_omarchy_pr_proposal
          rustc --edition=2021 --test src/distro/sovereign_thousands_distro_components.rs -o build/test_thousands_components

      - name: Execute Universal Multi-Distro PM Gateway Verification
        run: |
          ./build/test_universal_pm_gateway
          ./build/test_omarchy_pr_proposal
          ./build/test_thousands_components

      - name: Verify Multi-Distro Package Formats (Apt, Pacman, Dnf, Apk, Ebuild, Ports, Nix)
        run: |
          cargo check --lib
