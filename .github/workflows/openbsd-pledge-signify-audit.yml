name: OpenBSD Pledge Unveil & Signify Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  openbsd-security-audit:
    name: OpenBSD pledge/unveil & Signify Cryptographic Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test OpenBSD Pledge Unveil Security Policies
        run: |
          cargo test --lib -- runtime::node_distribution::tests
