name: openSUSE OBS & Kiwi Deployment CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  opensuse-obs-kiwi:
    name: openSUSE Open Build Service (OBS) & Kiwi Deployment Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7b737f3747eb115cf4e8f1766b8fb62b6948fb16 # stable
        with:
          toolchain: stable

      - name: Run openSUSE OBS, Snapper & YaST configuration tests
        run: |
          mkdir -p build
          echo "Executing openSUSE OBS, Snapper CoW & YaST test suite..."
          rustc --test --edition=2021 src/distro/improvements.rs -o build/test_opensuse_obs && ./build/test_opensuse_obs
