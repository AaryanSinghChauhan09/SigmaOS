name: Illumos Solaris Crossbow VNIC & DTrace CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  illumos-crossbow-dtrace:
    name: Illumos Crossbow VNIC & DTrace Telemetry Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Crossbow VNIC & Zone Sandboxing Tests
        run: |
          cargo test --test test_distro_dominance test_sovereign_solaris_crossbow_vnic_engine
