name: Arch Linux Namcap & AUR Security Audit CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]


permissions:
  contents: read
jobs:
  arch-namcap-aur-audit:
    name: Arch Linux Namcap PKGBUILD Audit & Repository Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable

      - name: Run Arch Linux PKGBUILD, AUR and pacman parity tests
        run: |
          mkdir -p build
          echo "Running Arch Linux namcap & AUR audit tests..."
          rustc --edition=2021 --test src/distro/arch_parity.rs -o build/test_arch_namcap && ./build/test_arch_namcap
          rustc --edition=2021 --test src/package/aur_integration.rs -o build/test_aur_namcap && ./build/test_aur_namcap
