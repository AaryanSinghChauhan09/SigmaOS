name: Pop!_OS COSMIC DE & Power Scheduler CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
jobs:
  popos-cosmic-verification:
    name: Pop!_OS COSMIC Desktop & System76 Power Scheduler Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Pop!_OS Test Suite
        run: |
          ./run_sigma_tests.sh
