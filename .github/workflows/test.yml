name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    
    - name: Run tests
      run: |
        if [ -f Cargo.toml ]; then
          cargo test --verbose
        else
          echo "No Cargo.toml found, skipping Rust tests"
        fi
    
    - name: Run shell script validation
      run: |
        if [ -d scripts ]; then
          shellcheck scripts/*.sh || true
        fi
