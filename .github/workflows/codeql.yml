name: "Σ SIGMAOS: SOVEREIGN CODE SCANNING (CODEQL)"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze (Sovereign Audit)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ] # CodeQL treats C as C++
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift' ]
        # Use only 'cpp' for this pure C11/ASM kernel.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Install Build Toolchain (nasmn / gcc-x86_64)
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu

    # Custom Build Step: Using x86_64-linux-gnu-gcc since CodeQL only needs static analysis.
    - name: Build Shards for Analysis
      run: |
        make -j$(nproc) CC=x86_64-linux-gnu-gcc AS=nasm LD=x86_64-linux-gnu-ld

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
