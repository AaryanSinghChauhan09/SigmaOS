name: Build and Deploy Docs (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Build cargo doc ────────────────────────────────────────────────────────
  build-docs:
    name: Build Rust API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (nightly for rustdoc features)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build API documentation
        run: cargo doc --workspace --no-deps --release || cargo doc --no-deps || true
        env:
          RUSTDOCFLAGS: "--cfg docsrs --html-in-header .cargo/html-header.html"

      - name: Create pages index
        run: |
          # Create output directory
          mkdir -p _site

          # Copy rust doc output
          if [ -d "target/doc" ]; then
            cp -r target/doc/. _site/api/
          fi

          # Collect all wiki/documentation .md files and render to HTML
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SigmaOS — Sovereign AI-Native Operating System</title>
            <meta name="description" content="SigmaOS is a zero-dependency, AI-native, capability-based microkernel OS written in Rust, targeting post-quantum security and sovereign computing.">
            <style>
              :root {
                --bg: #0d1117;
                --surface: #161b22;
                --border: #30363d;
                --accent: #58a6ff;
                --accent2: #3fb950;
                --text: #c9d1d9;
                --muted: #8b949e;
                --warning: #d29922;
                --danger: #f85149;
              }
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
              }
              header {
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                padding: 1.5rem 2rem;
                display: flex;
                align-items: center;
                gap: 1rem;
              }
              header h1 {
                font-size: 1.5rem;
                color: var(--accent);
                font-weight: 700;
              }
              header .badge {
                background: var(--accent2);
                color: #000;
                padding: 0.15rem 0.6rem;
                border-radius: 9999px;
                font-size: 0.75rem;
                font-weight: 600;
              }
              .hero {
                background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1c2128 100%);
                padding: 5rem 2rem;
                text-align: center;
                border-bottom: 1px solid var(--border);
              }
              .hero h2 {
                font-size: 3rem;
                font-weight: 800;
                background: linear-gradient(90deg, var(--accent), var(--accent2));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 1rem;
              }
              .hero p {
                font-size: 1.2rem;
                color: var(--muted);
                max-width: 700px;
                margin: 0 auto 2rem;
              }
              .cta-row {
                display: flex;
                justify-content: center;
                gap: 1rem;
                flex-wrap: wrap;
              }
              .btn {
                padding: 0.75rem 1.5rem;
                border-radius: 8px;
                text-decoration: none;
                font-weight: 600;
                font-size: 1rem;
                transition: opacity 0.2s;
              }
              .btn:hover { opacity: 0.85; }
              .btn-primary { background: var(--accent); color: #000; }
              .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
              main {
                max-width: 1100px;
                margin: 3rem auto;
                padding: 0 2rem;
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 1.5rem;
                margin-bottom: 3rem;
              }
              .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1.5rem;
                transition: border-color 0.2s;
              }
              .card:hover { border-color: var(--accent); }
              .card h3 { color: var(--accent); margin-bottom: 0.5rem; font-size: 1.1rem; }
              .card p { color: var(--muted); font-size: 0.9rem; }
              .card a { color: var(--accent); text-decoration: none; }
              .section-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: var(--text);
                margin-bottom: 1.5rem;
                padding-bottom: 0.5rem;
                border-bottom: 1px solid var(--border);
              }
              table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
              th, td { padding: 0.75rem; border: 1px solid var(--border); text-align: left; }
              th { background: var(--surface); color: var(--accent); font-weight: 600; }
              tr:hover { background: rgba(88, 166, 255, 0.05); }
              footer {
                text-align: center;
                padding: 2rem;
                color: var(--muted);
                border-top: 1px solid var(--border);
                font-size: 0.85rem;
              }
            </style>
          </head>
          <body>
            <header>
              <h1>⚡ SigmaOS</h1>
              <span class="badge">Sovereign OS</span>
              <span class="badge" style="background: #8957e5; color: #fff;">AI-Native</span>
              <span class="badge" style="background: #da3633; color: #fff;">Post-Quantum</span>
            </header>

            <div class="hero">
              <h2>SigmaOS</h2>
              <p>The Sovereign, AI-Native, Zero-Dependency Operating System — built in Rust with post-quantum cryptography, capability-based security, and a microkernel architecture.</p>
              <div class="cta-row">
                <a href="api/sigmaos/index.html" class="btn btn-primary">📚 API Docs</a>
                <a href="https://github.com/AaryanSinghChauhan09/SigmaOS" class="btn btn-secondary">⭐ GitHub</a>
                <a href="https://github.com/AaryanSinghChauhan09/SigmaOS/wiki" class="btn btn-secondary">📖 Wiki</a>
              </div>
            </div>

            <main>
              <h2 class="section-title">🏛️ Core Architecture</h2>
              <div class="grid">
                <div class="card">
                  <h3>🔷 Microkernel Core</h3>
                  <p>Zero-dependency, no_std Rust microkernel with capability-based IPC, hardware-isolated S-SHARDs, and hard real-time scheduling.</p>
                </div>
                <div class="card">
                  <h3>🔐 Post-Quantum Security</h3>
                  <p>Native Kyber-1024 key exchange and Dilithium-5 signatures. Zero hardcoded keys, hardware entropy (RDRAND/RDSEED), and CapabilityGate access control.</p>
                </div>
                <div class="card">
                  <h3>🧠 AI Integration</h3>
                  <p>SigmaAgent NLP-to-command REPL, local LLM inference with quantized models, and predictive hardware maintenance agents.</p>
                </div>
                <div class="card">
                  <h3>⚡ Sigma Package Manager</h3>
                  <p>Content-addressed .spkg packages with Dilithium-5 signing, DPLL SAT dependency solving, and atomic transactional rollbacks.</p>
                </div>
                <div class="card">
                  <h3>🌐 Sovereign Networking</h3>
                  <p>BBR congestion control, zero-copy Netmap ring buffers, MPTCP multi-path, and native Tor/I2P anonymization routing.</p>
                </div>
                <div class="card">
                  <h3>🖥️ Zenith Desktop</h3>
                  <p>Wayland-native compositor with Vulkan backend, hardware KMS/DRM, per-profile CPU/GPU management, and accessibility WCAG 2.1 AA compliance.</p>
                </div>
              </div>

              <h2 class="section-title">📊 Performance Targets</h2>
              <table>
                <tr><th>Metric</th><th>SigmaOS Target</th><th>Linux Reference</th></tr>
                <tr><td>Boot Time</td><td>&lt; 2.5s</td><td>4–8s typical</td></tr>
                <tr><td>Context Switch</td><td>&lt; 0.5μs</td><td>~1μs</td></tr>
                <tr><td>Syscall Overhead</td><td>&lt; 100ns</td><td>~100ns</td></tr>
                <tr><td>Memory Footprint</td><td>&lt; 200 MB</td><td>400–800 MB</td></tr>
                <tr><td>Network Throughput</td><td>&gt; 8 Gbps</td><td>10G limit</td></tr>
                <tr><td>Security Patch Time</td><td>&lt; 24h</td><td>~7 days avg</td></tr>
              </table>

              <h2 class="section-title">🔗 Resources</h2>
              <div class="grid">
                <div class="card">
                  <h3><a href="api/sigmaos/index.html">📚 Rust API Reference</a></h3>
                  <p>Auto-generated rustdoc covering all public kernel, driver, security, and userland APIs.</p>
                </div>
                <div class="card">
                  <h3><a href="https://github.com/AaryanSinghChauhan09/SigmaOS/wiki">📖 GitHub Wiki</a></h3>
                  <p>Architecture deep-dives, implementation plans, roadmaps, and contributor guides.</p>
                </div>
                <div class="card">
                  <h3><a href="https://github.com/AaryanSinghChauhan09/SigmaOS/blob/main/CONTRIBUTING.md">🤝 Contributing</a></h3>
                  <p>How to set up cross-compilation, submit kernel patches, and join the community.</p>
                </div>
                <div class="card">
                  <h3><a href="https://github.com/AaryanSinghChauhan09/SigmaOS/security">🔒 Security Policy</a></h3>
                  <p>Responsible disclosure, CVE response SLA (&lt;24h), and security audit reports.</p>
                </div>
              </div>
            </main>

            <footer>
              <p>SigmaOS &copy; 2026 AaryanSinghChauhan09 &mdash; MIT/GPL-2.0 &mdash; Built with Rust 🦀</p>
              <p style="margin-top: 0.5rem;">
                <a href="https://github.com/AaryanSinghChauhan09/SigmaOS" style="color: var(--accent);">GitHub</a> ·
                <a href="https://github.com/AaryanSinghChauhan09/SigmaOS/wiki" style="color: var(--accent);">Wiki</a> ·
                <a href="https://github.com/AaryanSinghChauhan09/SigmaOS/issues" style="color: var(--accent);">Issues</a>
              </p>
            </footer>
          </body>
          </html>
          HTML

          echo "✅ Pages index created"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── Deploy to GitHub Pages ─────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
