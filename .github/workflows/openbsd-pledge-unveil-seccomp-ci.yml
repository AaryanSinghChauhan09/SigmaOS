name: OpenBSD Pledge Unveil & Seccomp Sandbox CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  openbsd-pledge-unveil-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test OpenBSD Pledge & Unveil Sandbox Subsystems
        run: cargo test --lib security::pledge
