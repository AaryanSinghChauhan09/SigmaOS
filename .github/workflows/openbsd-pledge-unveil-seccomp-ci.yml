name: OpenBSD Pledge Unveil & Retguard Memory Security Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  openbsd-security-ci:
    name: OpenBSD Pledge, Unveil & Retguard Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test OpenBSD Security Sentinel
        run: cargo test --lib -- security::pledge::tests

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
