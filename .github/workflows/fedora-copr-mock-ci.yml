name: Fedora COPR Mock Chroot & SELinux Policy CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  fedora-copr-mock:
    name: Fedora Mock Cleanroom RPM Build & SELinux Policy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test Fedora Mock RPM & DNF Dispatcher
        run: |
          echo "Testing Fedora COPR Mock RPM specs and microdnf/dnf command dispatcher..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
