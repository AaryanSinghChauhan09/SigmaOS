name: Gentoo Portage Ebuild CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  gentoo-portage-ebuild:
    name: Gentoo Portage Ebuild & Pkgcheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1 # v1
        with:
          toolchain: stable

      - name: Test Gentoo Package Format Transpilation
        run: |
          rustc --test src/package/universal.rs --edition=2021 -o build/test_universal && ./build/test_universal
