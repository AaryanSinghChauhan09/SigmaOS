name: Gentoo Portage Ebuild CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  gentoo-portage-ebuild:
    name: Gentoo Portage Ebuild & Pkgcheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable # v1
        with:
          toolchain: stable

      - name: Test Gentoo Package Format Transpilation
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh
