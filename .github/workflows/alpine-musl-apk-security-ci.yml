name: Alpine Musl APK Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  alpine-apk-security:
    name: Alpine APK Security & Musl Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1 # v1
        with:
          toolchain: stable

      - name: Run Input Validation Security Tests
        run: |
          rustc --test src/security/input_validation.rs --edition=2021 -o build/input_val_test && ./build/input_val_test
