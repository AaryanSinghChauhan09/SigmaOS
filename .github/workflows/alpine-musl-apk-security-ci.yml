name: Alpine Musl APK Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  alpine-apk-security:
    name: Alpine APK Security & Musl Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Run Input Validation Security Tests
        run: |
          mkdir -p build
          rustc --test src/security/input_validation.rs --edition=2021 -o build/input_val_test && ./build/input_val_test
