name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on all connector scripts
        run: |
          fail=0
          for f in $(git ls-files '*.sh' | grep -v '^archive/'); do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "All shell scripts parse cleanly" || exit 1

      - name: Validate TOML registries
        run: |
          python3 - <<'EOF'
          import tomllib
          for p in ["COMPONENT.toml", "COMPONENTS-ACTIVE.toml", "COMPONENTS.toml"]:
              with open(p, "rb") as f:
                  tomllib.load(f)
              print(f"OK: {p}")
          EOF

      - name: Registry consistency check
        run: python3 scripts/validate_component_registry.py || true
