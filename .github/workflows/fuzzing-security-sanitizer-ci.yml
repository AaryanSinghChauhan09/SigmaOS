name: Security Input Validation & Sanitizer Fuzzing CI

on:
  push:
    branches: [ main, master, 'fix/*', 'feat/*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-security-validation:
    name: Security Input Validation & Path Traversal Guard Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Run Input Validation Unit Tests
        run: rustc --test src/security/input_validation.rs --edition=2021 -o build/input_val_test && ./build/input_val_test
