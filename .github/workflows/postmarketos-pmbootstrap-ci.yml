name: postmarketOS pmbootstrap & Mobile Kernel CI
permissions:
  contents: read


on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  postmarketos-pmbootstrap:
    name: postmarketOS pmbootstrap Tooling & Alpine Mobile Architecture Audit

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable

      - name: Test postmarketOS & apk-tools Package Integration
        run: |
          echo "Testing postmarketOS pmbootstrap and apk-tools package adapter..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
