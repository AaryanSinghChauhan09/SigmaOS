name: Fedora & NixOS Reproducible Environment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora-nixos-pipeline:
    name: NixOS nix-shell & Fedora Clean-Room Parity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test NixOS nix-shell & Fedora Clean-Room Parity
        run: |
          cargo test --lib sigpkg::nix_shell
          cargo test --lib compatibility::fedora
          cargo test --lib security::selinux
          cargo test --lib security::selinux_integration
