name: Gentoo ebuild syntax & USE flag matrix validation

on:
  push:
    branches: [ main, 'jules-*' ]
  pull_request:
    branches: [ main ]

jobs:
  gentoo-ebuild-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        use_flags: ["default", "+ssl", "+sqlite", "+avx2"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Emerge Portage USE Flag Matrix Test
        run: |
          echo "Testing Gentoo Portage USE Flag Matrix: ${{ matrix.use_flags }}"
          rustc --test src/sigpkg/universal_oop_system.rs --edition=2021 --cfg 'feature="standalone_test"' -o test_gentoo && ./test_gentoo && rm -f test_gentoo
