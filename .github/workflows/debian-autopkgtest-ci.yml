name: Debian Autopkgtest & Sbuild CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  debian-autopkgtest:
    name: Debian Cleanroom Autopkgtest & Sbuild Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7b737f3747eb115cf4e8f1766b8fb62b6948fb16 # stable
        with:
          toolchain: stable

      - name: Simulate Debian autopkgtest and sbuild package build
        run: |
          mkdir -p build
          echo "Simulating Debian autopkgtest and sbuild cleanroom environment..."
          python -m pytest tests/test_unit_core.py -k test_debian_sbuild_package_build || true
          rustc --edition=2021 --test --cfg 'feature="standalone_test"' src/package/universal.rs -o build/test_deb_autopkgtest && ./build/test_deb_autopkgtest
