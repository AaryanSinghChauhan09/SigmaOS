name: Storage & Performance Matrix

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/09_storage-performance-matrix.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 10 * * 0'  # Weekly

permissions:
  contents: read

jobs:
  storage-performance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Filesystem tests - ext4
          - storage: ext4
            format-cmd: "sudo mkfs.ext4 -F /tmp/test.img"
            mount-cmd: "sudo mount /tmp/test.img /mnt/test"
            benchmark: "fio --name=sequential_read --ioengine=libaio --rw=read --bs=4k --size=1G"

          # Filesystem tests - Btrfs
          - storage: btrfs
            format-cmd: "sudo mkfs.btrfs /tmp/test.img"
            mount-cmd: "sudo mount /tmp/test.img /mnt/test"
            benchmark: "fio --name=sequential_read --ioengine=libaio --rw=read --bs=4k --size=1G"

          # Filesystem tests - XFS
          - storage: xfs
            format-cmd: "sudo mkfs.xfs -f /tmp/test.img"
            mount-cmd: "sudo mount /tmp/test.img /mnt/test"
            benchmark: "fio --name=sequential_read --ioengine=libaio --rw=read --bs=4k --size=1G"

          # Filesystem tests - ZFS (if available)
          - storage: zfs
            format-cmd: "sudo zpool create testpool /tmp/test.img"
            mount-cmd: "sudo mkdir -p /mnt/test"
            benchmark: "fio --name=sequential_read --ioengine=libaio --rw=read --bs=4k --size=1G"

          # Caching strategies
          - performance: cache
            cache-type: lru
            build-cmd: "cargo build --features cache-lru --release"
            test-cmd: "cargo test --features cache-lru --release"

          - performance: cache
            cache-type: lfu
            build-cmd: "cargo build --features cache-lfu --release"
            test-cmd: "cargo test --features cache-lfu --release"

          - performance: cache
            cache-type: arc
            build-cmd: "cargo build --features cache-arc --release"
            test-cmd: "cargo test --features cache-arc --release"

          # Memory allocation strategies
          - performance: allocation
            allocator: jemalloc
            build-cmd: "cargo build --features jemalloc --release"
            test-cmd: "cargo test --features jemalloc --release"

          - performance: allocation
            allocator: mimalloc
            build-cmd: "cargo build --features mimalloc --release"
            test-cmd: "cargo test --features mimalloc --release"

          - performance: allocation
            allocator: system
            build-cmd: "cargo build --release"
            test-cmd: "cargo test --release"

          # CPU scheduling
          - performance: scheduling
            scheduler: eevdf
            build-cmd: "cargo build --features scheduler-eevdf --release"
            test-cmd: "cargo test --features scheduler-eevdf --release"

          - performance: scheduling
            scheduler: bore
            build-cmd: "cargo build --features scheduler-bore --release"
            test-cmd: "cargo test --features scheduler-bore --release"

          # Concurrency patterns
          - performance: concurrency
            pattern: lock-free
            build-cmd: "cargo build --features lock-free --release"
            test-cmd: "cargo test --features lock-free --release"

          - performance: concurrency
            pattern: mutex
            build-cmd: "cargo build --features mutex --release"
            test-cmd: "cargo test --features mutex --release"

          - performance: concurrency
            pattern: rwlock
            build-cmd: "cargo build --features rwlock --release"
            test-cmd: "cargo test --features rwlock --release"

          # I/O patterns
          - performance: io
            pattern: sequential
            build-cmd: "cargo build --features io-sequential --release"
            test-cmd: "cargo test --features io-sequential --release"

          - performance: io
            pattern: random
            build-cmd: "cargo build --features io-random --release"
            test-cmd: "cargo test --features io-random --release"

          - performance: io
            pattern: mmap
            build-cmd: "cargo build --features io-mmap --release"
            test-cmd: "cargo test --features io-mmap --release"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install filesystem tools
        if: matrix.storage
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs btrfs-progs xfsprogs fio

      - name: Prepare filesystem test
        if: matrix.storage
        run: |
          dd if=/dev/zero of=/tmp/test.img bs=1M count=1024
          ${{ matrix.format-cmd }}
          ${{ matrix.mount-cmd }}

      - name: Run filesystem benchmark
        if: matrix.storage
        continue-on-error: true
        run: |
          ${{ matrix.benchmark }} --directory=/mnt/test

      - name: Build with ${{ matrix.performance || matrix.storage }} configuration
        run: |
          ${{ matrix.build-cmd || 'cargo build --release' }}

      - name: Test with ${{ matrix.performance || matrix.storage }} configuration
        continue-on-error: true
        run: |
          ${{ matrix.test-cmd || 'cargo test --release' }}

      - name: Run performance benchmark
        if: matrix.performance
        continue-on-error: true
        run: |
          cargo bench --release || true

      - name: Cleanup filesystem
        if: matrix.storage && always()
        run: |
          sudo umount /mnt/test || true
          rm /tmp/test.img || true

      - name: Report status
        if: always()
        run: |
          echo "Storage/Performance ${{ matrix.storage || matrix.performance }}: ${{ job.status }}"
