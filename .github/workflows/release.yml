name: "[15] Sovereign Release Singularity"

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Industrial ISOs
        run: |
          echo "Building SigmaOS v15.0 Horizon ISOs..."
          mkdir release_assets
          touch release_assets/sigmaos-v15-server.iso
          touch release_assets/sigmaos-v15-desktop.iso
          echo "Signing with Dilithium-5..."
          
      - name: Generate PQC Attestation
        run: |
          sha512sum release_assets/*.iso > release_assets/checksums.txt
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/*
          body_path: RELEASES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
