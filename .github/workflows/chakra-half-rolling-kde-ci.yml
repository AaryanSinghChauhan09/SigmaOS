name: Chakra Linux Half-Rolling & Akabei CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  chakra-akabei-verification:
    name: Chakra Linux Half-Rolling & Akabei Bundle Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Chakra Test Suite
        run: |
          ./run_sigma_tests.sh
