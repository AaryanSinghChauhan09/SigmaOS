name: Sovereign GitHub Pages & Wiki Auto-Publisher CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sovereign-pages-wiki:
    name: Sovereign Pages & Wiki Transpilation Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify Sovereign Wiki Parity & Data Syncer
        run: |
          mkdir -p build && rustc --test --edition=2021 src/sovereign_wiki_master_engine.rs -o build/test_sovereign_wiki_master_engine && ./build/test_sovereign_wiki_master_engine
