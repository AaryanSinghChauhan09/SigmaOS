name: "[01] Sovereign Build & Test"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-lattice:
    name: Build & Modular Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [server, iot, dev]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Purge Legacy Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf build/ dist/
          mkdir -p build/

      - name: Purge Legacy Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path build/) { Remove-Item -Recurse -Force build/ }
          if (Test-Path dist/) { Remove-Item -Recurse -Force dist/ }
          New-Item -ItemType Directory -Force -Path build/ | Out-Null

      - name: Build Sovereign Orchestrator (Unix)
        if: runner.os != 'Windows'
        run: |
          g++ -std=c++20 orchestrator/main.cpp -o s-cli
          echo "[CI] Sovereign Orchestrator built successfully."

      - name: Build Sovereign Orchestrator (Windows)
        if: runner.os == 'Windows'
        run: |
          g++ -std=c++20 orchestrator/main.cpp -o s-cli.exe
          Write-Output "[CI] Sovereign Orchestrator built successfully."

      - name: Switch to Sovereign Profile (Unix)
        if: runner.os != 'Windows'
        run: ./s-cli profile ${{ matrix.profile }}

      - name: Switch to Sovereign Profile (Windows)
        if: runner.os == 'Windows'
        run: .\s-cli.exe profile ${{ matrix.profile }}

      - name: Build Sovereign Lattice (Unix)
        if: runner.os != 'Windows'
        run: ./s-cli build x86_64

      - name: Build Sovereign Lattice (Windows)
        if: runner.os == 'Windows'
        run: .\s-cli.exe build x86_64

      - name: Run Subsystem Regression Tests (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "Running Kernel Tests..."
          ./s-cli test --subsystem genesis
          echo "Running HAL Driver Tests..."
          ./s-cli test --subsystem hal
          echo "Running Userland Tests..."
          ./s-cli test --subsystem userland

      - name: Run Subsystem Regression Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Output "Running Kernel Tests..."
          .\s-cli.exe test --subsystem genesis
          Write-Output "Running HAL Driver Tests..."
          .\s-cli.exe test --subsystem hal
          Write-Output "Running Userland Tests..."
          .\s-cli.exe test --subsystem userland

      - name: Security & Performance Benchmarks (Unix)
        if: runner.os != 'Windows'
        run: ./s-cli benchmark --run-all

      - name: Security & Performance Benchmarks (Windows)
        if: runner.os == 'Windows'
        run: .\s-cli.exe benchmark --run-all

      - name: Upload Kernel Binary & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigmaos-${{ matrix.profile }}-${{ matrix.os }}
          path: |
            build/
          retention-days: 7
