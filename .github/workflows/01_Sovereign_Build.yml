name: "[01] Sovereign Build & Test"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-lattice:
    name: Build & Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [server, iot, dev, alpine, ubuntu, arch, kali, tails]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Purge Legacy Artifacts
        run: |
          rm -rf build/
          rm -rf dist/
          mkdir -p build/

      - name: Repair & Verify Build Environment
        run: |
          mkdir -p build || true
          touch build/.gitkeep || true
          g++ -std=c++20 s-cli.cpp -o s-cli || g++ -std=c++20 s-cli.cpp -o s-cli.exe
          echo "[CI] Sovereign Environment Repaired"

      - name: Switch to Sovereign Profile
        run: |
          ./s-cli profile ${{ matrix.profile }} || .\s-cli.exe profile ${{ matrix.profile }}

      - name: Build Sovereign Lattice
        run: |
          ./s-cli build x86_64 || .\s-cli.exe build x86_64

      - name: Run Sovereign Atomic Tests
        run: |
          ./s-cli test || .\s-cli.exe test

      - name: Upload Kernel Binary & Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sigmaos-${{ matrix.profile }}-${{ matrix.os }}
          path: |
            build/
            *.log
          retention-days: 7
