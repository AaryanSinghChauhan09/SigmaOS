name: Knoppix RAM-Disk Compression & Overlay CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  knoppix-ramdisk-overlay:
    name: Knoppix Compressed RAM-Disk & Squashfs Overlay Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Live RAM-Disk Overlay & XZ Compression Engine
        run: |
          cargo test --lib -- compression::algorithms
          cargo check --lib --features "microkernel"
