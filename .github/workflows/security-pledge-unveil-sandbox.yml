name: Security - Pledge & Unveil Capability Sandbox Audit

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  pledge-unveil-security-audit:
    name: OpenBSD Pledge/Unveil & Shell Sandboxing Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run Pledge/Unveil & Shell Security Tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test src/shell/sigma_sh.rs -o build/sh_test
          ./build/sh_test
          rm -f build/sh_test
