name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read


    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
