name: "[02] Lattice Verification"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-analysis:
    name: Static Analysis & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: sudo apt-get install -y cppcheck clang-tidy

      - name: Native Static Analysis
        run: |
          cppcheck --error-exitcode=1 --force --inline-suppr --quiet suites/ modules/ scripts/

      - name: HAL Exception Lint
        run: |
          clang-tidy suites/S04_HAL/arch/hal_exceptions.c -- -I. -Iinclude -Isuites/S04_HAL -Isuites/S01_Genesis -std=c11 -ffreestanding -nostdlib || true

  formal-verification:
    name: Formal Proofs (Kani)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Run Kani Proofs
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: suites/S08_Security/formal_proofs
          args: "--harness ipc_dma_proofs::verify_dma_ipc_non_interference --harness ipc_dma_proofs::verify_dispatch_capability_ownership"
        continue-on-error: true

  lattice-fuzzing:
    name: Entropy Stress Test (S-FUZZ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build S-CLI
        run: g++ -std=c++20 s-cli.cpp -o s-cli
      - name: Run Lattice Fuzzer
        run: ./s-cli test --shard S22_LatticeFuzzer
