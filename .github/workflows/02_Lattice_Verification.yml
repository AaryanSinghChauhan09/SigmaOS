name: "[02] Lattice Verification"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-analysis:
    name: Static Analysis & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: sudo apt-get install -y cppcheck

      - name: Native Static Analysis (sigmaos core)
        run: |
          cppcheck --error-exitcode=1 --force --inline-suppr --quiet \
            --suppress=missingIncludeSystem \
            sigmaos/core/src/ || true
        continue-on-error: true

      - name: Native Static Analysis (suites)
        run: |
          cppcheck --error-exitcode=1 --force --inline-suppr --quiet \
            --suppress=missingIncludeSystem \
            suites/ || true
        continue-on-error: true

  formal-verification:
    name: Formal Proofs (Kani)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Run Kani Proofs
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: suites/S08_Security/formal_proofs
          args: "--harness ipc_dma_proofs::verify_dma_ipc_non_interference --harness ipc_dma_proofs::verify_dispatch_capability_ownership"
        continue-on-error: true

  lattice-fuzzing:
    name: Entropy Stress Test (S-FUZZ)
    strategy:
      fail-fast: false
      matrix:
        profile: [kali, tails, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build S-CLI
        run: g++ -std=c++20 orchestrator/main.cpp -o s-cli
      - name: Run Profile Fuzzing
        run: ./s-cli test --shard S22_LatticeFuzzer --profile ${{ matrix.profile }}
