name: Gentoo Linux Portage & USE Flags Compilation Matrix CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  gentoo-portage-matrix:
    name: Gentoo Portage Ebuild & USE Flags Matrix Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        use_profile: ["hardened", "minimal", "full-desktop"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Gentoo Portage Subsystem for Profile ${{ matrix.use_profile }}
        run: |
          rustc --test src/process/activity_manager.rs -o test_act
          ./test_act
          rustc --test src/memory/segmentation_paging.rs -o test_seg
          ./test_seg
