name: Universal Package Manager Multi-Format CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  package-formats-verify:
    permissions:
      contents: read

    name: Verify Universal Package Manifest Parsing & Adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Test Universal Package Manager Submodule
        run: |
          mkdir -p build
          rustc --test --cfg 'feature="standalone_test"' src/package/universal.rs --edition=2021 -o build/package_test
          ./build/package_test
