name: Universal Package Manager Multi-Format CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  package-formats-verify:
    name: Verify Universal Package Manifest Parsing & Adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable # stable

      - name: Test Universal Package Manager Submodule
        run: |
          mkdir -p build
          rustc --test src/package/universal.rs --edition=2021 -o build/package_test
          ./build/package_test
