name: Universal Package Manager Multi-Format CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  package-formats-verify:
    name: Verify Universal Package Manifest Parsing & Adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Universal Package Manager Submodule
        run: |
          mkdir -p build
          rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/package/universal.rs -o build/package_test
          ./build/package_test
