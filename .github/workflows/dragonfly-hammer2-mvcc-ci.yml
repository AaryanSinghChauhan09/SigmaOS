name: DragonFly BSD HAMMER2 PFS MVCC Replication CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  dragonfly-hammer2-ci:
    name: DragonFly BSD HAMMER2 PFS Replication Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test HAMMER2 PFS Snapshot Engine
        run: cargo test --lib -- unimplemented_features::extra_unimplemented_tests::test_dragonfly_hammer2_snapshot

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
