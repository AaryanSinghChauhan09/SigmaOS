name: FreeBSD & OpenBSD Security & Capsicum/Pledge Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bsd-security-audit:
    name: FreeBSD Capsicum, OpenBSD Pledge/Unveil & GEOM Storage Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test FreeBSD Jails, VNET, OpenBSD Pledge & Unveil
        run: |
          cargo test --lib security::jails
          cargo test --lib security::unveil
          cargo test --lib storage::geom
