name: Solus Moss eopkg Stateless Desktop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  solus-moss-audit:
    name: Solus Moss & eopkg Package Manager Engine Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify Solus Moss & eopkg Engine
        run: |
          rustc --test src/distro/missing_distro_innovations.rs --edition=2021 --cfg 'feature="standalone_test"' -o /tmp/solus_test && /tmp/solus_test
