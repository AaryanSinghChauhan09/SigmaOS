name: FreeBSD Poudriere Ports & Jail Isolation Matrix CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  freebsd-poudriere-ci:
    name: FreeBSD Jail & GEOM Topology Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test FreeBSD Jail Manager & Capsicum
        run: cargo test --lib -- compatibility::bsd::tests

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
