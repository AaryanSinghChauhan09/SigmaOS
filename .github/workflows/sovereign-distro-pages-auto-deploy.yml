name: Sovereign Multi-Distro GitHub Pages Automated Deployment

on:
  push:
    branches: [ main, master ]

jobs:
  pages-deploy:
    name: Build and Deploy Multi-Distro Documentation to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Web Installer & Zenith Desktop
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Deploy Pages Artifacts
        run: echo "Multi-distro GitHub Pages Deployment Ready"
