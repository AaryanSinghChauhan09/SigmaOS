name: FreeBSD Jails VNET & GEOM Storage CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  freebsd-parity-verify:
    name: Verify FreeBSD Jails, VNET Stack, and GEOM Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test FreeBSD Jails Submodule
        run: |
          rustc --test src/compatibility/freebsd_jails.rs --edition=2021 -o build/freebsd_jails_test
          ./build/freebsd_jails_test
