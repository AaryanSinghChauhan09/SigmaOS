name: FreeBSD Jails VNET & GEOM Storage CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  freebsd-parity-verify:
    name: Verify FreeBSD Jails, VNET Stack, and GEOM Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Test FreeBSD Jails Submodule
        run: |
          rustc --test src/compatibility/freebsd_jails.rs --edition=2021 -o build/freebsd_jails_test
          ./build/freebsd_jails_test
