name: FreeBSD Jails VNET & GEOM Storage CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  freebsd-parity-verify:
    name: Verify FreeBSD Jails, VNET Stack, and GEOM Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable # stable

      - name: Test FreeBSD Jails Submodule
        run: |
          mkdir -p build
          rustc --test src/compatibility/freebsd_jails.rs --edition=2021 -o build/freebsd_jails_test
          ./build/freebsd_jails_test
