name: Label PR Size

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size-label:
    name: Label PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Label PR Size
        uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          sizes: >-
            {"0": "size/XS", "50": "size/S", "250": "size/M", "500": "size/L", "1000": "size/XL"}
