name: Σ SIGMAOS ZENITH CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  sovereign-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Σ KERNEL STRUCTURAL VERIFICATION
      run: |
        node --check index.js
    - name: Σ KERNEL COMPILATION AUDIT
      run: |
        gcc -std=c11 -ffreestanding -fno-builtin -Ikernel \
        kernel/kmain.c kernel/mm/slab.c kernel/syscall.c kernel/vfs_stub.c \
        -fsyntax-only 2>&1 && echo "  [PASS]: Kernel Shards Syntax OK"
    - name: Σ WIKI MASTER INTEGRITY CHECK
      run: |
        grep -q "Σ SIGMAOS ZENITH SUPREME: SOVEREIGN WIKI MASTER" WIKI_MASTER.md
