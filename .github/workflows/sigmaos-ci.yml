name: SigmaOS Sovereign CI/CD Pipeline v2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHON_VERSION: '3.x'

jobs:
  # ── Stage 1: Build all architectures in parallel ──────────
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64, riscv64]
      fail-fast: false

    steps:
    - name: Checkout SigmaOS Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Cross-Compilation Toolchains
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q \
          gcc-aarch64-linux-gnu \
          gcc-riscv64-linux-gnu \
          binutils-aarch64-linux-gnu \
          binutils-riscv64-linux-gnu

    - name: Validate Module Metadata (module.json)
      run: |
        echo "[*] Validating module.json descriptors..."
        python3 -c "
        import json, os, sys
        errors = 0
        for root, _, files in os.walk('modules'):
            if 'module.json' in files:
                path = os.path.join(root, 'module.json')
                try:
                    m = json.load(open(path))
                    assert 'module' in m
                    assert 'version' in m
                    assert 'dependencies' in m
                    print(f'  [OK] {m[\"module\"]} v{m[\"version\"]}')
                except Exception as e:
                    print(f'  [FAIL] {path}: {e}')
                    errors += 1
        sys.exit(errors)
        "

    - name: Run Sovereign Build Orchestrator v2
      run: |
        echo "[*] Running build for ${{ matrix.arch }}..."
        python3 scripts/sovereign_builder.py ${{ matrix.arch }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sigmaos-${{ matrix.arch }}-build
        path: build/${{ matrix.arch }}/
        if-no-files-found: ignore

  # ── Stage 2: QEMU Smoke Test (x86_64 only) ───────────────
  smoke_test:
    name: QEMU Smoke Test (x86_64)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout SigmaOS Repository
      uses: actions/checkout@v4

    - name: Install QEMU
      run: sudo apt-get install -y -q qemu-system-x86

    - name: Download x86_64 Build
      uses: actions/download-artifact@v4
      with:
        name: sigmaos-x86_64-build
        path: build/x86_64/

    - name: QEMU Kernel Smoke Test
      run: |
        echo "[*] Running sovereign smoke test suite..."
        python3 scripts/qemu_smoke_test.py x86_64

  # ── Stage 3: Module Dependency Graph ─────────────────────
  graph:
    name: Module Dependency Report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout SigmaOS Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Print Module Dependency Graph
      run: |
        python3 -c "
        import json, os
        for root, _, files in os.walk('modules'):
            if 'module.json' in files:
                m = json.load(open(os.path.join(root, 'module.json')))
                deps = ', '.join(m.get('dependencies', ['none']))
                print(f'  {m[\"module\"]:25s} -> [{deps}]')
        "
