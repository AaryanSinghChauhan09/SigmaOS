name: "Illumos ZFS & DTrace Parity CI"

on:
  push:
    branches: [ "main", "dev", "jules-*" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  illumos-parity-test:
    name: "Verify Illumos ZFS & DTrace Parity"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Rust Toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: "Run Illumos ZFS & DTrace Tests"
        run: |
          ./run_sigma_tests.sh
