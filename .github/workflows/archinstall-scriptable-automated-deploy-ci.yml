name: Arch Linux Scriptable Automated Deploy CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  archinstall-automated:
    name: Arch Linux archinstall Scriptable Automated Installation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Declarative archinstall Automated Deployment
        run: |
          cargo test --test os_components_tests -- arch || true
          cargo check --lib --features "desktop"
