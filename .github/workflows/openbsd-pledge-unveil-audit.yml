name: "OpenBSD Pledge & Unveil Sandbox Audit"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]


permissions:
  contents: read
jobs:
  pledge-unveil-audit:
    name: OpenBSD Pledge & Unveil Privilege Reduction Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify OpenBSD Pledge & Unveil Sandboxing
        run: |
          cargo test --lib security::pledge::tests -- --nocapture
          cargo test --lib security::sigma_pledge::tests -- --nocapture
