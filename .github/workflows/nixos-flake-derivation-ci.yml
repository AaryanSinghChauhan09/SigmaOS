name: NixOS Flakes & Nix Store Closure Evaluation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  nixos-flake-check:
    name: Nix Derivation & Hermetic Store Isolation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Isolated Nix Store Path Management
        run: |
          cargo test --lib -- test_node_binary_verification_and_store_installation
