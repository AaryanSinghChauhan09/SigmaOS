name: "SELinux AppArmor MAC Policy CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  mac-policy-audit:
    name: SELinux & AppArmor Mandatory Access Control Policy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Verify SELinux Type Enforcement & AppArmor Profile Rules
        run: |
          echo "=== Auditing SELinux & AppArmor MAC security rules ==="
          cargo test --lib security
