name: Mandatory Access Control (SELinux/AppArmor) Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]


permissions:
  contents: read
jobs:
  mac-security-policy-check:
    name: Fedora SELinux MLS/MCS Policy Evaluation Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify SELinux Policy Engine
        run: |
          cargo test --lib selinux || true
