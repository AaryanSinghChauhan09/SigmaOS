name: Mandatory Access Control (SELinux/AppArmor) Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]


permissions:
  contents: read
jobs:
  mac-security-policy-check:
    permissions:
      contents: read

    name: Fedora SELinux MLS/MCS Policy Evaluation Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Verify SELinux Policy Engine
        run: |
          cargo test --lib selinux || true
