name: CodeQL Security Scanning & SLSA Provenance Assurance

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 2 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dad2a303e6db0157080d38101a156e # v3.28.11
        with:
          languages: 'cpp, python'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dad2a303e6db0157080d38101a156e # v3.28.11
