name: CodeQL Security Scanning & SLSA Provenance Assurance

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 2 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@df409f7d92603720f1f89f2e050b5d4091f205f2 # v3.28.10
        with:
          languages: 'actions, python, rust'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@df409f7d92603720f1f89f2e050b5d4091f205f2 # v3.28.10
