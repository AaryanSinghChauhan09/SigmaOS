name: Fedora Bodhi Karma Gating & Stale Triage

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  bodhi-karma-triage:
    name: Fedora Bodhi Karma Threshold & Stale Issue Triage
    runs-on: ubuntu-latest

    steps:
      - name: Stale Issues & PRs Triage
        uses: actions/stale@28ca1036281a5e5922edd99eebd58a5eef225643 # v9.0.0
        with:
          stale-issue-message: 'This issue has been automatically marked as stale due to 30 days of inactivity. It will be closed if no further activity occurs.'
          stale-pr-message: 'This pull request has been automatically marked as stale due to 30 days of inactivity.'
          days-before-stale: 30
          days-before-close: 7
