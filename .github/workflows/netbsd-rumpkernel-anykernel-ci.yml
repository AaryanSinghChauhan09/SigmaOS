name: NetBSD Rump Kernel Anykernel Driver Isolation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  netbsd-rump-ci:
    permissions:
      contents: read

    name: NetBSD Rump Anykernel Router Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Test NetBSD Rump Kernel Router
        run: cargo test --lib -- distro::linux_bsd_parity_extended::tests

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
