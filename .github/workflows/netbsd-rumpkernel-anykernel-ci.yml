name: NetBSD Rump Kernel & Anykernel Subsystem CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  netbsd-rumpkernel-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test NetBSD Rump Kernel Architecture
        run: cargo test --lib distro::netbsd
