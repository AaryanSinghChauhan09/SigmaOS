name: OpenWrt UCI Network Router & Cross-Compilation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  openwrt-router:
    name: OpenWrt UCI Network & Cross-Compilation Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run OpenWrt Router Network Tests
        run: |
          mkdir -p build && rustc --test --edition=2021 src/net/socket.rs -o build/socket_test && ./build/socket_test
