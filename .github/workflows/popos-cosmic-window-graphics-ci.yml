name: Pop!_OS COSMIC Window Tiling & Hybrid Graphics CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  popos-cosmic-graphics:
    name: COSMIC Dynamic Tiling & Distro Country Flags SVG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable

      - name: Test COSMIC Window Tiling Engine
        run: |
          mkdir -p build
          cargo test --lib -- unimplemented_features::tests::test_sovereign_cosmic_tiling_engine

      - name: Test Graphics SVG Flag Engine
        run: |
          mkdir -p build
          cargo test --lib -- graphics::country_flags_svg::tests
