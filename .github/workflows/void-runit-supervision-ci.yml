name: Void Linux Runit Supervision & Health Check CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  void-runit-supervision:
    name: Void runit Supervisor Health Check Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run Void Runit Standalone Tests
        run: mkdir -p build && rustc --test src/distro/void_runit.rs --edition=2021 -o build/void_runit_test && ./build/void_runit_test
