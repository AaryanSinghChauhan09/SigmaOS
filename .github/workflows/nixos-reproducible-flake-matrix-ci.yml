name: NixOS Flake Matrix & Reproducible Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  nixos-reproducible-ci:
    name: NixOS Flake Matrix & Reproducible Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Reproducible NixOS Flakes Engine
        run: cargo check --lib

      - name: Run Sovereign Atomic Harness Tests
        run: ./run_sigma_tests.sh
