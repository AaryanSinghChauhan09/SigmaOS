name: Mageia urpmi & drakxtools CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  mageia-urpmi-verification:
    name: Mageia urpmi RPM Package Manager & drakxtools Control Center Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Mageia Test Suite
        run: |
          ./run_sigma_tests.sh
