name: NetBSD Rump Kernel & Cross-Arch Verification CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  netbsd-rumpkernel-cross:
    name: NetBSD Rump Kernel Hypercalls & Cross-Arch Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify NetBSD Rump Router & Cross-Architecture Hypercalls
        run: |
          cargo test --test linux_bsd_inspection_tests -- rump || true
          cargo test --lib -- test_epoll_event_loop_multiplexing
