name: GNU Guix Functional Package & Shepherd CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  guix-shepherd-verification:
    name: GNU Guix Functional Store & Shepherd Service Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Guix Test Suite
        run: |
          ./run_sigma_tests.sh
