name: "Gentoo Portage USE-Flags Optimizer CI"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  portage-useflags-test:
    name: Gentoo Portage Ebuild USE-Flags Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Portage Ebuild Compiler and Target CPU Optimization
        run: |
          cargo test --lib sigpkg::arch_compat::tests::test_gentoo_portage_compiler -- --nocapture
