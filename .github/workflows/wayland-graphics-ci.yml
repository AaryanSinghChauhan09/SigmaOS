name: Wayland & DRM-KMS Compositor Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]


permissions:
  contents: read
jobs:
  graphics-compositor-check:
    name: Wayland XDG Shell Compositor & DRM Frame Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Compositor Pipeline Test
        run: |
          cargo test --lib compositor || true
