name: SigmaOS Cross-Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-kernel:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
        with:
          repository: AaryanSinghChauhan09/SigmaOS-kernel
        continue-on-error: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        continue-on-error: true
      - run: cargo test
        continue-on-error: true

  test-iso:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test-kernel
    steps:
      - uses: actions/checkout@v3
        with:
          repository: AaryanSinghChauhan09/SigmaOS-ISO
        continue-on-error: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        continue-on-error: true
      - run: cargo test
        continue-on-error: true

  test-desktop:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test-kernel
    steps:
      - uses: actions/checkout@v3
        with:
          repository: AaryanSinghChauhan09/SigmaOS-desktop-environment
        continue-on-error: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        continue-on-error: true
      - run: cargo test
        continue-on-error: true

  test-screen-recorder:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
        with:
          repository: AaryanSinghChauhan09/SigmaOS-screen-recorder
        continue-on-error: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        continue-on-error: true
      - run: cargo test
        continue-on-error: true

  test-screen-shot:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
        with:
          repository: AaryanSinghChauhan09/SigmaOS-screen-shot
        continue-on-error: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        continue-on-error: true
      - run: cargo test
        continue-on-error: true

  test-software-manager:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
        with:
          repository: AaryanSinghChauhan09/SigmaOS-software-manager
        continue-on-error: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        continue-on-error: true
      - run: cargo test
        continue-on-error: true

  integration-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [test-kernel, test-iso, test-desktop]
    steps:
      - uses: actions/checkout@v3
      - name: Run integration tests
        run: cargo test --test-threads=1
