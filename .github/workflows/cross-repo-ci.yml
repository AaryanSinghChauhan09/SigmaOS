name: SigmaOS Cross-Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo test

  integration-test:
    runs-on: ubuntu-latest
    needs: [test-kernel]
    steps:
      - uses: actions/checkout@v3
      - name: Run integration tests
        run: cargo test --test-threads=1
