name: NetBSD PUFFS RumpFS Server CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-netbsd-puffs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify NetBSD PUFFS & RumpFS Kernel Server Router
        run: |
          cargo test --test os_algorithms_inspection_tests
