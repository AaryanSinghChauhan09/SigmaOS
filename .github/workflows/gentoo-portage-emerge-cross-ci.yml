name: Gentoo Portage Ebuild USE Flag Matrix CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  gentoo-portage-ci:
    name: Gentoo Portage USE Flag Matrix & Mask Resolver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Gentoo Portage & Ebuild Engine
        run: cargo test --lib -- distro::gentoo::tests

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
