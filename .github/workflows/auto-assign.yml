name: "Automation: Issue and PR Auto-Assign"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    name: Auto-Assign Maintainers
    runs-on: ubuntu-latest
    steps:
      - name: Assign Maintainers
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const issueNumber = isPR ? context.payload.pull_request.number : context.payload.issue.number;
            const author = isPR ? context.payload.pull_request.user.login : context.payload.issue.user.login;

            // Assign author if they are a repo contributor, or set triage team
            console.log(`Processing ${isPR ? 'PR' : 'Issue'} #${issueNumber} opened by @${author}`);

            // Apply triage label
            const label = isPR ? 'needs-review' : 'triage';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [label]
            });
