name: SigmaOS Zenith CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/aaryansinghchauhan09/sigmaos-industrial:latest

    steps:
    - uses: actions/checkout@v3

    - name: Compile Sovereign Lattice
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)

    - name: Run Lattice Benchmarks
      run: |
        ./build/sigma-bench --run-all

    - name: Verify PQC Signatures
      run: |
        ./tools/pqc-audit --verify-core

    - name: Regression Testing (QEMU)
      run: |
        ./scripts/qemu-test.sh --headless
