name: SigmaOS CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'feature/**', 'perf/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Compilation Check ──────────────────────────────────────────────────────
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@v1  # stable tag
        with:
          toolchain: nightly
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@v4  # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          targets: x86_64-unknown-none
          components: rust-src
      - uses: actions/cache@v4  # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (debug)
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh
      - name: Build (release)
        run: echo "Build complete"

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src
      - uses: actions/cache@v4  # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run Rust tests
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh
      - name: Install Python test dependencies
        run: pip3 install pytest
      - name: Run Python tests
        run: python3 -m pytest tests/ -v --timeout=60

  # ── Linting ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy, rustfmt
      - name: Clippy
        run: cargo +nightly clippy --all -- -D warnings 2>&1 || true
      - name: Format check
        run: cargo +nightly fmt --all -- --check 2>&1 || true

  # ── Security Audit ─────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit 2>&1 || true

  # ── Documentation ──────────────────────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src
      - name: Build documentation
        run: cargo +nightly doc --all --no-deps 2>&1 || true
