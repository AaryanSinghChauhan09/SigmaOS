name: SigmaOS Sovereign CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        arch: [x86_64, arm64]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake g++-12 lcov

    - name: Build Kernel Shards
      run: |
        mkdir build
        cd build
        cmake .. -DARCH=${{ matrix.arch }} -DENABLE_COVERAGE=ON
        make -j$(nproc)

    - name: Run Host-Mode Tests (GTest)
      run: |
        cd build
        ctest --output-on-failure

    - name: Generate Coverage Report
      run: |
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file filtered_coverage.info
        genhtml filtered_coverage.info --output-directory coverage_report

    - name: Upload Coverage Results
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.arch }}
        path: coverage_report/

  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Shard Benchmarks
      run: |
        # Simulate benchmark execution
        echo "SHARD_ID,NATIVE_MS,WASM_MS" > benchmarks.csv
        echo "S001,12.5,18.2" >> benchmarks.csv
        echo "S002,45.1,52.4" >> benchmarks.csv
        
    - name: Upload Benchmark Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: shard-benchmarks
        path: benchmarks.csv

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: 'cpp'
    - name: Build for CodeQL
      run: make
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
