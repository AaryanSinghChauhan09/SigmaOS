name: SigmaOS CI / Reproducible Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify Reproducibility
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Rust (no_std)
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        target: x86_64-unknown-none
        override: true
        components: rust-src, llvm-tools-preview

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache Cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    # Mock step since we don't have a full Cargo workspace setup yet
    - name: Check Kernel Compilation (Syntax & Types)
      run: |
        echo "Running syntax and type checks on bare-metal code..."
        # Example: cargo check --target x86_64-unknown-none
        echo "Check passed."

    - name: SBOM Generation
      run: |
        echo "Generating Software Bill of Materials (SBOM)..."
        # Example: cargo install cargo-sbom && cargo sbom > sbom.json
        touch sbom.json
        echo "SBOM generated."

    - name: Kernel Signing
      run: |
        echo "Signing kernel artifacts (Mock)..."
        # Example: sbsign --key secureboot.key --cert secureboot.crt vmlinuz
        echo "Signing complete."

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sigmaos-build
        path: |
          sbom.json
