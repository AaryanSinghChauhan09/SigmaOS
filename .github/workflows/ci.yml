name: SigmaOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Run cargo check
        run: cargo check --workspace

      - name: Run cargo test
        run: cargo test --workspace

      - name: Test Control Center
        run: cargo test -p sigma-control-center

      - name: Test AI Integration
        run: cargo test -p sigma-ai-integration

      - name: Test Dev Studio
        run: cargo test -p sigma-dev-studio

      - name: Test Design System
        run: cargo test -p sigma-design-system

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --production

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
