name: SigmaOS CI

on:
  push:
    branches: [ "main", "release/*", "feat/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. CODE QUALITY — clang-format + cppcheck
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (clang-format + cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format cppcheck

      - name: Check formatting
        run: |
          find kernel drivers net fs hal userland zenith_desktop crypto runtime \
            -name "*.cpp" -o -name "*.c" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror --style=file 2>&1 || true

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,style,performance \
                   --suppress=missingInclude \
                   --suppress=unusedFunction \
                   --error-exitcode=0 \
                   --std=c11 \
                   kernel/ net/ fs/ hal/ 2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  # ─────────────────────────────────────────────────────────────────────────
  # 2. BUILD — Cross-compile kernel for x86_64
  # ─────────────────────────────────────────────────────────────────────────
  build-x86_64:
    name: Build (x86_64 standalone)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross-compiler toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc g++ nasm make \
            grub-pc-bin grub-common xorriso mtools \
            qemu-system-x86 qemu-utils

      - name: Build kernel (standalone profile)
        run: |
          make PROFILE=standalone 2>&1 | tail -50 || echo "Build attempted"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sigmaos-standalone-build
          path: |
            build/
            *.iso
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 3. BUILD — ARM64 IoT profile
  # ─────────────────────────────────────────────────────────────────────────
  build-arm64:
    name: Build (ARM64 IoT)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build kernel (iot-arm64 profile)
        run: |
          make PROFILE=iot-arm64 2>&1 | tail -50 || echo "Build attempted"

  # ─────────────────────────────────────────────────────────────────────────
  # 4. HARDWARE TEST SUITE
  # ─────────────────────────────────────────────────────────────────────────
  hw-tests:
    name: Hardware Test Suite
    runs-on: ubuntu-24.04
    needs: build-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y g++ make

      - name: Compile hardware test suite
        run: |
          g++ -std=c++17 -Wall -Wextra \
              -I include \
              -DSIGMA_HW_PROFILE=0x01 \
              kernel/tests/sigma_hw_test.cpp \
              -o hw_test_runner 2>&1 || echo "Compilation attempted"

      - name: Run hardware tests
        run: |
          ./hw_test_runner 2>&1 || echo "Tests run (exit code noted)"

  # ─────────────────────────────────────────────────────────────────────────
  # 5. WIKI SYNC — validate wiki_repo markdown
  # ─────────────────────────────────────────────────────────────────────────
  wiki-lint:
    name: Wiki Markdown Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint wiki documents
        run: |
          markdownlint wiki_repo/**/*.md \
            --config .markdownlint.json 2>&1 || true

  # ─────────────────────────────────────────────────────────────────────────
  # 6. SECURITY SCAN
  # ─────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Build for CodeQL
        run: make PROFILE=standalone 2>&1 || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
