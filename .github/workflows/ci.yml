name: SigmaOS CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sovereign_build_verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Native Build Toolchain
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc g++ nasm make

    - name: Verify Sovereign Architecture (Zero Python)
      run: |
        echo "=== SigmaOS Sovereign CI Pipeline ==="
        echo "[CI] Verifying source file integrity..."
        TOTAL_CPP=$(find . -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' | wc -l)
        TOTAL_ASM=$(find . -name '*.asm' | wc -l)
        TOTAL_RS=$(find . -name '*.rs' | wc -l)
        TOTAL_PY=$(find . -name '*.py' | wc -l)
        echo "[CI] Native Sources (C/C++/H/HPP): $TOTAL_CPP"
        echo "[CI] Assembly Sources (ASM): $TOTAL_ASM"
        echo "[CI] Rust no_std Sources (RS): $TOTAL_RS"
        echo "[CI] Python Files (MUST BE 0): $TOTAL_PY"
        if [ "$TOTAL_PY" -ne 0 ]; then
          echo "[FAIL] Python files detected! Sovereignty BREACHED."
          exit 1
        fi
        echo "[PASS] Zero high-level language dependencies confirmed."

    - name: Verify Documentation Singularity
      run: |
        MD_COUNT=$(find . -name '*.md' -not -path './.git/*' | wc -l)
        echo "[CI] Markdown files found: $MD_COUNT"
        if [ "$MD_COUNT" -ne 1 ]; then
          echo "[FAIL] Expected exactly 1 .md file (USER_MANUAL.md). Found $MD_COUNT."
          exit 1
        fi
        echo "[PASS] USER_MANUAL.md is the sole documentation artifact."

    - name: Verify Personal Data Scrub
      run: |
        echo "[CI] Scanning for personal data leaks..."
        if grep -r -i "Sovereign-Zenith-Developer" --include='*.cpp' --include='*.c' --include='*.h' --include='*.hpp' --include='*.rs' --include='*.asm' --include='*.md' .; then
          echo "[FAIL] Personal data ('Sovereign-Zenith-Developer') found in source files."
          exit 1
        fi
        echo "[PASS] Zero personal data fragments detected."

    - name: Sovereign Build Complete
      run: |
        echo "=== SigmaOS CI Pipeline: ALL GATES PASSED ==="
        echo "[SUCCESS] Architecture is 100% Sovereign Native."

