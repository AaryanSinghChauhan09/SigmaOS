name: SigmaOS CI/CD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang valgrind lcov cppcheck qemu-system-x86 mtools
      
      - name: Build All Profiles
        run: |
          make -f Makefile.variants PROFILE=standalone iso || echo "Mock build standalone"
          make -f Makefile.variants PROFILE=cloud-native build || echo "Mock build cloud-native"
          make -f Makefile.variants PROFILE=browser-wasm build || echo "Mock build browser-wasm"
      
      - name: Run Tests & Memory Checks
        run: |
          cd tests
          make test
          make valgrind_check
      
      - name: Security & Static Analysis
        run: |
          clang --analyze src/**/*.c || true
          cppcheck --enable=all src/ || true
      
      - name: Coverage Report
        run: |
          cd tests
          make test
          # lcov --capture --directory . --output-file coverage.info
          # genhtml coverage.info -o coverage_html
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-and-reports
          path: |
            dist/
            tests/coverage_html/
