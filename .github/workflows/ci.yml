name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    
    - name: Build
      run: cargo build --release
    
    - name: Test
      run: cargo test
    
    - name: Clippy
      run: cargo clippy -- -D warnings
    
    - name: Format check
      run: cargo fmt -- --check
    
    - name: Security audit
      run: cargo audit