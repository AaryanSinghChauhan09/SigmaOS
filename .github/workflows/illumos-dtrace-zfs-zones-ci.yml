name: Illumos Solaris DTrace, ZFS ARC & Zones Container CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  illumos-dtrace-zones:
    name: Illumos Kernel DTrace, ZFS ARC & Zones Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7b737f3747eb115cf4e8f1766b8fb62b6948fb16 # stable
        with:
          toolchain: stable

      - name: Test OpenSource Gap Closure Supremacy Engine
        run: |
          mkdir -p build
          cargo test --lib -- open_source_os_gap_closure::tests
