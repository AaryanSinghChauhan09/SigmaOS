name: "Void Linux: xbps-src Chroot Bulk CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  void-xbps-bulk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run Void xbps-src chroot bulk package verification
        run: |
          mkdir -p build
          echo "Simulating Void xbps-src bulk chroot build..."
          ./run_sigma_tests.sh
