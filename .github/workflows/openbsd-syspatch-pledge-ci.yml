name: OpenBSD Syspatch & Pledge/Unveil CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]


permissions:
  contents: read
jobs:
  openbsd-syspatch-pledge:
    name: OpenBSD Syspatch Security Updates & Pledge/Unveil Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable

      - name: Test OpenBSD syspatch security & pledge/unveil compliance
        run: |
          mkdir -p build
          echo "Executing OpenBSD syspatch & pledge/unveil sandbox checks..."
          rustc --edition=2021 --test src/distro/missing_distro_innovations.rs --cfg 'feature="standalone_test"' -o build/test_openbsd_pledge && ./build/test_openbsd_pledge
