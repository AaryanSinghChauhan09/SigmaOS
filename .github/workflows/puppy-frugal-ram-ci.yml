name: Puppy Linux Frugal RAM Boot & OverlayFS CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
jobs:
  puppy-ram-verification:
    permissions:
      contents: read

    name: Puppy Linux Frugal RAM Boot & OverlayFS Storage Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Run Puppy Linux Test Suite
        run: |
          ./run_sigma_tests.sh
