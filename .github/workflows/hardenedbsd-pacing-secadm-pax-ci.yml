name: HardenedBSD Secadm & PaX Security CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  hardenedbsd-pax-secadm:
    name: HardenedBSD ASLR/PaX NOEXEC & Secadm Rule Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify HardenedBSD Memory Protection & Security Integrity
        run: |
          cargo test --lib -- security::hardening
          cargo test --test os_components_tests -- bsd || true
