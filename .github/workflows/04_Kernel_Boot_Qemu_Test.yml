name: "04 ⚡ Kernel Boot, QEMU & Scheduler CI"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  kernel-architecture-matrix:
    name: Multi-Arch Kernel Build & Boot Test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-none
          - arch: aarch64
            target: aarch64-unknown-none
          - arch: riscv64
            target: riscv64gc-unknown-none-elf
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qemu-system-x86 qemu-system-arm qemu-system-riscv64

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Run Systemd Init & BORE Scheduler Tests
        run: |
          cargo test --lib -- init::systemd_init::tests
          cargo test --lib -- kernel::linux_bsd_innovations::tests

      - name: Run Standalone Rust Inspection Suite
        run: |
          chmod +x ./scripts/changed_files_rustc_tests.sh
          ./scripts/changed_files_rustc_tests.sh
