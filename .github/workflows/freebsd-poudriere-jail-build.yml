name: FreeBSD Poudriere & VNET Jail Sandbox CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  freebsd-poudriere-build:
    name: FreeBSD Ports & Jail Isolation Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test FreeBSD Jail & Package Managers
        run: |
          cargo test --lib -- package::universal::tests
