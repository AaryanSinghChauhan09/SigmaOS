name: OpenWrt & Yocto Embedded Router Firmware CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  openwrt-yocto-embedded:
    name: OpenWrt OPKG & Yocto Embedded Firmware Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Embedded Network Stack & Router Drivers
        run: |
          cargo test --lib -- drivers::distro_device_expansion::can_bus_socket_driver
          cargo check --lib --features "cloud-init"
