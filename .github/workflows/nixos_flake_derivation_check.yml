name: NixOS flake evaluation & profile rollback checks

on:
  push:
    branches: [ main, 'jules-*' ]
  pull_request:
    branches: [ main ]

jobs:
  nixos-flake-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Evaluate Content-Addressed Store Derivations & Rollbacks
        run: |
          echo "Evaluating NixOS Flake content-addressed derivations and atomic rollbacks..."
          rustc --test src/sigpkg/universal_oop_system.rs --edition=2021 --cfg 'feature="standalone_test"' -o test_nix && ./test_nix && rm -f test_nix
