name: SigmaOS Sovereign Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build_and_audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck gcc-multilib build-essential
    - name: Build Sovereign Kernel
      run: cargo check --lib --all-features
    - name: CodeQL Security Scan
      uses: github/codeql-action/init@v3
      with:
        languages: rust
        queries: security-extended,security-and-quality
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
    - name: Validate Architecture Documentation
      run: |
        if [ -f Architecture_Overview.md ]; then
          echo "Architecture_Overview.md found and validated."
        else
          echo "::warning::Architecture_Overview.md not found."
        fi
