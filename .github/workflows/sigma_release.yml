name: "Release Automation"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v29.0.0)'
        required: true

jobs:
  build_release:
    name: Build Sovereign Release ISO
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building SigmaOS release: $VERSION"

    - name: Run sigma-build
      run: python3 tools/sigma-build.py

    - name: Run cppcheck quality gate
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=warning,style,performance \
                 --suppress=missingIncludeSystem \
                 kernel/core/ userland/ 2>&1

    - name: Generate Release Notes
      run: |
        echo "# SigmaOS ${{ steps.version.outputs.VERSION }}" > RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "## Sovereign Lattice Release" >> RELEASE_NOTES.md
        echo "- 600-shard modular C++ OOP architecture" >> RELEASE_NOTES.md
        echo "- ARM64 / x86_64 / RISC-V multi-arch support" >> RELEASE_NOTES.md
        echo "- Zero-trust security via SovereignSEL + SovereignEnclave" >> RELEASE_NOTES.md
        echo "- QEMU validated boot" >> RELEASE_NOTES.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: RELEASE_NOTES.md
        files: |
          RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
