name: OpenBSD & FreeBSD Security & Privilege Isolation Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  openbsd-freebsd-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify OpenBSD KARL Kernel Address Randomization
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/security/openbsd_karl.rs -o /tmp/test_karl && /tmp/test_karl

      - name: Verify OpenBSD Pledge & Unveil Sandbox Enforcement
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/security/sigma_pledge.rs -o /tmp/test_pledge && /tmp/test_pledge

      - name: Verify FreeBSD Capsicum Descriptor Sandbox Engine
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/security/capsicum.rs -o /tmp/test_capsicum && /tmp/test_capsicum

      - name: Verify FreeBSD VNET Virtualized Network Jails
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/security/jails.rs -o /tmp/test_jails && /tmp/test_jails
