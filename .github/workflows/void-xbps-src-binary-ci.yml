name: Void XBPS Source Binary CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  void-xbps-src-binary:
    name: Void Linux xbps-src Package Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable # v1
        with:
          toolchain: stable

      - name: Test Universal Package Importer
        run: |
          rustc --test src/package/sigma_pkg.rs --edition=2021 -o build/sigma_pkg_test && ./build/sigma_pkg_test
