name: Desktop Environment Matrix

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/04_desktop-environment-matrix.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * 0'  # Weekly

permissions:
  contents: read

jobs:
  desktop-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNOME Desktop
          - desktop: gnome
            version: "45"
            container: ubuntu:jammy
            deps: "libgtk-4-dev libadwaita-1-dev"
            build-cmd: "cargo build --features gnome --release"

          - desktop: gnome
            version: "46"
            container: ubuntu:mantic
            deps: "libgtk-4-dev libadwaita-1-dev"
            build-cmd: "cargo build --features gnome --release"

          # KDE Plasma
          - desktop: kde
            version: "5"
            container: ubuntu:jammy
            deps: "libkf5-dev libqt5-dev"
            build-cmd: "cargo build --features kde --release"

          - desktop: kde
            version: "6"
            container: ubuntu:mantic
            deps: "libkf6-dev libqt6-dev"
            build-cmd: "cargo build --features kde --release"

          # XFCE
          - desktop: xfce
            version: latest
            container: ubuntu:jammy
            deps: "libxfce4ui-2-dev libxfce4panel-2.0-dev"
            build-cmd: "cargo build --features xfce --release"

          # MATE Desktop
          - desktop: mate
            version: "1.26"
            container: ubuntu:jammy
            deps: "libmate-desktop-dev libmatecomponent-dev"
            build-cmd: "cargo build --features mate --release"

          # LXQt
          - desktop: lxqt
            version: latest
            container: ubuntu:jammy
            deps: "liblxqt-dev libqt5-dev"
            build-cmd: "cargo build --features lxqt --release"

          # Enlightenment
          - desktop: enlightenment
            version: "0.26"
            container: ubuntu:jammy
            deps: "libefl-dev libevas-dev"
            build-cmd: "cargo build --features enlightenment --release"

          # Wayland Compositors
          - desktop: wayland
            version: weston
            container: ubuntu:jammy
            deps: "libwayland-dev weston"
            build-cmd: "cargo build --features wayland --release"

          - desktop: wayland
            version: mutter
            container: ubuntu:jammy
            deps: "libwayland-dev mutter"
            build-cmd: "cargo build --features wayland --release"

          # Mir Display Server
          - desktop: mir
            version: latest
            container: ubuntu:jammy
            deps: "mir-dev"
            build-cmd: "cargo build --features mir --release"

          # X11
          - desktop: x11
            version: latest
            container: ubuntu:jammy
            deps: "libx11-dev libxrandr-dev"
            build-cmd: "cargo build --features x11 --release"

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update package manager
        run: |
          apt-get update

      - name: Install Rust
        run: |
          apt-get install -y curl build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Install desktop dependencies
        run: |
          apt-get install -y ${{ matrix.deps }}

      - name: Build for ${{ matrix.desktop }} ${{ matrix.version }}
        run: |
          source $HOME/.cargo/env
          ${{ matrix.build-cmd }}

      - name: Test desktop features
        continue-on-error: true
        run: |
          source $HOME/.cargo/env
          cargo test --features ${{ matrix.desktop }} --release

      - name: Report status
        if: always()
        run: |
          echo "Desktop ${{ matrix.desktop }} ${{ matrix.version }}: ${{ job.status }}"
