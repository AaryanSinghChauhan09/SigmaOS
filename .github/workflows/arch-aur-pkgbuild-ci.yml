name: Arch Linux PKGBUILD & AUR Helper CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  arch-pkgbuild-audit:
    permissions:
      contents: read
    name: Arch Pacman & Contrib Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7b737f3747eb115cf4e8f1766b8fb62b6948fb16 # stable
        with:
          toolchain: stable # stable

      - name: Verify Arch Pacman & Contrib Engine
        run: |
          mkdir -p build
          ./run_sigma_tests.sh
