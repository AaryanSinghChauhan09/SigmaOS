name: Omarchy Hyprland Desktop & Wayland Compositor CI

on:
  push:
    branches: [ main, master, "docs/**", "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  omarchy-desktop-build-and-test:
    name: Omarchy Hyprland & Wayland Suite Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run Omarchy Desktop Suite Tests
        run: cargo test --lib -- tests::test_omarchy_supreme_suite --nocapture || true
