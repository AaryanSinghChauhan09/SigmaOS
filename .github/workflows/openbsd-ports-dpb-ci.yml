name: "OpenBSD: Ports dpb Signify Audit CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  openbsd-dpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run OpenBSD ports dpb concurrent packaging & signify audit
        run: |
          mkdir -p build
          echo "Simulating OpenBSD dpb concurrent ports build..."
          ./run_sigma_tests.sh
