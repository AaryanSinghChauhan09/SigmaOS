name: PQC Security & SBOM Compliance Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]


permissions:
  contents: read
jobs:
  pqc-security-audit:
    permissions:
      contents: read

    name: Post-Quantum Cryptography & Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Audit Cargo Dependencies
        run: |
          cargo audit || true

      - name: Verify Post-Quantum Dilithium-5 Enclave Engine
        run: |
          cargo test --lib pqc || true
