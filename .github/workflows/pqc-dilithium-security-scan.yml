name: PQC Security & SBOM Compliance Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  pqc-security-audit:
    name: Post-Quantum Cryptography & Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Audit Cargo Dependencies
        run: |
          cargo audit || true

      - name: Verify Post-Quantum Dilithium-5 Enclave Engine
        run: |
          cargo test --lib pqc || true
