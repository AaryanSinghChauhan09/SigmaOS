name: "Post-Quantum Cryptography Dilithium Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pqc-security-scan:
    name: Post-Quantum Dilithium-5 & Kyber-1024 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Verify Post-Quantum Cryptographic key signatures & key exchange
        run: |
          echo "=== Auditing Dilithium-5 signatures & Kyber-1024 key encapsulation ==="
          cargo test --lib security
