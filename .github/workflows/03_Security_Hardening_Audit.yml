name: "03 🛡️ Security Hardening & PQC Integrity Audit"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily security audit at 02:00 UTC

permissions:
  contents: read

jobs:
  security-sandboxing-audit:
    name: Security Primitives & PQC Attestation Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify OpenBSD Pledge & Unveil Sandbox
        run: |
          cargo test --lib -- security::unveil::tests

      - name: Verify FreeBSD Capsicum Capability Sandbox
        run: |
          cargo test --lib -- security::bsd_hardening::tests

      - name: Verify Post-Quantum Cryptography (PQC) Measurement & Firmitas Attestation
        run: |
          cargo test --lib -- security::pqc_measurement::tests

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
