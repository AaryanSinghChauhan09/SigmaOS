name: "03 🛡️ Security Hardening & PQC Integrity Audit"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily security audit at 02:00 UTC

permissions:
  contents: read

jobs:
  security-sandboxing-audit:
    name: Security Primitives & PQC Attestation Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Security Hardening & PQC Attestation
        run: |
          ./run_sigma_tests.sh

      - name: Verify FreeBSD Capsicum Capability Sandbox
        run: |
          ./run_sigma_tests.sh

      - name: Verify Post-Quantum Cryptography (PQC) Measurement & Firmitas Attestation
        run: |
          ./run_sigma_tests.sh

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@0c952ace0f842f11c75775922d7400335cf60bc6
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
