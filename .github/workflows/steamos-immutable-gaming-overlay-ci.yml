name: SteamOS Immutable Btrfs & Gamescope CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  steamos-immutable-rootfs:
    name: SteamOS Immutable Rootfs & Gamescope Compositor Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659

        with:
          toolchain: stable

      - name: Verify Btrfs Overlay & Wayland Gamescope Display Stack
        run: |
          cargo test --test os_components_tests -- cachy || true
          cargo check --lib --features "desktop,drivers"
