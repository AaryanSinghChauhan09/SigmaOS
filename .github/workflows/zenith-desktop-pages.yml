name: Deploy Zenith Desktop Shell to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy Zenith Desktop Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: 20

      - name: Verify Zenith Desktop Static Assets
        run: |
          test -f zenith_desktop/index.html
          test -f zenith_desktop/index.js
          test -f zenith_desktop/index.css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zenith_desktop

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
