name: Linux Cgroups v2 & EEVDF Scheduler CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  linux-sched-cgroups-verify:
    name: Verify Linux cgroups v2 & EEVDF/BORE Scheduler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          toolchain: stable

      - name: Test Kernel Scheduler Submodule
        run: |
          rustc --test src/kernel/scheduler.rs --edition=2021 -o build/sched_test
          ./build/sched_test
