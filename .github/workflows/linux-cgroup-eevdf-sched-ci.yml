name: Linux Cgroups v2 & EEVDF Scheduler CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux-sched-cgroups-verify:
    permissions:
      contents: read

    name: Verify Linux cgroups v2 & EEVDF/BORE Scheduler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Test Kernel Scheduler Submodule
        run: |
          rustc --test src/kernel/scheduler.rs --edition=2021 -o build/sched_test
          ./build/sched_test
