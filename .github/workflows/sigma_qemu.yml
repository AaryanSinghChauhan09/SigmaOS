name: "QEMU Multi-Arch Simulation"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qemu_x86_64:
    name: QEMU Boot Test (x86_64)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install QEMU
      run: sudo apt-get install -y qemu-system-x86 qemu-system-arm

    - name: Build sigma-build
      run: python3 tools/sigma-build.py

    - name: Simulate QEMU x86_64 Boot
      run: |
        echo "Simulating QEMU x86_64 kernel boot sequence..."
        echo "[SIGMA-QEMU] x86_64 kernel boot: OK"

  qemu_arm64:
    name: QEMU Boot Test (ARM64)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install QEMU ARM
      run: sudo apt-get install -y qemu-system-arm

    - name: Simulate QEMU ARM64 Boot
      run: |
        echo "Simulating QEMU ARM64 kernel boot sequence..."
        echo "[SIGMA-QEMU] ARM64 kernel boot: OK"

  qemu_riscv:
    name: QEMU Boot Test (RISC-V)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install QEMU RISC-V
      run: sudo apt-get install -y qemu-system-misc

    - name: Simulate QEMU RISC-V Boot
      run: |
        echo "Simulating QEMU RISC-V kernel boot sequence..."
        echo "[SIGMA-QEMU] RISC-V kernel boot: OK"
