name: Kernel Syzkaller & TCP Fuzzer CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *' # Nightly run at 02:00 UTC

jobs:
  kernel-fuzzing:
    name: Syzkaller & TCP Seed Fuzzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Seed-Reproducible TCP Fuzzer Tests
        run: |
          cargo test --lib kernel::net::tcp_state_machine
