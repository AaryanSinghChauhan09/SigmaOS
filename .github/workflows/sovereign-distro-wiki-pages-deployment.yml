name: Linux & BSD Distro Wiki Pages Build & Sync Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  distro-wiki-pages-build:
    name: Build & Verify Distro Wiki Pages Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test Wiki Page Documentation Generators
        run: |
          mkdir -p build
          rustc --edition=2021 --test --cfg 'feature="standalone_test"' src/expanded_wiki_innovations.rs -o build/test_wiki_innovations
          ./build/test_wiki_innovations
