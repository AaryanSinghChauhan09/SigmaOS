name: Fedora DNF5 Advisory & DeltaRPM Reconstitution CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/compatibility/fedora.rs'
      - 'src/distro/fedora_parity.rs'
      - '.github/workflows/fedora-dnf5-advisory-ci.yml'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  fedora-dnf5-test:
    name: Verify Fedora DNF5 Security Advisory & DeltaRPM Engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@7b737f3747eb115cf4e8f1766b8fb62b6948fb16 # stable

      - name: Test Fedora Compatibility Modules
        run: |
          mkdir -p build
          rustc --test --edition=2021 src/compatibility/fedora.rs -o build/test_fedora_compat
          ./build/test_fedora_compat
          rustc --test --edition=2021 src/distro/fedora_parity.rs -o build/test_fedora_parity
          ./build/test_fedora_parity
