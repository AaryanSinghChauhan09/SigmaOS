name: "Slackware: SlackBuilds SBo Script CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  slackware-sbo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Slackware SlackBuilds SBo script verification
        run: |
          mkdir -p build
          echo "Simulating Slackware SBo script execution..."
          ./run_sigma_tests.sh
