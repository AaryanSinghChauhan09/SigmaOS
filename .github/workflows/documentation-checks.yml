name: Documentation Synchronization and Link Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-checks:
    name: Documentation Synchronization and Link Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        
      - name: Check for manual edits to wiki_content/
        run: |
          echo "Checking for manual edits to wiki_content/..."
          if git diff --name-only origin/main | grep -q "^wiki_content/"; then
            echo "ERROR: Manual edits detected in wiki_content/"
            echo "wiki_content/ should be auto-generated from docs/"
            echo "Please edit files in docs/ instead"
            exit 1
          fi
          echo "No manual edits detected in wiki_content/"

      - name: Check for manual edits to wiki/
        run: |
          echo "Checking for manual edits to wiki/..."
          if git diff --name-only origin/main | grep -q "^wiki/"; then
            echo "ERROR: Manual edits detected in wiki/"
            echo "wiki/ should be auto-generated from docs/"
            echo "Please edit files in docs/ instead"
            exit 1
          fi
          echo "No manual edits detected in wiki/"

      - name: Check for stale legacy mirrors
        run: |
          echo "Checking for stale legacy mirrors..."
          echo "Legacy directories (WIKI/, wiki_repo/) should not be edited"
          if git diff --name-only origin/main | grep -q "^WIKI/\|^wiki_repo/"; then
            echo "WARNING: Edits detected in legacy mirrors"
            echo "These directories are deprecated and will be removed"
            echo "Please edit files in docs/ instead"
          fi

      - name: Install markdown-link-check
        run: |
          npm install -g markdown-link-check

      - name: Check documentation links
        run: |
          echo "Checking documentation links in docs/..."
          find docs/ -name "*.md" -exec markdown-link-check {} \; || true

      - name: Check wiki links
        run: |
          echo "Checking wiki links..."
          find wiki/ -name "*.md" -exec markdown-link-check {} \; || true

      - name: Validate internal links
        run: |
          echo "Validating internal documentation structure..."
          echo "Checking that all referenced docs/ files exist..."

          # Simple check for common reference patterns
          cd docs/
          for file in *.md; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              # Extract markdown links
              grep -o '\[.*\](.*\.md)' "$file" | sed 's/.*(\(.*\))/\1/' | while read link; do
                if [ -n "$link" ] && [ ! -f "$link" ]; then
                  echo "WARNING: Broken link in $file: $link"
                fi
              done
            fi
          done

      - name: Check for duplicate documentation
        run: |
          echo "Checking for duplicate documentation..."
          echo "Looking for files with similar content..."

          # Check for duplicate titles
          cd docs/
          for file in *.md; do
            if [ -f "$file" ]; then
              title=$(head -1 "$file")
              echo "$file: $title"
            fi
          done | sort | uniq -d -c | while read count line; do
            if [ "$count" -gt "1" ]; then
              echo "WARNING: Duplicate title detected: $line"
            fi
          done

      - name: Verify documentation policy compliance
        run: |
          echo "Verifying documentation policy compliance..."

          # Check that DOCUMENTATION_SOURCE_POLICY.md exists
          if [ ! -f "docs/DOCUMENTATION_SOURCE_POLICY.md" ]; then
            echo "ERROR: DOCUMENTATION_SOURCE_POLICY.md not found"
            exit 1
          fi

          # Check that ARCHITECTURE_DECISIONS.md exists
          if [ ! -f "docs/ARCHITECTURE_DECISIONS.md" ]; then
            echo "ERROR: ARCHITECTURE_DECISIONS.md not found"
            exit 1
          fi

          # Check that PROJECT_STATUS.md exists
          if [ ! -f "docs/PROJECT_STATUS.md" ]; then
            echo "ERROR: PROJECT_STATUS.md not found"
            exit 1
          fi

          echo "Documentation policy compliance verified"

      - name: Generate documentation summary
        run: |
          echo "=== Documentation Summary ==="
          echo "docs/ files: $(find docs/ -name "*.md" | wc -l)"
          echo "wiki/ files: $(find wiki/ -name "*.md" | wc -l)"
          echo "wiki_content/ files: $(find wiki_content/ -name "*.md" 2>/dev/null | wc -l)"
          echo "WIKI/ files: $(find WIKI/ -name "*.md" 2>/dev/null | wc -l)"
          echo "wiki_repo/ files: $(find wiki_repo/ -name "*.md" 2>/dev/null | wc -l)"

      - name: Documentation check summary
        run: |
          echo "=== Documentation Check Summary ==="
          echo "✓ No manual edits to wiki_content/"
          echo "✓ No manual edits to wiki/"
          echo "✓ Documentation policy compliance verified"
          echo "⚠ Link checks are informational only (not blocking)"
          echo "⚠ Legacy mirrors (WIKI/, wiki_repo/) are deprecated"
          echo ""
          echo "Next steps:"
          echo "1. Implement automatic wiki generation from docs/"
          echo "2. Remove legacy mirrors after migration complete"
          echo "3. Make link checks blocking after cleanup"
