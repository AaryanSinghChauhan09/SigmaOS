name: Void Linux XBPS & Runit Service Supervisor CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  void-runit-verification:
    permissions:
      contents: read

    name: Void Linux XBPS Package Manager & Runit Supervisor Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Execute Void Linux Runit & XBPS Subsystem Verification
        run: |
          rustc --test src/process/activity_manager.rs -o test_act
          ./test_act
          rustc --test src/memory/segmentation_paging.rs -o test_seg
          ./test_seg
