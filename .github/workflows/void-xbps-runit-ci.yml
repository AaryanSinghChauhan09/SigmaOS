name: Void Linux XBPS & runit CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  void-runit-verification:
    name: Void Linux XBPS Package Manager & runit Supervisor Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Void Linux Test Suite
        run: |
          ./run_sigma_tests.sh
