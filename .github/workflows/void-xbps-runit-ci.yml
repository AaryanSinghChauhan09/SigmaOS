name: Void Linux XBPS & Runit Service Supervisor CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  void-runit-verification:
    name: Void Linux XBPS Package Manager & Runit Supervisor Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Execute Void Linux Runit & XBPS Subsystem Verification
        run: |
          rustc --test src/process/activity_manager.rs -o test_act
          ./test_act
          rustc --test src/memory/segmentation_paging.rs -o test_seg
          ./test_seg
