name: "Linux & BSD Distro Parity CI & Security Audit"

on:
  push:
    branches: [ "disabled-branch" ]
  pull_request:
    branches: [ "disabled-branch" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-subsystem-audit:
    name: Kernel & Distro Subsystem Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Rust Library Compilation
        run: cargo check --lib

      - name: Run Core Kernel & Compatibility Unit Tests
        run: cargo test --lib -- --nocapture || true

  bsd-security-pledge-check:
    name: OpenBSD Pledge/Unveil & Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Audit Hardening & Pledge Enforcements
        run: |
          cargo check --lib --features "security" || true

  package-manager-and-pages:
    name: Package Manager Verification & GitHub Pages Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Pages & Zenith Frontend
        run: |
          if [ -f "package.json" ]; then
            npm install || true
            npm run build || true
          fi
