name: Intel Clear Linux Stateless Config & Clr-boot-manager CI
permissions:
  contents: read


on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  clear-linux-stateless:
    name: Intel Clear Linux Stateless /etc & /usr Resolution & Boot Manager Audit

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test Clear Linux Stateless Engine & Bundle Manager
        run: |
          echo "Testing Clear Linux stateless configuration resolution and swupd bundle manager..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
