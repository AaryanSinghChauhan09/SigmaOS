name: Continuous Integration Workflows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  nodejs-ci:
    name: Node.js CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies & run build
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build --if-present
            npm test --if-present || true
          fi

  python-ci:
    name: Python CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & test
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            pytest || true
          fi

  cpp-cmake-ci:
    name: C/C++ CMake CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build C++ Test Harness
        run: |
          g++ -std=c++20 -I. -Iinclude -DTEST_RUNNER -o test_runner tests/sigma_test_runner.cpp kernel/containers/sigma_oci_runtime.cpp kernel/tests/sigma_hw_test.cpp || true
          if [ -f ./test_runner ]; then ./test_runner; fi

  docker-ci:
    name: Docker Build CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile availability
        run: |
          if [ -f Dockerfile ]; then
            docker build . -t sigmaos:ci || true
          fi
