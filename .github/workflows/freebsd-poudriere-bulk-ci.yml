name: "FreeBSD: Poudriere Bulk Jail Package CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  freebsd-poudriere:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run FreeBSD Poudriere bulk jail package verification
        run: |
          mkdir -p build
          echo "Simulating FreeBSD Poudriere jail bulk build..."
          ./run_sigma_tests.sh
