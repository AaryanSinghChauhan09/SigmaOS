name: FreeBSD VNET Jail & GEOM Storage CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  freebsd-vnet-geom-verification:
    name: FreeBSD VNET Jail Networking & GEOM/GELI Storage Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run FreeBSD Subsystem Suite
        run: |
          ./run_sigma_tests.sh
