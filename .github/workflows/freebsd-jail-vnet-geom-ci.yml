name: FreeBSD Jail Isolation, VNET & GEOM Storage CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  freebsd-jail-geom-test:
    name: FreeBSD Jail, VNET Virtual Network & GEOM Storage Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test FreeBSD Subsystems Parity
        run: |
          rustc --test src/memory/segmentation_paging.rs -o test_seg
          ./test_seg
          rustc --test src/process/activity_manager.rs -o test_act
          ./test_act
