name: Debian & Ubuntu APT Duo Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-ubuntu-deploy:
    name: Debian Dpkg, APT Repository & SysVinit Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Debian & Ubuntu Compatibility Layer
        run: |
          cargo test --lib compatibility::debian
