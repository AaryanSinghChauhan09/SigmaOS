name: Debian & Ubuntu APT Repository Deployment CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  debian-apt-verification:
    name: Debian Control & APT Sync Matrix Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Debian & System Verification Tests
        run: |
          ./run_sigma_tests.sh
