name: "Alpine Linux: abuild APKBUILD aports CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  alpine-abuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Alpine abuild APKBUILD packaging verification
        run: |
          mkdir -p build
          echo "Simulating Alpine abuild APKBUILD package creation..."
          ./run_sigma_tests.sh
