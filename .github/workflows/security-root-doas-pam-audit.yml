name: Security - BSD Securelevel, Doas & PAM Stack Audit

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  doas-pam-security-audit:
    name: Root Improvement, Doas & PAM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1 # stable

      - name: Run Doas & PAM Root Improvement Unit Tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test src/security/root_improvement.rs -o build/root_test
          ./build/root_test
          rm -f build/root_test
