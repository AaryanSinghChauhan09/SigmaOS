name: Alpine Abuild & APK Security CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  alpine-abuild-apk:
    name: Alpine Linux Abuild APK Package Security Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Test Alpine abuild fast initramfs & APK world engine
        run: |
          echo "Testing Alpine Linux abuild initramfs and APK security..."
          rustc --edition=2021 --test src/distro/missing_distro_innovations.rs --cfg 'feature="standalone_test"' -o build/test_alpine_abuild && ./build/test_alpine_abuild
