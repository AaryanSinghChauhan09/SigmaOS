name: Chimera Linux CFI Hardening & Dinit Supervisor CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  chimera-dinit-verification:
    name: Chimera Linux LLVM/Clang CFI Hardening & Dinit Service Supervisor Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Chimera Linux Parity Suite
        run: |
          ./run_sigma_tests.sh
