name: Chimera Linux CFI Hardening & Dinit Supervisor Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chimera-test:
    name: Chimera Linux Dinit Supervisor & Clang CFI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Chimera Linux Dinit & Userland Parity
        run: |
          cargo test --lib compatibility::chimera_linux
