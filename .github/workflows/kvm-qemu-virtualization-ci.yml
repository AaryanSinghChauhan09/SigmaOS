name: QEMU/KVM Virtualization & Hardware Acceleration CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  kvm-qemu-virtualization-test:
    name: Validate QEMU/KVM Hypervisor Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run KVM Virtualization Unit Tests
        run: |
          cargo test --lib virtualization::vm_manager
