name: Arch Linux Pacman & AUR Sandboxed Makepkg CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  arch-pacman-ci:
    permissions:
      contents: read

    name: Arch Pacman & PKGBUILD Recipe Compiler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Test Arch Recipe Compiler & Dependency Resolver
        run: cargo test --lib -- distro::arch_parity::tests

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
