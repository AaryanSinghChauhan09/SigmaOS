name: NixOS Flake Hermetic Store Closure & GC CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  nixos-flake-ci:
    permissions:
      contents: read

    name: NixOS Flake & Store Closure Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Test Nix Store GC & Flake Engine
        run: cargo test --lib -- unimplemented_features::extra_unimplemented_tests::test_sovereign_nix_gc_engine

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
