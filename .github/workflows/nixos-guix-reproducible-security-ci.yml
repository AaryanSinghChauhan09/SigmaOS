name: NixOS & GNU Guix Reproducible Builds & Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  reproducible-builds-verification:
    name: Nix Store Derivation & Guix Reproducible Build Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@39cd7d8a6567312886107b533db551532454b8a0 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pytest

      - name: Run Reproducible Build & PQC Cryptographic Verification
        run: PYTHONDONTWRITEBYTECODE=1 pytest tests/test_unit_core.py tests/test_stress_fuzz_bench.py
