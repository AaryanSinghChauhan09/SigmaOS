name: SigmaOS Sovereign CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1: Dependency Purity Gate
  # Ensures no Python/JS files exist inside kernel suites S01-S10
  # ─────────────────────────────────────────────────────────────────────────────
  dependency_purity:
    name: "🔒 Dependency Purity Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile sovereign-audit tool
        run: |
          gcc -std=c11 -O2 -Wall \
            tools/sovereign_audit/sovereign_audit.c \
            -o sigma-audit
          echo "✅ sigma-audit built"

      - name: Run dependency purity scan on kernel suites
        run: |
          # Scan ONLY the kernel suites (S01-S10) — tooling Python is allowed
          python_in_kernel=$(find kernel/suites -name "*.py" -o -name "*.js" 2>/dev/null | head -5)
          if [ -n "$python_in_kernel" ]; then
            echo "❌ FOREIGN DEPS IN KERNEL SUITES:"
            echo "$python_in_kernel"
            exit 1
          fi
          echo "✅ Kernel suites S01-S10: zero foreign runtime dependencies"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 2: Build Native Toolchain
  # Compile all tools/ C binaries — fail if any do not compile cleanly
  # ─────────────────────────────────────────────────────────────────────────────
  build_toolchain:
    name: "🔧 Build Native Toolchain"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sigma-audit
        run: gcc -std=c11 -O2 -Wall -Wpedantic -I include tools/sovereign_audit/sovereign_audit.c -o sigma-audit

      - name: Build sigma-test
        run: gcc -std=c11 -O2 -Wall -I include tools/sovereign_test/sovereign_test_runner.c -o sigma-test

      - name: Build sigma-wiki
        run: gcc -std=c11 -O2 -Wall -I include tools/sovereign_wiki/sovereign_wiki_builder.c -o sigma-wiki

      - name: Build sigma-shell
        run: gcc -std=c11 -O2 -Wall -I include tools/sovereign_shell/sovereign_shell.c -o sigma-shell

      - name: Build sigma-depgraph
        run: gcc -std=c11 -O2 -Wall -I include tools/sovereign_depgraph/sovereign_depgraph.c -o sigma-depgraph

      - name: Build sigma-pkg
        run: gcc -std=c11 -O2 -Wall -I include tools/sovereign_pkg/sovereign_pkg_manager.c -o sigpkg

      - name: Verify all binaries are statically linked (no glibc runtime)
        run: |
          for bin in sigma-audit sigma-test sigma-wiki sigma-shell sigma-depgraph sigpkg; do
            echo "=== $bin ==="
            ldd $bin || true
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 3: Kernel Shard Compilation Check
  # Try-compile every .c shard across all suites with strict C11 flags
  # ─────────────────────────────────────────────────────────────────────────────
  shard_compile_check:
    name: "⚙️ Kernel Shard Compile Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile-check all 33 kernel suites (C11 strict)
        run: |
          FAIL=0
          for f in $(find kernel/suites -name "*.c" | sort); do
            # Use -nostdinc to ensure zero dependency on host system headers
            gcc -std=c11 -fsyntax-only -Wall -Wextra \
                -nostdinc -I include -I libc \
                -D__SIGMAOS__ \
                "$f" && echo "✅ $f" || \
                { echo "❌ $f FAILED (SYXTAX OR PURITY ERROR)"; FAIL=1; }
          done
          if [ $FAIL -ne 0 ]; then exit 1; fi
          echo "✅ All 33 suites passed 100% industrial purity check"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 4: Run Native Test Suite
  # ─────────────────────────────────────────────────────────────────────────────
  native_tests:
    name: "🧪 Native Test Suite"
    runs-on: ubuntu-latest
    needs: [build_toolchain]
    steps:
      - uses: actions/checkout@v4

      - name: Build and run sigma-test
        run: |
          gcc -std=c11 -O2 -I include tools/sovereign_test/sovereign_test_runner.c -o sigma-test
          ./sigma-test || { echo "❌ TESTS FAILED"; exit 1; }
          echo "✅ ALL TESTS PASSED"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 5: Auto-generate Wiki on every main push
  # ─────────────────────────────────────────────────────────────────────────────
  wiki_update:
    name: "📚 Auto-generate Sovereign Wiki"
    runs-on: ubuntu-latest
    needs: [shard_compile_check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sigma-wiki
        run: gcc -std=c11 -O2 tools/sovereign_wiki/sovereign_wiki_builder.c -o sigma-wiki

      - name: Generate wiki table
        run: ./sigma-wiki kernel/suites WIKI/AUTO_SOVEREIGN_WIKI.md

      - name: Commit updated wiki if changed
        run: |
          git config user.name  "sigma-bot"
          git config user.email "bot@sigmaos.dev"
          git add WIKI/AUTO_SOVEREIGN_WIKI.md
          git diff --cached --quiet || \
            git commit -m "docs(wiki): auto-update sovereign shard index [skip ci]"
          git push || true
