name: Kernel ABI & System Call Compliance Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]


permissions:
  contents: read
jobs:
  kernel-abi-check:
    name: Linux/BSD Syscall ABI Compatibility Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Syscall ABI Translator Test Suite
        run: |
          cargo test --lib emulate_syscall_translate || true
          cargo test --lib test_syscall || true
