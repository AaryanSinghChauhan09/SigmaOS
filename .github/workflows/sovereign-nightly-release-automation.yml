name: "Sovereign: Nightly Release Automation & Cosign Signing"
on:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
  id-token: write
jobs:
  nightly-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build Nightly Release Artifacts
        run: |
          mkdir -p build
          cargo build --release --lib
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
      - name: Sign Nightly Binary with Cosign
        run: |
          cosign sign-blob --yes target/release/libsigmaos.rlib --output-signature target/release/libsigmaos.rlib.sig
