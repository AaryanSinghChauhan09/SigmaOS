name: FreeBSD Capsicum & MAC Framework Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  bsd-capsicum-mac:
    name: FreeBSD Capsicum Sandbox & Mandatory Access Control Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run FreeBSD MAC Framework & Capsicum Tests
        run: |
          mkdir -p build && rustc --test --edition=2021 src/distro/linux_bsd_pinnacle_synthesis.rs -o build/freebsd_mac_test && ./build/freebsd_mac_test
