name: Sovereign Silicon CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Ubuntu: Full ELF kernel build + link ────────────────────────────────
  kernel_build_linux:
    name: "Kernel Build (Linux ELF)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache build objects
        uses: actions/cache@v4
        with:
          path: build/
          key: sovereign-build-linux-${{ hashFiles('suites/**', 'build_sovereign.sh') }}
          restore-keys: |
            sovereign-build-linux-

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm g++ binutils

      - name: Repair Build Environment
        run: node repair_build.js

      - name: Build Sovereign Lattice
        run: |
          chmod +x ./build_sovereign.sh
          ./build_sovereign.sh

      - name: Upload kernel binary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sigmaos_zenith_linux
          path: build/sigmaos_zenith
          if-no-files-found: warn

      - name: Run Sovereign Atomic Tests
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh

  # ── macOS: Compilation validation only (no ELF link) ───────────────────
  compilation_macos:
    name: "Compilation Validation (macOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Tools
        run: |
          brew install nasm || brew upgrade nasm || true
          brew install gcc || true

      - name: Repair Build Environment
        run: node repair_build.js

      - name: Validate Compilation (macOS)
        run: |
          chmod +x ./build_sovereign.sh
          ./build_sovereign.sh
