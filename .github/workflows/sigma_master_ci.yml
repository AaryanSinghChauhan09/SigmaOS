name: Sovereign Silicon CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  silicon_build:
    name: "Lattice Build & Test"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib ld-linux-x86-64

      - name: Install Build Tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install nasm

      - name: Build Sovereign Lattice
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            powershell ./build_sovereign.ps1
          else
            chmod +x ./build_sovereign.sh
            ./build_sovereign.sh
          fi

      - name: Run Sovereign Atomic Tests
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            powershell ./run_sigma_tests.ps1
          else
            chmod +x ./run_sigma_tests.sh
            ./run_sigma_tests.sh
          fi
