name: 👑 Sovereign Singularity CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  purity_and_toolchain:
    name: "🔒 Purity Gate & Native Toolchain"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu make python3

      - name: Compile Sovereign Toolchain
        run: |
          cd tools
          make all


      - name: Foreign Dependency Scan (kernel/suites)
        run: |
          python_in_kernel=$(find kernel/suites -name "*.py" -o -name "*.js" 2>/dev/null | head -5)
          if [ -n "$python_in_kernel" ]; then
            echo "❌ FOREIGN DEPS IN KERNEL SUITES:"; echo "$python_in_kernel"; exit 1
          fi

  bare_metal_build:
    name: "⚙️ Bare-Metal Kernel Shard Compilation"
    runs-on: ubuntu-latest
    needs: [purity_and_toolchain]
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain
        run: sudo apt-get install -y gcc-x86-64-linux-gnu

      - name: Create Build Directory
        run: mkdir -p build

      - name: Multi-Arch Shard Compilation
        run: |
          for src in $(find kernel/suites kernel/libc arch -name "*.c" 2>/dev/null); do
            NAME=$(basename "${src%.*}")
            x86_64-linux-gnu-gcc -std=c11 -ffreestanding -O2 -m64 \
                -I./include -I./kernel/libc -I./kernel/suites \
                -nostdlib -fno-stack-protector \
                -c "$src" -o "build/${NAME}_shard.o"
          done

  static_analysis:
    name: "🏛️ Sovereign Structural Registry Analysis"
    runs-on: ubuntu-latest
    needs: [bare_metal_build]
    steps:
      - uses: actions/checkout@v4

      - name: Verify Sovereign Registries
        run: |
            echo "Σ [STATIC]: Scanning for registry shards..."
            for suite in kernel/suites/S*; do
                if [ -d "$suite/shards" ]; then
                    if ls "$suite/shards"/*Registry.c >/dev/null 2>&1; then
                        echo "Σ [OK]: Registry found in $suite"
                    else
                        echo "Σ [FAIL]: Registry MISSING in $suite"; exit 1
                    fi
                fi
            done

  wiki_and_release:
    name: "📚 Wiki Sync & Release"
    runs-on: ubuntu-latest
    needs: [static_analysis]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Release Stubs
        run: |
          touch SigmaOS_Zenith_Supreme.iso
          echo "vROADMAP_1005" > VERSION

      - name: Build & Deploy Wiki
        run: |
          cd tools
          make sigma-wiki
          ./sigma-wiki ../kernel/suites ../WIKI/AUTO_SOVEREIGN_WIKI.md

          git config user.name  "sigma-bot"
          git config user.email "bot@sigmaos.dev"
          git add WIKI/AUTO_SOVEREIGN_WIKI.md
          git diff --cached --quiet || (git commit -m "docs(wiki): auto-update sovereign shard index [skip ci]" && git push)

