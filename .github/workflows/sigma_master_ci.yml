name: Sovereign Master CI Pipeline
on:
  push:
    branches: ["main", "master", "fix/*", "feat/*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Rust Core OS, Subsystems, Security & Distro Test Suite ─────────────
  sovereign_rust_suite:
    name: "SigmaOS Sovereign Test Suite & Distro Parity Inspection"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1 # stable

      - name: Prepare Build Environment
        run: mkdir -p build

      - name: Execute Complete Sovereign Test Suite
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh

      - name: Verify eBPF XDP Fastpath Subsystem
        run: |
          rustc --test src/kernel/ebpf.rs --edition=2021 -o build/ebpf_test
          ./build/ebpf_test

      - name: Verify FreeBSD Jails & GEOM Storage Subsystem
        run: |
          rustc --test src/compatibility/freebsd_jails.rs --edition=2021 -o build/jails_test
          ./build/jails_test

      - name: Verify Kernel Kdump Observability Subsystem
        run: |
          rustc --test src/kernel/watchdog.rs --edition=2021 -o build/watchdog_test
          ./build/watchdog_test

      - name: Verify Linux Cgroups & EEVDF Scheduler Subsystem
        run: |
          rustc --test src/memory/cgroups.rs --edition=2021 -o build/cgroups_test
          ./build/cgroups_test

      - name: Verify OpenBSD Pledge & Unveil Security Subsystem
        run: |
          rustc --test src/security/input_validation.rs --edition=2021 -o build/validation_test
          ./build/validation_test

      - name: Verify Universal Multi-Format Packaging Subsystem
        run: |
          rustc --test src/package/universal.rs --edition=2021 -o build/universal_pkg_test
          ./build/universal_pkg_test

      - name: Verify Arch Pacman & AUR Parity Subsystem
        run: |
          rustc --test src/sigpkg/pacman.rs --edition=2021 -o build/pacman_test
          ./build/pacman_test

      - name: Verify Desktop Zenith Compositor & Window Manager
        run: |
          rustc --test src/graphics/zenith.rs --edition=2021 -o build/zenith_test
          ./build/zenith_test

      - name: Verify Audio & Indicator Sound Subsystem
        run: |
          rustc --test src/audio/sigma_audio.rs --edition=2021 -o build/audio_test
          ./build/audio_test

      - name: Verify Multi-Distro Schedulers Subsystem
        run: |
          rustc --test src/scheduler/distro_schedulers.rs --edition=2021 -o build/sched_test
          ./build/sched_test

      - name: Verify System Startup Telemetry Subsystem
        run: |
          rustc --test src/system/startup.rs --edition=2021 -o build/startup_test
          ./build/startup_test
