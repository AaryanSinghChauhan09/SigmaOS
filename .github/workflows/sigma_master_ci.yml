name: Sovereign Silicon CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ubuntu: Full ELF kernel build + link ────────────────────────────────
  kernel_build_linux:
    name: "Kernel Build (Linux ELF)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache build objects
        uses: actions/cache@v4
        with:
          path: build/
          key: build-linux-${{ hashFiles('suites/**', 'build_sovereign.sh') }}
          restore-keys: |
            build-linux-

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm g++ binutils

      - name: Repair Build Environment
        run: node repair_build.js

      - name: Build Sovereign Lattice
        run: |
          chmod +x ./build_sovereign.sh
          ./build_sovereign.sh

      - name: Upload kernel binary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sigmaos_zenith_linux
          path: build/sigmaos_zenith
          if-no-files-found: warn

      - name: Run Sovereign Atomic Tests
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh

  # ── Windows: Compilation validation (Fixed 100% failure rate) ───────────
  compilation_windows:
    name: "Compilation Validation (Windows)"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Tools (Choco)
        shell: pwsh
        run: |
          choco install nasm -y
          choco install mingw -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Repair Build Environment
        run: node repair_build.js

      - name: Validate Compilation (Windows)
        shell: bash
        run: |
          chmod +x ./build_sovereign.sh
          ./build_sovereign.sh

  # ── macOS: Compilation validation only ──────────────────────────────────
  compilation_macos:
    name: "Compilation Validation (macOS)"
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Tools
        run: |
          brew install nasm || brew upgrade nasm || true
          brew install gcc || true

      - name: Repair Build Environment
        run: node repair_build.js

      - name: Validate Compilation (macOS)
        run: |
          chmod +x ./build_sovereign.sh
          ./build_sovereign.sh

  # ── Security: CodeQL Audit (Optimized to reduce 2h runtime) ───────────
  security_audit:
    name: "Sovereign Security Audit (CodeQL)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'cpp'
          queries: security-and-quality

      - name: Build for CodeQL (Manual Mode)
        run: |
          chmod +x ./build_sovereign.sh
          ./build_sovereign.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
