name: "Fuzzing & Memory Sanitizer Security Suite"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  fuzzing-and-sanitizers:
    name: Memory Safety & Input Validation Fuzzing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Input Validation & Vulnerability Scans
        run: |
          cargo test --lib security::input_validation::tests -- --nocapture
          cargo test --lib security::vulnerability::tests -- --nocapture
