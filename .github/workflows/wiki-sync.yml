name: "Wiki Sync"

on:
  push:
    paths:
      - 'WIKI/**'
    branches:
      - main

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SigmaOS
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout Wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Wiki Changes
        run: |
          cp -r main/WIKI/* wiki/
          cd wiki
          git config user.name "SigmaOS Bot"
          git config user.email "bot@sigmaos.org"
          git add .
          git commit -m "docs: sync wiki from main repo [skip ci]" || echo "No changes to commit"
          git push origin master || echo "Push failed"
