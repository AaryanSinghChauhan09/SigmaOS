name: openSUSE Snapper CoW Recovery CI

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  snapper-cow-recovery:
    permissions:
      contents: write
      pages: write
      id-token: write

    name: Snapper Pre/Post CoW Transaction Recovery Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Test Snapper Transaction Guard
        run: |
          cargo test --test linux_bsd_inspection_tests test_wiki_distro_innovations_inspection
