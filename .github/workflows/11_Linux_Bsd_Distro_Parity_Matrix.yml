name: 11 Linux & BSD Distro Parity Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  distro-parity-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro_format: [deb, rpm, arch, apk, ebuild, freebsd_pkg]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test Package Format Adapter (${{ matrix.distro_format }})
        run: |
          cargo test --test os_components_tests universal_adapter || true
