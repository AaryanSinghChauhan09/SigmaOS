name: 11 Linux & BSD Distro Parity Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  distro-parity-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro_format: [deb, rpm, arch, apk, ebuild, freebsd_pkg]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Test Package Format Adapter (${{ matrix.distro_format }})
        run: |
          ./run_sigma_tests.sh
