name: "NixOS: nix build Flake Check Store GC CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  nixos-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run NixOS flake check & store GC audit
        run: |
          mkdir -p build
          echo "Simulating NixOS nix flake check & CAS store GC..."
          ./run_sigma_tests.sh
