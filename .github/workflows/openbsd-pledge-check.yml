name: Verify OpenBSD Pledge and Unveil Policies

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]


permissions:
  contents: read
jobs:
  pledge-unveil-verify:
    name: Verify OpenBSD Pledge and Unveil Policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Pledge & Unveil Tests
        run: cargo test --lib security::pledge
