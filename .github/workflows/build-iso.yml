name: Build SigmaOS ISO

on:
  push:
    branches: [ main ]
    paths:
      - 'iso/**'
      - 'scripts/build_archiso.sh'
      - 'scripts/reassemble-iso.sh'
      - '.github/workflows/build-iso.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'iso/**'
      - 'scripts/build_archiso.sh'
      - 'scripts/reassemble-iso.sh'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

# contents:write is required so the final step can create the GitHub Release
# that hosts the split ISO assets (gh release create -> 403 without it).
permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Free disk space for ISO build
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
          /opt/ghc /usr/local/.ghcup /usr/share/swift \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        sudo docker system prune -af || true
        df -h /

    - name: Validate ISO profile
      run: |
        bash scripts/build_archiso.sh --validate-only
        
    - name: Build ISO with Docker
      run: |
        bash scripts/build_archiso.sh --docker
        
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: sigmaos-desktop-iso
        path: out/*.iso
        retention-days: 7
        
    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: out/build.log
        retention-days: 7

    # Real boot regression test: boots the freshly built kernel+initramfs in
    # QEMU (TCG) and requires a userspace marker on the serial console.
    # Catches the broken-initramfs class of bug before a release is cut.
    - name: Install QEMU for boot smoke test
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-system-x86 xorriso >/dev/null

    - name: Boot smoke test (QEMU)
      run: bash scripts/ci/qemu_iso_boot.sh "$(ls out/*.iso | head -1)" out/qemu-boot 1500

    - name: Get ISO filename
      id: iso-name
      run: |
        ISO_FILE=$(ls out/*.iso | head -1)
        ISO_NAME=$(basename "$ISO_FILE")
        echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
        
    - name: Create release summary
      run: |
        echo "## SigmaOS ISO Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**ISO Name:** ${{ steps.iso-name.outputs.iso_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Features" >> $GITHUB_STEP_SUMMARY
        echo "- Stock Arch Linux kernel" >> $GITHUB_STEP_SUMMARY
        echo "- Hyprland Wayland compositor" >> $GITHUB_STEP_SUMMARY
        echo "- Waybar status bar" >> $GITHUB_STEP_SUMMARY
        echo "- Wallust dynamic theming" >> $GITHUB_STEP_SUMMARY
        echo "- PipeWire audio stack" >> $GITHUB_STEP_SUMMARY
        echo "- 105 curated packages (lean ~3.3 GB ISO)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download" >> $GITHUB_STEP_SUMMARY
        echo "Download the ISO from the artifacts below." >> $GITHUB_STEP_SUMMARY

    # Produce a Secure-Boot-signed ISO variant. Non-fatal: if signing or its
    # tooling fails, the standard (unsigned) ISO still publishes normally.
    # Uses secrets SIGMAOS_SB_KEY/SIGMAOS_SB_CRT if set, else a per-build key
    # whose cert is published for one-time MOK/db enrolment.
    - name: Sign ISO for Secure Boot
      if: success()
      continue-on-error: true
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq xorriso mtools sbctl >/dev/null
        ISO=$(ls out/*.iso | head -1)
        SB_DIR=secureboot-keys
        if [[ -n "${SIGMAOS_SB_KEY:-}" && -n "${SIGMAOS_SB_CRT:-}" ]]; then
          mkdir -p "$SB_DIR"
          printf '%s' "$SIGMAOS_SB_KEY" | base64 -d > "$SB_DIR/db.key" || true
          printf '%s' "$SIGMAOS_SB_CRT" | base64 -d > "$SB_DIR/db.crt" || true
          chmod 600 "$SB_DIR/db.key"
          echo "Using release signing key from secrets."
        fi
        mkdir -p sb_out
        scripts/sign-iso-secureboot.sh "$ISO" "sb_out/$(basename "${ISO%.iso}")-secureboot.iso" "$SB_DIR"
        # Split the signed ISO too and stage it + the cert for the release.
        SBISO="sb_out/$(basename "${ISO%.iso}")-secureboot.iso"
        [[ -f "$SBISO" ]] || { echo "signed ISO not produced"; exit 0; }
        mkdir -p release_parts
        SBASE=$(basename "$SBISO")
        split -d -b 1900m --additional-suffix=.part "$SBISO" "release_parts/${SBASE}."
        (cd release_parts && sha256sum *.part > "${SBASE}.parts.sha256")
        (cd sb_out && sha256sum "$SBASE" > "../release_parts/${SBASE}.sha256")
        cp "$SB_DIR/db.crt" release_parts/SigmaOS-SecureBoot-CA.crt
        echo "Secure Boot variant staged: $SBASE"
      env:
        SIGMAOS_SB_KEY: ${{ secrets.SIGMAOS_SB_KEY }}
        SIGMAOS_SB_CRT: ${{ secrets.SIGMAOS_SB_CRT }}

    - name: Split ISO and publish rolling release
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        ISO=$(ls out/*.iso | head -1)
        BASE=$(basename "$ISO")
        STAMP=$(date +%Y.%m.%d)
        mkdir -p release_parts
        # Split into <2 GiB parts (GitHub asset limit) with .part suffix.
        split -d -b 1900m --additional-suffix=.part "$ISO" "release_parts/${BASE}."
        # Checksums for the whole ISO and for the parts.
        (cd release_parts && sha256sum *.part > "${BASE}.parts.sha256")
        (cd out && sha256sum "$BASE" > "../release_parts/${BASE}.sha256")
        # Each build publishes a new dated release (releases are immutable,
        # so never reuse a tag). Users grab the newest by date.
        TAG="sigmaos-desktop-${STAMP}-run${{ github.run_number }}"
        gh release create "$TAG" \
          --title "SigmaOS Desktop ${STAMP}" \
          --notes "SigmaOS live ISO (BIOS+UEFI), built by CI run ${{ github.run_number }}. Assets include the standard ISO plus a Secure-Boot-signed variant (*-secureboot.iso) and SigmaOS-SecureBoot-CA.crt for one-time key enrolment. See the Wiki 'ISO Build Guide'." \
          release_parts/*
        echo "Published release: https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> $GITHUB_STEP_SUMMARY
