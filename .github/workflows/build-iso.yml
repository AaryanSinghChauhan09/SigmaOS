name: Build SigmaOS ISO

on:
  push:
    branches: [ main ]
    paths:
      - 'iso/**'
      - 'scripts/build_archiso.sh'
      - 'scripts/reassemble-iso.sh'
      - '.github/workflows/build-iso.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'iso/**'
      - 'scripts/build_archiso.sh'
      - 'scripts/reassemble-iso.sh'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Free disk space for ISO build
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
          /opt/ghc /usr/local/.ghcup /usr/share/swift \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        sudo docker system prune -af || true
        df -h /

    - name: Validate ISO profile
      run: |
        bash scripts/build_archiso.sh --validate-only
        
    - name: Build ISO with Docker
      run: |
        bash scripts/build_archiso.sh --docker
        
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: sigmaos-desktop-iso
        path: out/*.iso
        retention-days: 7
        
    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: out/build.log
        retention-days: 7
        
    - name: Get ISO filename
      id: iso-name
      run: |
        ISO_FILE=$(ls out/*.iso | head -1)
        ISO_NAME=$(basename "$ISO_FILE")
        echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
        
    - name: Create release summary
      run: |
        echo "## SigmaOS ISO Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**ISO Name:** ${{ steps.iso-name.outputs.iso_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Features" >> $GITHUB_STEP_SUMMARY
        echo "- Stock Arch Linux kernel" >> $GITHUB_STEP_SUMMARY
        echo "- Hyprland Wayland compositor" >> $GITHUB_STEP_SUMMARY
        echo "- Waybar status bar" >> $GITHUB_STEP_SUMMARY
        echo "- Wallust dynamic theming" >> $GITHUB_STEP_SUMMARY
        echo "- PipeWire audio stack" >> $GITHUB_STEP_SUMMARY
        echo "- 116 curated packages" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download" >> $GITHUB_STEP_SUMMARY
        echo "Download the ISO from the artifacts below." >> $GITHUB_STEP_SUMMARY

    - name: Split ISO and publish rolling release
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        ISO=$(ls out/*.iso | head -1)
        BASE=$(basename "$ISO")
        STAMP=$(date +%Y.%m.%d)
        mkdir -p release_parts
        # Split into <2 GiB parts (GitHub asset limit) with .part suffix.
        split -d -b 1900m --additional-suffix=.part "$ISO" "release_parts/${BASE}."
        # Checksums for the whole ISO and for the parts.
        (cd release_parts && sha256sum *.part > "${BASE}.parts.sha256")
        (cd out && sha256sum "$BASE" > "../release_parts/${BASE}.sha256")
        # Each build publishes a new dated release (releases are immutable,
        # so never reuse a tag). Users grab the newest by date.
        TAG="sigmaos-desktop-${STAMP}-run${{ github.run_number }}"
        gh release create "$TAG" \
          --title "SigmaOS Desktop ${STAMP}" \
          --notes "SigmaOS live ISO (BIOS+UEFI), built by CI run ${{ github.run_number }}. See the Wiki 'ISO Build Guide' for Secure Boot, flashing, and reassembly." \
          release_parts/*
        echo "Published release: https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> $GITHUB_STEP_SUMMARY
