name: SLSA Level 3 Provenance & Cosign Deployment CI

permissions:
  contents: read

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  slsa-cosign-deployment:
    name: SLSA Level 3 Build Provenance, Cosign Verification & Pages Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # stable
        with:
          toolchain: stable

      - name: Verify SLSA Level 3 provenance & Cosign signing simulation
        run: |
          mkdir -p build
          echo "Simulating SLSA Level 3 build provenance & Cosign binary signature verification..."
          rustc --edition=2021 --test src/arch_kernel_inspirations.rs -o build/test_slsa_cosign && ./build/test_slsa_cosign
          python -m pytest tests/test_integration_system.py -k test_cosign || true
