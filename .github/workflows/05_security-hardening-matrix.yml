name: Security Hardening Matrix

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/05_security-hardening-matrix.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 0'  # Weekly

jobs:
  security-hardening:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SELinux policies
          - security: selinux
            mode: permissive
            policy: targeted
            build-cmd: "cargo build --release"
            test-cmd: "cargo test --release"

          - security: selinux
            mode: enforcing
            policy: strict
            build-cmd: "cargo build --release"
            test-cmd: "cargo test --release"

          # AppArmor profiles
          - security: apparmor
            profile: strict
            build-cmd: "cargo build --release"
            test-cmd: "cargo test --release"

          - security: apparmor
            profile: complain
            build-cmd: "cargo build --release"
            test-cmd: "cargo test --release"

          # Landlock sandboxing (Linux 5.13+)
          - security: landlock
            rules: v4
            build-cmd: "cargo build --features landlock-v4 --release"
            test-cmd: "cargo test --features landlock-v4 --release"

          # OpenBSD pledge/unveil
          - security: pledge
            promises: "stdio rpath wpath inet unix"
            build-cmd: "cargo build --features pledge --release"
            test-cmd: "cargo test --features pledge --release"

          # FreeBSD Capsicum
          - security: capsicum
            caps: "CAP_READ CAP_WRITE"
            build-cmd: "cargo build --features capsicum --release"
            test-cmd: "cargo test --features capsicum --release"

          # seccomp syscall filtering
          - security: seccomp
            filter: strict
            build-cmd: "cargo build --features seccomp-strict --release"
            test-cmd: "cargo test --features seccomp-strict --release"

          # SMACK (Simplified Mandatory Access Control)
          - security: smack
            labels: system
            build-cmd: "cargo build --features smack --release"
            test-cmd: "cargo test --features smack --release"

          # Memory protections (W^X/DEP)
          - security: memory-protection
            type: nx-stack
            build-cmd: "RUSTFLAGS='-C overflow-checks=on -C debug-assertions=on' cargo build --release"
            test-cmd: "cargo test --release"

          - security: memory-protection
            type: stack-smashing
            build-cmd: "RUSTFLAGS='-C target-feature=+crc' cargo build --release"
            test-cmd: "cargo test --release"

          # Address Sanitizer
          - security: sanitizer
            type: address
            build-cmd: "RUSTFLAGS='-Z sanitizer=address' cargo +nightly build --release"
            test-cmd: "RUSTFLAGS='-Z sanitizer=address' cargo +nightly test --release"

          # Memory Sanitizer
          - security: sanitizer
            type: memory
            build-cmd: "RUSTFLAGS='-Z sanitizer=memory' cargo +nightly build --release"
            test-cmd: "RUSTFLAGS='-Z sanitizer=memory' cargo +nightly test --release"

          # Thread Sanitizer
          - security: sanitizer
            type: thread
            build-cmd: "RUSTFLAGS='-Z sanitizer=thread' cargo +nightly build --release"
            test-cmd: "RUSTFLAGS='-Z sanitizer=thread' cargo +nightly test --release"

    container:
      image: ubuntu:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential curl

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Install security tools
        run: |
          apt-get install -y selinux-policy apparmor-profiles seccomp

      - name: Build with ${{ matrix.security }} hardening
        run: |
          source $HOME/.cargo/env
          ${{ matrix.build-cmd }}

      - name: Test security hardening
        continue-on-error: true
        run: |
          source $HOME/.cargo/env
          ${{ matrix.test-cmd }}

      - name: Security audit
        run: |
          source $HOME/.cargo/env
          cargo audit || true

      - name: Report status
        if: always()
        run: |
          echo "Security hardening ${{ matrix.security }}: ${{ job.status }}"
