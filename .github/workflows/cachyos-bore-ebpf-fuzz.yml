name: CachyOS BORE Scheduler & eBPF Kernel Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cachyos-ebpf-test:
    name: CachyOS BORE Scheduler Governor & eBPF Verifier Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test CachyOS BORE Governor & eBPF Safety Verifier
        run: |
          cargo test --lib compatibility::cachy_os
          cargo test --lib kernel::ebpf
