name: CachyOS BORE Scheduler & eBPF Fuzzing CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  cachyos-ebpf-verification:
    name: CachyOS BORE Scheduler, eBPF Verifier & Ananicy Tuning Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run CachyOS & eBPF Test Suite
        run: |
          ./run_sigma_tests.sh
