name: Σ SigmaOS Sovereign CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ nasm binutils make

      - name: Repair Build Environment
        run: node repair_build.js

      - name: Build Sovereign Lattice
        run: |
          chmod +x ./build_sovereign.sh
          ./build_sovereign.sh

      - name: Verify Architecture
        run: make info || echo "Σ [INFO] Architecture verification step skipped (make info not required)"
