name: Void Linux XBPS-src & Runit Service CI
permissions:
  contents: read


on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  void-xbps-runit:
    name: Void Linux XBPS-src Package & Runit Service Supervision Matrix

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test Void Linux XBPS Package & Runit Integration
        run: |
          echo "Testing Void Linux XBPS package parsing and runit supervision..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
