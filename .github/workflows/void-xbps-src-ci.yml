name: Void Linux xbps-src & Runit Service Supervision CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  void-xbps-check:
    name: Void Linux XBPS & Runit Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test XBPS Package Format Parsing
        run: |
          cargo test --lib -- test_package_format_from_filename_extensions
