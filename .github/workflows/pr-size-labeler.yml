name: "Automation: PR Size Labeler"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size-labeler:
    name: Label PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Size Labeler
        uses: pascalgn/size-label-action@v0.5.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          sizes: >-
            {
              "0": "size/XS",
              "50": "size/S",
              "250": "size/M",
              "500": "size/L",
              "1000": "size/XL"
            }
