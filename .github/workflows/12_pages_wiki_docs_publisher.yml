name: GitHub Pages & Wiki Publisher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-pages-publisher:
    name: Build & Deploy Pages and Wiki Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Run Wiki & Roadmap Data Syncer
        run: |
          chmod +x ./scripts/sync_wiki.sh || true
          ./scripts/sync_wiki.sh || true

      - name: Validate Markdown & Architecture Docs
        run: |
          ls -la docs/
          ls -la wiki/ || true
          ls -la WIKI/ || true
