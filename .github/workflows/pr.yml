name: PR Validation Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    name: Build and Test Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt --check

      - name: Cargo check library
        run: cargo check --lib

      - name: Run unit tests
        run: cargo test --lib

      - name: Run Sigma test suite
        run: ./run_sigma_tests.sh
