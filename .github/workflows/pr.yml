name: PR Validation Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Build and Test Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 / stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt --check

      - name: Cargo check library
        run: cargo check --lib

      - name: Run unit tests
        # RUSTFLAGS="-C codegen-units=1" prevents OOM on GitHub Actions (7 GiB)
        # for this ~1M-LOC single-crate. The profile.test in Cargo.toml also
        # sets codegen-units=1, but we set CARGO_BUILD_JOBS as extra safety.
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --lib

      - name: Run Sigma test suite
        run: ./run_sigma_tests.sh
