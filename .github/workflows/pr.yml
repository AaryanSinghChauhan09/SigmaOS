name: PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shell syntax check (changed files)
        run: |
          fail=0
          for f in $(git diff --name-only origin/main...HEAD -- '*.sh' | grep -v '^archive/'); do
            [ -f "$f" ] && { bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }; }
          done
          exit $fail

      - name: Registry + doctor
        run: make registry-audit consolidation-audit doctor
