name: Illumos SMF & DTrace Dynamic Tracing CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  illumos-dtrace-test:
    permissions:
      contents: read
    name: Illumos SMF Service Management & DTrace Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify Illumos SMF & DTrace Subsystems
        run: |
          ./run_sigma_tests.sh
