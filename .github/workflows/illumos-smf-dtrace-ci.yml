name: Illumos SMF Service Management & DTrace CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  illumos-smf-dtrace:
    name: Illumos SMF & DTrace Tracing Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run Illumos SMF & DTrace Tests
        run: |
          mkdir -p build && rustc --test --edition=2021 src/distro/open_source_distro_innovations.rs -o build/illumos_dtrace_test && ./build/illumos_dtrace_test
