name: Debian dpkg Reproducible Builds & Lintian Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  debian-reproducible-check:
    name: Debian dpkg Reproducible Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=1700000000" >> $GITHUB_ENV

      - name: Verify Deterministic Cargo Build
        run: |
          cargo check --lib
          cargo test --lib -- package::universal::tests

      - name: Lintian Manifest Audit Simulation
        run: |
          echo "Auditing Debian control manifests against Lintian guidelines..."
          cargo test --lib -- test_distro_packaging_manifests_and_sandboxing
