name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@11bd5193b48c4b3c7778881999d4b1d7e0ba3a8c
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@b77805b0cba5f4923cc3ca22b4c2c5104891fa4b
      with:
        toolchain: stable

    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run security audit
      run: cargo audit
    
    - name: Run dependency check
      run: cargo tree -d
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@8685613e7270999a0b60a2bb20a5666b789c9b0e
      with:
        languages: rust

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@32c0b3f6954e68f4826d8057f4c005477b119e5f
      with:
        category: "/language:rust"
