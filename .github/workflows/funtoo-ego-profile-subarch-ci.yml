name: Funtoo Ego Profile & Kit Tree CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  funtoo-ego-profile:
    name: Funtoo Ego Meta-Profile Subarch & Kit Tree Solver
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Funtoo Subarch Optimizations & Kit Tree
        run: |
          cargo check --lib --features "core-shards"
          cargo test --lib -- distro::gentoo
