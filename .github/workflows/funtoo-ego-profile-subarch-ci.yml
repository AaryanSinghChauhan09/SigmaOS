name: Funtoo Ego Profile & Subarch Optimization CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  funtoo-ego-subarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Funtoo Ego Subarch & Profile Selection Engine
        run: |
          echo "::group::Funtoo Ego Profile & Subarch Optimization"
          cargo check --lib
          echo "::endgroup::"
