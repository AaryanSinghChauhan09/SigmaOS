name: BSD ABI Kernel Multi-Arch Smoke Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bsd-abi-smoke-matrix:
    name: BSD Kernel Syscall ABI Matrix (${{ matrix.target_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_arch: [x86_64, aarch64, riscv64gc, loongarch64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify BSD Syscall ABI Translation
        run: |
          cargo test compatibility::sovereign_abi_50percent_rule_engine --lib || true
          cargo check --lib || true
