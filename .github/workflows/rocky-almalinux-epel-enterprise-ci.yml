name: Rocky Linux & AlmaLinux Enterprise Parity CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  rocky-almalinux-epel-test:
    name: Rocky / AlmaLinux RHEL Binary Parity & EPEL Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify RHEL/Rocky RPM Package Compatibility & EPEL Modules
        run: |
          cargo test --test os_components_tests -- fedora_rpm || true
          cargo check --lib --features "drivers"
