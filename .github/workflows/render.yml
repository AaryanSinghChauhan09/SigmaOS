name: Deploy to Render

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  deploy-render:
    name: Render Service Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || true
