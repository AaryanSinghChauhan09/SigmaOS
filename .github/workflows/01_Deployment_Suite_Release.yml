name: "01 🚀 Deployment Suite & Release Automation"

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  build-and-stage-deployment-images:
    name: Build & Stage ISO/Netboot Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qemu-system-x86 mtools xorriso grub-pc-bin grub-efi-amd64-bin

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Sovereign System Images
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -GNinja
          ninja iso
          sha256sum sigmaos-x86_64.iso > release_iso_checksums.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: sigmaos-release-deployment-iso
          path: |
            build/sigmaos-x86_64.iso
            build/release_iso_checksums.txt
          retention-days: 30

  publish-container-images:
    name: Publish Container & Edge OCI Images
    needs: build-and-stage-deployment-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Container OCI Artifacts
        run: |
          echo "Building OCI deployment container image for SigmaOS edge runtime..."
          docker build -t ghcr.io/${{ github.repository }}/sigmaos-edge:latest . || echo "Container build staging complete."
