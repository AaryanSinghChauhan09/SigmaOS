name: "SigmaOS CI/CD Pipeline"

on:
  push:
    branches: [ "disabled-branch" ]
  pull_request:
    branches: [ "disabled-branch" ]

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write

    strategy:
      matrix:
        arch: [x86_64, aarch64]
        mode: [release, debug]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu make

    - name: Build Core Microkernel
      run: |
        make ARCH=${{ matrix.arch }} MODE=${{ matrix.mode }}

    - name: Run Unit Tests
      run: |
        make test ARCH=${{ matrix.arch }}

    - name: Run Memory and I/O Regression Tests
      run: |
        bash ./scripts/regression_check.sh

    - name: Run Format-Specific Stress Tests
      run: |
        bash ./scripts/format_stress_test.sh

    - name: Run App Layer Regression Tests
      run: |
        bash ./scripts/app_regression_test.sh

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: cpp
        queries: security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Dependabot Security Updates
      uses: dependabot/fetch-metadata@v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release Tag
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        NEW_TAG=$(date +"v%Y.%m.%d-%H%M")
        git tag -a $NEW_TAG -m "Automated release $NEW_TAG"
        git push origin $NEW_TAG
