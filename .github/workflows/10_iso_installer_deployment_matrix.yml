name: Universal ISO & Installer Media Deployment Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso-deployment-matrix:
    name: ISO Build & Deployment Matrix (${{ matrix.target_profile }})
    # Publish and test ISO profiles only after a real boot/install path is validated.
    if: ${{ vars.SIGMAOS_BOOT_VALIDATED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_profile: [desktop-preview, server-minimal, netinst-recovery, microvm-firecracker]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install ISO Creation Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso syslinux-utils mtools

      - name: Build Target ISO Image
        run: |
          echo "Building ISO target profile: ${{ matrix.target_profile }}"
          chmod +x ./scripts/build_iso.sh
          ./scripts/build_iso.sh

      - name: Verify ISO Artifact Integrity
        run: |
          mkdir -p build
          test -s build/sigmaos-desktop-preview.iso
          file build/sigmaos-desktop-preview.iso
