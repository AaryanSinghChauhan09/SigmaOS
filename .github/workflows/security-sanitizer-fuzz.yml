name: Security Subsystem & Fuzzing Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  fuzzing-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Post-Quantum Cryptography & Hardening
        run: |
          rustc --edition 2021 --test src/security/hardening.rs --cfg 'feature="standalone_test"' -o build/test_hardening
          ./build/test_hardening

      - name: Run Fuzzing Script
        run: |
          chmod +x scripts/fuzz.sh
          ./scripts/fuzz.sh || true
