name: Clear Linux Stateless Swupd & Microarch Acceleration CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  clear-linux-stateless:
    name: Clear Linux Stateless Swupd & x86_64-v4 Microarch Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Run Clear Linux Stateless Engine Tests
        run: |
          mkdir -p build && rustc --test --edition=2021 src/distro/clear_linux.rs -o build/clear_linux_test && ./build/clear_linux_test
