name: 🌐 SigmaOS Web Sovereign CI
on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  web_purity:
    name: "🌊 Web OS Purity Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Zenith Core
        run: |
          echo "Σ [CI]: Verifying Web OS components..."
          if [ ! -f "index.html" ]; then echo "❌ Missing index.html"; exit 1; fi
          if [ ! -f "dashboard/index.html" ]; then echo "❌ Missing dashboard/index.html"; exit 1; fi
          if [ ! -d "assets" ]; then echo "❌ Missing assets directory"; exit 1; fi

  aesthetic_audit:
    name: "🎨 Aesthetic & UX Audit"
    runs-on: ubuntu-latest
    needs: [web_purity]
    steps:
      - uses: actions/checkout@v4
      - name: CSS Integrity Scan
        run: |
          echo "Σ [CI]: Auditing CSS for Zenith compliance..."
          if ! grep -q "glass-morphism" dashboard/dashboard.css; then
            echo "❌ [FAIL]: Glassmorphism logic missing from dashboard."
            exit 1
          fi

  deployment_vitals:
    name: "🚀 Deployment Readiness"
    runs-on: ubuntu-latest
    needs: [aesthetic_audit]
    steps:
      - name: Declare Readiness
        run: echo "Σ SIGMAOS WEB ZENITH: PORTAL SUPREMACY READY."
