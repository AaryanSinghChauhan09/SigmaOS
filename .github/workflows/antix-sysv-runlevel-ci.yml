name: antiX Linux SysVinit & Slim Desktop CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  antix-sysv-verification:
    name: antiX Linux SysVinit Runlevel & Lightweight Desktop Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run antiX Test Suite
        run: |
          ./run_sigma_tests.sh
