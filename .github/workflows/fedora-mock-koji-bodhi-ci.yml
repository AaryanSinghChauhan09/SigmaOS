name: Fedora Mock, Koji & Bodhi Release Engineering CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  fedora-release-engineering:
    name: Fedora Release Engineering Tools Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Fedora Release Engineering Unit Tests
        run: mkdir -p build && rustc --test src/compatibility/fedora.rs --edition=2021 -o build/fedora_test && ./build/fedora_test
