name: SigmaOS Algorithm, Ecosystem & Compliance CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  algorithm-and-compliance-tests:
    name: Verify Algorithms, Ecosystem & Statutory Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Sovereign Atomic & Subsystem Test Harness
        run: |
          chmod +x run_sigma_tests.sh
          ./run_sigma_tests.sh

      - name: Verify SPDX License Headers
        run: |
          chmod +x scripts/check-spdx.sh
          ./scripts/check-spdx.sh
