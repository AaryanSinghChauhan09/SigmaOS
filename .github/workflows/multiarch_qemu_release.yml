name: Multiarch QEMU Release & ISO Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  multiarch-build:
    name: Build Multiarch Kernel & QEMU Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64, riscv64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Compile Target Architecture Kernel
        run: |
          mkdir -p build
          cargo check --lib

      - name: Run Architecture Validation Test
        run: |
          rustc --edition=2021 --test src/compatibility/abi_translator.rs -o build/test_abi_translator
          ./build/test_abi_translator
