name: Gentoo Portage Ebuild & USE Flag Matrix CI
permissions:
  contents: read


on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  gentoo-portage-ebuild:
    name: Gentoo Portage Ebuild Compilation & USE Flag Dependency Audit

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7b737f3747eb115cf4e8f1766b8fb62b6948fb16 # stable
        with:
          toolchain: stable

      - name: Test Gentoo Portage Ebuild & Universal Adapter
        run: |
          echo "Testing Gentoo Portage ebuild manifest parsing and canonical dependency translation..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
