name: SigmaOS Health Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sovereign_health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Sovereign Boot Integrity
        run: |
          echo "=== SigmaOS Health Gate ==="
          echo "[HEALTH] Checking boot chain integrity..."
          if [ -f "SigmaBootloader.asm" ]; then
            echo "[PASS] SigmaBootloader.asm present."
          else
            echo "[FAIL] SigmaBootloader.asm MISSING."
            exit 1
          fi
          if [ -f "SigmaRustCore.rs" ]; then
            echo "[PASS] SigmaRustCore.rs (no_std) present."
          else
            echo "[FAIL] SigmaRustCore.rs MISSING."
            exit 1
          fi
          if [ -f "Makefile" ]; then
            echo "[PASS] Makefile present."
          else
            echo "[FAIL] Makefile MISSING."
            exit 1
          fi
          echo "[PASS] Boot chain verified."

      - name: Verify Zero Third-Party Dependencies
        run: |
          echo "[HEALTH] Scanning for third-party dependency manifests..."
          FAIL=0
          for f in requirements.txt package.json Gemfile Cargo.toml pyproject.toml; do
            if [ -f "$f" ]; then
              echo "[FAIL] Third-party manifest detected: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "[PASS] Zero third-party dependency manifests detected."

      - name: Verify No High-Level Scripts
        run: |
          PY=$(find . -name '*.py' -not -path './.git/*' | wc -l)
          JS=$(find . -name '*.js' -not -path './.git/*' -not -path './node_modules/*' | wc -l)
          TS=$(find . -name '*.ts' -not -path './.git/*' | wc -l)
          RB=$(find . -name '*.rb' -not -path './.git/*' | wc -l)
          echo "[HEALTH] Python: $PY | JS: $JS | TS: $TS | Ruby: $RB"
          TOTAL=$((PY + JS + TS + RB))
          if [ "$TOTAL" -ne 0 ]; then
            echo "[FAIL] High-level language scripts detected."
            exit 1
          fi
          echo "[PASS] Zero high-level scripts. 100% native sovereignty."

      - name: Health Gate Complete
        run: |
          echo "=== SigmaOS Health Gate: ALL CHECKS PASSED ==="
          echo "[SUCCESS] System is healthy, sovereign, and production-ready."
