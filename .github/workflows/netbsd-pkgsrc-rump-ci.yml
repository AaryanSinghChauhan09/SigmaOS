name: NetBSD pkgsrc & Rump Kernel Subsystem CI
permissions:
  contents: read


on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  netbsd-pkgsrc-rump:
    name: NetBSD pkgsrc Package Manager & Rump Kernel Virtual Server Audit

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test NetBSD pkgsrc & Rump Integration
        run: |
          echo "Testing NetBSD pkgsrc manifest parser and Rump Kernel virtualization engine..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
