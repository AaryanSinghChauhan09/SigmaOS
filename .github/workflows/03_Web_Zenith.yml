name: "[03] Zenith UI Dashboard"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-ui-lint:
    name: Web UI Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Purge Web Build Cache
        run: rm -rf web_ui/dist/
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      - name: Install & Lint
        run: |
          cd web_ui
          npm ci
          npm run lint
