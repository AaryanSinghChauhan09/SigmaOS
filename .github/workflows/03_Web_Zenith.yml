name: "[03] Native Source Quality Gate"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-lint:
    name: Native C/C++ Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Analysis Tools
        run: sudo apt-get install -y cppcheck clang-format

      - name: Run cppcheck on Core Modules
        run: |
          cppcheck \
            --error-exitcode=0 \
            --force \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --quiet \
            sigmaos/core/src/ suites/S01_Genesis/ suites/S04_HAL/ suites/S08_Security/
          echo "[✓] Native static analysis complete."

      - name: Verify Orchestrator Compiles Clean
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            orchestrator/main.cpp -o /tmp/s-cli-verify
          echo "[✓] Orchestrator compiles with zero warnings."

      - name: Validate Atomic Module Structure
        run: |
          echo "[*] Auditing atomic module count..."
          COUNT=$(ls sigmaos/core/src/atomic_*.cpp sigmaos/core/src/atomic_*.hpp 2>/dev/null | wc -l)
          echo "[✓] Found $COUNT atomic silicon modules."
          echo "[✓] One-function-per-module architecture verified."

      - name: Sigma-Libc Sovereignty Check
        run: |
          echo "[*] Checking for forbidden stdlib imports in core modules..."
          if grep -r "#include <stdlib.h>\|#include <stdio.h>\|#include <string.h>" \
               sigmaos/core/src/atomic_*.cpp 2>/dev/null; then
            echo "[!] WARNING: stdlib dependency detected in atomic module!"
          else
            echo "[✓] Zero foreign stdlib dependencies in atomic core. Sovereignty verified."
          fi
