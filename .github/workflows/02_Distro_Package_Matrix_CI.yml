name: "02 📦 Multi-Distro Package System Matrix CI"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  package-format-matrix:
    name: Package Format Suite (${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - format: debian-dpkg-apt
            test_filter: "package::debian::tests"
          - format: fedora-dnf-rpm
            test_filter: "package::fedora_dnf::tests"
          - format: arch-pacman-aur
            test_filter: "sigpkg::arch_pacman_engine::tests"
          - format: alpine-apk-v3
            test_filter: "sigpkg::alpine_apk_engine::tests"
          - format: void-xbps-soname
            test_filter: "package::bsd_linux_package_innovations::tests::test_xbps_soname_and_orphan_engine"
          - format: gentoo-portage-ebuild
            test_filter: "package::bsd_linux_package_innovations::tests::test_gentoo_portage_subslot_and_use_expand_engine"
          - format: freebsd-ports-vuxml
            test_filter: "package::bsd_linux_package_innovations::tests::test_freebsd_ports_flavours_and_vuxml_engine"
          - format: haiku-hpkg-packagefs
            test_filter: "package::bsd_linux_package_innovations::tests::test_haiku_hpkg_packagefs_engine"
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run Package Adapter Unit Tests
        run: |
          cargo test --lib -- ${{ matrix.test_filter }}

      - name: Execute Full System Integration Suite
        run: |
          ./run_sigma_tests.sh
