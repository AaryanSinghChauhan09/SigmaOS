name: "02 📦 Distro Package Integration & Multi-Ecosystem Matrix"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  package-ecosystem-matrix:
    name: Package Format & Engine Audit (${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - format: Debian (.deb / dpkg / apt)
            test_filter: sigpkg::debian_dpkg_engine
          - format: Arch Linux (PKGBUILD / pacman / AUR)
            test_filter: sigpkg::arch_pacman_engine
          - format: Fedora / Red Hat (.rpm / dnf / ostree)
            test_filter: sigpkg::fedora_rpm_engine
          - format: Gentoo (.ebuild / portage)
            test_filter: package::universal
          - format: Alpine Linux (.apk / apk-tools)
            test_filter: sigpkg::universal_adapter
          - format: Nix / NixOS (nix store / derivation)
            test_filter: package::universal
          - format: Universal Transpiler & Foreign Bridge
            test_filter: package::universal
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify Package Subsystem Compatibility
        run: |
          mkdir -p build
          ./run_sigma_tests.sh
