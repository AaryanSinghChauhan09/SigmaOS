name: Arch Linux AUR PKGBUILD Pages & Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-arch-aur"
  cancel-in-progress: false

jobs:
  arch-aur-pkgbuild-verify:
    name: Verify Arch Linux Pacman & AUR Hooks Subsystems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7bbf72382103ef808801d00d235be6b4b455c1ef
        with:
          toolchain: stable

      - name: Verify Arch Pacman & AUR Parity
        run: cargo test --test linux_bsd_inspection_tests -- linux_bsd_parity::tests::test_arch_pacman_hooks

      - name: Build Arch PKGBUILD Release Site
        run: |
          mkdir -p public_aur
          echo "<html><body><h1>SigmaOS Arch Linux PKGBUILD Site</h1></body></html>" > public_aur/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public_aur

  deploy-pages:
    name: Deploy Arch AUR Pages Site
    needs: arch-aur-pkgbuild-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db596a10b7b134807f43503db9ab302ae552c8
