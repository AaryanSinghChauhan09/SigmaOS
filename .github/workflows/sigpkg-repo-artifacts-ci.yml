name: SigmaPkg Signed Test Repository Artifacts CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sigpkg-repo-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sigpkg CLI
        run: |
          cargo build --bin sigpkg
          cargo check --lib

      - name: Run SigmaPkg client integration tests
        run: |
          cargo test --test sigpkg_client_tests

      - name: Generate signed test repository metadata (TUF root/timestamp/snapshot/targets)
        run: |
          set -euo pipefail
          REPO="build/sigpkg-repo"
          mkdir -p "$REPO"

          # A test signing key (placeholder for CI; production uses real Dilithium/Ed25519).
          KEY_ID="sigma-ci-test-key"
          printf '%s' "$KEY_ID" > "$REPO/.signing-key-id"

          # root.json — trust anchor listing the repository role keys/versions.
          cat > "$REPO/root.json" <<EOF
          {
            "_type": "root",
            "version": 1,
            "spec_version": "1.0.31",
            "expires": "2030-01-01T00:00:00Z",
            "roles": {
              "root": { "keys": [ "sigma-ci-test-key" ], "threshold": 1 },
              "timestamp": { "keys": [ "sigma-ci-test-key" ], "threshold": 1 },
              "snapshot": { "keys": [ "sigma-ci-test-key" ], "threshold": 1 },
              "targets": { "keys": [ "sigma-ci-test-key" ], "threshold": 1 }
            }
          }
          EOF

          # timestamp.json — freshness/rollback protection.
          cat > "$REPO/timestamp.json" <<EOF
          {
            "_type": "timestamp",
            "version": 1,
            "spec_version": "1.0.31",
            "expires": "2030-01-01T00:00:00Z",
            "meta": { "snapshot.json": { "version": 1 } }
          }
          EOF

          # snapshot.json — names/versions of all target files.
          cat > "$REPO/snapshot.json" <<EOF
          {
            "_type": "snapshot",
            "version": 1,
            "spec_version": "1.0.31",
            "expires": "2030-01-01T00:00:00Z",
            "meta": { "targets.json": { "version": 1 } }
          }
          EOF

          # targets.json — the installable package targets published by this repo.
          cat > "$REPO/targets.json" <<EOF
          {
            "_type": "targets",
            "version": 1,
            "spec_version": "1.0.31",
            "expires": "2030-01-01T00:00:00Z",
            "targets": {
              "zenith.sigmapkg": { "sha256": "test-zenith-sha256" },
              "sigma-core.sigmapkg": { "sha256": "test-sigcore-sha256" }
            }
          }
          EOF

          # A sample package manifest consumed by src/sigpkg/client.rs parse_manifest.
          cat > "$REPO/zenith.sigmapkg.manifest" <<EOF
          name: zenith
          version: 1.2.3
          description: Zenith compositor (test repo)
          checksum: 8000
          dependencies: libfoo, libbar
          provides: zenith, zenith-compositor
          files: /usr/bin/zenith, /etc/zenith.conf
          EOF

          # Emit an index listing the published TUF metadata.
          ls -1 "$REPO" | tee "$REPO/index.txt"

      - name: Upload signed test repository artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sigpkg-test-repo
          path: build/sigpkg-repo
