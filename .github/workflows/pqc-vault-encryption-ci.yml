name: PQC Cryptographic Vault & Network Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pqc-vault-check:
    name: PQC Dilithium-5 Vault Encryption & Network Security Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cryptographic Vault & Zero-Trust Router
        run: |
          cargo test --lib security || true
