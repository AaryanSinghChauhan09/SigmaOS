name: PR Fast Checks

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]


permissions:
  contents: read
jobs:
  fast-checks:
    permissions:
      contents: read

    name: Fast PR Validation & Standalone Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

        with:
          components: rustfmt, clippy

      - name: Check Formatting (rustfmt)
        run: cargo fmt -- --check

      - name: Run Clippy Lints (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Run no_std Enforcement Check
        run: |
          chmod +x ./scripts/no_std_check.sh
          ./scripts/no_std_check.sh

      - name: Run Standalone File Tests for Modified Files
        run: |
          chmod +x ./scripts/changed_files_rustc_tests.sh
          ./scripts/changed_files_rustc_tests.sh
