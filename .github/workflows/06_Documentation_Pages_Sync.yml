name: "06 📚 Documentation & Pages Sync Suite"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-wiki-and-docs:
    name: Sync Documentation & Wiki Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Execute Wiki Synchronization
        run: |
          mkdir -p build
          if [ -f ./scripts/sync_wiki.sh ]; then
            chmod +x ./scripts/sync_wiki.sh
            ./scripts/sync_wiki.sh
          fi

      - name: Generate Rustdoc API Documentation
        run: |
          mkdir -p build
          cargo doc --no-deps 2>&1 || true

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sigmaos-docs-html
          path: target/doc
