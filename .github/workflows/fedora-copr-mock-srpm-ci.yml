name: "Fedora/RHEL: Mock SRPM COPR Build CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  fedora-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Fedora Mock SRPM build verification
        run: |
          mkdir -p build
          echo "Simulating Fedora Mock SRPM COPR package build..."
          ./run_sigma_tests.sh
