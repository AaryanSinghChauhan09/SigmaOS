name: Slackware KISS Packaging & Slackpkg Patch Engine CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  slackware-packaging:
    name: Slackware pkgtool & Slackpkg Patch Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable

      - name: Test Slackware Package & Patch Engine
        run: |
          mkdir -p build
          cargo test --lib -- sigpkg::poudriere_xbps::tests::test_slackpkg_patch_engine
