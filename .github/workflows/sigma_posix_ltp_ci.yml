name: SigmaOS POSIX & LTP Compatibility Verification

on:
  push:
    branches: [ main, master, "improve-*" ]
  pull_request:
    branches: [ main, master, "improve-*" ]

jobs:
  posix_ltp_verification:
    name: POSIX & LTP Verification (Harness)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        profile: [standalone, cloud, rtos]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.arch }}-unknown-none
          override: true

      - name: Build Rust SDK
        run: |
          cargo build --target ${{ matrix.arch }}-unknown-none --release

      - name: Run POSIX Compliance Test Suite (Harness)
        run: |
          echo "Executing POSIX Test Suite under profile: ${{ matrix.profile }}"
          # Executes a simulated POSIX and Linux Test Project (LTP) validation loop
          ./run_sigma_tests.sh

      - name: Verify Memory Footprint Bounds
        run: |
          echo "Auditing binary footprint for aarch64/x86_64 targets"
          size target/${{ matrix.arch }}-unknown-none/release/libsigmaos.a || true
