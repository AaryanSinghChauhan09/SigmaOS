name: NixOS Flake Devshell & Store Deduplication CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/sigpkg/universal_oop_system.rs'
      - 'src/sigpkg/universal_engine.rs'
      - '.github/workflows/nixos-flake-devshell-ci.yml'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  nixos-store-test:
    name: Verify Nix/Guix Store Deduplication & CAS GC Profiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable

      - name: Run Nix Universal System Tests
        run: |
          ./scripts/changed_files_rustc_tests.sh
