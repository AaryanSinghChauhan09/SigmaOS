name: EndeavourOS Reflector & Yay/Paru CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  endeavour-reflector-verification:
    name: EndeavourOS Reflector Mirror Ranking & Yay/Paru Helper Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run EndeavourOS Parity Test
        run: |
          ./run_sigma_tests.sh
