name: Qubes OS Micro-Domain Zero-Trust Isolation Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  qubes-zero-trust-verification:
    name: Qubes Qrexec IPC & MicroVM Domain Isolation Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pytest

      - name: Run Qubes Zero-Trust Micro-Domain Verification
        run: PYTHONDONTWRITEBYTECODE=1 pytest tests/test_integration_system.py
