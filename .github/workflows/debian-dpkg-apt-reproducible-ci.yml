name: Debian & Ubuntu DPKG/APT Reproducible Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  debian-apt-ci:
    name: Debian & Ubuntu DPKG/APT Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Debian APT Policy & Package Adapter
        run: cargo test --lib -- sigpkg::debian_apt_engine::tests

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
