name: Gentoo Catalyst Stage3 & Portage EAPI 8 CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  gentoo-catalyst-stage3:
    name: Gentoo Linux Catalyst Stage3 & Portage EAPI 8 Rebuild Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Run Gentoo Portage EAPI 8 slot operator & catalyst stage3 tests
        run: |
          echo "Executing Gentoo Portage EAPI 8 slot operator & catalyst stage3 tests..."
          rustc --test --edition 2021 src/distro/open_source_distro_innovations.rs -o build/test_gentoo_catalyst && ./build/test_gentoo_catalyst
