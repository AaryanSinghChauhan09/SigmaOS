name: eBPF & Zero-Copy Splice Subsystem CI

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  ebpf-splice-ci:
    name: eBPF Policy Verifier & Splice Pipeline Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify eBPF & Splice Engine
        run: |
          rustc --edition=2021 --test src/distro/wiki_ideas_implementation.rs -o test_wiki_ideas && ./test_wiki_ideas
          rm test_wiki_ideas
