name: OpenBSD KARL ASLR Trap Audit CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-openbsd-karl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify OpenBSD KARL Kernel Reordering & ASLR Trap Protections
        run: |
          cargo test --test os_algorithms_inspection_tests
