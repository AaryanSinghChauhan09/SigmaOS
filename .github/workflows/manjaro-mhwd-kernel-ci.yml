name: Manjaro MHWD Driver & Kernel Switcher CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
jobs:
  manjaro-mhwd-verification:
    name: Manjaro MHWD Hardware Detection & Kernel Rebuilder Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Manjaro Parity Test
        run: |
          ./run_sigma_tests.sh
