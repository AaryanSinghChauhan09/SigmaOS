name: eBPF XDP Programmable Networking CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  ebpf-xdp-verify:
    name: Verify eBPF XDP Fast Data-Plane Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@v1 # stable

      - name: Test eBPF Fast Data-Plane Engine
        run: |
          rustc --test src/kernel/ebpf.rs --edition=2021 -o build/ebpf_test
          ./build/ebpf_test
