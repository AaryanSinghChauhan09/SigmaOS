name: eBPF XDP Programmable Networking CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ebpf-xdp-verify:
    permissions:
      contents: read

    name: Verify eBPF XDP Fast Data-Plane Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Test eBPF Fast Data-Plane Engine
        run: |
          mkdir -p build
          rustc --test src/kernel/ebpf.rs --edition=2021 -o build/ebpf_test
          ./build/ebpf_test
