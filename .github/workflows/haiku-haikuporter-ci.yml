name: Haiku HaikuPorter & HPKG Package CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  haiku-hpkg:
    name: Haiku HaikuPorter Recipe & HPKG Package Manifest Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test Haiku HPKG Manifest & Subsystem
        run: |
          echo "Testing Haiku .hpkg package parser and HaikuPorter integration..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
