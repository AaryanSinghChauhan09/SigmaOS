name: Sovereign Multi-Arch GitHub Pages Deployment

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Site Directory
        run: |
          mkdir -p build/site
          cp docs/PHASE0_DISCOVERY_AND_BASELINE.md build/site/index.md
          cp docs/EXPANDED_DEVELOPER_ROADMAP.md build/site/roadmap.md

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
