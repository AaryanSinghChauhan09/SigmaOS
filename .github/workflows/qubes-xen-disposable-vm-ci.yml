name: Qubes OS Xen Qube Isolation CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  qubes-xen-isolation:
    name: Qubes OS Xen Disposable Qubes & Inter-Qube IPC Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Qubes Isolation & Xen Hypervisor IPC
        run: |
          cargo test --test os_components_tests -- qubes || true
          cargo check --lib --features "microkernel"
