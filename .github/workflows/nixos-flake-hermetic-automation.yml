name: NixOS Flake Hermetic Automation & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  nixos-flake-automation:
    name: Verify NixOS Flakes, Declarative Generations & Rollback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify NixOS Declarative Generations and Flake Engine
        run: |
          cargo test --test linux_bsd_inspection_tests -- test_nixos_declarative_config_engine_inspection
          cargo test --test linux_bsd_inspection_tests -- linux_bsd_parity::tests::test_nixos_flake_engine

      - name: Check Workspace Library Compilation
        run: cargo check --lib
