name: Alpine APK, Musl Hardened & SecComp CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  alpine-musl-ci:
    name: Alpine APK & Musl Hardened Sandbox Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Alpine APK & Musl Compatibility
        run: cargo check --lib

      - name: Run Sovereign Atomic Harness Tests
        run: ./run_sigma_tests.sh
