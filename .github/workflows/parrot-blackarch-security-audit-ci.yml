name: Parrot Security & BlackArch Audit CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  parrot-blackarch-audit:
    name: Parrot Security OS & BlackArch Pentest Engine Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Forensic Network Inspection & Security Hardening
        run: |
          cargo test --lib -- security::vulnerability
          cargo check --lib --features "ai"
