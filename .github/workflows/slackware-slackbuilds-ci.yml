name: Slackware SlackBuilds & Pkgtools CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  slackware-pkgtools:
    name: Slackware SlackBuilds Shell Scripts & pkgtools Integration Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test Slackware Package Manifest & Scripting
        run: |
          echo "Testing Slackware package manifest parsing and pkgtools dispatch..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
