name: DragonFly BSD HAMMER2 PFS & Emergency CoW CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  dragonfly-hammer2:
    name: DragonFly BSD HAMMER2 Pseudo-Filesystem & Emergency CoW Snapshot Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test DragonFly BSD HAMMER2 & Package Subsystem
        run: |
          echo "Testing DragonFly BSD HAMMER2 PFS CoW snapshots and pkgin package manager..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
