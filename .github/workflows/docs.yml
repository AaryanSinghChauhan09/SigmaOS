name: Generate API Documentation

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'userland/**'
      - 'drivers/**'
      - 'shards/**'
  pull_request:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'userland/**'
      - 'drivers/**'
      - 'shards/**'
  workflow_dispatch:

jobs:
  rust-docs:
    name: Generate Rust Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Generate Rust documentation
        run: |
          # Generate documentation for kernel
          cargo doc --no-deps --manifest-path kernel/Cargo.toml

          # Generate documentation for userland Rust components
          for manifest in $(find userland -name Cargo.toml); do
            cargo doc --no-deps --manifest-path $manifest
          done

      - name: Upload Rust documentation
        uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: target/doc/

  nim-docs:
    name: Generate Nim Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: '2.0.0'

      - name: Generate Nim documentation
        run: |
          # Generate documentation for Nim components
          for nim_file in $(find userland -name "*.nim"); do
            nim doc --out:docs/nim --docSeeSrcUrl:https://github.com/${{ github.repository }}/blob/main/$nim_file $nim_file
          done

      - name: Upload Nim documentation
        uses: actions/upload-artifact@v4
        with:
          name: nim-docs
          path: docs/nim/

  zig-docs:
    name: Generate Zig Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Generate Zig documentation
        run: |
          # Generate documentation for Zig components
          for zig_file in $(find . -name "*.zig"); do
            zig test --doc --emit=docs $zig_file -femit-doc=docs/zig/$(basename $zig_file .zig).html
          done

      - name: Upload Zig documentation
        uses: actions/upload-artifact@v4
        with:
          name: zig-docs
          path: docs/zig/

  deploy-docs:
    name: Deploy Documentation
    needs: [rust-docs, nim-docs, zig-docs]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Rust documentation
        uses: actions/download-artifact@v4
        with:
          name: rust-docs
          path: docs/api/rust

      - name: Download Nim documentation
        uses: actions/download-artifact@v4
        with:
          name: nim-docs
          path: docs/api/nim

      - name: Download Zig documentation
        uses: actions/download-artifact@v4
        with:
          name: zig-docs
          path: docs/api/zig

      - name: Create index
        run: |
          cat > docs/api/README.md << 'EOF'
          # API Documentation

          This directory contains automatically generated API documentation for SigmaOS components.

          ## Rust Documentation

          [View Rust API Documentation](rust/)

          ## Nim Documentation

          [View Nim API Documentation](nim/)

          ## Zig Documentation

          [View Zig API Documentation](zig/)

          ---

          *Generated by GitHub Actions*
          EOF

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "docs: update API documentation

Auto-generated by GitHub Actions from commit ${{ github.sha }}"
            git push
          fi

      - name: Summary
        run: |
          echo "## Documentation Generation Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Rust documentation: [View](https://github.com/${{ github.repository }}/tree/main/docs/api/rust)" >> $GITHUB_STEP_SUMMARY
          echo "- Nim documentation: [View](https://github.com/${{ github.repository }}/tree/main/docs/api/nim)" >> $GITHUB_STEP_SUMMARY
          echo "- Zig documentation: [View](https://github.com/${{ github.repository }}/tree/main/docs/api/zig)" >> $GITHUB_STEP_SUMMARY
