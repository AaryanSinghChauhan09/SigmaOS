name: 02_CrossArch_Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-cross-arch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64-linux-gnu, riscv64-linux-gnu]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.arch }} binutils-${{ matrix.arch }}
        
    - name: Compile Arch Shards
      run: |
        # Mock compilation of arch-specific shards
        if [ "${{ matrix.arch }}" == "aarch64-linux-gnu" ]; then
          aarch64-linux-gnu-gcc -c modules/core/arch/aarch64/boot.c -o aarch64_boot.o -I modules/core/include
        elif [ "${{ matrix.arch }}" == "riscv64-linux-gnu" ]; then
          riscv64-linux-gnu-gcc -c modules/core/arch/riscv64/boot.c -o riscv64_boot.o -I modules/core/include
        fi
        
    - name: Verify ELF Sovereignty
      run: |
        # Check that no external symbols are linked
        if [ "${{ matrix.arch }}" == "aarch64-linux-gnu" ]; then
          aarch64-linux-gnu-nm aarch64_boot.o | grep " U " && exit 1 || exit 0
        elif [ "${{ matrix.arch }}" == "riscv64-linux-gnu" ]; then
          riscv64-linux-gnu-nm riscv64_boot.o | grep " U " && exit 1 || exit 0
        fi
