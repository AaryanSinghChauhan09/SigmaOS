name: 09 Security Hardening PQC Dilithium Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  pqc-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@7b737f3747eb115cf4e8f1766b8fb62b6948fb16 # stable
        with:
          toolchain: stable

      - name: Scan for Quantum-Vulnerable Cryptographic Keys
        run: |
          echo "Scanning codebase for hardcoded cryptographic keys and weak RSA/ECC signatures..."
          if grep -rn --exclude-dir=.git --exclude-dir=.github -E "(BEGIN RSA PRIVATE KEY|BEGIN EC PRIVATE KEY|BEGIN PRIVATE KEY)" . ; then
            echo "ERROR: Hardcoded private keys detected in codebase!"
            exit 1
          else
            echo "Zero hardcoded private keys detected."
          fi

      - name: Verify Post-Quantum Dilithium-5 Signature Compliance
        run: |
          cargo test --lib
