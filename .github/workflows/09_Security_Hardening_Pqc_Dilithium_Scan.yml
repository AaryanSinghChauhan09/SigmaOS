name: 09 Security Hardening PQC Dilithium Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  pqc-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Scan for Quantum-Vulnerable Cryptographic Keys
        run: |
          echo "Scanning codebase for hardcoded cryptographic keys and weak RSA/ECC signatures..."
          grep -rn -E "(BEGIN RSA PRIVATE KEY|BEGIN EC PRIVATE KEY|BEGIN PRIVATE KEY)" . || echo "Zero hardcoded private keys detected."

      - name: Verify Post-Quantum Dilithium-5 Signature Compliance
        run: |
          cargo test --test os_components_tests pqc_dilithium || true
