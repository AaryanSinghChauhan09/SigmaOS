name: Kernel Crashdump & Observability CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  observability-verify:
    name: Verify Kdump, Netconsole & DTrace Probes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable # stable

      - name: Test Kdump & Watchdog Engine
        run: |
          mkdir -p build
          rustc --test src/kernel/watchdog.rs --edition=2021 -o build/watchdog_test
          ./build/watchdog_test

      - name: Test DTrace Tracing Engine
        run: |
          mkdir -p build
          rustc --test src/kernel/dtrace_compat.rs --edition=2021 -o build/dtrace_test
          ./build/dtrace_test
