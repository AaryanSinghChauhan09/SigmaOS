name: Kernel Crashdump & Observability CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  observability-verify:
    permissions:
      contents: read

    name: Verify Kdump, Netconsole & DTrace Probes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Test Kdump & Watchdog Engine
        run: |
          mkdir -p build
          rustc --test src/kernel/watchdog.rs --edition=2021 -o build/watchdog_test
          ./build/watchdog_test

      - name: Test DTrace Tracing Engine
        run: |
          mkdir -p build
          rustc --test src/kernel/dtrace_compat.rs --edition=2021 -o build/dtrace_test
          ./build/dtrace_test
