name: NixOS Hydra Evaluation & Flake CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]

permissions:
  contents: read
  pull_request:
    branches: [ "main", "master" ]

jobs:
  nixos-hydra-eval:
    name: NixOS Hydra Flake & Hermetic CAS Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Evaluate NixOS Hydra declarative state and CAS store
        run: |
          echo "Evaluating NixOS Hydra declarative state and hermetic CAS store..."
          rustc --edition=2021 --test src/distro/sovereign_nextgen_distro_leap.rs -o build/test_nix_hydra && ./build/test_nix_hydra
          rustc --edition=2021 --test src/distro/wiki_ideas_implementation.rs -o build/test_nix_wiki && ./build/test_nix_wiki
