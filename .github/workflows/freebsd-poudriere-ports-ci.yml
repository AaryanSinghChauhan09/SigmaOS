name: FreeBSD Poudriere Ports & Jails CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  freebsd-poudriere-ports:
    name: FreeBSD Poudriere Cleanroom Jail Port Building
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Test FreeBSD Poudriere & Capsicum security integration
        run: |
          echo "Executing FreeBSD poudriere & Capsicum security test matrix..."
          rustc --edition=2021 --test --cfg 'feature="standalone_test"' src/distro/linux_bsd_inspirations.rs -o build/test_freebsd_poudriere && ./build/test_freebsd_poudriere
