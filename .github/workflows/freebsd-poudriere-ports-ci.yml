name: FreeBSD Poudriere Bulk Ports Build CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  freebsd-poudriere-verification:
    name: FreeBSD Poudriere Bulk Package Building & Ports Tree Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run FreeBSD Poudriere Test
        run: |
          ./run_sigma_tests.sh
