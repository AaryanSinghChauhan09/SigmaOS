name: "Debian/Ubuntu: pbuilder cowbuilder lintian CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  debian-pbuilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run Debian pbuilder cowbuilder & lintian audit
        run: |
          mkdir -p build
          echo "Simulating Debian pbuilder chroot build & lintian compliance..."
          ./run_sigma_tests.sh
