name: BSD KQueue, GEOM & Capsicum Subsystems CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  bsd-subsystems:
    name: BSD KQueue, GEOM & Capsicum Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify BSD Security & Compatibility
        run: |
          cargo check --lib
