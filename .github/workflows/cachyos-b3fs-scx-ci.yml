name: CachyOS B3FS & scx_sched_ext Scheduler CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  cachyos-scx-test:
    permissions:
      contents: read
    name: CachyOS BORE Scheduler & B3FS Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify CachyOS Sched Ext & Performance Matrix
        run: |
          ./run_sigma_tests.sh
