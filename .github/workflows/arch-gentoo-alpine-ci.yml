name: Multi-Distro & Multi-Arch Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]


permissions:
  contents: read
jobs:
  multi-distro-and-multi-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Verify PCI/PCIe Bus Scanner Subsystem
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/kernel/pci_scanner.rs -o /tmp/test_pci && /tmp/test_pci

      - name: Verify Multi-Architecture HAL (x86_64, AArch64, RISC-V)
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/kernel/architecture.rs -o /tmp/test_arch && /tmp/test_arch

      - name: Verify Universal Package System & All Distro Format Adapters
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/sigpkg/universal_oop_system.rs -o /tmp/test_oop && /tmp/test_oop

      - name: Verify Package Transaction & Snapshot Rollback Engine
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/sigpkg/transaction.rs -o /tmp/test_trans && /tmp/test_trans
