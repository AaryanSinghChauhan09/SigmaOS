name: Multi-Distro Package Compatibility CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  distro-packages:
    name: Multi-Distro Package System Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Universal Package Adapters (Nix, APK, Apt, Pacman)
        run: |
          cargo test --lib sigpkg::universal_engine

      - name: Test Gentoo Portage USE & Slot Resolution
        run: |
          cargo test --lib sigpkg::portage

      - name: Test Arch ALPM Hooks & Debian sbuild
        run: |
          cargo test --lib sigpkg::arch_compat
