name: FreeBSD Capsicum Sandbox Gate

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  capsicum-gate:
    name: FreeBSD Capsicum Descriptor Capability Delegation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Capsicum Delegation Logic
        run: |
          rustc --edition=2021 --test src/distro/wiki_ideas_implementation.rs -o test_wiki_ideas && ./test_wiki_ideas
          rm test_wiki_ideas
