name: FreeBSD Capsicum Sandbox Gate

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  capsicum-gate:
    permissions:
      contents: write
      pages: write
      id-token: write

    name: FreeBSD Capsicum Descriptor Capability Delegation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Verify Capsicum Delegation Logic
        run: |
          rustc --edition=2021 --test src/distro/wiki_ideas_implementation.rs -o test_wiki_ideas && ./test_wiki_ideas
          rm test_wiki_ideas
