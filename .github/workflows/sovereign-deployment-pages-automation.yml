name: Sovereign Continuous Deployment & Documentation Pages Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  sovereign-deployment-pages-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify Web Server Routing & Deployment Infrastructure
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/open_source_obsoletion.rs -o /tmp/test_webserver && /tmp/test_webserver test_sovereign_web_server_routing

      - name: Audit Wiki & Documentation Specifications
        run: bash scripts/sync_wiki.sh --check || true
