name: Sovereign Deployment Pages & Metrics Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  deployment-pages-automation:
    name: Pages Deployment & Metrics Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pytest

      - name: Verify Automated System Metrics Suite
        run: PYTHONDONTWRITEBYTECODE=1 pytest tests/test_unit_core.py tests/test_stress_fuzz_bench.py
