name: Sovereign Automated Nightly Kernel & Distro Release Build

on:
  schedule:
    - cron: '0 2 * * *' # 2 AM UTC Daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nightly-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Release Binaries & ISO Artifacts
        run: cargo build --release --all-targets
