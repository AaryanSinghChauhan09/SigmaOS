name: Slackware pkgtools & SysV Init CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  slackware-verification:
    name: Slackware pkgtools & BSD rc.S Init Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Slackware Integration Test
        run: |
          ./run_sigma_tests.sh
