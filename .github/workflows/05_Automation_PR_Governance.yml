name: "05 🤖 Automation, PR Governance & Labeler"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-governance-and-labeling:
    name: Auto Labeler & PR Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: PR Size Labeler
        uses: pascalgn/size-label-action@v0.5.5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          sizes: '{"0": "size/XS", "50": "size/S", "250": "size/M", "500": "size/L", "1000": "size/XL"}'

      - name: Validate Branch Naming Convention
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request ? context.payload.pull_request.head.ref : context.ref.replace('refs/heads/', '');
            const validPrefixes = ['feat/', 'fix/', 'docs/', 'style/', 'refactor/', 'perf/', 'test/', 'chore/', 'revert/', 'impl/', 'driver/', 'security/', 'kernel/', 'arch/', 'ci/', 'pkg/', 'ai/', 'ux/', 'sdk/', 'boot/', 'bolt/', 'palette/', 'sentinel/', 'jules-', 'master-', 'master', 'main'];
            const isValid = validPrefixes.some(prefix => branchName.startsWith(prefix));
            if (!isValid) {
              console.log(`Branch name '${branchName}' does not start with a valid prefix: ${validPrefixes.join(', ')}`);
            } else {
              console.log(`Branch name '${branchName}' matches valid convention.`);
            }
