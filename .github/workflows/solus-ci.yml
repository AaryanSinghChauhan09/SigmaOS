name: Solus eopkg Budgie Desktop & Hardware Driver CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  solus-eopkg-budgie:
    name: Solus eopkg Delta Package & Budgie Desktop Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run Solus eopkg & Budgie Tests
        run: |
          mkdir -p build && rustc --test --edition=2021 src/distro/linux_bsd_pinnacle_synthesis.rs -o build/solus_eopkg_test && ./build/solus_eopkg_test
