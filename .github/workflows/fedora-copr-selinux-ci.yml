name: "Fedora SELinux MAC Policy & COPR Build CI"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  selinux-copr-audit:
    name: Fedora SELinux MAC & AVC Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test SELinux Engine & Syscall Integration
        run: |
          cargo test --lib security::selinux::tests -- --nocapture
          cargo test --lib security::selinux_integration::tests -- --nocapture
          cargo test --lib compatibility::fedora::tests -- --nocapture
