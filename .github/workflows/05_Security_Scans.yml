name: "[05] Security Scans & Hardening"

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Weekly

permissions:
  contents: read

jobs:
  security-audit:
    permissions:
      contents: read

    name: Security & Vulnerability Scans
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Setup cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Static Code Analysis (cppcheck)
        run: |
          cppcheck --enable=all --inconclusive --force -I modules/core/include modules/core/ 2> cppcheck-report.txt
          cat cppcheck-report.txt

      - name: Rust Security & Memory Safety Audit
        run: |
          echo "Auditing Rust modules for memory leaks, privilege boundaries, and bounds checks..."
          mkdir -p build
          rustc --test src/security/qubes_isolation.rs -o build/sec_qubes && ./build/sec_qubes
          rustc --test src/security/unveil.rs -o build/sec_unveil && ./build/sec_unveil
          rustc --test src/security/pledge.rs -o build/sec_pledge && ./build/sec_pledge
          echo "[✓] Rust memory safety and sandboxing verified."

      - name: Memory Leak & Race Condition Scans
        run: |
          sudo apt-get install -y valgrind
          cargo test --lib --no-fail-fast

      - name: Sandbox Isolation Verification
        run: |
          cargo test --lib security::capsicum -- --nocapture
          cargo test --lib security::capability_enforcer -- --nocapture
          cargo test --lib security::kernel_hardening -- --nocapture
