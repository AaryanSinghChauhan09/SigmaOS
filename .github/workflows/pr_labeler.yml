name: "Auto-Label & Route PRs"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: "Label PR by Changed Paths"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  size-label:
    name: "PR Size Label"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate PR size
        id: size
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          LINES=$(git diff --stat "$BASE" "$HEAD" | tail -1 | grep -oP '\d+(?= insertion)' || echo 0)
          if   [ "$LINES" -lt 30 ];   then echo "size=XS" >> $GITHUB_OUTPUT
          elif [ "$LINES" -lt 100 ];  then echo "size=S"  >> $GITHUB_OUTPUT
          elif [ "$LINES" -lt 300 ];  then echo "size=M"  >> $GITHUB_OUTPUT
          elif [ "$LINES" -lt 1000 ]; then echo "size=L"  >> $GITHUB_OUTPUT
          else                              echo "size=XL" >> $GITHUB_OUTPUT
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            const size = "${{ steps.size.outputs.size }}";
            const allSizes = ["size/XS","size/S","size/M","size/L","size/XL"];
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number
            });
            for (const lbl of labels.data.filter(l => allSizes.includes(l.name))) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, name: lbl.name
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: [`size/${size}`]
            });

  welcome-first-time:
    name: "Welcome First-Time Contributors"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 Thanks for opening your first PR to **SigmaOS**!

            Before we merge, please ensure:
            - [ ] Your code follows the [Contribution Guide](https://github.com/AaryanSinghChauhan09/SigmaOS/wiki/Contributing)
            - [ ] Build is clean: `sigma build`
            - [ ] Tests pass: `sigma test`
            - [ ] Commit messages follow [Conventional Commits](https://www.conventionalcommits.org/)

            A maintainer will review shortly. Welcome to the Lattice! ⚡
