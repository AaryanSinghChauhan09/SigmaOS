name: Sovereign SPDX License & Legal Compliance Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  spdx-license-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run SPDX License Header Check
        run: bash scripts/check-spdx.sh
