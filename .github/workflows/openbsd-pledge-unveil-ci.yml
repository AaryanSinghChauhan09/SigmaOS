name: OpenBSD pledge & unveil Kernel Security Audit CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  openbsd-security-audit:
    permissions:
      contents: read

    name: OpenBSD pledge, unveil & W^X Memory Hardening Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c


      - name: Run OpenBSD pledge/unveil and Memory Protection Tests
        run: |
          rustc --test src/memory/segmentation_paging.rs -o test_seg
          ./test_seg
          rustc --test src/process/activity_manager.rs -o test_act
          ./test_act
