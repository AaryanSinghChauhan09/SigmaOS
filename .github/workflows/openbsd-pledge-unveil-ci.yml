name: OpenBSD pledge & unveil Kernel Security Audit CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  openbsd-security-audit:
    name: OpenBSD pledge, unveil & W^X Memory Hardening Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@1.24.0
        with:
          toolchain: stable

      - name: Run OpenBSD pledge/unveil and Memory Protection Tests
        run: |
          rustc --test src/memory/segmentation_paging.rs -o test_seg
          ./test_seg
          rustc --test src/process/activity_manager.rs -o test_act
          ./test_act
