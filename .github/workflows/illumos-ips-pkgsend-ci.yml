name: "Illumos: IPS p5p Repo Verification CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  illumos-ips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run Illumos IPS p5p repo verification
        run: |
          mkdir -p build
          echo "Simulating Illumos IPS pkgsend p5p repository verification..."
          ./run_sigma_tests.sh
