name: GitHub Pages Wiki & Package Repo Automation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'wiki/**'
      - 'src/package/**'
      - '.github/workflows/pages_automation_deployment.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy GitHub Pages Documentation & Repository Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Index & Artifacts
        run: |
          mkdir -p _site
          cp -r docs/* _site/ 2>/dev/null || true
          cp -r wiki/* _site/ 2>/dev/null || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
