name: GitHub Pages Wiki & Package Repo Automation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'wiki/**'
      - 'src/package/**'
      - '.github/workflows/pages_automation_deployment.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy GitHub Pages Documentation & Repository Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae828b75115a804c3f0c7d72cb63 # v5.0.0

      - name: Build Index & Artifacts
        run: |
          mkdir -p _site
          cp -r docs/* _site/ 2>/dev/null || true
          cp -r wiki/* _site/ 2>/dev/null || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3f7b0b83764b81b8214643 # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3a0f03e # v4.0.5
