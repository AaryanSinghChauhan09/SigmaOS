name: "OpenBSD Pledge Unveil Seccomp MAC CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-mac-audit:
    name: OpenBSD Pledge Unveil & Seccomp MAC Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Verify OpenBSD pledge & unveil sandboxing rules
        run: |
          echo "=== Verifying OpenBSD pledge & unveil security invariants ==="
          cargo test --lib capability_enforcer

      - name: Audit Seccomp BPF & Landlock LSM security boundaries
        run: |
          echo "=== Verifying Seccomp BPF & Landlock LSM sandboxing ==="
          cargo test --lib security
