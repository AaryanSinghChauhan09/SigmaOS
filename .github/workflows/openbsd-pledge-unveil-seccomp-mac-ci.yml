name: OpenBSD Pledge, Unveil & Security MAC Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  openbsd-security-ci:
    name: OpenBSD Pledge/Unveil & Security Policy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Audit OpenBSD Pledge/Unveil Bounds
        run: cargo check --lib

      - name: Run Sovereign Atomic Harness Tests
        run: ./run_sigma_tests.sh
