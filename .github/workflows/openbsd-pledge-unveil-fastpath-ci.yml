name: OpenBSD Pledge & Unveil Security Sandboxing CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pledge-unveil-verify:
    name: Verify OpenBSD Pledge & Unveil Sandboxing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test OpenBSD Pledge & Unveil Submodule
        run: |
          rustc --test src/security/unveil.rs --edition=2021 -o build/unveil_test
          ./build/unveil_test
