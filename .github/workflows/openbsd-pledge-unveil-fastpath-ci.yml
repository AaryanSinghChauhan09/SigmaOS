name: OpenBSD Pledge & Unveil Security Sandboxing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  pledge-unveil-verify:
    name: Verify OpenBSD Pledge & Unveil Sandboxing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test OpenBSD Pledge & Unveil Submodule
        run: |
          rustc --test src/security/unveil.rs --edition=2021 -o build/unveil_test
          ./build/unveil_test
