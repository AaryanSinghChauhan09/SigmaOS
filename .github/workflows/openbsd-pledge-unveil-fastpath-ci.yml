name: OpenBSD Pledge & Unveil Security Sandboxing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  pledge-unveil-verify:
    name: Verify OpenBSD Pledge & Unveil Sandboxing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable # stable

      - name: Test OpenBSD Pledge & Unveil Submodule
        run: |
          mkdir -p build
          rustc --test src/security/unveil.rs --edition=2021 -o build/unveil_test
          ./build/unveil_test
