name: OpenBSD Pledge & Unveil Security Sandboxing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pledge-unveil-verify:
    name: Verify OpenBSD Pledge & Unveil Sandboxing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Test OpenBSD Pledge & Unveil Submodule
        run: |
          rustc --test src/security/unveil.rs --edition=2021 -o build/unveil_test
          ./build/unveil_test
