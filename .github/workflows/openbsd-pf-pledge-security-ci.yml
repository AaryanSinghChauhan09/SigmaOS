name: OpenBSD Security Sandbox & PF Firewall CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-verification:
    name: OpenBSD Sandbox & PF Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify OpenBSD Pledge & Unveil Primitives
        run: |
          cargo test --lib -- expanded_wiki_innovations::expanded_wiki_tests::test_openbsd_security_sandbox_wiki_engine

      - name: Run OpenBSD Parity Verification
        run: |
          ./run_sigma_tests.sh
