name: OpenBSD Security Sandbox & PF Firewall CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-verification:
    permissions:
      contents: read
    name: OpenBSD Sandbox & PF Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          toolchain: stable

      - name: Run OpenBSD Security Policies Test
        run: |
          ./run_sigma_tests.sh
