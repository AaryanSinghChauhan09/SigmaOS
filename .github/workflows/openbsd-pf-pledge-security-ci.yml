name: OpenBSD Security Sandbox & PF Firewall CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-verification:
    name: OpenBSD Sandbox & PF Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify OpenBSD Pledge & Unveil Primitives
        run: |
          rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/expanded_wiki_innovations.rs -o /tmp/test_wiki && /tmp/test_wiki

      - name: Run OpenBSD Parity Verification
        run: |
          ./run_sigma_tests.sh
