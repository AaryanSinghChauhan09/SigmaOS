name: OpenBSD Security Sandbox & PF Firewall CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-verification:
    name: OpenBSD Sandbox & PF Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify OpenBSD Pledge & Unveil Primitives
        run: |
          rustc --test src/open_source_os_gap_closure.rs --edition=2021 -o /tmp/openbsd_test
          /tmp/openbsd_test

      - name: Run OpenBSD Parity Verification
        run: |
          ./run_sigma_tests.sh
