name: OpenBSD Security Sandbox & PF Firewall CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-verification:
    permissions:
      contents: read
    name: OpenBSD Sandbox & PF Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify OpenBSD Pledge & Unveil Primitives
        run: |
          cargo test --lib -- expanded_wiki_innovations::expanded_wiki_tests::test_openbsd_security_sandbox_wiki_engine

      - name: Run OpenBSD Parity Verification
        run: |
          ./run_sigma_tests.sh
