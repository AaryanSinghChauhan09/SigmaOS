name: Sovereign OS Rolling ISO Build & Dilithium-5 PQC Release Automation

on:
  push:
    tags:
      - 'v*'

jobs:
  sovereign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Sovereign ISO Image
        run: |
          echo "Building Sovereign OS ISO image with post-quantum Dilithium-5 attestation signatures..."
          rustc --test src/sigpkg/universal_oop_system.rs --edition=2021 --cfg 'feature="standalone_test"' -o test_release && ./test_release && rm -f test_release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
