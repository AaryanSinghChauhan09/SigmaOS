name: NetBSD Rump Kernel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  netbsd-rump-kernel:
    name: NetBSD Rump Kernel & Pkgsrc Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable # v1
        with:
          toolchain: stable

      - name: Test Rump Kernel & Pkgsrc Engine
        run: |
          ./run_sigma_tests.sh
          rustc --test src/distro/missing_distro_innovations.rs --edition=2021 --cfg 'feature="standalone_test"' -o build/missing_distros_test && ./build/missing_distros_test
