name: OpenBSD Pledge & Unveil Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  openbsd-security-audit:
    name: Audit OpenBSD Pledge, Unveil & Sysctl Sandboxing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Verify OpenBSD Security & Sandboxing Subsystems
        run: |
          cargo test --test linux_bsd_inspection_tests -- test_openbsd_unveil_inspection
          cargo test --test linux_bsd_inspection_tests -- test_openbsd_sysctl_mib_inspection
          cargo test --lib -- capability_enforcer::tests::test_openbsd_pledge_restrictions

      - name: Run Security Clippy Analysis
        run: cargo clippy --lib -- -D warnings
