name: Fedora Crypto-Policies & Silverblue RPM-OSTree CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  fedora-crypto-ostree-ci:
    name: Fedora Crypto-Policies & Silverblue RPM-OSTree Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Fedora Crypto Policies Engine
        run: cargo check --lib

      - name: Run Sovereign Atomic Harness Tests
        run: ./run_sigma_tests.sh
