name: Fedora Crypto Policies & RPM-OSTree CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  fedora-crypto-ostree-audit:
    permissions:
      contents: read
    name: Fedora Parity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          toolchain: stable

      - name: Run Fedora Security Policies Test
        run: |
          ./run_sigma_tests.sh
