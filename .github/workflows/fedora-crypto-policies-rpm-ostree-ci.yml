name: Fedora Crypto Policies & RPM-OSTree CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  fedora-crypto-ostree-audit:
    name: Fedora Parity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Fedora Security Policies Test
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh
