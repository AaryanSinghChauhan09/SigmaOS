name: Fedora Crypto Policies & RPM-OSTree CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  fedora-crypto-ostree-audit:
    permissions:
      contents: read
    name: Fedora Parity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable # stable

      - name: Run Fedora Security Policies Test
        run: |
          mkdir -p build
          ./run_sigma_tests.sh
