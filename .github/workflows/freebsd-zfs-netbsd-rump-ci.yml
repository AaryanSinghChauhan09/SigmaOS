name: FreeBSD ZFS, NetBSD Rump Kernel & Plan 9 Interop CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  freebsd-zfs-netbsd-rump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify FreeBSD ZFS Storage Pool & Instant Snapshots Engine
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/open_source_obsoletion.rs -o /tmp/test_zfs && /tmp/test_zfs test_sovereign_btrfs_zfs_pool

      - name: Verify Open Source OS Gap Closure Subsystem (NetBSD Rump, Plan 9 9P2000, Haiku BFS, SmartOS Crossbow)
        run: mkdir -p build && rustc --test --edition=2021 --cfg 'feature="standalone_test"' src/open_source_os_gap_closure.rs -o /tmp/test_gap_closure && /tmp/test_gap_closure
