name: Alpine Linux APK v3 Musl-Hardened Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  alpine-apk-ci:
    name: Alpine APK v3 & Musl Security Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Alpine APK Index & Trigger Engine
        run: cargo test --lib -- unimplemented_features::extra_unimplemented_tests::test_alpine_apk_package_index

      - name: Run Native Sovereign Atomic Harness
        run: ./run_sigma_tests.sh
