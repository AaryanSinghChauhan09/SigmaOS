name: GNU Guix Channel & Functional Graft CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  guix-channel:
    name: GNU Guix Functional Channel & Graft Evaluation Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test GNU Guix Manifest & Substitute Dispatcher
        run: |
          echo "Testing GNU Guix package derivation manifest and substitute server dispatcher..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
