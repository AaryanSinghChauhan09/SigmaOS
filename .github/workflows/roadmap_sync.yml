name: "Roadmap Sync"
# Keeps the GitHub Projects board in sync with issue labels and milestones.
# Also posts a weekly digest to GitHub Discussions.

on:
  issues:
    types: [opened, labeled, unlabeled, milestoned, demilestoned, closed, reopened]
  milestone:
    types: [created, closed, edited]
  schedule:
    - cron: "0 9 * * 1"   # Weekly on Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  discussions: write
  repository-projects: write

jobs:
  sync-project-board:
    name: "Sync to Projects Board"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const labels = (issue.labels || []).map(l => l.name);
            const milestone = issue.milestone?.title ?? 'Backlog';

            // Determine roadmap column from labels
            let column = 'Backlog';
            if (labels.includes('in-progress')) column = 'In Progress';
            else if (labels.includes('blocked'))   column = 'Blocked';
            else if (issue.state === 'closed')     column = 'Done';
            else if (labels.some(l => l.startsWith('area/'))) column = 'Planned';

            core.notice(`Issue #${issue.number} → column: ${column} | milestone: ${milestone}`);
            // NOTE: Moving cards requires a classic Projects v1 column_id or
            // ProjectsV2 GraphQL mutation — configure PROJECT_ID secret and
            // add the full GraphQL call below for production use.

  weekly-digest:
    name: "Weekly Roadmap Digest"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();

            // Merged PRs this week
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'closed', sort: 'updated', direction: 'desc', per_page: 50
            });
            const merged = prs.data.filter(pr =>
              pr.merged_at && pr.merged_at > since
            );

            // New contributors
            const contributors = [...new Set(merged.map(pr => pr.user.login))];

            // Open issues count by area
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100
            });

            const body = [
              '## 📋 Weekly SigmaOS Roadmap Digest',
              `*Week ending ${new Date().toDateString()}*`,
              '',
              `### ✅ Merged this week (${merged.length})`,
              ...merged.slice(0, 10).map(pr => `- [#${pr.number}](${pr.html_url}) ${pr.title}`),
              merged.length > 10 ? `- ...and ${merged.length - 10} more` : '',
              '',
              `### 👥 Contributors (${contributors.length})`,
              contributors.map(c => `@${c}`).join(' · ') || 'None',
              '',
              `### 📌 Open Issues: ${issues.data.filter(i => !i.pull_request).length}`,
              '',
              '_Auto-generated by `roadmap_sync.yml`_',
            ].filter(l => l !== '').join('\n');

            core.summary.addRaw(body).write();
            console.log(body);
            // To post to Discussions, uncomment and provide DISCUSSION_CATEGORY_ID:
            // await github.graphql(`mutation { createDiscussion(...) { discussion { id } } }`)
