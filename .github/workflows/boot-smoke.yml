name: SigmaOS QEMU Boot Smoke Test

on:
  # Run against the ISO artifact produced by a successful build.
  workflow_run:
    workflows: ["Build SigmaOS ISO"]
    types: [completed]
  # Nightly + manual: test the latest published release ISO end-to-end.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-smoke:
    name: QEMU Boot-to-Userspace Smoke Test
    runs-on: ubuntu-latest
    # Skip when the triggering build failed — nothing valid to boot.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install QEMU and ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso >/dev/null

      - name: Resolve ISO under test
        id: iso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            mkdir -p build/artifact
            gh run download "$RUN_ID" -n sigmaos-desktop-iso -D build/artifact
            ISO="$(find build/artifact -name '*.iso' | head -1)"
          else
            # No local ISO on schedule/manual runs — qemu_boot_smoke.sh
            # falls back to downloading + reassembling the latest release.
            ISO=""
          fi
          echo "path=$ISO" >> "$GITHUB_OUTPUT"

      - name: Run real QEMU boot test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/ci/qemu_iso_boot.sh scripts/ci/qemu_boot_smoke.sh
          if [[ -n "${{ steps.iso.outputs.path }}" ]]; then
            bash scripts/ci/qemu_boot_smoke.sh "${{ steps.iso.outputs.path }}"
          else
            bash scripts/ci/qemu_boot_smoke.sh
          fi

      - name: Upload Boot Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: qemu-boot-smoke-artifact
          path: |
            build/qemu-boot/serial.log
            build/release-download/
          if-no-files-found: ignore
