name: SigmaOS QEMU Boot Smoke Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *' # Daily boot validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-smoke:
    name: QEMU Boot-to-Shell Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Run Boot-to-Shell Smoke Test
        run: |
          chmod +x scripts/ci/qemu_boot_smoke.sh
          ./scripts/ci/qemu_boot_smoke.sh

      - name: Upload Boot Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: qemu-boot-smoke-artifact
          path: build/boot/boot_smoke_result.json
