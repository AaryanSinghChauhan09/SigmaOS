name: "Community Digest"
# Every Monday posts a rich weekly digest to GitHub Discussions:
# merged PRs, new contributors, top open issues, and benchmark trends.

on:
  schedule:
    - cron: "0 8 * * 1"   # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  issues: read
  pull-requests: read

jobs:
  digest:
    name: "Generate Weekly Digest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const { owner, repo } = context.repo;

            // ── Merged PRs ──────────────────────────────────────────────────
            const allPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100
            });
            const merged = allPRs.filter(pr => pr.merged_at && pr.merged_at > since);

            // ── New Contributors ─────────────────────────────────────────────
            const newContribs = [...new Set(merged.map(pr => pr.user.login))];

            // ── Top Open Issues ──────────────────────────────────────────────
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', sort: 'updated', direction: 'desc', per_page: 50
            });
            const topIssues = openIssues
              .filter(i => !i.pull_request)
              .slice(0, 5);

            // ── Benchmark trend placeholder ──────────────────────────────────
            const benchLine = '📊 Benchmark trend: see [latest run](https://github.com/'
              + owner + '/' + repo + '/actions/workflows/benchmarks.yml)';

            // ── Build digest ─────────────────────────────────────────────────
            const date   = new Date().toDateString();
            const lines  = [
              `# 🗞️ SigmaOS Weekly Digest — ${date}`,
              '',
              `## ✅ Merged PRs (${merged.length})`,
              ...merged.slice(0, 15).map(pr =>
                `- [#${pr.number}](${pr.html_url}) **${pr.title}** — @${pr.user.login}`
              ),
              merged.length > 15 ? `- …and ${merged.length - 15} more` : '',
              '',
              `## 👥 Contributors This Week (${newContribs.length})`,
              newContribs.length
                ? newContribs.map(u => `[@${u}](https://github.com/${u})`).join(' · ')
                : '_No merged contributions this week_',
              '',
              `## 🔥 Top Open Issues`,
              ...topIssues.map(i =>
                `- [#${i.number}](${i.html_url}) ${i.title} ` +
                (i.labels.length ? `\`${i.labels.map(l=>l.name).join('` `')}\`` : '')
              ),
              '',
              benchLine,
              '',
              '---',
              '_Auto-generated by the `community_digest` workflow. Reply here or open an issue to get involved!_',
            ].filter(l => l !== undefined).join('\n');

            // Write to job summary (always works)
            core.summary.addRaw(lines).write();

            // Post to Discussions if DISCUSSION_CATEGORY_ID is configured
            const catId = process.env.DISCUSSION_CATEGORY_ID;
            if (catId) {
              const repoData = await github.graphql(`query($owner:String!,$repo:String!){
                repository(owner:$owner,name:$repo){ id }
              }`, { owner, repo });
              await github.graphql(`
                mutation($repoId:ID!,$catId:ID!,$title:String!,$body:String!){
                  createDiscussion(input:{repositoryId:$repoId,categoryId:$catId,title:$title,body:$body}){
                    discussion{ url }
                  }
                }`, {
                repoId: repoData.repository.id,
                catId,
                title: `Weekly Digest — ${date}`,
                body: lines
              });
            }
        env:
          DISCUSSION_CATEGORY_ID: ${{ secrets.DISCUSSION_CATEGORY_ID }}
