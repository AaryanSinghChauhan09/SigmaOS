name: "Automation: Branch Name Validator"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-branch-name:
    name: Validate Branch Name Convention
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Name Pattern
        uses: actions/github-script@v7 # v7.0.1
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const validPrefixes = [
              'feat/', 'feature/', 'fix/', 'docs/', 'style/', 'refactor/', 'perf/',
              'test/', 'chore/', 'revert/', 'impl/', 'driver/', 'security/',
              'kernel/', 'arch/', 'ci/', 'pkg/', 'ai/', 'ux/', 'sdk/', 'boot/',
              'bolt/', 'palette/', 'sentinel/', 'jules-', 'universal-',
              'palette-', 'bolt-', 'sentinel-', 'master-', 'master', 'main'
            ];

            const isValid = validPrefixes.some(prefix => branchName.startsWith(prefix));

            if (!isValid) {
              const errorMsg = `❌ Branch name \`${branchName}\` does not follow Conventional Branch Naming rules.\n\n` +
                `Valid prefixes include: ${validPrefixes.map(p => `\`${p}\``).join(', ')}.`;

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: errorMsg
                });
              } catch (e) {
                console.log(`Unable to create comment: ${e.message}`);
              }

              core.setFailed(`Branch name '${branchName}' does not start with a valid prefix.`);
            } else {
              console.log(`✅ Branch name '${branchName}' satisfies naming guidelines.`);

              // Fedora Linux style automatic PR branch categorization labeling
              if (context.payload && context.payload.pull_request) {
                let branchLabel = 'component';
                if (branchName.startsWith('feat/') || branchName.startsWith('impl/')) branchLabel = 'feature';
                else if (branchName.startsWith('fix/')) branchLabel = 'bugfix';
                else if (branchName.startsWith('docs/')) branchLabel = 'documentation';
                else if (branchName.startsWith('pkg/') || branchName.startsWith('universal-')) branchLabel = 'packaging';
                else if (branchName.startsWith('kernel/') || branchName.startsWith('arch/')) branchLabel = 'kernel';
                else if (branchName.startsWith('security/') || branchName.startsWith('sentinel/')) branchLabel = 'security';
                else if (branchName.startsWith('perf/') || branchName.startsWith('bolt/')) branchLabel = 'performance';

                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    labels: [branchLabel]
                  });
                } catch (e) {
                  console.log(`Note: Unable to add label '${branchLabel}': ${e.message}`);
                }
              }
            }
