name: ISO Live Media & Installation Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-iso-live-media:
    name: Bootable Live ISO & Deployment Script Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y xorriso grub-pc-bin grub-common || true

      - name: Test ISO Build Script
        run: |
          python3 scripts/sovereign_build_backend.py || true
