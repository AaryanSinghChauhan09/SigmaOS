name: Fedora RPM & DNF MirrorManager 2 Integration CI

on:
  push:
    branches: [ main, master, 'fix/*', 'feat/*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-fedora-mirrormanager:
    name: Fedora MirrorManager 2 & System Roles Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Run Fedora Compatibility Unit Tests
        run: cargo test --lib -- compatibility::fedora
