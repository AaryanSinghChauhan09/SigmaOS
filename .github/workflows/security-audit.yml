name: "Security Audit"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Monday at 06:00 UTC (offset from CodeQL to spread CI load)
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # ── cargo-audit ─────────────────────────────────────────────────────────────
  cargo-audit:
    permissions:
      contents: read

    name: Cargo Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ── Unsafe without SAFETY ────────────────────────────────────────────────────
  unsafe-check:
    permissions:
      contents: read

    name: Unsafe Blocks Without SAFETY Comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect unsafe blocks missing SAFETY comments
        run: |
          echo "=== Scanning for unsafe blocks without SAFETY comments ==="
          FOUND=0
          while IFS=: read -r file line _; do
            prev=$((line - 1))
            if [[ $prev -gt 0 ]]; then
              prev_line=$(sed -n "${prev}p" "$file" 2>/dev/null)
              if ! echo "$prev_line" | grep -q 'SAFETY'; then
                echo "::warning file=$file,line=$line::unsafe block may be missing a // SAFETY comment"
                FOUND=$((FOUND + 1))
              fi
            fi
          done < <(grep -rn 'unsafe {' src/ --include='*.rs' 2>/dev/null || true)
          echo "Total warnings: $FOUND"

  # ── Hardcoded secrets check ──────────────────────────────────────────────────
  secrets-check:
    permissions:
      contents: read

    name: Hardcoded Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Scan for hardcoded secrets
        run: |
          echo "=== Scanning for potential hardcoded secrets ==="
          # Patterns that suggest hardcoded secrets in production code
          PATTERNS='password\s*=\s*"[^"]\|secret\s*=\s*"[^"]\|api_key\s*=\s*"[^"]\|token\s*=\s*"[^"]'
          HITS=$(grep -rn "$PATTERNS" src/ --include='*.rs' \
            | grep -v '^\s*//' \
            | grep -v '#\[test\]' \
            | grep -v 'test\|mock\|example\|TODO' \
            || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Potential hardcoded secrets found:"
            echo "$HITS"
            exit 1
          else
            echo "No hardcoded secrets detected."
          fi

  # ── Unwrap without SAFETY ─────────────────────────────────────────────────────
  unwrap-check:
    permissions:
      contents: read

    name: Unwrap Without Safety Justification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect bare unwrap/expect in production code
        run: |
          echo "=== Scanning for .unwrap() / .expect() in production code ==="
          # Exclude test modules, test files, and lines with a SAFETY comment
          grep -rn '\.unwrap()\|\.expect(' src/ --include='*.rs' \
            | grep -v '#\[test\]' \
            | grep -v 'tests/' \
            | grep -v '^\s*//' \
            | grep -v '// SAFETY' \
            | grep -v '// safe:' \
            | while IFS=: read -r file line content; do
                # Check surrounding lines for SAFETY comment
                prev=$((line - 1))
                prev_content=$(sed -n "${prev}p" "$file" 2>/dev/null || true)
                if echo "$prev_content" | grep -q 'SAFETY\|safe:'; then
                  continue
                fi
                echo "::warning file=$file,line=$line::$content"
              done || true
          echo "Scan complete."

  # ── Integer overflow patterns ─────────────────────────────────────────────────
  overflow-check:
    permissions:
      contents: read

    name: Integer Overflow Pattern Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Flag unchecked integer casts in kernel code
        run: |
          echo "=== Checking for unsafe integer casts in kernel/security code ==="
          # Flag 'as u8' / 'as i8' truncation casts that could lose data
          grep -rn ' as u8\b\| as i8\b\| as u16\b\| as i16\b' \
            src/kernel/ src/security/ src/crypto/ --include='*.rs' \
            | grep -v '^\s*//' \
            | while IFS=: read -r file line content; do
                echo "::warning file=$file,line=$line::Potentially truncating cast: $content"
              done || true
          echo "Scan complete."
