name: FreeBSD Poudriere Ports & VuXML Security Auditor CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  freebsd-poudriere-audit:
    name: Verify FreeBSD Ports Flavours & VuXML Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@7b737f3747eb115cf4e8f1766b8fb62b6948fb16 # stable

      - name: Execute Test Suite
        run: |
          ./run_sigma_tests.sh
