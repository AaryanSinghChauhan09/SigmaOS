name: "Automation: Weekly Repository Metrics Report"

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-metrics:
    name: Generate Repository Health Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Health Summary
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const prCount = openIssues.data.filter(i => i.pull_request).length;
            const issueCount = openIssues.data.length - prCount;

            const body = `## 📊 SigmaOS Weekly Repository Health & Metrics Report\n\n` +
              `- **Generated on:** ${new Date().toISOString().split('T')[0]}\n` +
              `- **Open Issues:** ${issueCount}\n` +
              `- **Open Pull Requests:** ${prCount}\n` +
              `- **Automated Workflow Status:** Healthy 🛡️⚡\n\n` +
              `*This report was automatically generated by the SigmaOS Autonomous AI Engineering Suite.*`;

            await github.rest.issues.create({
              owner,
              repo,
              title: `📊 [Metrics] Weekly Repository Health Summary (${new Date().toISOString().split('T')[0]})`,
              body,
              labels: ['metrics', 'automation']
            });
