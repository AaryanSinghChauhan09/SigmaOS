name: Sovereign Security & Supply Chain Vulnerability Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

permissions:
  contents: read

jobs:
  security-supply-chain-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify Security Capabilities & Audits
        run: cargo test --lib security::root_improvement
