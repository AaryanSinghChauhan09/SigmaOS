name: Kernel Fuzzing & Stress Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Nightly fuzzing run

permissions:
  contents: read

jobs:
  fuzz-kernel-ipc-vfs:
    name: Syzkaller & Cargo-Fuzz IPC/VFS Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Kernel Regression Suite
        run: |
          make -C tests regress

      - name: Run IPC Fuzzing Test Harness
        run: |
          cargo test --lib fuzz_ipc_message_passing || true
