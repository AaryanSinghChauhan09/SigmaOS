name: NixOS Hydra Distributed Evaluation & Nix Flakes CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  nixos-hydra-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify NixOS Hydra Distributed Jobset Evaluator
        run: |
          echo "::group::NixOS Hydra Distributed Evaluation"
          cargo check --lib
          echo "::endgroup::"
