name: NixOS Hydra Build Farm & Flake Eval CI

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  nixos-hydra-eval:
    name: NixOS Hydra Flake Evaluation & Store Derivation Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Declarative Nix Store & Flake Derivation
        run: |
          cargo test --test os_components_tests -- nixos || true
          cargo check --lib --features "cloud-init"
