name: Arch Linux & Gentoo Package Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-gentoo-build:
    name: Arch PKGBUILD & Gentoo Portage Ebuild Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Arch PKGBUILD, makepkg & AUR Helper Engine
        run: |
          cat << 'EOF' > test_arch_gentoo.rs
          extern crate alloc;

          #[path = "src/sigpkg/makepkg.rs"]
          pub mod makepkg;
          #[path = "src/sigpkg/aur_helper.rs"]
          pub mod aur_helper;
          #[path = "src/sigpkg/universal_engine.rs"]
          pub mod universal_engine;
          #[path = "src/sigpkg/spec.rs"]
          pub mod spec;
          #[path = "src/sigpkg/aur.rs"]
          pub mod aur;

          fn main() {}
          EOF
          cargo test --lib sigpkg::makepkg
          cargo test --lib sigpkg::aur_helper
          cargo test --lib sigpkg::universal_engine
