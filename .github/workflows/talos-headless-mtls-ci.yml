name: Talos Linux Headless mTLS API OS CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  talos-mtls-cluster:
    name: Talos Headless API & mTLS Cluster Invariant Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Headless API Engine
        run: |
          cargo test --test test_distro_dominance test_talos_headless_mtls_cluster
