name: Sovereign Performance & Memory Benchmarking CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  performance-benchmarking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Execute Boot Benchmark Script
        run: bash scripts/benchmark-boot.sh

      - name: Execute Memory Benchmark Script
        run: bash scripts/benchmark-memory.sh
