name: Gentoo Portage USE-Flags & Ebuild Emerge Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-gentoo-portage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable

      - name: Execute Gentoo Portage USE-Flags & Mask Engine Tests
        run: |
          rustc --edition 2021 --test src/distro/linux_bsd_inspirations.rs -o build/gentoo_test
          ./build/gentoo_test test_gentoo_use_flags_and_conflicts
