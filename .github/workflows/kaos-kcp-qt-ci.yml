name: KaOS KCP & Plasma Desktop Integration CI

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  kaos-kcp:
    name: KaOS Community Packages (KCP) & Plasma Desktop Engine Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test KaOS KCP & Universal Pacman Adapter
        run: |
          echo "Testing KaOS KCP package manifests and pacman integration..."
          rustc --test --edition=2021 tests/test_universal_adapter.rs -o build/test_universal_adapter && ./build/test_universal_adapter
