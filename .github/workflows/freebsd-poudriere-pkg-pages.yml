name: FreeBSD Poudriere Ports & Pages Documentation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-poudriere"
  cancel-in-progress: false

jobs:
  poudriere-pkg-build:
    name: Verify FreeBSD GEOM & Poudriere Subsystems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run FreeBSD Parity & GEOM Inspection
        run: |
          cargo test --test linux_bsd_inspection_tests -- test_kernel_parity_innovations_geom_devlink_unveil_vnet_inspection
          cargo test --test linux_bsd_inspection_tests -- test_freebsd_jail_manager_inspection

      - name: Build Documentation Site
        run: |
          mkdir -p public_poudriere
          echo "<html><body><h1>SigmaOS FreeBSD Poudriere & GEOM Verification Site</h1></body></html>" > public_poudriere/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public_poudriere

  deploy-pages:
    name: Deploy FreeBSD Poudriere Docs to GitHub Pages
    needs: poudriere-pkg-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db596a10b7b134807f43503db9ab302ae552c8
