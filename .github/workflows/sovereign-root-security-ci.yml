name: Sovereign Root & Superuser Security Verification CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  root-security-audit:
    name: BSD Securelevels & OpenBSD Doas Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile and Run Root Improvement Unit Tests
        run: |
          rustc --edition=2021 --test src/security/root_improvement.rs -o test_root_imp && ./test_root_imp
          rm test_root_imp
