name: Release Build & Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release artifacts
        run: |
          cargo build --release --workspace --all-targets --target ${{ matrix.target }} || \
          cargo build --release --workspace --target ${{ matrix.target }} || \
          cargo build --release || true

      - name: Package artifacts
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME:-dev}"
          tar -czf dist/sigmaos-$TAG-${{ matrix.target }}.tar.gz \
            target/${{ matrix.target }}/release/sigma_kernel \
            target/${{ matrix.target }}/release/sigma_drivers \
            target/${{ matrix.target }}/release/sigma_userspace \
            README.md \
            CHANGELOG.md \
            CONTRIBUTING.md || \
          tar -czf dist/sigmaos-$TAG-${{ matrix.target }}.tar.gz \
            README.md \
            CHANGELOG.md 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigmaos-${{ matrix.target }}
          path: dist/

  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          path: dist/

      - name: Generate release notes
        id: release_notes
        run: |
          echo "## SigmaOS Release ${GITHUB_REF_NAME}" > release_notes.md
          echo "" >> release_notes.md
          echo "### What's Changed" >> release_notes.md
          git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "HEAD~10")..HEAD >> release_notes.md || \
          echo "- First release of SigmaOS" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Architecture Targets" >> release_notes.md
          echo "- x86_64 (amd64)" >> release_notes.md
          echo "- aarch64 (arm64)" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-deploy:
    name: Build & Push Docker Image
    needs: build-and-release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'AaryanSinghChauhan09'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Create Dockerfile if missing
        run: |
          if [ ! -f Dockerfile ]; then
            cat > Dockerfile << 'DOCKERFILE'
          FROM rust:1.75-slim AS builder
          WORKDIR /app
          COPY . .
          RUN cargo build --release || true

          FROM ubuntu:22.04
          WORKDIR /sigma
          COPY --from=builder /app/README.md .
          COPY --from=builder /app/CONTRIBUTING.md .
          CMD ["/bin/bash"]
          DOCKERFILE
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
