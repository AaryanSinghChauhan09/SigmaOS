# SigmaOS Deployment Pipeline
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
    
    - name: Build release
      run: cargo build --release
    
    - name: Create release package
      run: |
        mkdir -p release
        cp target/release/sigma_kernel release/
        cp target/release/sigma_drivers release/
        cp target/release/sigma_userspace release/
        tar -czf sigmaos-release.tar.gz release/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sigmaos-release
        path: sigmaos-release.tar.gz
