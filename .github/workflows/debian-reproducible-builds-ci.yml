name: Debian Reproducible Builds & DFSG Policy CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  debian-reproducible-verification:
    name: Debian Reproducible Build Output & DFSG License Compliance Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Debian Policy Test
        run: |
          ./run_sigma_tests.sh
