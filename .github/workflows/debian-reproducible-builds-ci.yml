name: Debian Reproducible Builds & APT Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  debian-apt-reproducible-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Test Debian APT Engine & DEB Package Parser
        run: cargo test --lib sigpkg::debian_apt_engine

      - name: Verify Reproducible Build Hash Consistency
        run: |
          mkdir -p build
          cargo check --lib --all-targets
