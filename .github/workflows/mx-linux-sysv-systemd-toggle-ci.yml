name: MX Linux SysVinit Systemd Toggle CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-init-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify MX Linux SysVinit / Systemd Init Toggle
        run: |
          cargo check --lib
