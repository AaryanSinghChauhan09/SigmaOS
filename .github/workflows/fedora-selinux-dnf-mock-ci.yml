name: Fedora SELinux & DNF Mock Chroot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  fedora-rpm-selinux-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Test Fedora RPM Resolver & SELinux Manager
        run: cargo test --lib sigpkg::fedora_rpm_engine
