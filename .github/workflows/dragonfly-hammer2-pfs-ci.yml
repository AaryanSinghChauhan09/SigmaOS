name: DragonFly HAMMER2 PFS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  dragonfly-hammer2-pfs:
    name: DragonFly BSD HAMMER2 PFS Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@a54c7dd936c2d043654ef3ea8221307521096fa6 # v1
        with:
          toolchain: stable

      - name: Test HAMMER2 PFS Engine
        run: |
          rustc --test src/distro/missing_distro_innovations.rs --edition=2021 --cfg 'feature="standalone_test"' -o build/missing_distros_test && ./build/missing_distros_test
