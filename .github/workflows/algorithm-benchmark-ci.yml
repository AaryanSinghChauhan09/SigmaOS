name: OS Subsystem & Algorithm Benchmarks CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  benchmark-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Execute Algorithm & Subsystem Inspection Tests
        run: |
          cargo test --test algorithm_and_subsystem_inspection_tests

      - name: Execute Full Sovereign Test Harness
        run: |
          ./run_sigma_tests.sh
