name: QEMU & KVM Virtualization Subsystem CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  virtualization-tests:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262


      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659

        with:
          toolchain: stable

      - name: Run Virtual Machine Manager Unit Tests
        run: |
          cargo test --lib virtualization::vm_manager

      - name: Run Full Sovereign Atomic & Virtualization Test Suite
        run: |
          ./run_sigma_tests.sh
