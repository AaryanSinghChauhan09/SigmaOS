name: "Linux Kernel ABI & Syscall Compatibility Matrix"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]


permissions:
  contents: read
jobs:
  abi-compat-matrix:
    name: Linux Kernel ABI Compatibility Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Linux Kernel ERA Syscall Emulation
        run: |
          cargo test --lib compatibility::historic_linux::tests -- --nocapture
