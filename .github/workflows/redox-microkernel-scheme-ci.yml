name: "Redox OS Microkernel Scheme CI"

on:
  push:
    branches: [ "main", "dev", "jules-*" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  redox-parity-test:
    name: "Verify Redox OS URL Schemes & Microkernel Parity"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Rust Toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: "Run Redox OS Subsystem Tests"
        run: |
          ./run_sigma_tests.sh
