name: FreeBSD Jail Isolation & ZFS BootEnv CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  bsd-jail-zfs-test:
    permissions:
      contents: read
    name: FreeBSD Parity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify FreeBSD Boot Environment & Storage
        run: |
          ./scripts/changed_files_rustc_tests.sh src/boot/sigma_boot.rs
          ./run_sigma_tests.sh
