name: FreeBSD Jails & ZFS Boot Environments CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  freebsd-jails-zfs-ci:
    name: FreeBSD Jails & ZFS BootEnv Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test FreeBSD Jails and ZFS Parity
        run: cargo check --lib

      - name: Run Sovereign Atomic Harness Tests
        run: ./run_sigma_tests.sh
