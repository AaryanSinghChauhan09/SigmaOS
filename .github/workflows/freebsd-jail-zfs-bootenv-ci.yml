name: FreeBSD Jail Isolation & ZFS BootEnv CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  bsd-jail-zfs-test:
    permissions:
      contents: read
    name: FreeBSD Parity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify FreeBSD Boot Environment & Storage
        run: |
          ./run_sigma_tests.sh
