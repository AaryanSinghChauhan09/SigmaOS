name: FreeBSD Jail Isolation & ZFS BootEnv CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  bsd-jail-zfs-test:
    permissions:
      contents: read
    name: FreeBSD Parity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@7b73730e263d91cf0ebbe694c03b1e3eb8fb14b1 # stable
        with:
          toolchain: stable # stable

      - name: Verify FreeBSD Boot Environment & Storage
        run: |
          mkdir -p build
          ./run_sigma_tests.sh
