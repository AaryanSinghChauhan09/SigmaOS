name: NixOS Declarative Generation & Rollback Deploy Verification

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  nixos-declarative-verification:
    name: NixOS System Generation & Rollback Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Declarative Generation State
        run: |
          cargo test --test linux_bsd_inspection_tests test_wiki_distro_innovations_inspection
