name: Debian sbuild Reproducible Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  debian-sbuild-reproducible:
    name: Debian sbuild & Reproducible Build Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify Debian Package Parity & Reproducibility Context
        run: |
          cargo test --lib -- sigpkg::sovereign_sigpkg
          cargo test --lib -- package::universal
