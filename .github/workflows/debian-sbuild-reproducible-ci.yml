name: Debian sbuild Reproducible Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  debian-sbuild-reproducible:
    name: Debian sbuild & Reproducible Build Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable # v1
        with:
          toolchain: stable

      - name: Verify Debian Package Parity & Reproducibility Context
        run: |
          chmod +x ./run_sigma_tests.sh
          ./run_sigma_tests.sh
