name: Debian sbuild Reproducible Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  debian-sbuild-reproducible:
    name: Debian sbuild & Reproducible Build Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@v1 # v1
        with:
          toolchain: stable

      - name: Verify Debian Package Parity & Reproducibility Context
        run: |
          rustc --test src/package/sigma_pkg.rs --edition=2021 -o build/test_sigma_pkg && ./build/test_sigma_pkg
          rustc --test src/package/universal.rs --edition=2021 -o build/test_universal && ./build/test_universal
