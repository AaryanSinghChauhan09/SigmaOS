name: Debian sbuild Reproducible Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  debian-sbuild-reproducible:
    name: Debian sbuild & Reproducible Build Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@a54c7dd936c2d043654ef3ea8221307521096fa6 # v1
        with:
          toolchain: stable

      - name: Verify Debian Package Parity & Reproducibility Context
        run: |
          cargo test --lib -- sigpkg::sovereign_sigpkg
          cargo test --lib -- package::universal
