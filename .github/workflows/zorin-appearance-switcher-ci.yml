name: Zorin OS Appearance Switcher CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
jobs:
  zorin-appearance-verification:
    name: Zorin OS Appearance Switcher & Layout Preset Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Zorin OS Test Suite
        run: |
          ./run_sigma_tests.sh
