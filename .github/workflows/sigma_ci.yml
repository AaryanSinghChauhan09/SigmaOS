name: SigmaOS Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        override: true
        components: rust-src, llvm-tools-preview
    - name: Build Kernel
      run: cargo build --target x86_64-unknown-none
    - name: Run Tests
      run: cargo test
    - name: QEMU Boot Test
      run: |
        make iso-ci
        # STUB: Run QEMU with timeout and check for panic/success string in serial output
