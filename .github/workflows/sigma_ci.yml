name: SigmaOS Sovereign CI

on:
  push:
    branches: [ main, lattice-dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib nasm make cppcheck

    - name: Clean & Ignite Lattice
      run: |
        make clean
        make singularity

    - name: Static Security Audit (CppCheck)
      run: |
        cppcheck --enable=warning,style,performance --error-exitcode=1 -Iinclude kernel/ core/ drivers/

    - name: Verify Shard Count
      run: |
        # Simple check to ensure critical shards are present
        ls -l sigmaos.bin
        [ -f sigmaos.bin ] || exit 1
