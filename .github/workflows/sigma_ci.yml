name: SigmaOS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Test Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check
        working-directory: ./kernel
        continue-on-error: true

      - name: Kernel Clippy Lints
        run: cargo clippy --target x86_64-unknown-none -- -D warnings
        working-directory: ./kernel
        continue-on-error: true

      - name: Build Kernel (no_std)
        run: cargo build --target x86_64-unknown-none --release
        working-directory: ./kernel

  sbom_generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-rust-cyclonedx-action@v1
        with:
          args: --all-features

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigmaos-sbom
          path: bom.xml

  userland_tests:
    name: Userland Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run SigPkg Unit Tests
        run: cargo test
        working-directory: ./userland/sigpkg
      - name: Make Smoke Test Executable
        run: chmod +x ./scripts/smoke-test.sh
      - name: Run Smoke Tests
        run: ./scripts/smoke-test.sh
