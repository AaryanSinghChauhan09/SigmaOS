# GitHub Labeler Configuration for SigmaOS
rust:
  - changed-files:
      - any-glob-to-any-file: 'src/**/*.rs'

workflows:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/*'

core-kernel:
  - changed-files:
      - any-glob-to-any-file: 'src/kernel/**/*'

package-system:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/package/**/*'
          - 'src/sigpkg/**/*'
          - 'src/bin/sigpkg.rs'

drivers-hal:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/drivers/**/*'
          - 'src/arch/**/*'

security:
  - changed-files:
      - any-glob-to-any-file: 'src/security/**/*'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - 'wiki/**/*'
          - 'wiki_repo/**/*'
          - 'WIKI/**/*'
          - '*.md'

"area: kernel":
  - src/kernel/**/*
"area: distro":
  - src/distro/**/*
"area: security":
  - src/security/**/*
"area: networking":
  - src/net/**/*
  - src/network/**/*
"area: package":
  - src/sigpkg/**/*
  - src/package/**/*
"area: documentation":
  - docs/**/*
  - wiki/**/*
