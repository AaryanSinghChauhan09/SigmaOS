# Auto-labeler config for SigmaOS pull requests
# Used by .github/workflows/automation.yml (labeler job)

"kernel":
  - changed-files:
    - any-glob-to-any-file:
      - "src/kernel/**"
      - "kernel/**"
      - "klib/**"
      - "kabi/**"

"drivers":
  - changed-files:
    - any-glob-to-any-file:
      - "src/drivers/**"
      - "src/driver/**"
      - "drivers/**"

"security":
  - changed-files:
    - any-glob-to-any-file:
      - "src/security/**"
      - "src/crypto/**"
      - "src/tpm/**"
      - "SECURITY.md"

"networking":
  - changed-files:
    - any-glob-to-any-file:
      - "src/network/**"
      - "src/net/**"

"filesystem":
  - changed-files:
    - any-glob-to-any-file:
      - "src/filesystem/**"
      - "src/fs/**"
      - "src/storage/**"

"AI":
  - changed-files:
    - any-glob-to-any-file:
      - "src/ai/**"
      - "src/ml/**"
      - "src/nlp/**"

"documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "wiki/**"
      - "wiki_repo/**"
      - "WIKI/**"
      - "**/*.md"

"CI/CD":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "Makefile"
      - "scripts/**"

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"

"shell":
  - changed-files:
    - any-glob-to-any-file:
      - "src/shell/**"
      - "sigma-sh/**"

"desktop":
  - changed-files:
    - any-glob-to-any-file:
      - "zenith_desktop/**"
      - "src/desktop/**"
      - "src/graphics/**"
      - "src/ui/**"

"package-manager":
  - changed-files:
    - any-glob-to-any-file:
      - "src/sigpkg/**"
      - "src/package/**"
      - "sigma_pkg_registry/**"

"virtualization":
  - changed-files:
    - any-glob-to-any-file:
      - "src/virtualization/**"
      - "src/virt/**"
      - "src/container/**"
