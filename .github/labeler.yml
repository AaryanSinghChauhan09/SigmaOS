# GitHub Labeler Configuration for SigmaOS
rust:
  - changed-files:
      - any-glob-to-any-file: 'src/**/*.rs'

workflows:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/*'

core-kernel:
  - changed-files:
      - any-glob-to-any-file: 'src/kernel/**/*'

package-system:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/package/**/*'
          - 'src/sigpkg/**/*'
          - 'src/bin/sigpkg.rs'

drivers-hal:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/drivers/**/*'
          - 'src/arch/**/*'

security:
  - changed-files:
      - any-glob-to-any-file: 'src/security/**/*'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - 'wiki/**/*'
          - 'wiki_repo/**/*'
          - '*.md'

"area: kernel":
  - changed-files:
      - any-glob-to-any-file: 'src/kernel/**/*'

"area: distro":
  - changed-files:
      - any-glob-to-any-file: 'src/distro/**/*'

"area: security":
  - changed-files:
      - any-glob-to-any-file: 'src/security/**/*'

"area: networking":
  - changed-files:
      - any-glob-to-any-file:
          - 'src/net/**/*'
          - 'src/network/**/*'

"area: package":
  - changed-files:
      - any-glob-to-any-file:
          - 'src/sigpkg/**/*'
          - 'src/package/**/*'

"area: documentation":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - 'wiki/**/*'
