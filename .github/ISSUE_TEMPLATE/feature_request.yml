name: 🚀 Professional Shard Request
description: Propose a new industrial or professional shard for the Sovereign Lattice.
labels: ["enhancement", "new-profession"]
body:
  - type: input
    id: profession
    attributes:
      label: Profession Name
      description: e.g., Quantum Physicist, Deep-Sea Archaeologist
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Essential Tools
      description: What specific professional tools should this shard provide?
    validations:
      required: true
  - type: textarea
    id: resilience
    attributes:
      label: Resilience Strategy
      description: How should this shard behave during a lattice-failover event?
    validations:
      required: true
