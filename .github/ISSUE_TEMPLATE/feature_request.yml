name: 🚀 Industrial Shard Proposal (Feature Request)
description: Suggest a new industry USP to absorb into the Lattice.
labels: ["industrial-usp", "strategic-expansion"]
body:
  - type: textarea
    id: usp-desc
    attributes:
      label: USP Description
      placeholder: What industry-standard tool or workflow should we absorb?
    validations:
      required: true
  - type: textarea
    id: profession-impact
    attributes:
      label: Profession Impact
      placeholder: Which industrial roles will benefit from this shard?
    validations:
      required: true
  - type: textarea
    id: implementation-path
    attributes:
      label: Implementation Path
      placeholder: How can we bridge this tool into the Sovereign Lattice?
    validations:
      required: true
