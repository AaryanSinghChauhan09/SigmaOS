name: Documentation Improvement
description: Suggest improvements or point out gaps in the SigmaOS documentation
title: "[Docs]: "
labels: ["documentation", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve our documentation!
  - type: input
    id: location
    attributes:
      label: Location of Documentation
      description: Where did you find the issue? (e.g., README.md, WIKI/BuildGuide.md)
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Description of the Issue
      description: What is wrong, missing, or unclear?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Improvement
      description: How should the documentation be updated?
    validations:
      required: false
