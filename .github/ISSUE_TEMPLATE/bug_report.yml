name: Bug Report
description: Report a bug in the SigmaOS kernel or shards
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: component
    attributes:
      label: Affected Component / Shard
      description: Which shard or subsystem is affected? (e.g., S01_Genesis, S04_HAL)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SigmaOS Version
      description: Which version or commit hash of SigmaOS are you using?
    validations:
      required: true
