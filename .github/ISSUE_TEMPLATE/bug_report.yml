name: 🐞 Shard Bug Report
description: Report a necrotic or malfunctioning shard in the SigmaOS lattice.
labels: ["bug", "lattice-necrosis"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please ensure your shard health is verified by `sigma-cli doctor` before submitting.
  - type: input
    id: shard_id
    attributes:
      label: Shard Identifier
      description: e.g., S-MED, S-VAKIL, S-CAD
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Malfunction Description
      description: What is the shard doing incorrectly?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: S-LOG Output
      description: Please provide relevant output from the Sovereign Journal.
    validations:
      required: true
