name: "🐞 Sovereign Bug Report"
description: "Report a shard-level anomaly or lattice instability."
body:
  - type: markdown
    attributes:
      value: "### Σ SigmaOS Forensic Report"
  - type: input
    id: suite_id
    attributes:
      label: "Affected Sovereign Suite"
      placeholder: "e.g., S01_Genesis"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Anomaly Description"
      placeholder: "What structural instability was observed?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Kernel Journal Logs"
      placeholder: "Output from s_journal_dump()"
