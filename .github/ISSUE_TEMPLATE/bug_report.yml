name: 🐛 Industrial Bug Report
description: Report an anomaly in the Sovereign Lattice.
labels: ["anomaly", "industrial-debt"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a detailed report of the lattice anomaly.
  - type: textarea
    id: anomaly-desc
    attributes:
      label: Anomaly Description
      placeholder: What part of the Lattice is failing? (e.g., S-AI, S-SCHED)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Boot SigmaOS in QEMU
        2. Trigger shard X...
    validations:
      required: true
  - type: textarea
    id: log-output
    attributes:
      label: S-LOG Output
      placeholder: Paste output from SovereignLog or S-DIAG here.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Industrial Environment
      placeholder: e.g., x86_64, ARM64, RISC-V, QEMU 7.0+
