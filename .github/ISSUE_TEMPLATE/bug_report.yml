name: Bug report
description: Create a report to help us improve the Sovereign Lattice.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible.
  - type: input
    id: shard_id
    attributes:
      label: Affected Shard
      description: Which shard (e.g., S01-HAL, S09-AI) is failing?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we trigger this fault in QEMU?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: System Logs
      description: Please paste the S-LOG output (serial console).
