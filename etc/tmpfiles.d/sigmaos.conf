# SigmaOS temporary file rules
# zswap double-compresses pages in front of zram and breaks zramctl
# accounting; disable at boot so the admin can tune it deliberately.
w! /sys/module/zswap/parameters/enabled - - - - N

# Ensure /run exists with correct mode.
d /run 0755 root root -

# Create runtime directory for the session bus.
d /run/user 0755 root root -
