# SigmaOS environment variables (sourced by the session, not login shells).
# Kept separate from /etc/profile.d/ so graphical sessions get the same values.

# Default terminal and editor for desktop applications.
export TERMINAL="${TERMINAL:-foot}"
export EDITOR="${EDITOR:-micro}"
export VISUAL="${VISUAL:-micro}"

# Default browser (set by the user via the settings panel).
# BROWSER is intentionally NOT set here system-wide so browsers can manage
# their own "set as default" flow without xdg-settings interference.

# SigmaOS paths.
export OMARCHY_PATH="${OMARCHY_PATH:-/usr/share/sigmaos}"
export SIGMAOS_PATH="${SIGMAOS_PATH:-/usr/share/sigmaos}"

# Activate mise shims if present (developer experience).
if command -v mise >/dev/null 2>&1; then
  eval "$(mise activate bash --shims 2>/dev/null || true)"
fi
