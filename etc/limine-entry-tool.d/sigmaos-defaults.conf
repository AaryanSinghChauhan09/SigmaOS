# SigmaOS limine config defaults
# Modeled on Omarchy 4.0.5 etc/limine-entry-tool.d/omarchy-defaults.conf

TARGET_OS_NAME="SigmaOS"

KERNEL_CMDLINE[default]+=" quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0 initramfs_async=0 systemd.tty.term.console=dumb"

CUSTOM_UKI_NAME="sigmaos"
ENABLE_LIMINE_FALLBACK=yes

FIND_BOOTLOADERS=yes

BOOT_ORDER="linux-sigmaos, linux-sigmaos-*, *, *fallback, Snapshots"

MAX_SNAPSHOT_ENTRIES=6
SNAPSHOT_FORMAT_CHOICE=5
