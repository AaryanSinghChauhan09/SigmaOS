[Theme]
Current=sigmaos

[General]
# Numlock on by default for the greeter.
Numlock=on

# Remember the last user who logged in.
RememberLastUser=true

# Theme the cursor to match the SigmaOS theme.
CursorTheme=SigmaOS

[Users]
# Hide system accounts from the greeter.
MinimumUid=1000

[Greeter]
# Show the reboot / shutdown / suspend buttons.
RebootButton=true
ShutdownButton=true
SuspendButton=true

# Auto-login is intentionally off by default for security (secure defaults).
# Enable by uncommenting and setting a user:
# AutoLoginUser=sigma
# AutoLoginSeat=seat0
# AutoLoginUser=sigma
# AutoLoginSeat=seat0
