# SigmaOS Hyprland user config
# Symlinked or copied from /usr/share/sigmaos/default/hypr/hyprland.conf
# This file is part of /etc/skel for new user accounts.

env = XCURSOR_SIZE,24
env = TERMINAL,foot
env = BROWSER,chromium
env = EDITOR,micro
env = FILE_MANAGER,nautilus
env = MOD,SUPER

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = rgba(c792eaee) rgba(00000000) 0 deg
	col.inactive_border = rgba(595959aa) rgba(00000000) 0 deg
	layout = dwindle
}

decoration {
	rounding = 10
	blur = yes
	blur_size = 8
	blur_passes = 7
	active_opacity = 1.0
	inactive_opacity = 0.95
	drop_shadow = yes
	shadow_range = 4
	shadow_render_power = 3
	col.shadow = rgba(1a1a1aee)
}

input {
	follow_mouse = yes
	mouse_move = $MOD
	mouse_resize = $MOD shift
	touchpad {
		natural_scroll = no
		tap-button = lr
	}
	keyboard {
		repeat_rate = 25
		repeat_delay = 250
		xkb_layout = us
		xkb_options = caps:escape
	}
}

exec-once = waybar
exec-once = mako

bind = $MOD SHIFT, Q, exec, hyprctl kill
bind = $MOD, Return, exec, $TERMINAL
bind = $MOD, D, exec, wofi --show drun
bind = $MOD, E, exec, $FILE_MANAGER
bind = $MOD, B, exec, $BROWSER
bind = $MOD, S, exec, sigmaos-capture-screenshot
bind = $MOD SHIFT, S, exec, sigmaos-capture-region
bind = $MOD, F, fullscreen, 1
bind = $MOD SHIFT, E, exec, hyprctl dispatch exit

bind = $MOD, left, movefocus, l
bind = $MOD, down, movefocus, d
bind = $MOD, up, movefocus, u
bind = $MOD, right, movefocus, r

bind = $MOD, 1, workspace, 1
bind = $MOD, 2, workspace, 2
bind = $MOD, 3, workspace, 3
bind = $MOD, 4, workspace, 4
bind = $MOD, 5, workspace, 5

windowrule = float, ^(pavucontrol|nm-applet|blueman-manager)$
