# SigmaOS system tuning
# Raise inotify limits so IDEs, language servers, and build tools don't hit
# the default 8192 ceiling.
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=256

# Swap only under pressure (desktop responsiveness).
vm.swappiness=10
vm.vfs_cache_pressure=200

# Conservative overcommit: fail allocations that can't be backed, rather than
# OOM-killing later (secure defaults + fail-fast).
vm.overcommit_memory=2
vm.overcommit_ratio=80

# Enable SysRq for emergency recovery (debuggability).
kernel.sysrq=1
