<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σ SigmaOS Sovereign Zenith</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #e95420; /* Ubuntu Orange */
            --bg-gradient: linear-gradient(135deg, #2c001e 0%, #772953 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            overflow: hidden;
            color: white;
        }

        /* Top Bar */
        #top-bar {
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 14px;
            z-index: 1000;
        }

        /* Desktop */
        #desktop {
            height: calc(100% - 30px);
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .icon {
            width: 80px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .icon:hover { transform: scale(1.1); }
        .icon img { width: 48px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .icon span { display: block; margin-top: 5px; font-size: 12px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Window System */
        .window {
            position: absolute;
            width: 800px;
            height: 500px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: window-open 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes window-open {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .title-bar {
            height: 35px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            cursor: move;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
        }

        .close { background: #ff5f56; }
        .min { background: #ffbd2e; }
        .max { background: #27c93f; }

        .terminal-content {
            flex-grow: 1;
            padding: 15px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            overflow-y: auto;
            color: #00ff00;
        }

        /* Sovereign Prompt */
        .prompt { color: var(--accent); font-weight: bold; }

    </style>
</head>
<body>
    <div id="top-bar">
        <span>Σ SigmaOS Activities</span>
        <span id="clock">12:34 PM</span>
        <span>Sovereign Zenith v6.3</span>
    </div>

    <div id="desktop">
        <div class="icon" onclick="openTerminal('SLAC v3.0')">
            <img src="https://cdn-icons-png.flaticon.com/512/1048/1048953.png" alt="Legal">
            <span>Legal Engine</span>
        </div>
        <div class="icon" onclick="openTerminal('Sovereign CLI')">
            <img src="https://cdn-icons-png.flaticon.com/512/906/906334.png" alt="Shell">
            <span>Omni Shell</span>
        </div>
    </div>

    <div id="windows-container"></div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        function openTerminal(title) {
            const container = document.getElementById('windows-container');
            const win = document.createElement('div');
            win.className = 'window';
            win.style.left = '200px';
            win.style.top = '100px';
            win.innerHTML = `
                <div class="title-bar">
                    <span>${title}</span>
                    <div class="window-controls">
                        <div class="control min"></div>
                        <div class="control max"></div>
                        <div class="control close" onclick="this.closest('.window').remove()"></div>
                    </div>
                </div>
                <div class="terminal-content">
                    <p>Σ [SOVEREIGN-BOOT]: Initializing Zenith v6.3...</p>
                    <p>Σ [ID-CHECK]: Identity verified. Welcome, Sovereign.</p>
                    <p><span class="prompt">Σ-CLI ></span> help</p>
                    <p>... Loading Omni-Shell Shards ...</p>
                </div>
            `;
            container.appendChild(win);
            // Draggable logic can be added here
        }
    </script>
</body>
</html>
