<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS | Sovereign Zenith</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top-bar">
        <div class="logo">Σ SigmaOS | Sovereign v2.0-STABLE</div>
        <div class="system-stats">
            <span>MEM: 2.1GB / 64GB</span>
            <span>NET: 10Gbps</span>
            <span>SHARDS: 425/425 OK</span>
        </div>
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <main class="workspace">
        <div class="dashboard animate-fade-in">
            <!-- Core Shard Status -->
            <div class="stat-card glass">
                <div class="stat-value">425</div>
                <div class="stat-label">Sovereign Shards Active</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- Security Matrix -->
            <div class="stat-card glass">
                <div class="stat-value">SHIELD</div>
                <div class="stat-label">Pledge / Unveil / IDS Hardened</div>
                <div class="stat-meta-accent">✓ Integrity Verified</div>
            </div>

            <!-- ABI Sovereignty -->
            <div class="stat-card glass">
                <div class="stat-value">ABI:TRANSLATE</div>
                <div class="stat-label">Linux / BSD / PE-COFF Binary Support</div>
                <div class="stat-meta-secondary">✓ ELF64 Trans-Matrix Seated</div>
            </div>
        </div>

        <!-- System Logs Console -->
        <div class="glass-dark system-console">
            <div id="log-console" class="console-text"></div>
        </div>
    </main>

    <div class="taskbar-container">
        <div class="taskbar glass">
            <div class="taskbar-item">🏠</div>
            <div class="taskbar-item">🛡️</div>
            <div class="taskbar-item">🚀</div>
            <div class="taskbar-item">🎮</div>
            <div class="taskbar-item">💾</div>
            <div class="taskbar-item">🧠</div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
