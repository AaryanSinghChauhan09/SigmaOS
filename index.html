<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS | Sovereign Zenith</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top-bar">
        <div class="logo">Σ SigmaOS | Sovereign v1.0-RC1</div>
        <div class="system-stats">
            <span>MEM: 2.1GB / 64GB</span>
            <span>NET: 10Gbps</span>
            <span>SHARDS: 135/135 OK</span>
        </div>
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <main class="workspace">
        <div class="dashboard animate-fade-in">
            <!-- Core Shard Status -->
            <div class="stat-card glass">
                <div class="stat-value">135</div>
                <div class="stat-label">Sovereign Shards Active</div>
                <div class="progress-bar-bg" style="height: 4px; background: rgba(255,255,255,0.05); margin-top:20px; border-radius:2px;">
                    <div style="width: 100%; height: 100%; background: var(--primary); border-radius:2px;"></div>
                </div>
            </div>

            <!-- Security Matrix -->
            <div class="stat-card glass">
                <div class="stat-value">DEFIANT</div>
                <div class="stat-label">Security Posture (W^X / Pledge)</div>
                <div style="color: var(--accent); font-size: 12px; margin-top: 20px;">✓ Chain-of-Trust Verified</div>
            </div>

            <!-- Performance -->
            <div class="stat-card glass">
                <div class="stat-value">0.05ms</div>
                <div class="stat-label">Avg. GCD Task Latency</div>
                <div style="color: var(--secondary); font-size: 12px; margin-top: 20px;">↑ AVX-512 Optimized</div>
            </div>
        </div>

        <!-- System Logs Console -->
        <div class="glass-dark" style="position: absolute; bottom: 120px; left: 40px; right: 40px; height: 180px; border-radius: 12px; padding: 20px; font-family: 'Courier New', monospace; font-size: 12px; overflow-y: hidden;">
            <div id="log-console" style="color: #6ee7b7;"></div>
        </div>
    </main>

    <div class="taskbar-container">
        <div class="taskbar glass">
            <div class="taskbar-item">🏠</div>
            <div class="taskbar-item">🛡️</div>
            <div class="taskbar-item">🚀</div>
            <div class="taskbar-item">🎮</div>
            <div class="taskbar-item">💾</div>
            <div class="taskbar-item">🧠</div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
