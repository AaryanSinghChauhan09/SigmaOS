=========================================================================

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS v6.2 – Zenith Sovereign Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:      #060910;
            --surface:      rgba(12, 18, 36, 0.72);
            --surface-solid:#0c1224;
            --surface-2:    rgba(255,255,255,0.04);
            --border:       rgba(255,255,255,0.10);
            --border-focus: rgba(0,210,255,0.5);
            --accent:       #00d2ff;
            --accent2:      #7c3aed;
            --accent-soft:  rgba(0,210,255,0.12);
            --accent-glow:  rgba(0,210,255,0.3);
            --pink:         #f472b6;
            --violet:       #818cf8;
            --success:      #34d399;
            --warning:      #fbbf24;
            --danger:       #f87171;
            --text-100:     #ffffff;
            --text-80:      rgba(255,255,255,0.85);
            --text-50:      rgba(255,255,255,0.50);
            --text-30:      rgba(255,255,255,0.30);
            --radius-sm:    6px;
            --radius-md:    12px;
            --radius-lg:    18px;
            --radius-xl:    24px;
            --font:         'Inter', system-ui, sans-serif;
            --dock-h:       72px;
            --bar-h:        30px;
            --zWin:         100;
            --zDock:        900;
            --zDrawer:      950;
            --zNotif:       9000;
            --zOmni:        9999;
            --blur:         blur(10px);
        }

        * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; }
        body { background:var(--bg-deep); color:var(--text-100); font-family:var(--font); overflow:hidden; }

        /* ── ZENITH DESKTOP ────────────────────────────────────────── */
        #desktop { position:fixed; top:var(--bar-h); left:0; right:0; bottom:var(--dock-h); padding:20px; display:grid; grid-template-columns:repeat(auto-fill,100px); grid-template-rows:repeat(auto-fill,100px); grid-auto-flow:column; gap:12px; z-index:1; }

        .di { width:100px; height:100px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border-radius:var(--radius-md); transition:background .2s, transform .2s; cursor:pointer; }
        .di:hover { background:var(--surface-2); transform:scale(1.05); }
        .di .g { font-size:2.8rem; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
        .di .lbl { font-size:.78rem; font-weight:600; text-align:center; color:var(--text-80); text-shadow:0 1px 4px rgba(0,0,0,0.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:90%; }

        /* ── STATUS BAR ────────────────────────────────────────────── */
        #statusbar { position:fixed; top:0; left:0; right:0; height:var(--bar-h); background:rgba(6,9,16,0.64); -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); border-bottom:1px solid var(--border); z-index:var(--zNotif); display:flex; justify-content:space-between; align-items:center; padding:0 12px; }
        .sb-logo { font-weight:900; letter-spacing:-0.5px; font-size:0.85rem; color:var(--accent); }
        .sb-clock { font-size:0.75rem; font-weight:700; color:var(--text-80); cursor:pointer; }

        /* ── OMNI-SIDEBAR ─────────────────────────────────────────── */
        #omni-sidebar {
            position: fixed; left: 12px; top: 50%; transform: translateY(-50%);
            width: 58px; height: auto; max-height: 80vh;
            background: rgba(10, 15, 30, 0.45);
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px; z-index: var(--zOmni);
            display: flex; flex-direction: column; align-items: center;
            padding: 16px 0; gap: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .os-item { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; transition: all 0.2s; color: var(--text-50); }
        .os-item:hover { background: var(--surface-2); color: var(--accent); transform: scale(1.15); }
        .os-sep { width: 24px; height: 1px; background: var(--border); margin: 4px 0; opacity: 0.5; }
        .os-stat { font-size: 0.62rem; font-weight: 800; color: var(--accent); opacity: 0.7; }

        /* ── WINDOWS ─────────────────────────────────────────────── */
        .win { position:fixed; width:800px; height:600px; background:var(--surface); -webkit-backdrop-filter:blur(40px); backdrop-filter:blur(40px); border:1px solid var(--border); border-radius:var(--radius-lg); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,0.6); transition:opacity .3s, transform .3s cubic-bezier(.16,1,.3,1); z-index:var(--zWin); }
        .win.focused { border-color:var(--border-focus); box-shadow:0 0 0 1px var(--accent-glow), 0 40px 100px rgba(0,0,0,0.8); }
        .wtbar { height:38px; display:flex; align-items:center; padding:0 12px; cursor:move; gap:12px; }
        .wcontrols { display:flex; gap:8px; }
        .wdot { width:12px; height:12px; border-radius:50%; border:none; cursor:pointer; }
        .wdot.cl { background:#ff5f57; } .wdot.cl:hover { background:#ff3b30; }
        .wdot.mn { background:#ffbd2e; } .wdot.mn:hover { background:#ff9500; }
        .wdot.mx { background:#28c840; } .wdot.mx:hover { background:#24af33; }
        .wtitle { font-size:0.8rem; font-weight:700; color:var(--text-80); flex:1; }
        .wbody { flex:1; background:#000; overflow:hidden; }
        .wbody iframe { width:100%; height:100%; border:none; }
    </style>
</head>
<body>

    <div id="statusbar">
        <span class="sb-logo">Σ SIGMAOS ZENITH</span>
        <span class="sb-clock" id="clock">15:15 PM</span>
    </div>

    <div id="omni-sidebar">
        <div class="os-item" title="Sovereign Control Center" onclick="zenith.launch('Control Center', 'userland/apps/control_center.html')">🏠</div>
        <div class="os-item" title="VFS Explorer" onclick="zenith.launch('Explorer', 'userland/apps/explorer.html')">📂</div>
        <div class="os-sep"></div>
        <div class="os-stat">CPU 4%</div>
        <div class="os-stat">MEM 12%</div>
        <div class="os-sep"></div>
        <div class="os-item" onclick="location.reload()">⏻</div>
    </div>

    <div id="desktop">
        <div class="di" onclick="zenith.launch('⚖️ Legal Core', 'userland/apps/legal_core.html')">
            <span class="g">⚖️</span><span class="lbl">Legal Core</span>
        </div>
        <div class="di" onclick="zenith.launch('📊 Monitor', 'userland/apps/monitor.html')">
            <span class="g">📊</span><span class="lbl">Monitor</span>
        </div>
    </div>

    <script>
        const zenith = {
            wins: {},
            zBase: 100,

            launch(title, url) {
                if(this.wins[title]) {
                    this.focus(this.wins[title]);
                    return;
                }

                const win = document.createElement('div');
                win.className = 'win focused';
                win.style.top = (100 + Object.keys(this.wins).length * 30) + 'px';
                win.style.left = (150 + Object.keys(this.wins).length * 30) + 'px';

                const bar = document.createElement('div');
                bar.className = 'wtbar';
                
                const ctrls = document.createElement('div');
                ctrls.className = 'wcontrols';
                
                const cl = document.createElement('button'); cl.className = 'wdot cl'; cl.onclick = () => this.close(title);
                const mn = document.createElement('button'); mn.className = 'wdot mn'; mn.onclick = () => this.minimize(title);
                const mx = document.createElement('button'); mx.className = 'wdot mx'; mx.onclick = () => this.maximize(title);
                
                ctrls.append(cl, mn, mx);
                
                const ttl = document.createElement('span');
                ttl.className = 'wtitle';
                ttl.textContent = title;
                
                bar.append(ctrls, ttl);
                
                const body = document.createElement('div');
                body.className = 'wbody';
                const iframe = document.createElement('iframe'); iframe.src = url;
                body.append(iframe);
                
                win.append(bar, body);
                document.body.appendChild(win);
                
                this.wins[title] = win;
                this.focus(win);
                this.initDrag(win, bar);
            },

            close(title) {
                if(this.wins[title]) {
                    this.wins[title].style.opacity = '0';
                    this.wins[title].style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        this.wins[title].remove();
                        delete this.wins[title];
                    }, 200);
                }
            },

            minimize(title) {
                if(this.wins[title]) {
                    this.wins[title].style.transform = 'scale(0.8) translateY(100vh)';
                    this.wins[title].style.opacity = '0';
                }
            },

            maximize(title) {
                const w = this.wins[title];
                if(w) {
                    if(w.style.width === '100vw') {
                        w.style.width = '800px'; w.style.height = '600px';
                        w.style.top = '100px'; w.style.left = '150px';
                    } else {
                        w.style.width = '100vw'; w.style.height = 'calc(100vh - 30px)';
                        w.style.top = '30px'; w.style.left = '0';
                    }
                }
            },

            focus(win) {
                document.querySelectorAll('.win').forEach(w => w.classList.remove('focused'));
                win.style.zIndex = ++this.zBase;
                win.classList.add('focused');
            },

            initDrag(win, bar) {
                let x = 0, y = 0;
                bar.onmousedown = (e) => {
                    this.focus(win);
                    x = e.clientX; y = e.clientY;
                    document.onmousemove = (e) => {
                        win.style.left = (win.offsetLeft + (e.clientX - x)) + 'px';
                        win.style.top  = (win.offsetTop + (e.clientY - y)) + 'px';
                        x = e.clientX; y = e.clientY;
                    };
                    document.onmouseup = () => document.onmousemove = null;
                };
            }
        };

        // Clock logic
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').textContent = d.getHours() + ":" + d.getMinutes().toString().padStart(2,'0') + (d.getHours() >= 12 ? " PM" : " AM");
        }, 1000);
    </script>
</body>
</html>
