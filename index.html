<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σ SigmaOS | Sovereign Web Emulator</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050506;
            --surface: #0c0c0e;
            --primary: #00f2ff;
            --accent: #7000ff;
            --text: #f5f5f7;
            --muted: #86868b;
            --success: #00ffaa;
            --error: #ff3366;
            --terminal: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* --- Boot Overlay --- */
        #boot-overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .boot-log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--muted);
            width: 80%;
            max-width: 700px;
            height: 350px;
            overflow-y: hidden;
            border-left: 2px solid var(--primary);
            padding-left: 30px;
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        }

        .boot-log p { margin: 8px 0; opacity: 0; transform: translateX(-10px); animation: slideIn 0.3s forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        
        .boot-log .ok { color: var(--success); font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 170, 0.3); }

        .logo-box { margin-bottom: 60px; text-align: center; }
        .logo-box h1 { 
            font-size: 5rem; 
            letter-spacing: -6px; 
            margin: 0; 
            color: white; 
            font-weight: 800;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.1));
        }
        .logo-box span { color: var(--primary); }
        .logo-box p { 
            color: var(--muted); 
            letter-spacing: 4px; 
            font-size: 0.9rem;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* --- Zenith Desktop --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            opacity: 0;
            transition: opacity 1.5s ease;
            background: radial-gradient(circle at top right, rgba(112, 0, 255, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(0, 242, 255, 0.05), transparent 40%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--glass-border);
        }

        .desktop-title { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }

        .status-bar { display: flex; gap: 30px; font-size: 0.8rem; color: var(--muted); }
        .status-item span { color: var(--primary); font-weight: 600; }

        .lattice-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            margin-top: 30px;
        }

        /* --- Terminal --- */
        .terminal-box {
            background: rgba(10, 10, 12, 0.8);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: var(--transition-smooth);
        }

        .term-header { 
            padding: 12px 20px; 
            border-bottom: 1px solid var(--glass-border); 
            font-size: 0.75rem; 
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .term-controls { display: flex; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        #term-output {
            flex: 1;
            padding: 25px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .input-line { display: flex; padding: 0 25px 25px 25px; font-family: 'JetBrains Mono', monospace; }
        .input-line span { color: var(--primary); margin-right: 12px; font-weight: bold; }
        #shell-input {
            background: transparent;
            border: none;
            color: white;
            font-family: inherit;
            font-size: inherit;
            flex: 1;
            outline: none;
        }

        /* --- Shard Monitor --- */
        .shard-monitor {
            background: var(--glass);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--glass-border);
        }

        .shard-monitor h2 { 
            font-size: 1.1rem; 
            margin-top: 0; 
            margin-bottom: 20px; 
            color: var(--text); 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shard-item {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .shard-item:hover { background: rgba(255,255,255,0.02); }
        .shard-id { color: var(--primary); font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .shard-status { 
            font-size: 0.7rem; 
            border: 1px solid var(--success); 
            color: var(--success);
            padding: 3px 8px; 
            border-radius: 4px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 255, 170, 0.05);
        }
    </style>
</head>
<body>

    <div id="boot-overlay">
        <div class="logo-box">
            <h1>Σ SIGMA<span>OS</span></h1>
            <p>Zenith Singularity v15.0</p>
        </div>
        <div class="boot-log" id="boot-log"></div>
    </div>

    <main id="desktop">
        <header>
            <div class="desktop-title">Σ ZENITH_DESKTOP</div>
            <div class="status-bar">
                <div class="status-item">LATTICE: <span>612 Shards</span></div>
                <div class="status-item">CRYPT: <span>Dilithium-5 Active</span></div>
                <div class="status-item">UPTIME: <span id="uptime">0.00s</span></div>
            </div>
        </header>

        <div class="lattice-container">
            <div class="terminal-box">
                <div class="term-header">
                    <span>sigma_sh v2.2.0 - Industrial Shard Interaction</span>
                    <div class="term-controls">
                        <div class="dot red"></div>
                        <div class="dot yellow"></div>
                        <div class="dot green"></div>
                    </div>
                </div>
                <div id="term-output"></div>
                <div class="input-line">
                    <span>Σ ></span>
                    <input type="text" id="shell-input" autofocus spellcheck="false" title="Shell Command Input" placeholder="Type shard command...">
                </div>
            </div>

            <div class="shard-monitor">
                <h2>Lattice Monitor</h2>
                <div id="shard-list">
                    <!-- Shards injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const bootLog = document.getElementById('boot-log');
        const bootOverlay = document.getElementById('boot-overlay');
        const desktop = document.getElementById('desktop');
        const termOutput = document.getElementById('term-output');
        const shellInput = document.getElementById('shell-input');
        const shardList = document.getElementById('shard-list');
        const uptimeEl = document.getElementById('uptime');

        const logs = [
            "ASI: Initializing Sovereign Shard Lattice...",
            "HAL: Silicon-native isolation active [OK]",
            "PQC: Dilithium-5 attestation sequence started...",
            "PQC: Attestation PASSED (Entropy: 0x8F2E)",
            "S-MM: Slab memory partition created [OK]",
            "S-VMM: 4-Level paging tables orchestrated [OK]",
            "S-NET: PQC-hardened IP stack bound [OK]",
            "S-LFS: Industrial Ext2 mount point reached [OK]",
            "S-DDF: Industrial driver orchestration started...",
            "S-DDF: GPU Shard [STABLE]",
            "S-DDF: NET Shard [ACTIVE]",
            "S-DDF: STORAGE Shard [SYNCED]",
            "S-WM: Zenith Compositor ignited [OK]",
            "SYSTEM: ASI sequence complete. Entering Zenith Singularity..."
        ];

        let logIdx = 0;
        function runBoot() {
            if (logIdx < logs.length) {
                const p = document.createElement('p');
                p.innerHTML = logs[logIdx].replace("[OK]", '<span class="ok">[OK]</span>')
                                          .replace("[STABLE]", '<span class="ok">[STABLE]</span>')
                                          .replace("[ACTIVE]", '<span class="ok">[ACTIVE]</span>')
                                          .replace("[SYNCED]", '<span class="ok">[SYNCED]</span>');
                bootLog.appendChild(p);
                bootLog.scrollTop = bootLog.scrollHeight;
                logIdx++;
                setTimeout(runBoot, 150 + Math.random() * 200);
            } else {
                setTimeout(() => {
                    bootOverlay.style.opacity = '0';
                    desktop.style.opacity = '1';
                    setTimeout(() => bootOverlay.style.display = 'none', 1000);
                    initShell();
                }, 800);
            }
        }

        const shards = [
            { id: "S-KERN", name: "Sovereign Core", status: "STABLE" },
            { id: "S-NET", name: "PQC Net Stack", status: "ACTIVE" },
            { id: "S-FS", name: "Lattice Ext2", status: "SYNCED" },
            { id: "S-UI", name: "Zenith WM", status: "COMPOSITING" },
            { id: "S-SEC", name: "Quantum Audit", status: "AUDITING" },
            { id: "S-ZOS", name: "Z/OS Rel", status: "ABSORBED" },
            { id: "S-QNX", name: "QNX RTOS", status: "ABSORBED" },
            { id: "S-NEXT", name: "NeXT Object", status: "ABSORBED" },
            { id: "S-PRO", name: "Professional", status: "STABLE" },
            { id: "S-IOT", name: "Industrial IoT", status: "POLLING" },
            { id: "S-OPT", name: "Sovereign Opt", status: "TUNING" },
            { id: "S-KUBE", name: "Lattice Kube", status: "RECONCILING" }
        ];

        function initShell() {
            termOutput.innerHTML = `<span style="color:var(--primary); font-weight:bold">Σ SIGMA OS [Version 15.0.ZENITH]</span>\n(c) 2026 Sovereign Industrial Collective. Absolute Privacy Guaranteed.\n\nType '<span style="color:var(--success)">help</span>' to view shard interaction protocols.\n`;
            shards.forEach(s => {
                const div = document.createElement('div');
                div.className = 'shard-item';
                div.innerHTML = `<span class="shard-id">${s.id}</span> <span class="shard-name">${s.name}</span> <span class="shard-status">${s.status}</span>`;
                shardList.appendChild(div);
            });
            
            startTime = Date.now();
            setInterval(() => {
                uptimeEl.innerText = ((Date.now() - startTime) / 1000).toFixed(2) + 's';
            }, 100);
        }

        shellInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = shellInput.value.trim().toLowerCase();
                termOutput.innerHTML += `\n<span style="color:var(--primary)">Σ ></span> ${cmd}\n`;
                handleCommand(cmd);
                shellInput.value = '';
                termOutput.scrollTop = termOutput.scrollHeight;
            }
        });

        function handleCommand(cmd) {
            const args = cmd.split(' ');
            const baseCmd = args[0];

            switch(baseCmd) {
                case 'help':
                    termOutput.innerHTML += "Available shard protocols: <span style='color:var(--success)'>help, ls, dmesg, shards, sigma-cli, neofetch, clear, exit</span>\n";
                    break;
                case 'sigma-cli':
                    if (args.length < 3) {
                        termOutput.innerHTML += "Usage: sigma-cli <subsystem> <command>\nSubsystems: iot, game, opt, orch, forensic, regress\n";
                    } else {
                        const sub = args[1];
                        const scmd = args[2];
                        termOutput.innerHTML += `<span style="color:var(--warning)">[CLI]</span> Executing ${scmd} on subsystem ${sub}...\n`;
                        setTimeout(() => {
                            termOutput.innerHTML += `<span style="color:var(--success)">[CLI]</span> Operation successful. Lattice status: 100% stable.\n`;
                            termOutput.scrollTop = termOutput.scrollHeight;
                        }, 500);
                    }
                    break;
                case 'gst':
                    if (args.length < 3) {
                        termOutput.innerHTML += "Usage: gst <amount> <rate>\n";
                    } else {
                        const amount = parseFloat(args[1]);
                        const rate = parseFloat(args[2]);
                        const gst = amount * (rate / 100);
                        termOutput.innerHTML += `[S-PRO] GST Calculation: Amount=${amount}, Rate=${rate}%\n[S-PRO] Result: GST=${gst.toFixed(2)}, TOTAL=${(amount + gst).toFixed(2)}\n`;
                    }
                    break;
                case 'bns':
                    const section = args[1] || "302";
                    termOutput.innerHTML += `[S-PRO] BNS Legal Mapper: Analyzing Section ${section}...\n[S-PRO] Mapping: IPC ${section} -> BNS Mapping ACTIVE.\n[S-PRO] Analysis COMPLETE.\n`;
                    break;
                case 'ls':
                    termOutput.innerHTML += "<span style='color:var(--accent)'>kernel/  system/  userland/  shards/  lattice_fs/</span>\n";
                    break;
                case 'dmesg':
                    termOutput.innerHTML += "[0.0000] ASI: Ignited.\n[0.1234] S-MM: Slab active.\n[0.4567] S-VMM: Paging active.\n[0.8901] PQC: Sealed.\n";
                    break;
                case 'shards':
                    termOutput.innerHTML += "Currently active industrial shards: 612\nLattice State: <span style='color:var(--success)'>Sovereign Singularity</span>\nSync Status: 100%\n";
                    break;
                case 'neofetch':
                    termOutput.innerHTML += `
<span style="color:var(--primary)">       ΣΣΣΣΣΣΣΣ</span>    <span style="color:var(--primary)">OS</span>: SigmaOS 15.0 Zenith
<span style="color:var(--primary)">     ΣΣΣ      ΣΣΣ</span>  <span style="color:var(--primary)">Kernel</span>: Sovereign-Lattice v15.0
<span style="color:var(--primary)">    ΣΣΣ        ΣΣΣ</span> <span style="color:var(--primary)">Uptime</span>: ${uptimeEl.innerText}
<span style="color:var(--primary)">    ΣΣΣ</span>            <span style="color:var(--primary)">Packages</span>: 612 (s-pkg)
<span style="color:var(--primary)">    ΣΣΣ            </span><span style="color:var(--primary)">Shell</span>: sigma_sh 2.2.0
<span style="color:var(--primary)">    ΣΣΣ    ΣΣΣΣΣΣΣΣ</span><span style="color:var(--primary)">Resolution</span>: 1920x1080
<span style="color:var(--primary)">    ΣΣΣ        ΣΣΣ</span> <span style="color:var(--primary)">WM</span>: Zenith Compositor
<span style="color:var(--primary)">     ΣΣΣ      ΣΣΣ</span>  <span style="color:var(--primary)">Terminal</span>: Zenith Console
<span style="color:var(--primary)">       ΣΣΣΣΣΣΣΣ</span>    <span style="color:var(--primary)">Memory</span>: 128MB / 16384MB
`;
                    break;
                case 'whoami':
                    termOutput.innerHTML += "Sovereign Shard Controller [UID: 0]\nIdentity: <span style='color:var(--primary)'>Aaryan</span>\n";
                    break;
                case 'clear':
                    termOutput.innerHTML = "";
                    break;
                default:
                    termOutput.innerHTML += `<span style="color:var(--error)">[sigma_sh] Shard protocol violation: '${cmd}' not recognized.</span>\n`;
            }
        }

        runBoot();
    </script>
</body>
</html>
