<!-- 
=========================================================================
Σ SIGMAOS: SOVEREIGN ZENITH DESKTOP (index.html)
=========================================================================
VERSION: 10.0.0 (Absolute Sovereignty Edition)
CORE: Zero-Dependency Metal-Nexus UI
DESIGN: Liquid Glass / Micro-Pixel Accuracy
=========================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS v10.0 – Sovereign Zenith Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Liquid Chrome Palette */
            --bg-deep:      #020408;
            --surface:      rgba(8, 12, 24, 0.45);
            --surface-solid:#080c18;
            --border:       rgba(255, 255, 255, 0.08);
            --border-glow:  rgba(0, 210, 255, 0.4);
            --accent:       #00d2ff;
            --accent-rgb:   0, 210, 255;
            --accent-2:     #7c3aed;
            --text-primary: #ffffff;
            --text-sec:     rgba(255, 255, 255, 0.7);
            --text-dim:     rgba(255, 255, 255, 0.35);
            
            /* Sizing & Pixels */
            --radius-main:  16px;
            --radius-btn:   8px;
            --dock-h:       84px;
            --bar-h:        34px;
            --blur:         blur(32px);
            --font:         'Outfit', sans-serif;
            
            /* Elevation */
            --shadow-lg:    0 32px 64px -16px rgba(0, 0, 0, 0.8);
            --shadow-win:   0 0 0 1px rgba(255,255,255,0.05), 0 24px 80px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg-deep); 
            color: var(--text-primary); 
            font-family: var(--font); 
            height: 100vh; 
            overflow: hidden; 
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
        }

        /* ── MESH BACKGROUND ── */
        #mesh-bg { position: fixed; inset: 0; z-index: 0; opacity: 0.2; pointer-events: none; }

        /* ── TOP BAR (SOVEREIGN HUD) ── */
        #hud { 
            position: fixed; top: 0; left: 0; right: 0; height: var(--bar-h);
            background: rgba(4, 6, 12, 0.2); 
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 10000;
        }
        .hud-logo { font-weight: 900; font-size: 0.8rem; letter-spacing: 0.5px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .hud-logo span { padding: 2px 6px; background: var(--accent); color: var(--bg-deep); border-radius: 4px; font-size: 0.6rem; }
        .hud-stats { display: flex; gap: 20px; font-size: 0.7rem; font-weight: 600; color: var(--text-sec); text-transform: uppercase; }
        .hud-stats b { color: var(--accent); }

        /* ── ZENITH DOCK ── */
        #dock-container {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; padding: 12px;
            background: var(--surface); backdrop-filter: var(--blur);
            border: 1px solid var(--border); border-radius: 24px;
            box-shadow: var(--shadow-lg); z-index: 9999;
        }
        .dock-item {
            width: 48px; height: 48px; margin: 0 6px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .dock-item:hover { 
            transform: translateY(-12px) scale(1.2); 
            background: rgba(255, 255, 255, 0.1); 
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.3);
        }
        .dock-item::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: var(--accent); border-radius: 50%;
            opacity: 0; transition: opacity 0.3s;
        }
        .dock-item.active::after { opacity: 1; }

        /* ── WINDOWS (LIQUID GLASS) ── */
        .win {
            position: fixed; background: var(--surface); backdrop-filter: var(--blur);
            border: 1px solid var(--border); border-radius: var(--radius-main);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: var(--shadow-win); z-index: 100;
            transition: opacity 0.3s, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: win-enter 0.4s cubic-bezier(0, 0, 0.2, 1);
        }
        @keyframes win-enter {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .win.focused { border-color: var(--border-glow); box-shadow: 0 0 0 1px var(--border-glow), var(--shadow-lg); }
        .win.minimized { opacity: 0; transform: scale(0.8) translateY(100vh); pointer-events: none; }

        .wbar { height: 42px; display: flex; align-items: center; padding: 0 16px; cursor: move; gap: 12px; background: rgba(0,0,0,0.1); }
        .wctrls { display: flex; gap: 10px; }
        .wdot { width: 13px; height: 13px; border-radius: 50%; border: none; cursor: pointer; transition: transform 0.2s; }
        .wdot:hover { transform: scale(1.2); }
        .wdot.cl { background: #ff5f57; }
        .wdot.mn { background: #febc2e; }
        .wdot.mx { background: #28c841; }
        .wtitle { font-size: 0.85rem; font-weight: 700; color: var(--text-sec); flex: 1; letter-spacing: 0.3px; }

        .wbody { flex: 1; background: #000; position: relative; }
        .wbody iframe { width: 100%; height: 100%; border: none; background: transparent; }

        /* ── DESKTOP AREA ── */
        #desktop {
            position: fixed; inset: var(--bar-h) 0 var(--dock-h) 0;
            padding: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            grid-auto-rows: 100px; gap: 24px; z-index: 1;
        }
        .di {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            cursor: pointer; border-radius: 12px; padding: 12px; transition: all 0.2s;
        }
        .di:hover { background: rgba(255, 255, 255, 0.05); }
        .di span { font-size: 3rem; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)); }
        .di label { font-size: 0.8rem; font-weight: 600; color: var(--text-sec); text-align: center; pointer-events: none; }

        /* ── OMNI SEARCH ── */
        #omni-search {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            width: 600px; background: var(--surface); backdrop-filter: var(--blur);
            border: 1px solid var(--border-glow); border-radius: 20px;
            padding: 24px; z-index: 10001; visibility: hidden; opacity: 0;
            transition: all 0.2s;
        }
        #omni-search.active { visibility: visible; opacity: 1; top: 25%; }
        #omni-input {
            width: 100%; background: transparent; border: none; color: white;
            font-size: 1.5rem; font-weight: 600; font-family: var(--font);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-logo">Σ SIGMAOS <span>ZENITH v10.0</span></div>
        <div class="hud-stats">
            <div>CPU <b>2%</b></div>
            <div>MEM <b>1.2 GB</b> / 64 GB</div>
            <div>NET <b>SOVEREIGN P2P</b></div>
            <div id="clock">08:18 AM</div>
        </div>
    </div>

    <div id="desktop">
        <div class="di" onclick="zenith.launch('⚖️ Legal Core', 'userland/apps/legal_core.html')"><span>⚖️</span><label>Legal Core</label></div>
        <div class="di" onclick="zenith.launch('📊 Monitor', 'userland/apps/monitor.html')"><span>📊</span><label>Monitor</label></div>
        <div class="di" onclick="zenith.launch('🧮 Calculator', 'sigma_calc.html')"><span>🧮</span><label>Calculator</label></div>
        <div class="di" onclick="zenith.launch('📂 Files', 'userland/apps/explorer.html')"><span>📂</span><label>Explorer</label></div>
    </div>

    <div id="dock-container">
        <div class="dock-item" onclick="zenith.launch('Terminal', 'userland/apps/terminal.html')">⌨️</div>
        <div class="dock-item" onclick="zenith.launch('Browser', 'userland/apps/browser.html')">🌐</div>
        <div class="dock-item" onclick="zenith.launch('Media', 'userland/apps/media.html')">🎬</div>
        <div class="dock-item" onclick="zenith.launch('Settings', 'userland/apps/settings.html')">⚙️</div>
    </div>

    <div id="omni-search">
        <input type="text" id="omni-input" placeholder="Search Sovereign Zenith...">
    </div>

    <script>
        const zenith = {
            wins: {},
            zIdx: 100,

            launch(title, url) {
                if(this.wins[title]) {
                    this.restore(title);
                    return;
                }

                const win = document.createElement('div');
                win.className = 'win';
                win.style.width = '900px';
                win.style.height = '620px';
                win.style.left = (window.innerWidth/2 - 450 + Object.keys(this.wins).length*20) + 'px';
                win.style.top = (window.innerHeight/2 - 310 + Object.keys(this.wins).length*20) + 'px';

                win.innerHTML = `
                    <div class="wbar">
                        <div class="wctrls">
                            <button class="wdot cl" onclick="zenith.close('${title}')"></button>
                            <button class="wdot mn" onclick="zenith.minimize('${title}')"></button>
                            <button class="wdot mx" onclick="zenith.maximize('${title}')"></button>
                        </div>
                        <span class="wtitle">${title}</span>
                    </div>
                    <div class="wbody">
                        <iframe src="${url}"></iframe>
                    </div>
                `;

                document.body.appendChild(win);
                this.wins[title] = win;
                this.focus(title);
                this.initDrag(win, win.querySelector('.wbar'));
            },

            close(title) {
                const w = this.wins[title];
                w.style.opacity = '0';
                w.style.transform = 'scale(0.95) translateY(20px)';
                setTimeout(() => { w.remove(); delete this.wins[title]; }, 300);
            },

            minimize(title) {
                this.wins[title].classList.add('minimized');
            },

            restore(title) {
                this.wins[title].classList.remove('minimized');
                this.focus(title);
            },

            maximize(title) {
                const w = this.wins[title];
                if(w.style.width === '100vw') {
                    w.style.width = '900px'; w.style.height = '620px';
                    w.style.top = '100px'; w.style.left = '100px';
                    w.style.borderRadius = 'var(--radius-main)';
                } else {
                    w.style.width = '100vw'; w.style.height = 'calc(100vh - var(--bar-h))';
                    w.style.top = 'var(--bar-h)'; w.style.left = '0';
                    w.style.borderRadius = '0';
                }
            },

            focus(title) {
                Object.values(this.wins).forEach(w => w.classList.remove('focused'));
                this.wins[title].style.zIndex = ++this.zIdx;
                this.wins[title].classList.add('focused');
            },

            initDrag(win, bar) {
                let x = 0, y = 0;
                bar.onmousedown = (e) => {
                    this.focus(Object.keys(this.wins).find(k => this.wins[k] === win));
                    x = e.clientX; y = e.clientY;
                    document.onmousemove = (e) => {
                        win.style.left = (win.offsetLeft + (e.clientX - x)) + 'px';
                        win.style.top  = (win.offsetTop + (e.clientY - y)) + 'px';
                        x = e.clientX; y = e.clientY;
                    };
                    document.onmouseup = () => document.onmousemove = null;
                };
            }
        };

        // Hotkeys (Omni Search)
        window.onkeydown = (e) => {
            if(e.metaKey && e.key === ' ') {
                document.getElementById('omni-search').classList.toggle('active');
                if(document.getElementById('omni-search').classList.contains('active')) {
                    document.getElementById('omni-input').focus();
                }
            }
        };

        // Clock
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').textContent = d.getHours()%12 + ":" + d.getMinutes().toString().padStart(2,'0') + (d.getHours() >= 12 ? " PM" : " AM");
        }, 1000);
    </script>
</body>
</html>
