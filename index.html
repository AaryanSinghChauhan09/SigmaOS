<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σ SigmaOS v21.0 – Sovereign Zenith Finality</title>
    <style>
        :root {
            --bg-deep:      #000308;
            --surface:      rgba(5, 10, 25, 0.6);
            --border:       rgba(0, 210, 255, 0.15);
            --accent:       #00f2ff;
            --accent-glow:  rgba(0, 242, 255, 0.5);
            --text-primary: #ffffff;
            --radius-win:   24px;
            /* Using System UI fonts to eliminate Third-Party Font dependencies (Google Fonts removed) */
            --font:         'Segoe UI', 'Outfit', 'Roboto', 'Helvetica Neue', sans-serif;
            --bar-h:        40px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { 
            background: var(--bg-deep); color: var(--text-primary); font-family: var(--font); 
            height: 100vh; overflow: hidden; perspective: 1500px;
            background: radial-gradient(circle at center, #051020 0%, #000308 100%);
        }

        #nexus-canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.4; }

        #hud { 
            position: fixed; top: 0; left: 0; right: 0; height: var(--bar-h);
            background: rgba(0, 5, 10, 0.4); backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; z-index: 10000;
        }
        .hud-logo { font-weight: 900; font-size: 1rem; letter-spacing: 2px; color: var(--accent); }
        .hud-logo span { font-weight: 400; color: var(--text-primary); opacity: 0.5; font-size: 0.8rem; }
        .hud-stats { display: flex; gap: 40px; font-size: 0.8rem; font-weight: 800; color: var(--accent); }

        #dock {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; padding: 15px; gap: 15px;
            background: rgba(5, 10, 20, 0.7); backdrop-filter: blur(50px);
            border: 1px solid var(--border); border-radius: 35px;
            z-index: 9999;
        }
        .dock-item {
            width: 60px; height: 60px; border-radius: 18px; 
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; 
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
        }
        .dock-item:hover { transform: translateY(-20px) scale(1.3); background: var(--accent-glow); }

        .win {
            position: fixed; background: var(--surface); backdrop-filter: blur(60px);
            border: 1px solid var(--border); border-radius: var(--radius-win);
            display: flex; flex-direction: column; overflow: hidden;
            z-index: 100; transform-style: preserve-3d;
        }
        .win.focused { border-color: var(--accent); transform: translateZ(100px); }
        
        .wbar { height: 48px; display: flex; align-items: center; padding: 0 25px; cursor: move; gap: 20px; }
        .wctrls { display: flex; gap: 12px; }
        .wdot { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; }
        .wdot.cl { background: #ff4b4b; } .wdot.mn { background: #ffb833; } .wdot.mx { background: #33ff7a; }
        .wtitle { font-size: 0.9rem; font-weight: 800; color: #fff; flex: 1; }

        .wbody { flex: 1; background: #000; position: relative; }
        .wbody iframe { width: 100%; height: 100%; border: none; opacity: 1; }

        #desktop {
            position: fixed; inset: var(--bar-h) 0 100px 0; padding: 60px;
            display: grid; grid-template-columns: repeat(auto-fill, 120px); grid-auto-rows: 120px; gap: 40px; z-index: 1;
        }
        .di { display: flex; flex-direction: column; align-items: center; gap: 15px; cursor: pointer; padding: 15px; }
        .di i { font-size: 3.5rem; }
        .di label { font-size: 0.85rem; font-weight: 800; color: #fff; text-shadow: 0 4px 10px #000; }
    </style>
</head>
<body>
    <canvas id="nexus-canvas"></canvas>
    <div id="hud">
        <div class="hud-logo">Σ SIGMAOS <span>SOVEREIGN ZENITH v21.0</span></div>
        <div class="hud-stats">
            <div>CORE: <b>SILICON-SHARDED</b></div>
            <div>SECURITY: <b>LATTICE-PQC</b></div>
            <div id="clock">00:00 AM</div>
        </div>
    </div>
    <div id="desktop">
        <div class="di" onclick="zenith.launch('🧮 Super Math', 'SovereignSuperCalculator.cpp')"><i>🧮</i><label>Math</label></div>
        <div class="di" onclick="zenith.launch('📂 VFS Root', 'SovereignFileSystemZenith.cpp')"><i>📂</i><label>VFS</label></div>
        <div class="di" onclick="zenith.launch('🌋 AI Kernel', 'SovereignAIKernelZenith.cpp')"><i>🌋</i><label>AI</label></div>
    </div>
    <div id="dock">
        <div class="dock-item" onclick="zenith.launch('Terminal', 'omni_shell.cpp')">⌨️</div>
        <div class="dock-item" onclick="zenith.launch('Web Shard', 'SovereignWebBridge.cpp')">🌐</div>
        <div class="dock-item" onclick="zenith.launch('Orchestrator', 'SovereignAetherOrchestrator.cpp')">🌀</div>
    </div>
    <script>
        const zenith = {
            wins: {}, zIdx: 100,
            launch(title, url) {
                if(this.wins[title]) { this.focus(title); return; }
                const win = document.createElement('div');
                win.className = 'win'; win.style.width = '1100px'; win.style.height = '750px';
                win.style.left = '100px'; win.style.top = '100px';
                win.innerHTML = `<div class="wbar"><div class="wctrls"><button class="wdot cl" onclick="zenith.close('${title}')"></button><button class="wdot mn"></button><button class="wdot mx"></button></div><span class="wtitle">${title}</span></div><div class="wbody"><iframe src="${url}"></iframe></div>`;
                document.body.appendChild(win);
                this.wins[title] = win; this.focus(title);
                this.initDrag(win, win.querySelector('.wbar'));
            },
            close(title) { this.wins[title].remove(); delete this.wins[title]; },
            focus(title) { Object.values(this.wins).forEach(w => w.classList.remove('focused')); this.wins[title].style.zIndex = ++this.zIdx; this.wins[title].classList.add('focused'); },
            initDrag(win, bar) {
                let x = 0, y = 0;
                bar.onmousedown = (e) => {
                    this.focus(Object.keys(this.wins).find(k => this.wins[k] === win));
                    x = e.clientX; y = e.clientY;
                    document.onmousemove = (e) => {
                        win.style.left = (win.offsetLeft + (e.clientX - x)) + 'px';
                        win.style.top  = (win.offsetTop + (e.clientY - y)) + 'px';
                        x = e.clientX; y = e.clientY;
                    };
                    document.onmouseup = () => document.onmousemove = null;
                };
            }
        };
        const canvas = document.getElementById('nexus-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        function animate() {
            ctx.fillStyle = "rgba(0,3,8,0.1)"; ctx.fillRect(0,0,canvas.width,canvas.height);
            requestAnimationFrame(animate);
        }
        animate();
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').textContent = d.getHours()%12 + ":" + d.getMinutes().toString().padStart(2,'0') + " " + (d.getHours() >= 12 ? "PM" : "AM");
        }, 1000);
    </script>
</body>
</html>
