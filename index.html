<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σ SigmaOS | Sovereign Web Emulator</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #0a0a0c;
            --primary: #00f2ff;
            --accent: #7000ff;
            --text: #e0e0e6;
            --muted: #60606a;
            --success: #00ffaa;
            --error: #ff3366;
            --terminal: #0a0a0c;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* --- Boot Overlay --- */
        #boot-overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out;
        }

        .boot-log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--muted);
            max-width: 600px;
            height: 300px;
            overflow-y: hidden;
            border-left: 2px solid var(--accent);
            padding-left: 20px;
        }

        .boot-log p { margin: 5px 0; }
        .boot-log .ok { color: var(--success); font-weight: bold; }

        .logo-box { margin-bottom: 40px; text-align: center; }
        .logo-box h1 { font-size: 4rem; letter-spacing: -4px; margin: 0; color: white; }
        .logo-box span { color: var(--primary); }

        /* --- Zenith Desktop --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            transition: opacity 1s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-bar { display: flex; gap: 20px; font-size: 0.85rem; color: var(--muted); }
        .status-item span { color: var(--primary); font-weight: bold; }

        .lattice-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-top: 20px;
        }

        /* --- Terminal --- */
        .terminal-box {
            background: var(--terminal);
            border: 1px solid rgba(0, 242, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .term-header { padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; color: var(--muted); }

        #term-output {
            flex: 1;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .input-line { display: flex; padding: 0 20px 20px 20px; font-family: 'JetBrains Mono', monospace; }
        .input-line span { color: var(--accent); margin-right: 10px; }
        #shell-input {
            background: transparent;
            border: none;
            color: white;
            font-family: inherit;
            font-size: inherit;
            flex: 1;
            outline: none;
        }

        /* --- Shard Monitor --- */
        .shard-monitor {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .shard-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .shard-id { color: var(--primary); font-weight: bold; }
        .shard-status { color: var(--success); font-size: 0.75rem; border: 1px solid; padding: 2px 6px; border-radius: 4px; }

        h2 { font-size: 1.2rem; margin-top: 0; color: var(--muted); }
    </style>
</head>
<body>

    <div id="boot-overlay">
        <div class="logo-box">
            <h1>Σ SIGMA<span>OS</span></h1>
            <p style="color: var(--muted); letter-spacing: 2px;">ZENITH SINGULARITY v15.0</p>
        </div>
        <div class="boot-log" id="boot-log"></div>
    </div>

    <main id="desktop">
        <header>
            <div style="font-weight: 800; font-size: 1.2rem;">Σ ZENITH DESKTOP</div>
            <div class="status-bar">
                <div class="status-item">LATTICE: <span>612 Shards</span></div>
                <div class="status-item">CRYPT: <span>PQC-ACTIVE</span></div>
                <div class="status-item">UPTIME: <span id="uptime">0.00s</span></div>
            </div>
        </header>

        <div class="lattice-container">
            <div class="terminal-box">
                <div class="term-header">sigma_sh v2.2.0 - Ring-3 Shard Interaction</div>
                <div id="term-output"></div>
                <div class="input-line">
                    <span>Σ ></span>
                    <input type="text" id="shell-input" autofocus spellcheck="false">
                </div>
            </div>

            <div class="shard-monitor">
                <h2>Lattice Monitor</h2>
                <div id="shard-list">
                    <!-- Shards injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const bootLog = document.getElementById('boot-log');
        const bootOverlay = document.getElementById('boot-overlay');
        const desktop = document.getElementById('desktop');
        const termOutput = document.getElementById('term-output');
        const shellInput = document.getElementById('shell-input');
        const shardList = document.getElementById('shard-list');
        const uptimeEl = document.getElementById('uptime');

        const logs = [
            "ASI: Igniting Sovereign Boot Lattice...",
            "HAL: Silicon-native isolation [OK]",
            "S-MM: Slab memory initialized [OK]",
            "S-VMM: 4-Level paging active [OK]",
            "S-NET: PQC IP stack bound [OK]",
            "S-LFS: Ext2 mount point reached [OK]",
            "S-DDF: Industrial drivers ignited [OK]",
            "S-PQC: Dilithium-5 attestation PASSED",
            "S-WM: Zenith Compositor ready [OK]",
            "SYSTEM: ASI sequence complete. Entering Zenith Singularity..."
        ];

        let logIdx = 0;
        function runBoot() {
            if (logIdx < logs.length) {
                const p = document.createElement('p');
                p.innerHTML = logs[logIdx].replace("[OK]", '<span class="ok">[OK]</span>');
                bootLog.appendChild(p);
                bootLog.scrollTop = bootLog.scrollHeight;
                logIdx++;
                setTimeout(runBoot, 200 + Math.random() * 300);
            } else {
                setTimeout(() => {
                    bootOverlay.style.opacity = '0';
                    desktop.style.opacity = '1';
                    setTimeout(() => bootOverlay.style.display = 'none', 1000);
                    initShell();
                }, 1000);
            }
        }

        const shards = [
            { id: "S-KERN", name: "Sovereign Core", status: "STABLE" },
            { id: "S-NET", name: "Net Stack", status: "ACTIVE" },
            { id: "S-FS", name: "Lattice FS", status: "SYNCED" },
            { id: "S-UI", name: "Zenith WM", status: "COMPOSITING" },
            { id: "S-KALI", name: "Security Audit", status: "AUDITING" }
        ];

        function initShell() {
            termOutput.innerHTML = "Σ SIGMA OS [Version 15.0.0.ZENITH]\n(c) 2026 Sovereign Collective. All rights reserved.\n\nType 'help' for available shard commands.\n";
            shards.forEach(s => {
                const div = document.createElement('div');
                div.className = 'shard-item';
                div.innerHTML = `<span class="shard-id">${s.id}</span> <span class="shard-name">${s.name}</span> <span class="shard-status">${s.status}</span>`;
                shardList.appendChild(div);
            });
            
            startTime = Date.now();
            setInterval(() => {
                uptimeEl.innerText = ((Date.now() - startTime) / 1000).toFixed(2) + 's';
            }, 100);
        }

        shellInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = shellInput.value.trim().toLowerCase();
                termOutput.innerHTML += `\nΣ > ${cmd}\n`;
                handleCommand(cmd);
                shellInput.value = '';
                termOutput.scrollTop = termOutput.scrollHeight;
            }
        });

        function handleCommand(cmd) {
            switch(cmd) {
                case 'help':
                    termOutput.innerHTML += "Available commands: help, ls, dmesg, shards, whoami, clear, exit\n";
                    break;
                case 'ls':
                    termOutput.innerHTML += "  kernel/  system/  userland/  shards/  lattice_fs/\n";
                    break;
                case 'dmesg':
                    termOutput.innerHTML += "[0.0000] ASI: Ignited.\n[0.1234] S-MM: Slab active.\n[0.4567] S-VMM: Paging active.\n";
                    break;
                case 'shards':
                    termOutput.innerHTML += "Currently active industrial shards: 612\nState: Sovereign Singularity\n";
                    break;
                case 'whoami':
                    termOutput.innerHTML += "Sovereign Shard Controller [UID: 0]\n";
                    break;
                case 'clear':
                    termOutput.innerHTML = "";
                    break;
                default:
                    termOutput.innerHTML += `<span style="color:var(--error)">[sigma_sh] Shard command not found: ${cmd}</span>\n`;
            }
        }

        runBoot();
    </script>
</body>
</html>
