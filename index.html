<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σ SIGMAOS ZENITH | Sovereign Desktop Shard</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body class="desktop-bg">
    <div id="desktop" class="desktop-workspace">
        <!-- Desktop Icons -->
        <div class="icon" onclick="openWindow('omni-shell')">
            <div class="icon-glyph terminal">Σ</div>
            <span>Omni-Shell</span>
        </div>
        <div class="icon" onclick="openWindow('mem-shard')">
            <div class="icon-glyph memory">M</div>
            <span>Memory Shard</span>
        </div>
        <div class="icon" onclick="openWindow('cloud-forge')">
            <div class="icon-glyph cloud">C</div>
            <span>Cloud Forge</span>
        </div>
        <div class="icon" onclick="openWindow('net-zenith')">
            <div class="icon-glyph network">N</div>
            <span>Net-Zenith</span>
        </div>

        <!-- Window Container (Draggable Windows) -->
        <div id="omni-shell" class="window glass-morphism" style="display: none;">
            <div class="window-header" onmousedown="dragWindow(event, 'omni-shell')">
                <div class="title">Σ OMNI-SHELL ZENITH</div>
                <div class="controls">
                    <span class="close" onclick="closeWindow('omni-shell')">×</span>
                </div>
            </div>
            <div id="output" class="window-content terminal-font">
                <p class="line welcome">[[ SIGMAOS ZENITH v93.0 -- SOVEREIGN CLI MODE ]]</p>
                <p class="line">Ready for silicon-direct instructions.</p>
            </div>
            <div class="window-footer">
                <span class="prompt">Σ://zenith></span>
                <input type="text" id="command-input" placeholder="Execute shard..." autofocus spellcheck="false" title="Zenith Shell Input">
            </div>
        </div>

        <div id="mem-shard" class="window glass-morphism" style="display: none; width: 400px; height: 300px;">
            <div class="window-header" onmousedown="dragWindow(event, 'mem-shard')">
                <div class="title">MEMORY SHARD REGISTRY</div>
                <div class="controls"><span class="close" onclick="closeWindow('mem-shard')">×</span></div>
            </div>
            <div class="window-content">
                <p>Status: HIERARCHICAL PAGING ACTIVE</p>
                <p>Slab: 128MB SHARD [ALLOCATED]</p>
                <div class="bar-container"><div class="bar-fill" style="width: 14%;"></div></div>
            </div>
        </div>

        <!-- Taskbar -->
        <div class="taskbar">
            <div class="start-btn">Σ</div>
            <div class="running-apps">
                <div id="task-omni-shell" class="task-item active" style="display: none;">Omni-Shell</div>
            </div>
            <div class="system-time" id="clock">14:15</div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
