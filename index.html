<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaOS v11.0 – Sovereign Transcendence Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Transcendence Chromatic Palette */
            --bg-deep:      #010204;
            --surface:      rgba(10, 15, 30, 0.45);
            --border:       rgba(255, 255, 255, 0.08);
            --accent:       #00d2ff;
            --accent-glow:  rgba(0, 210, 255, 0.4);
            --gold:         #ffcc00;
            --text-primary: #ffffff;
            --radius-win:   20px;
            --font:         'Outfit', sans-serif;
            --bar-h:        36px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg-deep); color: var(--text-primary); font-family: var(--font); height: 100vh; overflow: hidden; perspective: 1000px; }

        /* ── TRANSCENDENCE BACKGROUND ── */
        canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.3; }

        /* ── SOVEREIGN HUD ── */
        #hud { 
            position: fixed; top: 0; left: 0; right: 0; height: var(--bar-h);
            background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 10000;
        }
        .hud-logo { font-weight: 900; font-size: 0.9rem; letter-spacing: 1px; color: var(--accent); }
        .hud-logo span { font-weight: 400; color: var(--text-primary); opacity: 0.6; }
        .hud-stats { display: flex; gap: 30px; font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }

        /* ── SHARD DOCK ── */
        #dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; padding: 12px; gap: 10px;
            background: rgba(10, 15, 30, 0.5); backdrop-filter: blur(40px);
            border: 1px solid var(--border); border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8); z-index: 9999;
        }
        .dock-item {
            width: 54px; height: 54px; border-radius: 14px; 
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center; font-size: 1.6rem; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dock-item:hover { transform: translateY(-15px) scale(1.2); border-color: var(--accent); box-shadow: 0 10px 30px var(--accent-glow); }

        /* ── SOVEREIGN WINDOWS ── */
        .win {
            position: fixed; background: var(--surface); backdrop-filter: blur(40px);
            border: 1px solid var(--border); border-radius: var(--radius-win);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7); z-index: 100;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }
        .win.focused { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow), 0 40px 120px rgba(0,0,0,0.9); transform: translateZ(50px); }
        
        .wbar { height: 44px; display: flex; align-items: center; padding: 0 20px; cursor: move; gap: 15px; }
        .wctrls { display: flex; gap: 10px; }
        .wdot { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; }
        .wdot.cl { background: #ff5f57; } .wdot.mn { background: #febc2e; } .wdot.mx { background: #28c841; }
        .wtitle { font-size: 0.85rem; font-weight: 800; color: var(--text-primary); flex: 1; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        .wbody { flex: 1; background: #000; position: relative; }
        .wbody iframe { width: 100%; height: 100%; border: none; }

        /* ── DESKTOP ICONS ── */
        #desktop {
            position: fixed; inset: var(--bar-h) 0 100px 0; padding: 40px;
            display: grid; grid-template-columns: repeat(auto-fill, 110px); grid-auto-rows: 110px; gap: 30px; z-index: 1;
        }
        .di { 
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; 
            transition: all 0.2s; border-radius: 16px; padding: 10px;
        }
        .di:hover { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
        .di span { font-size: 3.2rem; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        .di label { font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.8); text-shadow: 0 2px 6px rgba(0,0,0,0.8); pointer-events: none; }

    </style>
</head>
<body>

    <canvas id="nexus-canvas"></canvas>

    <div id="hud">
        <div class="hud-logo">Σ SIGMAOS <span>v11.0 TRANSCENDENCE</span></div>
        <div class="hud-stats">
            <div>CORE: <b>SHARDED</b></div>
            <div>SECURITY: <b>LATTICE-PQC</b></div>
            <div>LATENCY: <b>0.0ms</b></div>
            <div id="clock">09:10 AM</div>
        </div>
    </div>

    <div id="desktop">
        <div class="di" onclick="zenith.launch('⚖️ Legal Matrix', 'userland/apps/sigma_bharat_legal_suite.html')"><span>⚖️</span><label>Legal Suite</label></div>
        <div class="di" onclick="zenith.launch('🧮 Sovereign Math', 'sigma_calc.html')"><span>🧮</span><label>Math Shard</label></div>
        <div class="di" onclick="zenith.launch('📂 VFS Matrix', 'userland/apps/explorer.html')"><span>📂</span><label>Explorer</label></div>
        <div class="di" onclick="zenith.launch('🌋 Dev Forge', 'sigma_ide.html')"><span>🌋</span><label>IDE Forge</label></div>
    </div>

    <div id="dock">
        <div class="dock-item" onclick="zenith.launch('Terminal', 'userland/apps/terminal.html')">⌨️</div>
        <div class="dock-item" onclick="zenith.launch('Browser', 'userland/apps/browser.html')">🌐</div>
        <div class="dock-item" onclick="zenith.launch('PQC Vault', 'userland/apps/sigma_identity_vault.html')">🔐</div>
        <div class="dock-item" onclick="zenith.launch('Media', 'userland/apps/media.html')">🎬</div>
        <div class="dock-item" onclick="zenith.launch('Analytics', 'sigma_monitor.html')">📊</div>
    </div>

    <script>
        const zenith = {
            wins: {},
            zIdx: 100,

            launch(title, url) {
                if(this.wins[title]) { this.focus(title); return; }
                const win = document.createElement('div');
                win.className = 'win';
                win.style.width = '1000px'; win.style.height = '680px';
                win.style.left = (window.innerWidth/2 - 500 + Object.keys(this.wins).length*30) + 'px';
                win.style.top = (window.innerHeight/2 - 340 + Object.keys(this.wins).length*30) + 'px';

                win.innerHTML = `
                    <div class="wbar">
                        <div class="wctrls">
                            <button class="wdot cl" onclick="zenith.close('${title}')"></button>
                            <button class="wdot mn" onclick="zenith.minimize('${title}')"></button>
                            <button class="wdot mx" onclick="zenith.maximize('${title}')"></button>
                        </div>
                        <span class="wtitle">${title}</span>
                    </div>
                    <div class="wbody">
                        <iframe src="${url}"></iframe>
                    </div>
                `;
                document.body.appendChild(win);
                this.wins[title] = win;
                this.focus(title);
                this.initDrag(win, win.querySelector('.wbar'));
            },

            close(title) {
                const w = this.wins[title];
                w.style.opacity = '0'; w.style.transform = 'scale(0.9) rotateY(10deg)';
                setTimeout(() => { w.remove(); delete this.wins[title]; }, 400);
            },

            minimize(title) { this.wins[title].style.transform = 'scale(0.5) translateY(200vh)'; },

            maximize(title) {
                const w = this.wins[title];
                if(w.style.width === '100vw') {
                    w.style.width = '1000px'; w.style.height = '680px';
                    w.style.top = '100px'; w.style.left = '100px';
                } else {
                    w.style.width = '100vw'; w.style.height = 'calc(100vh - var(--bar-h))';
                    w.style.top = 'var(--bar-h)'; w.style.left = '0';
                }
            },

            focus(title) {
                Object.values(this.wins).forEach(w => w.classList.remove('focused'));
                this.wins[title].style.zIndex = ++this.zIdx;
                this.wins[title].classList.add('focused');
            },

            initDrag(win, bar) {
                let x = 0, y = 0;
                bar.onmousedown = (e) => {
                    this.focus(Object.keys(this.wins).find(k => this.wins[k] === win));
                    x = e.clientX; y = e.clientY;
                    document.onmousemove = (e) => {
                        win.style.left = (win.offsetLeft + (e.clientX - x)) + 'px';
                        win.style.top  = (win.offsetTop + (e.clientY - y)) + 'px';
                        x = e.clientX; y = e.clientY;
                    };
                    document.onmouseup = () => document.onmousemove = null;
                };
            }
        };

        // Nexus Background Canvas (Neutralizes standard wallpapers)
        const canvas = document.getElementById('nexus-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        function drawNexus() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 0.5;
            for(let i=0; i<canvas.width; i+=100) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
            }
            for(let j=0; j<canvas.height; j+=100) {
                ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke();
            }
        }
        drawNexus();

        // Clock
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').textContent = d.getHours()%12 + ":" + d.getMinutes().toString().padStart(2,'0') + " " + (d.getHours() >= 12 ? "PM" : "AM");
        }, 1000);
    </script>
</body>
</html>
