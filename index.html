<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σ SIGMAOS: SOVEREIGN ZENITH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="zenith_desktop.css">
</head>
<body>
    <div class="desktop-overlay"></div>

    <!-- Central Clock -->
    <div class="clock-container">
        <div id="clock-time">00:00</div>
        <div id="clock-date">Tuesday, April 28</div>
    </div>

    <!-- Notification Center / Kernel Logs -->
    <div class="notification-center" id="kernel-logs">
        <!-- Logs will be injected here -->
    </div>

    <!-- Widgets -->
    <div class="widgets-container">
        <div class="widget">
            <div class="widget-title">
                <span>Silicon Audit</span>
                <span class="accent">16 Cores</span>
            </div>
            <div class="stat-value" id="cpu-load">12%</div>
            <div class="stat-bar">
                <div class="stat-progress" id="cpu-progress" style="width: 12%"></div>
            </div>
        </div>

        <div class="widget">
            <div class="widget-title">
                <span>Memory Zenith</span>
                <span class="accent">Slab Alloc</span>
            </div>
            <div class="stat-value" id="mem-load">4.2 GB</div>
            <div class="stat-bar">
                <div class="stat-progress" id="mem-progress" style="width: 25%"></div>
            </div>
        </div>

        <div class="widget">
            <div class="widget-title">
                <span>Quantum Shield</span>
                <span class="accent">PQC Active</span>
            </div>
            <div class="stat-value">SHIELDED</div>
            <div style="font-size: 10px; color: var(--success); margin-top: 5px;">Entropy Level: Critical</div>
        </div>
    </div>

    <!-- Desktop Icons -->
    <div class="desktop-icons">
        <div class="app-icon">
            <div class="app-img">📚</div>
            <div class="app-label">Scholar Zenith</div>
        </div>
        <div class="app-icon">
            <div class="app-img">🛡️</div>
            <div class="app-label">Lattice Security</div>
        </div>
        <div class="app-icon">
            <div class="app-img">☁️</div>
            <div class="app-label">Cloud Maestro</div>
        </div>
        <div class="app-icon">
            <div class="app-img">⚙️</div>
            <div class="app-label">Core Orchestrator</div>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="taskbar">
        <div class="task-icon active">Σ</div>
        <div class="task-icon">📂</div>
        <div class="task-icon">🌐</div>
        <div class="task-icon">🧠</div>
        <div class="task-icon">🔌</div>
        <div style="width: 1px; height: 30px; background: var(--glass-border); margin: 0 10px;"></div>
        <div class="task-icon">🔔</div>
        <div class="task-icon">🔋</div>
    </div>

    <script>
        // Update Clock
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            document.getElementById('clock-time').textContent = time;
            document.getElementById('clock-date').textContent = date;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simulate Kernel Logs
        const logContainer = document.getElementById('kernel-logs');
        const logs = [
            { t: "Σ [BOOT]: Sovereign Lattice Online.", c: "" },
            { t: "Σ [SECURE]: PQC Shard Initialized (Lattice-V5).", c: "success" },
            { t: "Σ [NET]: Cloud Maestro projected to EU-WEST-1.", c: "" },
            { t: "Σ [KERN]: Memory Slab Shard mapped (64MB).", c: "success" },
            { t: "Σ [AUDIT]: CPU Silicon Discovery: 16 Zenith Cores.", c: "" },
            { t: "Σ [VGA]: Direct Framebuffer Projector Online.", c: "success" },
            { t: "Σ [ZENITH]: Desktop Environment Absorbed.", c: "success" }
        ];

        function addLog(text, type) {
            const div = document.createElement('div');
            div.className = `log-item ${type}`;
            div.textContent = text;
            logContainer.prepend(div);
            if (logContainer.children.length > 10) logContainer.lastChild.remove();
        }

        let logIdx = 0;
        function cycleLogs() {
            if (logIdx < logs.length) {
                addLog(logs[logIdx].t, logs[logIdx].c);
                logIdx++;
                setTimeout(cycleLogs, 1000);
            }
        }
        cycleLogs();

        // Simulate Hardware Stats
        setInterval(() => {
            const cpu = Math.floor(Math.random() * 15) + 5;
            document.getElementById('cpu-load').textContent = cpu + "%";
            document.getElementById('cpu-progress').style.width = cpu + "%";
            
            const mem = (Math.random() * 0.5 + 4.1).toFixed(1);
            document.getElementById('mem-load').textContent = mem + " GB";
            document.getElementById('mem-progress').style.width = (mem / 16 * 100) + "%";
        }, 3000);
    </script>
</body>
</html>
