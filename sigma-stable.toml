# SigmaOS Stable Release Profile (sigma-stable)
# Fixed release with long-term support and stability focus
# Inspired by openSUSE Leap and Ubuntu LTS

[profile]
name = "sigma-stable"
description = "Fixed release with long-term support and stability focus"
version = "1.0.0"
release_type = "fixed"
support_cycle = "2-years"

[features]
# Stable feature set
desktop = true
ai_tools = true
networking = true
graphics = true
audio = true

[shards]
# Stable core shards
core_shards = ["s-mm", "s-sched", "s-net", "s-fs", "s-ipc", "s-sec", "s-sys"]

# Stable essential shards
essential_shards = ["gpu", "network", "storage", "input", "audio"]

# Stable optional shards
optional_shards = ["zenith", "desktop", "llm", "pkg"]

[boot]
# Stable kernel parameters
kernel_params = [
  "kernel.smm.enable=true",
  "kernel.sched.eevdf=true",
  "kernel.net.firewall=deny"
]

[init]
# Full init system
systemd_compatible = true
services = ["network", "ssh", "desktop", "audio"]

[package]
# Stable package configuration
repository = "https://packages.sigmaos.org/stable"
cache_dir = "/sigma/store"
auto_update = true
update_frequency = "monthly"

# Stable packages
core_packages = \[
  "sigma-coreutils",
  "sigma-shell",
  "sigma-network",
  "sigma-storage",
  "sigma-security",
  "sigma-desktop",
  "sigma-ai"
\]

[security]
# Full security configuration
secure_boot = true
tpm_enabled = true
disk_encryption = true
selinux = true
auditd = true

[network]
# Full network configuration
dhcp = true
firewall = "deny"
dns_servers = ["8.8.8.8", "8.8.4.4"]

[ui]
# Desktop UI settings
compositor = "zenith"
theme = "stable"
scaling = "auto"

[ai]
# AI configuration
llm_enabled = true
llm_model = "stable"
privacy_mode = "balanced"

[logging]
# Full logging
log_level = "info"
log_file = "/var/log/sigmaos.log"
