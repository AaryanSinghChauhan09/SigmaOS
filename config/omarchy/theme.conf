# ============================================================
# SigmaOS Omarchy Theme — Catppuccin Mocha
# ============================================================
# Compatible with Hyprland, Waybar, Rofi, Kitty, and Alacritty.
# Generated by scripts/setup_omarchy_dotfiles.sh
# ============================================================

[palette]
name       = catppuccin-mocha

# ── Base / Background ────────────────────────────────────────
base       = #1e1e2e
mantle     = #181825
crust      = #11111b

# ── Surface layers ──────────────────────────────────────────
surface0   = #313244
surface1   = #45475a
surface2   = #585b70

# ── Overlay / Muted ─────────────────────────────────────────
overlay0   = #6c7086
overlay1   = #7f849c
overlay2   = #9399b2

# ── Text ────────────────────────────────────────────────────
subtext0   = #a6adc8
subtext1   = #bac2de
text       = #cdd6f4

# ── Accent colours ──────────────────────────────────────────
rosewater  = #f5e0dc
flamingo   = #f2cdcd
pink       = #f38ba8
mauve      = #cba6f7
red        = #f38ba8
maroon     = #eba0ac
peach      = #fab387
yellow     = #f9e2af
green      = #a6e3a1
teal       = #94e2d5
sky        = #89dceb
sapphire   = #74c7ec
blue       = #89b4fa
lavender   = #b4befe

# ── SigmaOS UI overrides ─────────────────────────────────────
[sigmaos]
accent         = #89b4fa
accent_hover   = #74c7ec
border         = #313244
border_active  = #89b4fa
border_radius  = 8
gap            = 6
font_ui        = Ubuntu, Noto Sans, system-ui, sans-serif
font_mono      = JetBrains Mono, Fira Code, Courier New, monospace
font_size      = 13
taskbar_height = 36
icon_size      = 22

# ── Waybar overrides ─────────────────────────────────────────
[waybar]
background      = #1e1e2ecc
background_full = #1e1e2e
foreground      = #cdd6f4
separator       = #313244

# ── Window decorations ───────────────────────────────────────
[windows]
active_border   = #89b4fa
inactive_border = #313244
shadow_color    = #00000066
rounding        = 8
blur_enabled    = true
blur_passes     = 2
