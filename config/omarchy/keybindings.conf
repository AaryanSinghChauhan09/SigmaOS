# ============================================================
# SigmaOS Omarchy Keybindings Reference
# Inspired by Hyprland / Omarchy Linux defaults
# ============================================================
# These are documentation/reference — the actual Hyprland
# bindings live in config/omarchy/hyprland/.
# ============================================================

[meta]
mod = SUPER   # Main modifier (Windows/Super key)

# ── Application launchers ────────────────────────────────────
[launch]
terminal    = SUPER + Return          # Open default terminal (kitty)
launcher    = SUPER + D               # Open rofi app launcher
browser     = SUPER + B               # Open default browser
file_mgr    = SUPER + E               # Open file manager
editor      = SUPER + N               # Open neovim in terminal
sigmaos_gui = SUPER + G               # Launch SigmaOS GUI desktop

# ── Window management ────────────────────────────────────────
[windows]
close       = SUPER + Q               # Kill active window
fullscreen  = SUPER + F               # Toggle fullscreen
float       = SUPER + V               # Toggle floating
resize_mode = SUPER + R               # Enter resize mode
focus_left  = SUPER + H               # Focus left
focus_right = SUPER + L               # Focus right
focus_up    = SUPER + K               # Focus up
focus_down  = SUPER + J               # Focus down
move_left   = SUPER + SHIFT + H       # Move window left
move_right  = SUPER + SHIFT + L       # Move window right
move_up     = SUPER + SHIFT + K       # Move window up
move_down   = SUPER + SHIFT + J       # Move window down

# ── Workspaces ───────────────────────────────────────────────
[workspaces]
switch_1    = SUPER + 1
switch_2    = SUPER + 2
switch_3    = SUPER + 3
switch_4    = SUPER + 4
switch_5    = SUPER + 5
switch_6    = SUPER + 6
switch_7    = SUPER + 7
switch_8    = SUPER + 8
switch_9    = SUPER + 9
switch_10   = SUPER + 0
move_to_1   = SUPER + SHIFT + 1
move_to_2   = SUPER + SHIFT + 2
move_to_3   = SUPER + SHIFT + 3
move_to_4   = SUPER + SHIFT + 4
move_to_5   = SUPER + SHIFT + 5
prev_ws     = SUPER + Left
next_ws     = SUPER + Right

# ── System controls ──────────────────────────────────────────
[system]
screenshot      = SUPER + PRINT          # Screenshot (sigmaos-capture-screenshot)
screenshot_sel  = SUPER + SHIFT + S      # Region screenshot (sigmaos-capture-region)
screenrecord    = SUPER + SHIFT + R      # Screen recording toggle
lock            = SUPER + SHIFT + L      # Lock screen (hyprlock)
logout_menu     = SUPER + SHIFT + E      # Power/logout menu (wlogout)
reload_config   = SUPER + SHIFT + C      # Reload Hyprland config
emoji_picker    = SUPER + PERIOD         # Emoji picker (sigmaos-emoji-picker)
clipboard       = SUPER + SHIFT + V      # Clipboard history

# ── Media / volume (via wpctl) ───────────────────────────────
[media]
vol_up      = XF86AudioRaiseVolume
vol_down    = XF86AudioLowerVolume
mute        = XF86AudioMute
play_pause  = XF86AudioPlay
prev_track  = XF86AudioPrev
next_track  = XF86AudioNext
brightness_up   = XF86MonBrightnessUp
brightness_down = XF86MonBrightnessDown

# ── SigmaOS-specific shortcuts ───────────────────────────────
[sigmaos]
doctor      = SUPER + SHIFT + D      # Run sigmaos_doctor.sh in terminal
theme_cycle = SUPER + SHIFT + T      # Cycle SigmaOS theme
bar_toggle  = SUPER + SHIFT + B      # Toggle status bar visibility
