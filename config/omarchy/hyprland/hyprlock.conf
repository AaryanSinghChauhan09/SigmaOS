# SigmaOS Omarchy Hyprlock Configuration
# Beautiful blurred lockscreen with clock and pam authentication

background {
    monitor =
    path = /usr/share/backgrounds/sigmaos-zenith.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(137, 180, 250)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 64
    font_family = JetBrains Mono ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = ⚡ SIGMAOS · OMARCHY
    color = rgb(137, 180, 250)
    font_size = 14
    font_family = JetBrains Mono Bold
    position = 0, 160
    halign = center
    valign = center
}
