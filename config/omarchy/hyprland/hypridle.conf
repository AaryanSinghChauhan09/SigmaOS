# -----------------------------------------------------
# Omarchy Linux / SigmaOS Hypridle Configuration
# Idle manager daemon with Hyprlock & DPMS integration
# -----------------------------------------------------

general {
    lock_cmd = pidof hyprlock || hyprlock       # lock-session hook
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display
    ignore_dbus_inhibit = false                 # whether to ignore dbus-sent idle-inhibit requests (e.g. from Firefox/media player)
}

# 2.5min: dim backlight
listener {
    timeout = 150                                # 2.5min
    on-timeout = brightnessctl -s set 10         # dim backlight to 10%
    on-resume = brightnessctl -r                 # restore monitor backlight
}

# 5min: lock screen with hyprlock
listener {
    timeout = 300                                # 5min
    on-timeout = loginctl lock-session           # lock screen
}

# 5.5min: turn off display
listener {
    timeout = 330                                # 5.5min
    on-timeout = hyprctl dispatch dpms off       # screen off when timeout passed
    on-resume = hyprctl dispatch dpms on         # screen on when activity detected
}

# 30min: suspend pc
listener {
    timeout = 1800                               # 30min
    on-timeout = systemctl suspend               # suspend PC
}
