# SigmaOS Sovereign Desktop — Hyprland Configuration
# Managed by: sigmaos-update --dotfiles-only
# To regenerate from active theme: sigmaos-desktop theme <name>
#
# Source: config/omarchy/hyprland/hyprland.conf

# ── Monitor layout ───────────────────────────────────────────────────────────
monitor = ,preferred,auto,1
# Include user monitor custom overrides if present
source = ~/.config/hypr/monitors.conf

# ── Environment variables ─────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ── Autostart ─────────────────────────────────────────────────────────────────
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = sigmaos-desktop theme

# ── Input ─────────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        disable_while_typing = yes
        tap-to-click = yes
    }
    sensitivity = 0
}

# ── General ───────────────────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(313244ff)
    layout = dwindle
    allow_tearing = false
}

# ── Decoration ────────────────────────────────────────────────────────────────
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
    drop_shadow = true
    shadow_range = 12
    shadow_render_power = 3
    col.shadow = rgba(1a1a2eee)
}

# ── Animations ────────────────────────────────────────────────────────────────
animations {
    enabled = yes
    bezier = ease, 0.25, 0.46, 0.45, 0.94
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 5, ease, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 5, overshot, slide
}

# ── Layouts ───────────────────────────────────────────────────────────────────
dwindle {
    pseudotile = yes
    preserve_split = yes
}
master {
    new_is_master = true
}

# ── Gestures ──────────────────────────────────────────────────────────────────
gestures {
    workspace_swipe = on
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.5
}

# ── Misc ──────────────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    enable_swallow = true
}

# ── Window rules ──────────────────────────────────────────────────────────────
windowrulev2 = float, class:^(Rofi)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(polkit-kde-authentication-agent-1)$
windowrulev2 = suppressevent maximize, class:.*

# ── SigmaOS Sovereign Keybinds ───────────────────────────────────────────────
$mod = SUPER

# System
bind = $mod, Return,     exec, foot
bind = $mod SHIFT, Return, exec, alacritty
bind = $mod, Q,          killactive
bind = $mod SHIFT, Q,    exit
bind = $mod, Space,      exec, rofi -show drun -theme ~/.config/rofi/sigmaos.rasi
bind = $mod SHIFT, Space,exec, rofi -show run  -theme ~/.config/rofi/sigmaos.rasi
bind = $mod, slash,      exec, sigmaos-keybinds
bind = $mod, question,   exec, sigmaos-keybinds
bind = $mod, D,          exec, foot --title "Display Configuration" bash -c "sigmaos-display; read -n1 -rp 'Press any key to close...'"
bind = $mod, E,          exec, thunar
bind = $mod, B,          exec, firefox
bind = $mod, V,          exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/sigmaos.rasi | cliphist decode | wl-copy
bind = $mod, L,          exec, hyprlock
bind = $mod SHIFT, L,    exec, wlogout

# Screenshot / screen capture
bind = , Print,          exec, hyprshot -m output
bind = SHIFT, Print,     exec, hyprshot -m region
bind = $mod, Print,      exec, hyprshot -m window

# Theme cycling
bind = $mod, T,          exec, sigmaos-desktop theme list
bind = $mod SHIFT, T,    exec, sigmaos-update --theme-only

# System update
bind = $mod SHIFT, U,    exec, foot --title "SigmaOS Update" bash -c "sigmaos-update; read -n1 -r -p 'Done. Press any key...'"

# Layout
bind = $mod, F,          fullscreen, 0
bind = $mod SHIFT, F,    fullscreen, 1
bind = $mod, P,          pseudo
bind = $mod, J,          togglesplit

# Focus movement (vim keys + arrow)
bind = $mod, H,          movefocus, l
bind = $mod, L,          movefocus, r
bind = $mod, K,          movefocus, u
bind = $mod, J,          movefocus, d
bind = $mod, left,       movefocus, l
bind = $mod, right,      movefocus, r
bind = $mod, up,         movefocus, u
bind = $mod, down,       movefocus, d

# Window movement
bind = $mod SHIFT, H,    movewindow, l
bind = $mod SHIFT, L,    movewindow, r
bind = $mod SHIFT, K,    movewindow, u
bind = $mod SHIFT, J,    movewindow, d

# Resize
binde = $mod CTRL, H,   resizeactive, -50 0
binde = $mod CTRL, L,   resizeactive,  50 0
binde = $mod CTRL, K,   resizeactive,  0 -50
binde = $mod CTRL, J,   resizeactive,  0  50

# Workspaces 1–9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mod, S,          togglespecialworkspace, magic
bind = $mod SHIFT, S,    movetoworkspace, special:magic

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Float / move with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Audio (PipeWire / PulseAudio)
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@   5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume       @DEFAULT_AUDIO_SINK@   5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute         @DEFAULT_AUDIO_SINK@   toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute         @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Media
bindl = , XF86AudioNext,          exec, playerctl next
bindl = , XF86AudioPrev,          exec, playerctl previous
bindl = , XF86AudioPlay,          exec, playerctl play-pause
bindl = , XF86AudioStop,          exec, playerctl stop
