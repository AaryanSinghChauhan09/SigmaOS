# /etc/pacman.conf
# SigmaOS Arch Linux Distribution ALPM Configuration
#
# See the pacman.conf(5) manpage for option and repository directives

[options]
# The following paths are commented to use defaults:
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc linux sigmaos-core
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u

# Architecture
Architecture = x86_64

# Pacman display options
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
ILoveCandy

# Security & Signature checking
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# ==============================================================================
# REPOSITORIES
# ==============================================================================

# SigmaOS Custom Sovereign Overlay Repository
[sigmaos]
SigLevel = Optional TrustAll
Server = https://raw.githubusercontent.com/AaryanSinghChauhan09/SigmaOS/main/repo/os/$arch
Include = /etc/pacman.d/sigmaos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
