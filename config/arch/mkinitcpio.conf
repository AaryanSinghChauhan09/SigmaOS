# vim:set ft=sh
# MODULES
# The following modules are loaded before any boot hooks are
# run.  Advanced users may wish to specify all required modules
# here to bypass the dynamic module loading mechanism.
MODULES=(btrfs)

# BINARIES
# This setting includes any additional binaries a given hook may need.
BINARIES=()

# FILES
# This setting includes any additional files in the image.
FILES=()

# HOOKS
# This is the most important setting in this file.  The HOOKS array
# is composed of an ordered list of items to include in the initramfs.
HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block filesystems fsck)

# COMPRESSION
# Use zstd compression for fast boot decompression
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
