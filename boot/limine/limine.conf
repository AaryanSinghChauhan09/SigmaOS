# SigmaOS limine bootloader configuration
# Bootloader Integration - modeled on Omarchy 4.0.5 etc/limine-entry-tool.d/

timeout=2
timeout_action=reboot

# SigmaOS default entry
:SigmaOS
PROTOCOL=linux
KERNEL_PATH=/boot/vmlinuz-linux
CMDLINE=root=UUID=__ROOT_UUID__ rw quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0 initramfs_async=0 systemd.tty.term.console=dumb
MODULE_PATH=/boot/initramfs-linux.img

# SigmaOS fallback entry
:SigmaOS Fallback
PROTOCOL=linux
KERNEL_PATH=/boot/vmlinuz-linux
CMDLINE=root=UUID=__ROOT_UUID__ rw
MODULE_PATH=/boot/initramfs-linux-fallback.img

# SigmaOS recovery entry
:SigmaOS Recovery
PROTOCOL=linux
KERNEL_PATH=/boot/vmlinuz-linux
CMDLINE=root=UUID=__ROOT_UUID__ rw single
MODULE_PATH=/boot/initramfs-linux-fallback.img

# EFI boot stub (direct device control)
ENABLE_X2APIC=yes
ENABLE_TSC=yes
ENABLE_SERIAL=yes
ENABLE_DEBUG=yes
ENABLE_PAGE_ALLOCATION_SHUFFLING=yes
ENABLE_MTRR_UPDATE=yes
ENABLE_SMAP=yes
ENABLE_SMEP=yes

# Background and theme
BACKGROUND_COLOR=0x000000
TEXT_COLOR=0xcdd6f4
HIGHLIGHT_COLOR=0x89b4fa
SELECTED_COLOR=0x1e1e2e

# Timeout styling
TIMEOUT_STYLE=hidden
