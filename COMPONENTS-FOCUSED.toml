# SigmaOS Component Registry (Focused)

# This is a focused registry of actual, working SigmaOS components.
# Following OPTIMISE FOR DELETION and CREATE COMPONENTS WHICH ARE NECESSARY.
# Only components that exist on GitHub and serve a purpose are included.

# Core System
[[component]]
name = "SigmaOS"
description = "Main SigmaOS repository - Arch-based Linux distribution"
repo = "https://github.com/AaryanSinghChauhan09/SigmaOS"
engine = "distro"
category = "System"
language = "shell"
inspirations = "Arch Linux"
visibility = "public"
depends_on = []

